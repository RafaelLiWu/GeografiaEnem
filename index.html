    3,
    "Alternativa correta: D. A Mata dos Cocais é o ecótono situado no Meio-Norte (Maranhão e Piauí), dominado por babaçuais e carnaubais que sustentam milhares de famílias extrativistas tradicionais. As alternativas A, C, D e E citam formações vegetais do Sul ou de outros domínios sem relação com o babaçu."
  ],
  "Movimentos de massa e escorregamentos de encosta": [
    "Os movimentos de massa (ou escorregamentos de encostas) são processos geomorfológicos gravitacionais que envolvem o deslocamento morro abaixo de solo, rochas alteradas (regolito) e cobertura vegetal ao longo de encostas íngremes. Dividem-se em diferentes modalidades segundo a velocidade e o teor de água: 1) Rastejo (ou creep): deslocamento imperceptível e extremamente lento do solo, evidenciado por árvores e postes inclinados; 2) Escorregamento planar ou rotacional: deslizamento rápido e violento de blocos de solo e rocha ao longo de uma superfície de ruptura, comum nas serras tropicais; 3) Corridas de lama ou detritos (mudflows): fluxos viscerais e rápidos provocados pela saturação hídrica completa de solos em temporais torrenciais, descendo por canais com imenso poder destrutivo. No Brasil, esses eventos ocorrem nas escarpas dos Mares de Morros (Serra do Mar, Serra da Mantiqueira) no verão, quando chuvas orográficas prolongadas saturam os poros do solo, reduzindo a coesão interna e aumentando o peso do talude, agravados pela ação antrópica de desmatamento, cortes de encostas e sobrecarga de residências em áreas de risco.",
    [
      "Fator deflagrador natural: saturação hídrica do manto de intemperismo por chuvas volumosas contínuas",
      "Fatores antrópicos agravantes: desmatamento da mata atlântica, corte de taludes e lançamento de esgoto no morro",
      "Rastejo (creep): movimento lento; Escorregamento: movimento rápido e destrutivo; Corrida de lama: fluxo viscoso de sedimentos",
      "Mitigação: drenagem pluvial em encostas, muros de contenção (gabiões), reflorestamento e remoção de moradias de risco"
    ],
    "Para o ENEM: a chuva é o gatilho deflagrador, mas o desastre tem causas sociais; famílias moram em encostas instáveis porque a especulação imobiliária encarece os terrenos planos e seguros, empurrando as classes pobres para áreas de risco geomorfológico.",
    "Após um acumulado de mais de 250 mm de chuvas em 24 horas em um município serrano do Sudeste brasileiro, encostas desmatadas com cortes verticais sofreram escorregamentos rápidos de solo saturado, soterrando residências autoconstruídas em loteamentos irregulares.",
    "A dinâmica mecânica e física que provoca o colapso dos taludes nas encostas durante episódios de precipitação contínua consiste no(a):",
    [
      "resfriamento glacial do solo que congela e solidifica a rocha-mãe sã.",
      "secagem instantânea do subsolo provocada por ventos catabáticos secos.",
      "atração gravitacional exclusiva exercida pela Lua durante o alinhamento das marés oceânicas.",
      "preenchimento dos poros do solo pela água, que eleva o peso da camada superficial e reduz a coesão mecânica interna das partículas de terra.",

    ],
    3,
    "Alternativa correta: D. O encharcamento prolongado faz com que a água ocupe todos os espaços vazios (poros) entre os grãos de solo; isso aumenta a pressão neutra da água, anula o atrito interno e a coesão mecânica do terreno, além de sobrecarregar o peso do talude com a água acumulada, provocando o rompimento e deslizamento morro abaixo. As alternativas A, C, D e E trazem formulações fisicamente incorretas."

  "Tipos de solo: Terra Roxa e Massapê": [
    "A formação dos solos brasileiros é marcada pela diversidade pedológica decorrente de diferentes rochas-mãe (substrato geológico) e processos de intemperismo. Dois solos de excepcional fertilidade natural histórica destacam-se na economia do país: 1) Terra Roxa (denominação popular de origem italiana 'terra rossa', vermelha, classificada pedologicamente como Latossolo Vermelho Eutroférrico ou Nitossolo): solo profundo, bem drenado, de coloração avermelhada escura e altíssima fertilidade natural, formado pela decomposição e intemperismo químico de rochas vulcânicas basálticas derramadas na Era Mesozoica sobre a Bacia Sedimentar do Paraná (oeste paulista, norte do Paraná, Santa Catarina e Rio Grande do Sul); foi a base do ciclo áureo do café no século XIX/XX e hoje abriga o agronegócio de cana e soja; 2) Massapê: solo argiloso, escuro, fértil e muito viscoso e pegajoso quando molhado, originado da decomposição de rochas metamórficas e ígneas ricas em calcário, gnaisses e xistos na Zona da Mata nordestina; foi o solo que sustentou os latifúndios monocultores da cana-de-açúcar desde os primórdios do Brasil Colonial.",
    [
      "Terra Roxa: decomposição do basalto vulcânico na Bacia do Paraná (SP e PR) ➔ ciclo do café e grãos modernos",
      "Massapê: decomposição de gnaisses e calcários na Zona da Mata nordestina ➔ ciclo da cana-de-açúcar colonial",
      "Latossolos: solos profundos, antigos, ácidos e bem drenados dominantes no Cerrado e Amazônia (corrigidos por calagem)",
      "Salinização: degradação química do solo no semiárido provocada pela evaporação rápida da água de irrigação inadequada"
    ],
    "Para a prova do ENEM: associe o solo à sua história econômica: Massapê = ciclo colonial da cana no litoral nordestino. Terra Roxa = expansão da ferrovia e do café no interior de São Paulo e norte do Paraná.",
    "A expansão cafeeira no século XIX pelo oeste do estado de São Paulo e, posteriormente, a colonização do norte pioneiro do Paraná foram impulsionadas pela presença de um solo avermelhado escuro de fertilidade mineral natural ímpar, derivado de antigos derrames basálticos ocorridos durante a separação dos continentes.",
    "A denominação tradicional e a rocha-mãe originária do solo descrito no trecho correspondem, respectivamente, a:",
    [
      "terra roxa, derivada do intemperismo de rochas ígneas vulcânicas basálticas.",
      "solo de massapê, derivado de rochas calcárias fossilizadas do Cretáceo costeiro.",
      "solo litólico pedregoso, derivado de dunas de areia eólica do semiárido.",
      "turfeira orgânica fóssil, originada do congelamento glacial da serra gaúcha.",
      "solo podzólico salinizado, resultante de rejeitos de mineração de bauxita."
    ],
    0,
    "Alternativa correta: A. A terra roxa origina-se da alteração química de rochas basálticas vulcânicas da Formação Serra Geral na Bacia do Paraná, ricas em minerais que fornecem nutrientes vegetais abundantes (como cálcio, magnésio e ferro), conferindo excelente fertilidade natural para a cafeicultura histórica e o agronegócio moderno. As alternativas A, C, D e E associam outros solos ou rochas incorretas."
  ],
  "Crise hídrica e segurança dos reservatórios": [
    "A segurança hídrica em grandes regiões metropolitanas e polos industriais do Centro-Sul brasileiro é colocada periodicamente em colapso devido à combinação de fatores climáticos e de gestão: 1) Dependência de mananciais de superfície altamente vulneráveis a anomalias pluviométricas e secas severas (como a histórica crise do Sistema Cantareira em São Paulo em 2014-2015); 2) Desmatamento das matas ciliares e cabeceiras de nascentes na bacia hidrográfica, diminuindo a capacidade de infiltração do solo e a recarga dos aquíferos que mantêm a vazão de base dos rios durante a estiagem; 3) Poluição crônica de corpos d'água urbanos (como os rios Tietê, Pinheiros e Iguaçu), que inviabiliza o tratamento e a captação de água dentro da própria metrópole, forçando a busca de água potável em bacias hidrográficas cada vez mais distantes; 4) Perdas físicas monumentais nas redes de distribuição urbanas (vazamentos de tubulações que chegam a desperdiçar mais de 35% a 40% da água tratada antes que chegue às residências).",
    [
      "Segurança hídrica: garantia de acesso a água em quantidade e qualidade para populações e ecossistemas",
      "Sistema Cantareira: complexo de represas e túneis que capta água no alto curso e abastece milhões em SP",
      "Poluição de mananciais: rios poluídos no centro urbano forçam captações a distâncias superiores a 100 km",
      "Perdas na distribuição: mais de um terço da água tratada no Brasil é desperdiçada em vazamentos subterrâneos"
    ],
    "Para o ENEM: a crise da água em grandes cidades não é apenas 'falta de chuva'; a estiagem atua como um gatilho que escancara a falta de planejamento preventivo, o descaso com as perdas na rede encanada e a destruição das florestas que protegem as nascentes.",
    "Durante a crise hídrica que afetou o abastecimento público na Região Metropolitana de São Paulo, o volume útil do Sistema Cantareira atingiu níveis negativos históricos, forçando a captação emergencial do chamado 'volume morto' abaixo das comportas das represas.",
    "Dentre as medidas estruturais de longo prazo voltadas a assegurar a resiliência hídrica e evitar novos colapsos de abastecimento metropolitano, destaca-se:",
    [
      "a recuperação das florestas ciliares nas áreas de mananciais associada à redução das perdas físicas na rede encanada e despoluição de bacias locais.",
      "a canalização e impermeabilização total de todas as nascentes e olhos d'água das áreas de serra.",
      "o aumento das alíquotas de desconto para o consumo industrial ilimitado de água doce.",
      "a drenagem contínua de todo o leito do Aquífero Guarani para lançamento no mar aberto.",
      "a eliminação dos comitês de bacia hidrográfica e a proibição da fiscalização ambiental."
    ],
    0,
    "Alternativa correta: A. A segurança hídrica duradoura exige conservar e reflorestar as áreas de mananciais (as florestas funcionam como 'esponjas' que filtram a água e alimentam nascentes o ano inteiro), combater os altos índices de perdas físicas por vazamentos na tubulação urbana e despoluir rios metropolitanos para que suas águas possam ser reutilizadas. As alternativas A, C, D e E agravariam a crise ou trazem ações ambientalmente destrutivas."
  ],
  "Poluição por esgoto e marés vermelhas": [
    "A deficiência histórica de coleta e tratamento de efluentes sanitários no Brasil faz com que bilhões de litros de esgoto doméstico in natura sejam despejados diariamente em rios, lagoas e praias urbanas, violando o direito humano ao saneamento básico e gerando impactos econômicos e na saúde coletiva. Além de transmitir doenças de veiculação hídrica (como cólera, hepatite A, giardíase e verminoses), a matéria orgânica em excesso desestabiliza ecossistemas marinhos costeiros. Um fenômeno grave recorrente em baías poluídas e águas quentes é a Maré Vermelha (floração de algas nocivas): o aporte de esgoto e compostos fosfatados estimula a multiplicação exponencial de microalgas dinoflageladas tóxicas, que colorem a água de tonalidades avermelhadas ou alaranjadas. Essas algas liberam toxinas potentes (como saxitoxinas) que paralisam a respiração de peixes e acumulam-se em mexilhões, ostras e moluscos filtradores; a ingestão humana desses frutos do mar contaminados pode provocar intoxicação grave, paralisia neuromuscular e morte.",
    [
      "Maré Vermelha: floração anormal de algas dinoflageladas tóxicas estimulada por esgoto e águas aquecidas",
      "Bioacumulação: toxinas concentram-se em moluscos filtradores (mexilhões e ostras), ameaçando humanos",
      "Doenças de veiculação hídrica: cólera, diarreia infecciosa, hepatite A e leptospirose decorrentes de esgoto bruto",
      "Marco Legal do Saneamento (Lei 14.026/2020): meta de universalização de 99% de água tratada e 90% de esgoto até 2033"
    ],
    "Para a prova do ENEM: a Maré Vermelha não tem relação com o sangue de peixes nem com petróleo! O nome vem da coloração marrom-avermelhada que milhões de microalgas microscópicas (dinoflagelados) conferem à superfície da água do mar quando se multiplicam em locais poluídos por esgoto.",
    "Autoridades de vigilância sanitária e ambiental interditaram a pesca e proibiram a comercialização de ostras e mexilhões na costa leste de um estado litorâneo brasileiro após manchas avermelhadas cobrirem a baía, constatando-se altas concentrações de neurotoxinas nos tecidos dos moluscos coletados.",
    "O fenômeno biológico costeiro descrito no texto e a fonte de nutrientes antrópica que catalisa a sua ocorrência são, respectivamente:",
    [
      "maré negra provocada por vazamentos de óleo cru de plataformas oceânicas.",
      "salinização de dunas costeiras motivada por ventos alísios continentais secos.",
      "inversão térmica salina decorrente de tsunamis polares antárticos.",
      "acidificação oceânica natural provocada pela transpiração de manguezais nativos.",
      "maré vermelha, induzida pela proliferação de microalgas tóxicas estimuladas pelo excesso de matéria orgânica de esgotos sem tratamento."
    ],
    4,
    "Alternativa correta: E. A maré vermelha é um fenômeno biológico no qual microalgas tóxicas (dinoflagelados) proliferam intensamente alimentadas pelo excesso de nutrientes de efluentes sanitários sem tratamento e calor marinho; suas toxinas acumulam-se na cadeia alimentar em organismos filtradores como mexilhões, tornando-os impróprios e letais para o consumo humano. As alternativas A, C, D e E trazem fenômenos distintos."
  ],
  "Projeção azimutal polar e projeção cônica": [
    "Além das clássicas projeções cilíndricas (como Mercator e Peters), a cartografia utiliza outras superfícies geométricas de projeção adaptadas a objetivos geopolíticos e de navegação específicos: 1) Projeção Azimutal (ou Plana / Zenital): projeta a superfície da Terra sobre um plano tangente a um ponto específico do globo. Quando o plano tangencia um dos polos (Projeção Azimutal Polar), o polo ocupa o centro do mapa e os meridianos aparecem como retas que convergem para esse centro, enquanto os paralelos aparecem como círculos concêntricos; é equidistante em relação ao ponto central (preserva as distâncias radiais corretas a partir do centro) e é utilizada na aviação para traçar as rotas ortodrômicas mais curtas sobre o Ártico e na diplomacia (o emblema oficial da ONU é uma projeção azimutal polar equidistante centrada no Polo Norte, transmitindo neutralidade e universalidade entre as nações); 2) Projeção Cônica: a Terra é projetada sobre um cone que tangencia ou corta a esfera em paralelos padrão; é a projeção ideal para mapear países e continentes situados nas médias latitudes (zonas temperadas, como os Estados Unidos e a Europa), onde as distorções são mínimas.",
    [
      "Projeção Azimutal Polar: plano tangente ao Polo; paralelos circulares concêntricos e meridianos radiais retos",
      "Emblema da ONU: projeção azimutal polar (nenhum país ou continente aparece como 'o topo' ou 'o centro' do mundo)",
      "Rotas aéreas polares: mapas azimudais mostram a linha reta de menor distância sobre a calota polar (ortodrômica)",
      "Projeção Cônica: ideal para representar regiões de médias latitudes (zonas temperadas do Hemisfério Norte e Sul)"
    ],
    "Para o ENEM: olhe o formato dos paralelos e meridianos: se os meridianos e paralelos formam uma grade em cruz de 90° retos, a projeção é Cilíndrica. Se os paralelos são círculos concêntricos e os meridianos raios saindo do meio, a projeção é Azimutal Polar. Se os meridianos convergem como um leque e os paralelos são arcos, a projeção é Cônica.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Projeção Azimutal Polar (Símbolo da ONU)</text><circle cx='90' cy='85' r='50' fill='none' stroke='#2F5BFF' stroke-width='2'/><circle cx='90' cy='85' r='35' fill='none' stroke='#2F5BFF' stroke-width='1.5'/><circle cx='90' cy='85' r='20' fill='none' stroke='#2F5BFF' stroke-width='1.5'/><line x1='90' y1='35' x2='90' y2='135' stroke='#2F5BFF' stroke-width='1.5'/><line x1='40' y1='85' x2='140' y2='85' stroke='#2F5BFF' stroke-width='1.5'/><circle cx='90' cy='85' r='4' fill='#D12D20'/><text x='82' y='80' font-size='8' fill='#D12D20' font-weight='700'>Polo</text><text x='160' y='65' font-size='10' fill='var(--tx)' font-weight='700'>➔ Polo Norte como centro</text><text x='160' y='85' font-size='9' fill='var(--tx)'>➔ Meridianos retos em raio</text><text x='160' y='105' font-size='9' fill='var(--tx)'>➔ Paralelos circulares concêntricos</text><text x='160' y='125' font-size='9' fill='var(--mu)'>Emblema oficial da ONU</text></svg>O emblema oficial da Organização das Nações Unidas (ONU) apresenta um mapa-múndi circunscrito por ramos de oliveira, no qual todos os continentes e oceanos são distribuídos em torno do Polo Norte, sem hierarquizar um hemisfério ou nação como superior.",
    "A superfície geométrica e o tipo de projeção cartográfica empregados na elaboração do símbolo da ONU correspondem à:",
    [
      "projeção azimutal (plana) polar equidistante centrada no Polo Norte.",
      "projeção cilíndrica conforme de Mercator com foco no Equador.",
      "projeção cônica equivalente de Albert para regiões tropicais.",
      "carta de relevo sombreado com curvas de nível militar submarina.",
      "anamorfose estatística baseada na extração de ouro aluvionar."
    ],
    0,
    "Alternativa correta: A. O emblema da ONU adota a projeção azimutal polar equidistante: o plano de projeção tangencia o Polo Norte, gerando círculos concêntricos para os paralelos e retas radiais para os meridianos; essa representação é simbolicamente neutra, pois abraça todos os continentes do mundo ao redor do polo sem colocar o Ocidente ou o Oriente em primazia cartográfica. As alternativas A, C, D e E trazem outras projeções incompatíveis com a geometria circular do emblema."
  ],
  "População absoluta vs relativa: populoso e povoado": [
    "Na demografia geográfica, é rigorosamente obrigatório distinguir população absoluta de população relativa (densidade demográfica). População Absoluta é o número total de habitantes que residem em um determinado território ou país; quando esse número é muito elevado, diz-se que o território é populoso (ex.: Índia e China são os países mais populosos do mundo, com mais de 1,4 bilhão cada; o Brasil é o 7º mais populoso, com cerca de 203 milhões de habitantes no Censo 2022). Já a População Relativa (ou Densidade Demográfica) expressa a distribuição espacial da população em relação à área territorial, calculada pela fórmula matemática: Densidade = População Absoluta ÷ Área (habitantes por km²); quando essa razão é elevada, diz-se que o território é povoado (ex.: Bangladesh possui mais de 1.100 hab/km²; Mônaco mais de 19.000 hab/km²). Um país pode ser muito populoso e, ao mesmo tempo, pouco povoado em virtude de suas dimensões continentais: é o caso exato do Brasil, que com 203 milhões de habitantes espalhados por 8,5 milhões de km² possui densidade demográfica baixa, de aproximadamente 24 hab/km², sendo considerado um país populoso, porém pouco povoado.",
    [
      "População Absoluta: número total de habitantes de um país ➔ define se o país é POPULOSO",
      "População Relativa (Densidade Demográfica): População total ÷ Área em km² ➔ define se é POVOADO",
      "Brasil no Censo 2022: ~203 milhões de habitantes em 8,5 milhões de km² ➔ Densidade de ~24 hab/km²",
      "Paradoxo demográfico brasileiro: o Brasil é muito POPULOSO (7º do mundo), mas é pouco POVOADO e com distribuição muito desigual"
    ],
    "Cálculo verificado: se uma região hipotética possui 1.200.000 habitantes e sua área territorial é de 40.000 km², sua densidade demográfica é: 1.200.000 ÷ 40.000 = 30 hab/km².",
    "O Censo Demográfico do IBGE apurou que o território brasileiro atingiu a marca de aproximadamente 203 milhões de habitantes em uma extensão territorial continental de cerca de 8,51 milhões de quilômetros quadrados, revelando ainda que mais de 40% dessa população concentra-se nos estados da Região Sudeste.",
    "A caracterização demográfica correta do território brasileiro decorrente da análise integrada dos dados de população absoluta e de densidade demográfica é a de um país:",
    [
      "pouco populoso e homogeneamente povoado com densidade superior a 500 hab/km².",
      "desabitado no litoral oriental e hiperdensamente povoado nas florestas de terra firme amazônicas.",
      "populoso em termos absolutos, porém pouco povoado em sua média geral e com distribuição espacial marcadamente desigual.",
      "com taxa de natalidade negativa que extinguiu toda a população jovem em idade escolar.",
      "onde a densidade demográfica no estado do Amazonas é cinco vezes maior que na cidade de São Paulo."
    ],
    2,
    "Alternativa correta: C. O Brasil figura entre as maiores populações absolutas do globo (populoso), mas apresenta baixa densidade demográfica média (~24 hab/km²) devido à sua imensa extensão territorial continental (pouco povoado); além disso, a população distribui-se de modo profundamente desigual, concentrando-se na faixa litorânea e no Sudeste e deixando vazios demográficos no interior do Norte e Centro-Oeste. As alternativas A, C, D e E trazem dados comprovadamente falsos."
  ],
  "Fuga de cérebros e migração qualificada": [
    "A 'fuga de cérebros' (brain drain) é a modalidade de migração internacional caracterizada pela emigração sistemática de profissionais de alta qualificação técnica, cientistas, pesquisadores acadêmicos, engenheiros, médicos e desenvolvedores de tecnologia de países em desenvolvimento e periféricos para nações desenvolvidas centrais (como Estados Unidos, Canadá, Alemanha e Reino Unido). Esse fluxo é impulsionado por fatores de repulsão no país de origem (cortes severos em orçamentos públicos de ciência e pesquisa, sucateamento de laboratórios universitários, baixos salários, instabilidade política e falta de plano de carreira) e fortes fatores de atração nos países de destino (vistos especiais de residência para talentos, salários em moedas fortes, infraestrutura de ponta de P&D e investimentos massivos de corporações tecnológicas). Para o país de origem, a fuga de cérebros representa uma perda socioeconômica colossal: o país financia a formação acadêmica gratuita desses profissionais (em universidades públicas de excelência) e perde a capacidade de inovar e agregar valor à sua própria economia, aprofundando o fosso tecnológico em relação aos países centrais.",
    [
      "Fuga de cérebros (Brain Drain): emigração de cientistas, engenheiros e profissionais altamente qualificados",
      "Fatores de repulsão: cortes em bolsas de pesquisa (CNPq/Capes), falta de investimento em ciência e desvalorização profissional",
      "Fatores de atração: salários altos em dólar/euro, laboratórios de ponta e facilidades de vistos em países do Norte",
      "Impacto no país de origem: desperdício do investimento público em formação e atraso na inovação científica nacional"
    ],
    "Para a redação e para a prova do ENEM: a fuga de cérebros é uma forma silenciosa de transferência de riqueza; o Brasil gasta centenas de milhares de reais dos impostos para formar um doutor ou médico, e quem colhe os frutos dos impostos e das patentes geradas por esse cientista é uma empresa nos EUA ou na Europa.",
    "Relatórios da Academia Brasileira de Ciências (ABC) e do Centro de Gestão e Estudos Estratégicos (CGEE) apontam que, ao longo da última década, milhares de pesquisadores doutores e especialistas em tecnologia de ponta deixaram o Brasil para atuar em centros de pesquisa e universidades do hemisfério norte, motivados por cortes orçamentários contínuos em bolsas de pós-graduação e carência de recursos para laboratórios científicos no país.",
    "A consequência socioeconômica mais grave acarretada pela fuga de cérebros para o desenvolvimento estratégico do país de origem é o(a):",
    [
      "desperdício do investimento social realizado na formação acadêmica e o aprofundamento da dependência tecnológica externa.",
      "aumento automático da capacidade nacional de produzir chips e patentes industriais de ponta.",
      "erradicação definitiva de qualquer necessidade de importar maquinários médicos avançados.",

  "Indústria 4.0 e automação inteligente": [
    "A Indústria 4.0 (ou Quarta Revolução Industrial) representa o estágio contemporâneo de transformação dos processos fabris e logísticos, impulsionado pela convergência e fusão entre os mundos físico, digital e biológico. Fundamenta-se em um conjunto disruptivo de tecnologias avançadas: 1) Internet das Coisas (IoT industrial): sensores conectados que comunicam dados de máquinas em tempo real; 2) Inteligência Artificial (IA) e Machine Learning: algoritmos preditivos capazes de otimizar a linha de montagem e antecipar falhas; 3) Computação em Nuvem e Big Data: processamento massivo de informações operacionais; 4) Robótica colaborativa autônoma (cobots); 5) Manufatura aditiva (impressão 3D de peças complexas); 6) Sistemas ciberfísicos (gêmeos digitais de fábricas inteiras). Essa revolução eleva os índices de produtividade e flexibilidade fabril a patamares inéditos, mas impõe profundos impactos no mercado de trabalho: destruição acelerada de postos operacionais tradicionais (desemprego estrutural tecnológico), exigência de mão de obra hiperqualificada em ciências da computação e aprofundamento das assimetrias entre nações ricas detentoras das tecnologias de IA e nações periféricas subordinadas.",
    [
      "Indústria 4.0: fusão de inteligência artificial, robótica avançada, internet das coisas e big data",
      "Sistemas ciberfísicos: fábricas inteligentes interconectadas que tomam decisões operacionais autônomas",
      "Desemprego estrutural: extinção permanente de empregos operacionais repetitivos substituídos por robôs e algoritmos",
      "Disparidade global: países líderes em IA e patentes ampliam a dominação econômica sobre os demais"
    ],
    "Para o ENEM: diferencie os tipos de desemprego: Desemprego CONJUNTURAL ocorre por crises econômicas passageiras (quando a economia volta a crescer, as vagas voltam). Desemprego ESTRUTURAL ocorre pela introdução de novas tecnologias e robôs (o posto de trabalho é extinto para sempre e não volta mais).",
    "Em uma fábrica automobilística modernizada, braços robóticos operam de maneira autônoma com sensores conectados à nuvem e inteligência artificial, dispensando a presença humana no galpão de funilaria e pintura, reduzindo o tempo de montagem de um veículo em 60% e reduzindo o quadro de operários tradicionais de 1.200 para 80 técnicos de monitoramento de software.",
    "O impacto socioeconômico direto sobre o mercado de trabalho urbano decorrente da difusão das tecnologias da Indústria 4.0 é o(a):",
    [
      "retorno maciço do artesanato manual em corporações de ofício medievais.",
      "ampliação do desemprego estrutural nas funções operacionais repetitivas e a exigência de novas competências técnicas digitais avançadas.",
      "garantia de contratação formal de operários analfabetos em postos de liderança de programação.",
      "proibição legal do uso de computadores e internet em todas as linhas de montagem fabris.",
      "estatização compulsória de todas as patentes de softwares criadas por empresas privadas."
    ],
    1,
    "Alternativa correta: B. A automação avançada e a robótica inteligente substituem o trabalho humano manual em tarefas rotineiras, eliminando empregos industriais tradicionais de forma permanente (desemprego estrutural), ao mesmo tempo em que polariza o mercado com a demanda por poucos profissionais especializados em análise de dados, mecatrônica e inteligência artificial. As alternativas A, C, D e E trazem hipóteses incoerentes."
  ],
  "Cabotagem e a Lei da BR do Mar": [
    "A cabotagem é a navegação marítima comercial de cargas e passageiros realizada ao longo da costa de um mesmo país entre portos nacionais ou entre portos de países vizinhos sem transpor o oceano aberto. O Brasil possui um potencial natural de cabotagem incomparável: mais de 7.400 km de litoral contínuo e mais de 80% de sua população e polos industriais situados a menos de 200 km da faixa costeira. No entanto, historicamente o modal aquaviário responde por menos de 10% da matriz de transporte de cargas interestaduais, asfixiado pelo domínio rodoviarista de caminhões a diesel. A Lei nº 14.301/2022 (programa 'BR do Mar') foi promulgada para destravar a cabotagem, flexibilizando o afretamento de navios estrangeiros, incentivando a competição, reduzindo os custos de frete marítimo e diminuindo as emissões de carbono no transporte de cargas pesadas a longas distâncias.",
    [
      "Cabotagem: navegação de comércio costeiro entre portos do mesmo litoral (porto a porto nacional)",
      "Potencial geográfico do Brasil: costa marítima contínua de mais de 7.400 km e população concentrada perto do mar",
      "Vantagens da cabotagem: capacidade colossal por embarcação, menor consumo de combustível por tonelada e menor emissão de CO₂",
      "BR do Mar (Lei 14.301/2022): marco legal para ampliar a frota mercante e equilibrar a matriz de transportes"
    ],
    "Para o ENEM: transportar contêineres por navio de cabotagem de Manaus até Santos queima até quatro vezes menos combustível por tonelada do que cruzar o país em caminhões bitrem pelas rodovias esburacadas.",
    "Um estudo comparativo de modais de transporte elaborado pela Agência Nacional de Transportes Aquaviários (ANTAQ) demonstrou que a transferência de cargas industriais do modal rodoviário para navios porta-contêineres na rota litorânea entre Suape (PE) e Santos (SP) reduz o custo logístico de frete por tonelada em mais de 30% e corta em 75% as emissões de gases poluentes por quilômetro percorrido.",
    "A expansão da navegação de cabotagem no litoral brasileiro atende aos objetivos estratégicos de sustentabilidade e eficiência logística ao:",
    [
      "aproveitar a extensão contínua da costa marítima nacional para baratear fretes de longa distância e descarbonizar o transporte de cargas.",
      "eliminar em definitivo o acesso de portos brasileiros ao comércio exterior atlântico.",
      "obrigar todas as cargas a serem transportadas exclusivamente por tração animal nas praias.",
      "fechar as rodovias estaduais para a circulação de ambulâncias e ônibus de passageiros.",
      "proibir a atracação de embarcações em terminais portuários das regiões Norte e Nordeste."
    ],
    0,
    "Alternativa correta: A. A cabotagem explora a vantagem geográfica de o Brasil possuir uma imensa costa oceânica navegável o ano inteiro; cada navio mercante retira centenas de carretas das rodovias, desafogando o trânsito, reduzindo custos de manutenção viária e diminuindo drasticamente as emissões de carbono no transporte interestadual de longa distância. As alternativas A, C, D e E trazem formulações descabidas."
  ],
  "Lítio e minerais críticos da transição energética": [
    "A transição energética global rumo à descarbonização e à mobilidade elétrica impulsionou uma nova geopolítica de recursos minerais centrada nos chamados 'minerais críticos' ou estratégicos: lítio, cobalto, níquel, cobre, grafite e elementos de terras raras, indispensáveis para a fabricação de baterias de íon-lítio de veículos elétricos, turbinas eólicas e painéis solares fotovoltaicos. O lítio ('o ouro branco do século XXI') concentra-se geopoliticamente no 'Triângulo do Lítio' sul-americano (formado pelas salinas e salares andinos de Bolívia, Chile e Argentina, que detêm mais de metade das reservas mundiais em salmouras). No Brasil, o lítio ocorre em rochas de pegmatito granítico no semiárido do Vale do Jequitinhonha, em Minas Gerais (projeto 'Vale do Lítio'). A extração mineral desses insumos críticos gera novos desafios socioambientais: consumo e contaminação de águas em regiões áridas, conflitos territoriais com comunidades indígenas e camponesas e a ameaça de reprodução de uma lógica neoextrativista subordinada, na qual os países do Sul exportam minério bruto sem refino de alto valor agregado.",
    [
      "Minerais críticos: lítio, cobalto, níquel e terras raras vitais para baterias de carros elétricos e energia limpa",
      "Triângulo do Lítio: salares da Bolívia (Salar de Uyuni), Chile (Atacama) e Argentina",
      "Vale do Lítio em Minas Gerais (Vale do Jequitinhonha): reservas brasileiras de lítio em rocha pegmatítica",
      "Risco do neoextrativismo: países em desenvolvimento exportam a matéria-prima bruta barata e importam as baterias caras"
    ],
    "Para a redação e para a prova do ENEM: trocar o carro a gasolina pelo carro elétrico ajuda a reduzir as emissões de carbono nos centros urbanos, mas a fabricação das baterias exige minerar lítio e cobalto em áreas ambientalmente frágeis; sem reciclagem e respeito às comunidades locais, a transição energética não será justa nem sustentável.",
    "A crescente demanda global por baterias para veículos elétricos e sistemas de armazenamento de energia renovável transformou o Vale do Jequitinhonha, em Minas Gerais, em um polo de mineração de lítio que atrai corporações transnacionais, despertando debates sobre a geração de empregos locais versus os impactos sobre os recursos hídricos e as comunidades rurais tradicionais da região.",
    "A importância geopolítica e tecnológica do lítio na conjuntura econômica internacional contemporânea decorre do fato de ele ser o:",
    [
      "único combustível fóssil hidrocarboneto capaz de substituir o carvão mineral em usinas siderúrgicas de aço.",
      "mineral estratégico essencial para a fabricação de baterias de alta densidade energética que viabilizam a transição para a mobilidade elétrica.",
      "elemento radioativo utilizado exclusivamente em ogivas de armas atômicas de dissuasão militar.",
      "fertilizante químico sintético que substitui o nitrogênio nas lavouras monocultoras de soja.",
      "gás inerte respirável utilizado em mergulhos de águas profundas na costa antártica."
    ],
    1,
    "Alternativa correta: B. O lítio possui propriedades eletroquímicas singulares de leveza e condutividade que o tornam insubstituível na tecnologia atual de baterias recarregáveis de íon-lítio para automóveis elétricos e celulares; o controle de suas jazidas e processamento industrial converteu-se em questão central da soberania energética moderna. As alternativas A, C, D e E trazem propriedades mineralógicas inteiramente falsas."
  ],
  "Ciclos econômicos e arquipélago econômico do Brasil": [
    "A formação histórica do território brasileiro caracterizou-se pela sucessão de ciclos econômicos primário-exportadores voltados a atender às demandas do mercado consumidor europeu e mundial: o ciclo do pau-brasil (século XVI), o ciclo da cana-de-açúcar no litoral nordestino (séculos XVI e XVII), o ciclo do ouro e diamantes em Minas Gerais e Goiás (século XVIII), o ciclo do café no Vale do Paraíba e no oeste paulista (séculos XIX e XX) e o ciclo da borracha na Amazônia (final do século XIX e início do XX). O geógrafo e historiador Caio Prado Júnior cunhou o célebre conceito de 'arquipélago econômico' para descrever a estrutura espacial resultante desse modelo colonial e pós-colonial: as regiões brasileiras funcionavam como ilhas econômicas isoladas e desconectadas entre si, voltadas para o comércio marítimo com o exterior ('ilhas voltadas para fora'), com pouquíssima integração física, viária ou comercial intra-nacional. A superação desse arquipélago e a efetiva integração do mercado interno nacional só ocorreram no século XX com a industrialização do Sudeste, a construção de rodovias radiais e a fundação de Brasília.",
    [
      "Ciclos econômicos: cana (Nordeste), ouro (Sudeste/Centro-Oeste), borracha (Norte) e café (Sudeste)",
      "Arquipélago econômico (Caio Prado Jr.): ilhas regionais isoladas entre si que produziam para a metrópole externa",
      "Integração do mercado nacional: consolidada a partir dos anos 1930/50 com a industrialização e a malha rodoviária",
      "Brasília (1960): papel geopolítico de interiorização do povoamento e articulação das regiões brasileiras"
    ],
    "Para o ENEM: a expressão 'arquipélago econômico' sintetiza a falta de integração do Brasil até os anos 1930: era mais fácil, barato e rápido viajar ou mandar mercadorias de navio de Recife ou Belém para Londres do que de Recife para São Paulo ou Cuiabá.",
    "Ao analisar a evolução histórica do território brasileiro até o início do século XX, o historiador Caio Prado Júnior destacou que as diversas regiões do país funcionavam como um conjunto de 'ilhas econômicas' separadas por vastos vazios geográficos, cujas produções primárias destinavam-se quase exclusivamente a portos de exportação ultramarinos, sem fluxos comerciais significativos entre as províncias.",
    "A denominação analítica atribuída por Caio Prado Júnior a essa desarticulação espacial histórica do território nacional é a de:",
    [
      "bloco econômico aduaneiro integrado por ferrovias circulares.",
      "rede urbana contínua polarizada por capitais metropolitanas planejadas.",
      "federação de cidades globais com conectividade digital em tempo real.",
      "mercado comum socialista com distribuição equitativa de bens industriais de base.",
      "arquipélago econômico, marcado por enclaves produtivos voltados para fora e desprovidos de integração interna."
    ],
    4,
    "Alternativa correta: E. O conceito de 'arquipélago econômico' retrata a fragmentação espacial do Brasil colonial e agrário-exportador: cada polo regional (açúcar na Zona da Mata, ouro em Minas, borracha no Amazonas, café em São Paulo) operava como uma ilha autônoma articulada diretamente às metrópoles estrangeiras por rotas oceânicas, com quase inexistente comunicação e comércio terrestre entre as regiões. As alternativas A, C, D e E usam conceitos contemporâneos que não existiam na época."
  ],
  "A questão de Taiwan e tensões no Pacífico Ocidental": [
    "A Questão de Taiwan (República da China) é um dos mais perigosos focos de atrito geopolítico e militar do planeta, envolvendo a rivalidade hegemônica entre os Estados Unidos e a República Popular da China. A disputa remonta à Revolução Chinesa de 1949: derrotados pelas forças comunistas de Mao Tsé-Tung, os nacionalistas do Kuomintang, liderados por Chiang Kai-shek, refugiaram-se na ilha de Taiwan e estabeleceram um governo separado apoiado por Washington. O governo de Pequim considera Taiwan como uma 'província rebelde' e parte inalienável de seu território soberano (princípio de 'Uma Só China'), declarando a meta histórica de reunificação nacional, inclusive pelo uso da força se houver proclamação formal de independência. Por sua vez, Taiwan consolidou-se como uma democracia próspera e estratégica: a ilha domina o mercado mundial de microchips avançados (a empresa TSMC fabrica mais de 90% dos semicondutores mais sofisticados do mundo) e localiza-se na 'primeira cadeia de ilhas' que bloqueia o acesso militar irrestrito da marinha chinesa ao Oceano Pacífico aberto, contando com o apoio militar e venda de armas dos Estados Unidos.",
    [
      "Taiwan: ilha autogovernada desde 1949; Pequim exige reunificação sob o princípio de 'Uma Só China'",
      "TSMC e semicondutores: o 'escudo de silício' de Taiwan que a torna vital para a economia dos EUA e da China",
      "Primeira cadeia de ilhas: barreiras geográficas insulares (Japão, Taiwan, Filipinas) que cercam a costa chinesa",
      "Risco de conflito: confronto direto entre as duas maiores potências militares e econômicas do globo"
    ],
    "Para o ENEM: a importância de Taiwan para os Estados Unidos é dupla: geopolítica (manter a China contida em seu mar costeiro) e tecnológica (proteger o suprimento de microchips da TSMC, sem os quais a indústria norte-americana e global entraria em colapso).",
    "Manobras militares com mísseis balísticos e frotas navais chinesas no Estreito de Taiwan geram frequentes declarações de alerta do governo norte-americano sobre o compromisso de assegurar a liberdade de navegação e a defesa da ilha autogovernada, em meio a reiteradas declarações de Pequim de que a reunificação territorial com a ilha é um imperativo nacional irrenunciável.",
    "A relevância geopolítica fundamental que torna a estabilidade da ilha de Taiwan uma questão de segurança nacional crítica tanto para Washington quanto para Pequim fundamenta-se no fato de que Taiwan:",
    [
      "é o maior produtor de petróleo cru em terra firme e de carvão betuminoso de todo o planeta.",
      "faz divisa terrestre direta com as fronteiras estaduais do estado do Amazonas.",
      "aboliu qualquer tipo de relação comercial com corporações tecnológicas internacionais.",
      "é um território desabitado utilizado exclusivamente para testes de ogivas espaciais da ONU.",
      "ocupa posição geográfica vital na primeira cadeia de ilhas do Pacífico e detém a liderança global na fabricação de semicondutores avançados."
    ],
    4,
    "Alternativa correta: E. Taiwan ocupa uma posição geoestratégica indispensável: militarmente, situa-se no centro da 'primeira cadeia de ilhas' que cerca o litoral da China; economicamente, abriga a maior fundição de chips semicondutores do planeta (TSMC), da qual dependem as indústrias automotiva, médica, de telecomunicações e bélica do mundo inteiro. As alternativas A, C, D e E trazem disparates factuais."
  ],
  "Escala geográfica: do local ao global": [
    "A escala geográfica é a dimensão espacial e metodológica utilizada para analisar, compreender e intervir sobre os fenômenos socioespaciais. Difere da escala cartográfica (que é uma razão matemática numérica entre o mapa e a realidade): a escala geográfica refere-se à abrangência, alcance e nível de manifestação das relações sociais e ecológicas, transitando do nível local (o bairro, a aldeia, a rua), passando pelo regional (o estado, o bioma, o vale fluvial), pelo nacional (o território do Estado-nação e suas leis) até o global (o sistema econômico mundial, acordos climáticos da ONU e fluxos financeiros transnacionais). A globalização contemporânea gerou a interdependência e a sobreposição dialética dessas escalas (o fenômeno da 'glocalização'): uma decisão financeira tomada em uma bolsa de valores em Nova York repercute imediatamente no desemprego de uma fábrica em uma pequena cidade do interior paulista; reciprocamente, o desmatamento promovido por um trator em uma fazenda local no Cerrado altera o ciclo global do carbono e do clima planetário.",
    [
      "Escala geográfica ≠ Escala cartográfica: a geográfica é a escala do fenômeno social e de sua abrangência espacial",
      "Níveis de escala: local, regional, nacional e global (interconectados pela globalização)",
      "Glocalização: articulação direta entre a dinâmica global planetária e as especificidades do lugar local",
      "Interdependência escalar: ações locais têm consequências globais (ex.: queimadas locais alterando o clima mundial)"
    ],
    "Para a prova do ENEM: nunca confunda a escala geográfica com a escala cartográfica do mapa. A escala cartográfica é a régua matemática (ex.: 1:50.000). A escala geográfica é o nível do fenômeno analisado: local, regional, nacional ou global.",
    "Ao analisar a contaminação por agrotóxicos em uma bacia hidrográfica do Centro-Oeste, um geógrafo demonstra que o uso do pesticida ocorre na escala local da lavoura, contudo a proibição de resíduos dessa substância em grãos é imposta pela legislação sanitária da União Europeia na escala global, e o crédito para a compra do insumo depende da taxa de juros do Banco Central na escala nacional.",
    "A abordagem espacial adotada pelo geógrafo na análise do fenômeno exemplifica o princípio da:",
    [
      "incomunicabilidade perpétua entre o espaço urbano e o espaço rural.",
      "eliminação definitiva do nível nacional de governo pela dissolução de todas as leis estatais.",
      "determinação climática exclusiva e cega que impede qualquer ação humana no território.",
      "articulação dialética entre as diferentes escalas geográficas na produção e regulação do espaço.",
      "impossibilidade matemática de representar dados agrários em mapas temáticos."
    ],
    3,
    "Alternativa correta: D. A análise geográfica crítica exige a apreensão simultânea de diferentes escalas espaciais (local, nacional, global) para compreender como decisões econômicas planetárias e legislações federais incidem concretamente sobre as práticas e conflitos vividos no cotidiano do lugar. As alternativas A, C, D e E trazem conclusões contrárias ao método geográfico."
  ],
  "Biopirataria e patrimônio genético": [
    "A biopirataria consiste na exploração, apropriação, patenteamento e comercialização ilegal de recursos biológicos (fauna e flora) e conhecimentos tradicionais associados de povos indígenas e comunidades locais por corporações e laboratórios estrangeiros sem prévia autorização e sem a justa repartição de benefícios. O Brasil, detentor da maior megadiversidade do planeta, é alvo histórico de biopirataria na Amazônia e no Cerrado, com casos célebres de registro indevido de patentes no exterior de princípios ativos derivados do cupuaçu, do veneno de jararaca (captopril) e do açaí. A Convenção sobre Diversidade Biológica (CDB, ECO-92), o Protocolo de Nagoia e a Lei da Biodiversidade brasileira (Lei nº 13.123/2015) estabelecem o consentimento prévio informado e a repartição obrigatória dos lucros econômicos gerados com as comunidades ancestrais que preservaram e desenvolveram esses saberes medicinais ao longo de gerações.",
    [
      "Biopirataria: apropriação e patenteamento ilegal de biodiversidade e saberes tradicionais por corporações",
      "Protocolo de Nagoia: tratado internacional que exige repartição justa e equitativa de benefícios genéticos",
      "Lei da Biodiversidade (Lei 13.123/2015): marco regulatório brasileiro de acesso ao patrimônio genético",
      "Conhecimento tradicional associado: saberes ancestrais de povos indígenas e ribeirinhos sobre plantas medicinais"
    ],
    "Para o ENEM: biopirataria não é só roubar animais vivos de avião (tráfico de animais); a forma mais perigosa de biopirataria moderna ocorre em laboratórios farmacêuticos que isolam a molécula de uma planta usada por séculos por indígenas e registram a patente no exterior, cobrando royalties e proibindo o Brasil de produzir o remédio.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Fluxo da Biopirataria no Sul Global</text><rect x='20' y='50' width='120' height='40' fill='#2E7D32' rx='6'/><text x='25' y='67' font-size='10' fill='#fff' font-weight='700'>Povos Tradicionais</text><text x='25' y='81' font-size='9' fill='#fff'>Manejo e Saber Ancestral</text><rect x='180' y='50' width='120' height='40' fill='#5B6785' rx='6'/><text x='185' y='67' font-size='10' fill='#fff' font-weight='700'>Laboratórios Globais</text><text x='185' y='81' font-size='9' fill='#fff'>Patentes e Monopólio</text><path d='M140 60 L 180 60' stroke='#D12D20' stroke-width='3'/><text x='70' y='115' font-size='10' fill='#D12D20' font-weight='700'>➔ Fuga de recursos genéticos sem repartição</text><text x='35' y='135' font-size='9' fill='var(--tx)'>Protocolo de Nagoia exige consentimento e royalties aos povos</text></svg>Pesquisadores estrangeiros coletaram amostras de cascas e folhas de plantas medicinais em aldeias amazônicas e, após isolarem em laboratório uma substância ativa contra dores inflamatórias, uma indústria química transnacional requereu a patente exclusiva do fármaco nos Estados Unidos e no Japão sem consultar os líderes indígenas nativos.",
    "A prática internacional descrita no texto é tipificada nos estudos ambientais como biopirataria porque envolve o(a):",
    [
      "reflorestamento gratuito de terras indígenas degradadas por monoculturas de soja.",
      "proibição global de qualquer tipo de pesquisa científica sobre a flora amazônica.",
