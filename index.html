      "conversão de toda a floresta tropical primária em laboratórios estatais públicos comunitários."
    ],
    3,
    "Alternativa correta: D. A biopirataria priva as nações de megadiversidade e as comunidades tradicionais do controle soberano e dos dividendos econômicos gerados a partir de seus próprios recursos naturais e saberes etnobotânicos, violando os princípios da Convenção sobre Diversidade Biológica da ONU. As alternativas A, C, D e E trazem formulações contraditórias com o conceito de biopirataria."
  ],
  "Créditos de carbono e mercado de carbono": [
    "O mercado de carbono é um mecanismo econômico e financeiro concebido sob a governança climática da ONU (criado no Protocolo de Quioto e regulamentado no Artigo 6 do Acordo de Paris) para incentivar a redução de emissões de gases de efeito estufa e canalizar investimentos para a preservação de florestas. Cada crédito de carbono corresponde comprovadamente à não emissão ou à captura de 1 tonelada de dióxido de carbono equivalente (tCO₂e) na atmosfera. No mercado voluntário e no regulado, empresas e países poluidores que ultrapassam suas metas de emissão são obrigados a comprar créditos gerados por projetos limpos (como reflorestamento, conservação de florestas nativas - REDD+, parques eólicos e solares). O Brasil possui potencial geográfico gigantesco para liderar o mercado global de créditos de carbono através da preservação da Amazônia e da transição agropecuária sustentável, embora enfrente o desafio da integridade e transparência para evitar o greenwashing (maquiagem verde corporativa sem redução real de carbono).",
    [
      "1 crédito de carbono = 1 tonelada de CO₂ equivalente (tCO₂e) evitada ou sequestrada da atmosfera",
      "REDD+: Redução de Emissões por Desmatamento e Degradação florestal associada à conservação e manejo",
      "Mecanismo financeiro do clima: quem polui além da conta paga e compra créditos de quem preserva florestas ou gera energia limpa",
      "Greenwashing: prática enganosa de empresas que compram créditos de carbono frágeis para forjar imagem sustentável"
    ],
    "Para o ENEM: crédito de carbono é uma compensação econômica, não uma licença para poluir eternamente; a prioridade ecológica mundial deve ser sempre a descarbonização na fonte (cortar o uso de petróleo e carvão).",
    "Uma siderúrgica multinacional na Europa, sujeita a rígidos limites legais de emissão de gases-estufa, financia anualmente a manutenção de uma Reserva de Desenvolvimento Sustentável na Amazônia brasileira que evita a derrubada de milhares de hectares de floresta primária, recebendo em troca certificados oficiais de créditos de carbono.",
    "A lógica econômica internacional que fundamenta o funcionamento desse mecanismo de compensação climática baseia-se na:",
    [
      "isenção perpétua de qualquer custo financeiro para indústrias que operam com termelétricas a carvão fóssil.",
      "proibição da presença de árvores e florestas nativas em países signatários do Acordo de Paris.",
      "atribuição de valor econômico à tonelada de carbono evitada ou capturada, remunerando projetos sustentáveis por meio da compra de créditos por setores poluidores.",
      "transformação do dióxido de carbono em moeda metálica de ouro distribuída aos cidadãos.",
      "estatização de todas as empresas florestais privadas pela Assembleia Geral da ONU."
    ],
    2,
    "Alternativa correta: C. O mercado de carbono cria um preço para as emissões de gases de efeito estufa (precificação do carbono): empresas que emitem em excesso precisam adquirir créditos de projetos que removem ou evitam emissões (como projetos de florestas preservadas), canalizando recursos para quem conserva a natureza. As alternativas A, C, D e E trazem formulações distorcidas."
  ],
  "Cidade compacta vs espraiamento urbano": [
    "Os modelos de crescimento urbano polarizam-se em dois padrões territoriais contrastantes: 1) Espraiamento Urbano (ou Urban Sprawl): expansão horizontal desordenada e de baixa densidade da mancha urbana sobre áreas rurais periféricas, com proliferação de condomínios fechados distantes e loteamentos populares desconectados; esse modelo impõe dependência extrema do automóvel individual, encarece brutalmente os custos do poder público para levar redes de água, asfalto e esgoto a distâncias quilométricas, devora áreas de recarga de aquíferos e gera trânsito diário caótico; 2) Cidade Compacta: modelo de urbanismo sustentável que preconiza a média e alta densidade demográfica, uso misto do solo (comércio, serviços e moradia no mesmo bairro ou edifício), valorização dos transportes públicos coletivos sobre trilhos e mobilidade ativa a pé ou em ciclovias (o conceito de 'cidade de 15 minutos'). A cidade compacta reduz o consumo de combustíveis fósseis, protege os ecossistemas no entorno e dinamiza o convívio social no espaço público.",
    [
      "Espraiamento urbano (Urban Sprawl): crescimento horizontal disperso, baixa densidade e dependência de automóveis",
      "Cidade Compacta: adensamento sustentável, uso misto do solo (morar perto do trabalho) e transporte coletivo de massa",
      "Cidade de 15 minutos: modelo urbanístico onde o cidadão acessa trabalho, saúde, escola e lazer em 15 minutos a pé ou de bicicleta",
      "Custos de infraestrutura: levar asfalto e canos para bairros periféricos espraiados custa até 4 vezes mais caro por habitante"
    ],
    "Para a redação e para a prova do ENEM: condomínios fechados horizontais murados no interior são o auge do espraiamento urbano excludente; quem mora lá consome litros de gasolina todos os dias para ir à cidade e privatiza a segurança, enquanto a periferia pobre é jogada ainda mais longe da infraestrutura.",
    "Ao revisar o Plano Diretor de uma metrópole regional, urbanistas constataram que a proliferação de condomínios fechados e loteamentos horizontais a mais de 35 km da área central quadruplicou os custos orçamentários com redes de saneamento e transporte, além de sobrecarregar rodovias radiais com engarrafamentos diários de veículos de passeio.",
    "Para reverter esse padrão predatório de espraiamento e promover a sustentabilidade socioespacial, as diretrizes urbanísticas contemporâneas recomendam:",
    [
      "a demolição de todas as linhas de metrô e ciclovias centrais para incentivar o uso do carro individual.",
      "a transferência compulsória da prefeitura para um loteamento isolado a 100 km do perímetro urbano.",
      "a proibição de comércios, padarias e consultórios em bairros habitacionais de classe média.",
      "o asfaltamento irrestrito de todas as bacias de mananciais hídricos do município.",
      "o incentivo à cidade compacta com uso misto do solo, adensamento controlado ao longo dos eixos de transporte público e proteção das franjas rurais periféricas."
    ],
    4,
    "Alternativa correta: E. O modelo de cidade compacta concentra moradia, empregos e serviços nos eixos já providos de transporte de massa sobre trilhos e corredores de ônibus, combatendo o espraiamento, reduzindo as distâncias diárias percorridas, poupando recursos orçamentários e diminuindo a emissão de poluentes atmosféricos. As alternativas A, C, D e E agravariam o caos urbano."
  ],
  "Cidades inteligentes e exclusão digital urbana": [
    "O conceito de 'Cidade Inteligente' (Smart City) define o espaço urbano que utiliza intensivamente tecnologias de informação e comunicação (TICs), sensores de internet das coisas (IoT), big data e inteligência artificial para gerenciar fluxos viários, iluminação pública por LED, câmeras de segurança, monitoramento de enchentes e serviços administrativos digitais. Embora ofereçam ganhos de eficiência operacional e sustentabilidade técnica, geógrafos urbanos críticos apontam os limites e contradições do modelo quando aplicado a metrópoles desiguais do Sul global: a instalação de infraestruturas inteligentes concentra-se seletivamente nos bairros nobres e eixos de alta renda (os 'espaços luminosos'), aprofundando o fosso da exclusão digital urbana em relação às periferias e favelas (os 'espaços opacos'), onde a população carece de internet de alta velocidade e de saneamento básico elementar. Além disso, a proliferação de tecnologias de reconhecimento facial e rastreamento algorítmico suscita debates urgentes sobre privacidade, vigilância em massa e racismo algorítmico contra minorias.",
    [
      "Smart Cities: cidades geridas por sensores, inteligência artificial, dados e automação de serviços públicos",
      "Exclusão digital urbana: contradição entre centros hiperconectados e periferias desprovidas de infraestrutura digital",
      "Espaços luminosos vs opacos (Milton Santos): tecnologia seletiva que privilegia áreas ricas e ignora periferias",
      "Vigilância algorítmica: uso de reconhecimento facial nas ruas que suscita debates sobre privacidade e discriminação racial"
    ],
    "Para o ENEM: uma cidade não pode ser verdadeiramente 'inteligente' se ela tiver postes de iluminação com wi-fi 5G nos bairros ricos enquanto a população da periferia ainda pisa no esgoto a céu aberto; inteligência urbana de verdade exige justiça socioespacial e universalização dos direitos.",
    "Em um município de grande porte, o poder público anunciou investimentos milionários para a instalação de semáforos inteligentes controlados por inteligência artificial e sensores de leitura facial nos bairros nobres centrais, enquanto moradores de assentamentos periféricos continuam sem acesso a computadores públicos, saneamento básico e rede de fibra óptica cabeada.",
    "A análise socioespacial crítica do processo revela que a modernização tecnológica nos moldes descritos:",
    [
      "eliminou instantaneamente todas as disparidades de renda e escolaridade da população urbana.",
      "proibiu a circulação de pedestres em áreas centrais dotadas de câmeras de segurança.",
      "garantiu o fornecimento gratuito de alimentação orgânica a todas as famílias vulneráveis.",
      "reproduz a lógica da seletividade espacial, aprofundando as desigualdades entre áreas hiperconectadas e periferias desprovidas de infraestrutura básica.",
      "estatizou todas as corporações privadas de telefonia móvel atuantes no país."
    ],
    3,
    "Alternativa correta: D. As tecnologias de cidades inteligentes tendem a ser implantadas de forma desigual, beneficiando bairros privilegiados com soluções tecnológicas sofisticadas enquanto problemas históricos fundamentais (como habitação digna, esgoto e transporte) permanecem negligenciados nas periferias, gerando uma modernização conservadora e excludente. As alternativas A, C, D e E trazem formulações distorcidas."
  ],
  "Complexos Agroindustriais (CAIs) e integração vertical": [
    "Os Complexos Agroindustriais (CAIs) representam a consolidação da industrialização da agricultura sob a lógica corporativa contemporânea, integrando de forma sistêmica as atividades que ocorrem 'antes da porteira' (indústria química de fertilizantes, agrotóxicos, sementes, tratores e máquinas), 'dentro da porteira' (a produção agropecuária propriamente dita) e 'depois da porteira' (indústria de processamento, frigoríficos, usinas de beneficiamento, redes de supermercados e logística portuária de tradings multinacionais). Destaca-se no Brasil o modelo da 'integração vertical' na avicultura e suinocultura (muito forte na Região Sul e Centro-Oeste): a grande corporação frigorífica fornece os pintinhos, a ração padronizada, as vacinas e a assistência técnica ao produtor rural integrado; este entra com as instalações físicas, os galpões climatizados, a energia elétrica e o trabalho familiar exaustivo, arcando com todos os riscos de perdas e endividamento e ficando subordinado aos preços e exigências estipulados pela integradora.",
    [
      "CAIs: integração técnica e financeira entre indústria de insumos, fazendas e indústrias de alimentos",
      "Antes da porteira: insumos químicos, tratores, sementes e biotecnologia fabril",
      "Depois da porteira: beneficiamento industrial, abate de carnes, embalagem, tradings e supermercados",
      "Integração vertical: pequeno produtor subordinado ao frigorífico corporativo (fornece animais criados sob padrão industrial)"
    ],
    "Para o ENEM: o produtor rural integrado ao CAI parece um 'proprietário livre', mas na prática opera como um trabalhador terceirizado da multinacional dentro do seu próprio lote, assumindo todos os riscos biológicos e ambientais da produção.",
    "Em municípios do oeste catarinense e do Paraná, pequenos avicultores familiares contratados por frigoríficos transnacionais recebem aves híbridas e rações industriais prontas, comprometendo-se a manter galpões com temperatura e iluminação controladas por normas rígidas, recebendo remuneração por lote entregue estipulada unilateralmente pela agroindústria compradora.",
    "A relação socioeconômica e produtiva estabelecida entre os produtores rurais e os grandes frigoríficos ilustra o funcionamento dos:",
    [
      "assentamentos comunais autogestionários indígenas do período pré-colombiano.",
      "complexos agroindustriais sob o regime de integração vertical e subordinação da produção camponesa ao capital fabril.",
      "sistemas de plantation escravista açucareira colonial com tração de moendas a boi.",
      "feudos medievais europeus de servidão com pagamento de tributos em metal precioso.",
      "sindicatos operários urbanos que controlam o abastecimento exclusivo de feiras livres municipais."
    ],
    1,
    "Alternativa correta: B. O modelo de integração agroindustrial subordina os agricultores familiares aos ditames das grandes corporações do agronegócio; o camponês arca com os custos dos galpões e da mão de obra, enquanto a agroindústria comanda a tecnologia, os insumos e a precificação final dos lotes abatidos. As alternativas A, C, D e E são anacrônicas ou descabidas."
  ],
  "Fronteira agrícola do Matopiba e expansão da soja": [
    "O Matopiba é o acrônimo que designa a mais dinâmica e agressiva fronteira agropecuária do Brasil contemporâneo, formada pela confluência territorial de porções contíguas de quatro estados: Maranhão, Tocantins, Piauí e Bahia. Essa região expandiu-se vertiginosamente a partir dos anos 1990 sobre o bioma Cerrado, beneficiada por atributos geográficos excepcionais para a mecanização intensiva em larga escala: extensos chapadões tabulares horizontais e planos, solos profundos fáceis de corrigir quimicamente com calcário (calagem), clima com estação chuvosa regular no verão e terras a preços mais acessíveis que no Centro-Sul. A região especializou-se na produção em alta produtividade de commodities voltadas à exportação (soja, milho e algodão em pluma), escoadas pelo Porto de Itaqui em São Luís (MA). Contudo, a expansão do Matopiba acarreta graves tensões socioambientais: desmatamento acelerado da vegetação nativa do Cerrado, rebaixamento de aquíferos por irrigação pesada de pivôs centrais e violentos conflitos de terra com populações tradicionais geraizeiras, vazanteiras e camponesas que há séculos habitam as áreas de baixão.",
    [
      "Matopiba: fronteira agrícola no Cerrado (Maranhão, Tocantins, Piauí e Bahia)",
      "Relevo favorável: chapadões planos que facilitam a mecanização plena com colheitadeiras e pulverizadores",
      "Escoamento logístico: Ferrovias Norte-Sul e Carajás integradas ao Porto de Itaqui (São Luís/MA)",
      "Impactos: desmatamento severo do Cerrado, grilagem de terras públicas e conflitos com comunidades geraizeiras tradicionais"
    ],
    "Para o ENEM: no Matopiba os grandes fazendeiros ocupam os topos planos dos chapadões para plantar soja mecanizada, enquanto as comunidades tradicionais (geraizeiros) vivem nos fundos de vale (baixões) onde corre a água; a quebra dos chapadões desvia a água das nascentes e seca as plantações das comunidades tradicionais.",
    "O avanço do agronegócio de grãos na região do Matopiba transformou o oeste baiano e o sul do Maranhão em polos globais de produtividade de soja e algodão, mas acendeu alertas científicos sobre a destruição da biodiversidade do Cerrado e a invasão de territórios ocupados historicamente por comunidades tradicionais de geraizeiros.",
    "O fator físico e geomorfológico que viabilizou a rápida introdução de maquinários agrícolas de alta precisão em escala monumental no Matopiba foi o predomínio de:",
    [
      "relevos cársticos com cavernas inundadas e despenhadeiros pontiagudos.",
      "escarpas serranas abruptas de alta montanha alpina cobertas por neves eternas.",
      "chapadões tabulares planos com baixa declividade e solos profundos propícios à mecanização intensiva.",
      "manguezais salobros com solos lodosos movediços sujeitos à maré atlântica.",
      "planícies costeiras de dunas móveis compostas exclusivamente de areia eólica estéril."
    ],
    2,
    "Alternativa correta: C. Os chapadões sedimentares do Cerrado no Matopiba apresentam relevo plano ou muito suavemente ondulado, o que permite o trânsito contínuo e em alta velocidade de colheitadeiras e tratores de grande porte guiados por GPS, reduzindo custos de combustível e maximizando a área plantada. As alternativas A, C, D e E citam relevos acidentados ou ecossistemas que impedem a mecanização de grãos."
  ],
  "Desindustrialização e reprimarização da economia": [
    "A desindustrialização é o fenômeno econômico caracterizado pela perda contínua e persistente da participação do setor industrial manufatureiro de transformação tanto no Produto Interno Bruto (PIB) quanto no emprego formal total de um país. No caso brasileiro, economistas apontam a ocorrência de uma 'desindustrialização precoce' a partir das décadas de 1980 e 1990: o parque industrial nacional começou a encolher antes mesmo de a renda per capita atingir os patamares de economias desenvolvidas. Paralelamente, ocorreu a reprimarização da pauta exportadora: enquanto nos anos 1980 os produtos manufaturados industrializados correspondiam a mais de 55% de todas as exportações brasileiras, nas últimas décadas os produtos primários básicos sem valor agregado (commodities como soja, minério de ferro, petróleo cru e carnes) passaram a responder por mais de metade de todas as vendas externas do país, tornando o Brasil vulnerável à 'doença holandesa' e às oscilações de preços nas bolsas de mercadorias internacionais.",
    [
      "Desindustrialização precoce: queda da participação da manufatura no PIB antes de o país enriquecer",
      "Reprimarização: pauta de exportação dominada por bens primários não processados (soja, minério de ferro, óleo cru)",
      "Doença holandesa: exportação maciça de commodities valoriza o câmbio nacional, barateia importados e quebra as fábricas locais",
      "Vulnerabilidade externa: submissão da balança comercial às cotações das bolsas globais de mercadorias"
    ],
    "Para a redação e para o ENEM: exportar navios de soja e minério de ferro bruto gera superávit em dólares, mas gera pouquíssimos empregos qualificados em comparação com fábricas de carros, semicondutores e aviões, mantendo o país preso à armadilha de renda média.",
    "Dados da balança comercial do Ministério do Desenvolvimento, Indústria, Comércio e Serviços (MDIC) mostram que mais de 55% do valor total das exportações brasileiras contemporâneas é composto por apenas três produtos básicos primários: soja em grão, minério de ferro bruto e petróleo cru não refinado.",
    "A tendência estrutural de aumento na dependência das exportações de produtos básicos primários em detrimento de bens industriais de alta tecnologia é denominada na Geografia Econômica como:",
    [
      "industrialização pesada por substituição de importações fabris.",
      "estatização compulsória de todo o parque fabril automobilístico multinacional.",
      "reprimarização da pauta exportadora associada ao processo de desindustrialização nacional.",
      "socialização comunitária de cooperativas têxteis descentralizadas.",
      "monopólio soberano sobre a produção de patentes de inteligência artificial quântica."
    ],
    2,
    "Alternativa correta: C. A reprimarização descreve o retorno da economia brasileira à condição de grande exportadora de produtos da terra e do subsolo (commodities agrícolas e minerais brutas) com baixo valor agregado, enquanto o setor fabril manufatureiro nacional perde competitividade frente aos produtos industrializados importados da Ásia. As alternativas A, C, D e E trazem formulações incoerentes."
  ],
  "Crise do subprime de 2008 e desregulamentação financeira": [
    "A crise financeira global deflagrada em 2008 teve como epicentro o colapso do mercado imobiliário dos Estados Unidos, motivado pela desregulamentação do sistema financeiro (que aboliu leis de controle que vigoravam desde a crise de 1929) e pela concessão irresponsável de empréstimos hipotecários de alto risco (conhecidos como créditos 'subprime') a famílias de baixa renda e sem histórico de crédito seguro. Os bancos empacotaram essas dívidas podres em títulos derivativos complexos e opacos (como os CDOs - obrigações de dívida colateralizada), vendendo-os como investimentos seguros para instituições financeiras, fundos de pensão e governos de todo o planeta. Quando a taxa de juros subiu nos EUA e os mutuários tornaram-se inadimplentes, a bolha imobiliária estourou: o quarto maior banco de investimentos do mundo, o Lehman Brothers, faliu em setembro de 2008, desencadeando um pânico bancário sistêmico global que paralisou o crédito, fechou fábricas, fez o comércio mundial desabar e arrastou a Europa para a crise das dívidas soberanas.",
    [
      "Crise de 2008: estopim no colapso dos empréstimos imobiliários de alto risco (subprime) nos EUA",
      "Desregulamentação financeira: bancos criaram derivativos complexos e títulos tóxicos sem fiscalização estatal",
      "Quebra do Lehman Brothers: marco histórico que gerou a maior recessão global desde o crash de 1929",
      "Contágio global: a interconexão do meio técnico-científico-informacional transmitiu a crise instantaneamente a todos os continentes"
    ],
    "Para o ENEM: a crise de 2008 desmontou o dogma neoliberal de que 'o mercado financeiro se autorregula sozinho'; os mesmos bancos e governos que defendiam o Estado mínimo correram aos cofres públicos para pedir trilhões de dólares dos contribuintes em socorro financeiro estatal.",
    "Em setembro de 2008, o colapso do banco de investimentos Lehman Brothers deflagrou uma crise de liquidez no sistema financeiro internacional que provocou a paralisação das linhas de crédito para o comércio exterior e mergulhou as principais economias ocidentais na mais profunda recessão registrada desde a Grande Depressão de 1929.",
    "O fator determinante que viabilizou a gestação da bolha imobiliária e a contaminação sistêmica de bancos e fundos de investimento em escala planetária foi a:",
    [
      "imposição de controle rígido e punições penais estatais sobre qualquer transação especulativa em Wall Street.",
      "abolição do uso de cartões de crédito e computadores eletrônicos no comércio varejista norte-americano.",
      "proibição por lei internacional da concessão de financiamentos para aquisição de imóveis urbanos.",
      "estatização de todas as bolsas de valores mundiais pela Organização das Nações Unidas.",
      "desregulamentação do setor bancário que permitiu a emissão e a livre circulação global de títulos securitizados lastreados em hipotecas podres de alto risco."
    ],
    4,
    "Alternativa correta: E. A desregulamentação financeira iniciada nos anos 1990 removeu travas legais à especulação bancária, permitindo a criação desenfreada de títulos derivativos lastreados em hipotecas podres (subprime); ao serem dispersados pelas redes de comunicação para bancos de todo o mundo, a inadimplência nos EUA gerou um efeito dominó que paralisou a economia mundial. As alternativas A, C, D e E trazem hipóteses falsas."
  ],
  "Camadas da atmosfera e tempo meteorológico": [
    "A atmosfera terrestre é o manto gasoso retido pela gravidade do planeta, estruturado em camadas sobrepostas com características térmicas e físico-químicas distintas: 1) Troposfera: camada mais baixa e densa (estende-se da superfície até cerca de 12-17 km de altitude); contém mais de 75% da massa total do ar e quase 100% de todo o vapor d'água da atmosfera; nela ocorrem todos os fenômenos meteorológicos que condicionam o tempo e o clima (nuvens, chuvas, ventos, frentes e tempestades); a temperatura diminui com a altitude (gradiente adiabático térmico de aproximadamente 6,5 °C por km); 2) Estratosfera: estende-se até cerca de 50 km; abriga a Camada de Ozônio (O₃), responsável por absorver a radiação ultravioleta (UV) nociva emitida pelo sol, fazendo com que a temperatura nessa camada aumente com a altitude; apresenta ar estável e seco, ideal para o voo de jatos comerciais; 3) Mesosfera: a camada mais fria (temperaturas inferiores a -90 °C), onde meteoroides entram em combustão por atrito; 4) Termosfera (ou Ionosfera): reflete ondas de rádio e abriga auroras polares e satélites de órbita baixa.",
    [
      "Troposfera: onde vivemos; concentra o vapor d'água e nela ocorrem todas as chuvas, nuvens e ventos",
      "Estratosfera: abriga a camada de ozônio (O₃) que filtra os raios ultravioleta (UV)",
      "Pressão atmosférica: é máxima ao nível do mar e diminui continuamente conforme a altitude aumenta (ar rarefeito)",
      "Gradiente térmico: na troposfera o ar esfria conforme subimos (perde ~6,5 °C a cada 1.000 metros)"
    ],
    "Para o ENEM: todos os fenômenos do tempo meteorológico (chuva, granizo, relâmpago, vento, nuvem) acontecem EXCLUSIVAMENTE na troposfera; acima da troposfera o ar é rarefeito e quase sem vapor d'água, não havendo formação de tempestades.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Perfil Vertical das Camadas da Atmosfera</text><rect x='30' y='35' width='260' height='22' fill='#14213D' rx='3'/><text x='115' y='50' font-size='9' fill='#fff' font-weight='700'>Termosfera / Ionosfera</text><rect x='30' y='60' width='260' height='22' fill='#5B6785' rx='3'/><text x='130' y='75' font-size='9' fill='#fff' font-weight='700'>Mesosfera</text><rect x='30' y='85' width='260' height='25' fill='#2F5BFF' rx='3'/><text x='85' y='101' font-size='9' fill='#fff' font-weight='700'>Estratosfera (Camada de Ozônio O₃)</text><rect x='30' y='113' width='260' height='25' fill='#2E7D32' rx='3'/><text x='65' y='129' font-size='9' fill='#fff' font-weight='700'>Troposfera (Tempo, Nuvens, Chuvas e Vida)</text></svg>Ao decolar para um voo intercontinental, um avião comercial atinge a altitude de cruzeiro de cerca de 11.000 metros, navegando próximo ao limite superior da troposfera (a tropopausa), onde o ar é extremamente rarefeito e as turbulências provocadas por nuvens de tempestade diminuem consideravelmente.",
    "A razão física e meteorológica pela qual os fenômenos meteorológicos que afetam o cotidiano terrestre (como a formação de nuvens e precipitações) concentram-se na troposfera fundamenta-se no fato de que essa camada:",
    [
      "é a única formada exclusivamente por magma líquido derretido em estado gasoso.",
      "apresenta vácuo absoluto que impede a circulação de moléculas de nitrogênio.",
      "concentra a imensa maioria do vapor de água e da massa gasosa atmosférica da Terra.",
      "localiza-se fora do campo de atração gravitacional do planeta Terra.",
      "é aquecida exclusivamente pela queima diária de meteoritos cadentes no solo."
    ],
    2,
    "Alternativa correta: C. A troposfera abriga mais de 99% de todo o vapor d'água da atmosfera e cerca de 75% da massa gasosa total; o aquecimento da superfície da Terra gera convecção que condensa esse vapor d'água, criando nuvens, chuvas e ventos. As alternativas A, C, D e E trazem formulações cientificamente falsas."
  ],
  "Monções asiáticas e dinâmica sazonal": [
    "O clima de monções rege a sobrevivência, a agricultura e a vida cotidiana de mais de dois bilhões de pessoas no Sul e Sudeste da Ásia (com destaque para a Índia, Bangladesh e Paquistão). Trata-se de um sistema de ventos sazonais de grande escala gerado pelo contraste térmico e barométrico estacional entre a gigantesca massa continental asiática e o Oceano Índico. No verão (Monção de Verão ou Monção Marítima): o continente asiático aquece intensamente sob a radiação solar estival, o ar quente sobe e forma um colossal centro de baixa pressão barométrica sobre a Índia; esse vácuo térmico atrai ventos oceânicos carregados de vapor d'água do Oceano Índico em direção ao continente; as massas úmidas encontram a barreira colossal da Cordilheira do Himalaia, provocando chuvas torrenciais orográficas ininterruptas por meses, causando inundações devastadoras, mas viabilizando o cultivo irrigado de arroz (rizicultura de inundação). No inverno (Monção de Inverno ou Continental): o continente esfria rápido, vira um centro de alta pressão fria e os ventos sopram do continente seco para o oceano, gerando uma prolongada e severa estação seca.",
    [
      "Monção de Verão (mar ➔ terra): úmida, chuvas torrenciais diárias, inundações e cultivo da rizicultura",
      "Monção de Inverno (terra ➔ mar): seca prolongada, ventos frios continentais soprando em direção ao Índico",
      "Gênese física: contraste térmico entre o calor específico da terra (continente) e da água (Oceano Índico)",
      "Barreira do Himalaia: impede a passagem das nuvens para o norte, concentrando toda a chuva no vale do Ganges"
    ],
    "Para o ENEM: a monção de verão na Índia é ao mesmo tempo bênção e tragédia: sem ela, as safras de arroz secam e milhões passam fome; se chover demais, ocorrem inundações catastróficas que destroem aldeias inteiras.",
    "Na bacia do Rio Ganges e nas planícies de Bangladesh, a economia rural é ritmada pela chegada dos ventos de monção entre os meses de junho e setembro: rios transbordam inundando milhares de hectares de várzeas, permitindo a semeadura em grande escala das lavouras tradicionais de arroz sob temperaturas elevadas.",
    "O mecanismo barométrico e térmico que desencadeia a Monção de Verão úmida no Sul da Ásia apoia-se no(a):",
    [
      "aquecimento pronunciado do continente asiático no verão, gerando um centro de baixa pressão que atrai massas de ar oceânicas repletas de umidade.",
      "resfriamento das águas do Oceano Índico provocado pelo avanço de blocos de gelo antárticos.",
      "estagnação contínua de ventos secos descendentes emitidos pelo deserto do Saara.",
      "ativação de erupções vulcânicas na ilha da Islândia que bloqueiam os ventos no Oceano Índico.",
      "ausência de relevo orográfico no território indiano que impede a formação de nuvens de chuva."
    ],
    0,
    "Alternativa correta: A. No verão do Hemisfério Norte, a terra do continente asiático esquenta muito mais rápido que o mar, formando uma vasta célula de baixa pressão térmica ciclônica; esse centro receptor suga os ventos oceânicos do Oceano Índico carregados de vapor d'água, provocando as chuvas torrenciais da monção de verão. As alternativas A, C, D e E trazem explicações incorretas."
  ],
  "Florestas temperadas e pradarias globais": [
    "Os biomas das zonas temperadas de latitudes médias caracterizam-se pelo equilíbrio estacional entre quatro estações do ano rigorosamente bem definidas (verão quente, outono fresco com mudança de coloração foliar, inverno frio com neve e primavera florida). A Floresta Temperada (dominante na Europa Ocidental, leste da América do Norte e leste da Ásia) é formada por árvores decíduas ou caducifólias (como carvalhos, faias e bordos), que perdem integralmente suas folhas no outono para reduzir a perda de água por transpiração e evitar o congelamento interno durante o inverno rigoroso, formando um rico manto de serrapilheira que gera solos profundos e férteis (como os alfissolos). Por ocuparem regiões densamente povoadas de industrialização pioneira, foram historicamente desmatadas para agricultura e cidades. Já as Pradarias (ou Estepes temperadas / Campos): desenvolvem-se em áreas de menor pluviosidade no interior dos continentes (como o Meio-Oeste dos EUA, a Ucrânia e as estepes russas), dominadas por gramíneas perenes; seus solos são os mais naturalmente ricos do planeta (como o Chernozem ou 'terra negra', repleto de matéria orgânica), convertidos nos maiores cinturões agrícolas mundiais de trigo e milho.",
    [
      "Floresta Temperada Caducifólia: perde as folhas no outono para resistir ao inverno frio (carvalhos, bordos)",
      "Pradarias e Estepes: vegetação rasteira de gramíneas em climas temperados continentais com invernos frios",
      "Chernozem (terra negra): solo mais fértil do mundo, rico em húmus nas pradarias da Ucrânia e Rússia",
      "Cinturões agrícolas globais: trigo e milho ocupam as antigas pradarias temperadas (Corn Belt e Wheat Belt nos EUA)"
    ],
    "Para o ENEM: caducifólia (ou decídua) significa que 'a folha cai'! Na Caatinga a folha cai na seca de calor; na Floresta Temperada a folha cai no outono para não congelar no inverno.",
    "Nas planícies centrais da América do Norte e nos vales da Ucrânia, a vegetação original de gramíneas de clima temperado deu lugar a imensos cinturões mecanizados de cultivo de trigo e girassol, beneficiados por um solo de coloração escura e altíssimo teor de matéria orgânica acumulada.",
    "O bioma temperado original e o tipo de solo fértil que sustentam as expressivas safras agrícolas de grãos relatadas são:",
    [
      "a floresta equatorial de terra firme e os latossolos lixiviados da Amazônia.",
      "o deserto hiperárido com lajedos rochosos desprovidos de minerais básicos.",
      "a tundra ártica de musgos sobreposta a horizontes salinizados por marés.",
      "as pradarias (ou estepes temperadas) assentadas sobre solos negros ricos em matéria orgânica (chernozen).",
      "os manguezais de estuário com solos arenosos movediços salobros."
    ],
    3,
    "Alternativa correta: D. As pradarias temperadas desenvolvem-se sob gramíneas densas cujas raízes e palhada entram em decomposição lenta no inverno frio, acumulando espessas camadas de matéria orgânica que originam solos negros de fertilidade natural excepcional (chernozen), hoje transformados nos maiores celeiros de cereais do mundo. As alternativas A, C, D e E citam biomas tropicais, polares ou desérticos."
  ],
  "Hotspots de biodiversidade no Brasil": [
    "O conceito biogeográfico de 'Hotspot de Biodiversidade', formulado pelo ecólogo britânico Norman Myers em 1988 e adotado pela organização Conservação Internacional, define as regiões ecológicas prioritárias para conservação no planeta que reúnem simultaneamente dois critérios rigorosos e cumulativos: 1) Apresentar altíssima biodiversidade com riqueza excepcional de espécies endêmicas (possuir pelo menos 1.500 espécies de plantas vasculares que não existem em nenhum outro lugar da Terra); 2) Estar criticamente ameaçado de extinção iminente por ter perdido pelo menos 70% de sua cobertura vegetal nativa original em razão da ocupação antrópica. No território brasileiro, apenas dois biomas qualificam-se formalmente como hotspots mundiais de biodiversidade: a Mata Atlântica (que perdeu cerca de 88% a 90% de sua vegetação para a urbanização e agricultura colonial e contemporânea) e o Cerrado (a savana mais biodiversa do globo, cuja cobertura foi reduzida a menos de metade pelo avanço da fronteira agropecuária da soja, cana e pastagens).",
    [
      "Critérios de Hotspot (Myers): >1.500 plantas endêmicas exclusivas + perda de mais de 70% da área original",
      "Hotspots no Brasil: apenas DOIS biomas atendem aos critérios: MATA ATLÂNTICA e CERRADO",
      "Por que a Amazônia e o Pantanal NÃO são hotspots? Porque, apesar de megadiversos, ainda conservam mais de 70% de sua vegetação nativa",
      "Endemismo: espécie que só ocorre naturalmente naquela região geográfica específica e em nenhum outro lugar"
    ],
    "Pegadinha clássica do ENEM: a Amazônia NÃO é um hotspot de biodiversidade! Por que? Porque para ser hotspot é obrigatório ter perdido mais de 70% da vegetação nativa (a Amazônia perdeu cerca de 20%, ainda conservando cerca de 80% da floresta nativa). Os únicos dois hotspots do Brasil são a Mata Atlântica e o Cerrado.",
    "A classificação de ecossistemas da Terra elaborada por Norman Myers identificou 36 regiões críticas que concentram mais de metade de todas as espécies vegetais endêmicas do planeta em menos de 3% da superfície terrestre, caracterizadas pela extrema perda de área provocada por desmatamentos históricos.",
    "No território brasileiro, os dois biomas que atendem integralmente aos critérios científicos que os qualificam como hotspots mundiais de biodiversidade são a:",
    [
      "Amazônia e o Pantanal mato-grossense.",
      "Mata dos Cocais e a restinga arenosa costeira.",
      "Caatinga sertaneja e os campos limpos do Pampa gaúcho.",
      "Mata Atlântica e o Cerrado.",
      "Mata de Igapó e a planície aluvial do Rio Paraguai."
    ],
    3,
    "Alternativa correta: D. A Mata Atlântica e o Cerrado são os dois biomas brasileiros que preenchem os requisitos de Myers: abrigam milhares de espécies exclusivas (endemismo altíssimo) e foram severamente degradados por séculos de ocupação humana e agropecuária, tendo perdido muito mais de 70% de suas coberturas florestais originais. A Amazônia e o Pantanal, embora riquíssimos em espécies, não são classificados como hotspots porque mantêm mais de 70% de sua vegetação nativa preservada. As alternativas A, C, D e E trazem biomas incorretos."
  ],
  "Cuestas, chapadas e falésias litorâneas": [
    "O relevo terrestre é modelado pela ação erosiva diferencial das águas sobre rochas de resistências desiguais (escultura estrutural). Três formas clássicas de relevo tabular e escarpado destacam-se no Brasil: 1) Chapadas: formas residuais tabulares de topo plano e horizontal recortadas em estratos sedimentares horizontais das bacias interiores (como na Chapada dos Veadeiros em GO, Chapada Diamantina na BA e Chapada do Araripe no CE), cercadas por escarpas íngremes talhadas pela erosão pluvial e fluvial; 2) Cuestas: formas de relevo dissimétricas esculpidas pelo intemperismo em camadas sedimentares e vulcânicas inclinadas; apresentam uma vertente abrupta e escarpada (o 'front' da cuesta) e uma vertente oposta de inclinação suave e longa (o 'reverso' da cuesta), como a Cuesta de Botucatu e São Pedro no interior paulista; 3) Falésias: escarpas rochosas abruptas e verticais em contato direto com o mar, esculpidas continuamente pelo choque mecânico das ondas oceânicas (processo de abrasão marinha), que desgasta a base da rocha até provocar o desmoronamento e recuo da escarpa.",
    [
      "Chapada: topo plano e horizontal em bacias sedimentares limitado por escarpas (Chapadões centrais)",
      "Cuesta: relevo dissimétrico com uma encosta íngreme (front) e outra suave e inclinada (reverso)",
      "Falésia: escarpa litorânea vertical esculpida pela ação mecânica das ondas do mar (abrasão marinha)",
      "Abrasão marinha: erosão provocada pelo atrito da água salgada e de areias arremessadas contra a base do paredão costeiro"
    ],
    "Para o ENEM: a Cuesta não é simétrica como um morro redondo; ela parece uma 'rampa de skate' que sobe suavemente por quilômetros de um lado e despenca em um paredão vertical do outro.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Perfil Morfológico de uma Cuesta</text><path d='M30 130 L 150 130 L 155 55 L 290 115 L 290 130 Z' fill='#5B6785'/><text x='110' y='45' font-size='10' fill='#D12D20' font-weight='700'>Front (Escarpa Abrupta)</text><text x='190' y='75' font-size='10' fill='#2F5BFF' font-weight='700'>Reverso Suave Inclinado ➔</text><text x='35' y='142' font-size='9' fill='var(--mu)'>Camadas de basalto e arenito com inclinação estrutural</text></svg>Em viagens pelo interior paulista e pelo planalto do Rio Grande do Sul, viajantes avistam no horizonte paredões abruptos que barram o horizonte em um lado, mas que, ao serem transpostos, revelam longas descidas suaves e contínuas que se estendem por dezenas de quilômetros em direção ao interior.",
    "A forma de relevo estrutural dissimétrica caracterizada por uma vertente abrupta (front) e outra de caimento suave (reverso) é denominada:",
    [
      "duna fóssil litorânea móvel.",
      "planície abissal recoberta por manguezais estuários.",
      "dorsal meso-oceânica submarina em expansão divergente.",
      "voçoroca urbana de canalização de esgotos sanitários.",
      "cuesta, esculpida pelo desgaste diferencial em camadas rochosas sedimentares e vulcânicas inclinadas."
    ],
    4,
    "Alternativa correta: E. A cuesta é um relevo característico de bordas de bacias sedimentares onde ocorrem camadas rochosas com inclinação monoclinal e de resistências desiguais ao intemperismo (como arenitos e basaltos); o lado escarpado é o front e o declive suave oposto é o reverso. As alternativas A, C, D e E trazem formas de relevo incompatíveis."
  ],
  "Escala do tempo geológico e éons/eras": [
    "A história da Terra (cerca de 4,54 bilhões de anos) é cronologicamente organizada na Escala do Tempo Geológico, subdividida em éons, eras, períodos e épocas geológicas. A cronologia divide-se fundamentalmente em: 1) Pré-Cambriano (compreende os éons Hadeano, Arqueano e Proterozoico, cobrindo cerca de 88% de toda a história planetária): consolidação da crosta primitiva e formação dos escudos cristalinos antigos; no Proterozoico brasileiro formaram-se as gigantescas reservas de minerais metálicos (minério de ferro, manganês e ouro em Carajás e no Quadrilátero Ferrífero); 2) Era Paleozoica: explosão de vida pluricelular marinha, surgimento das plantas terrestres e formação das primeiras bacias sedimentares; no período Carbonífero/Permiano formaram-se as jazidas de carvão mineral na Bacia do Paraná; 3) Era Mesozoica: domínio dos répteis e dinossauros, fragmentação da Pangeia (separação da América do Sul e África no Cretáceo), intensa atividade vulcânica com derrames basálticos no Sul/Sudeste (origem da terra roxa) e soterramento de matéria orgânica fóssil que originou as bacias petrolíferas (Campos e Santos); 4) Era Cenozoica: subdividida no Período Terciário (formação dos dobramentos modernos como Andes e Himalaia) e Período Quaternário (surgimento do Homo sapiens e formação das planícies aluviais recentes).",
    [
      "Tempo geológico: 4,5 bilhões de anos (tempo em milhões/bilhões de anos, diferente do tempo histórico humano)",
      "Pré-Cambriano: escudos cristalinos antigos e minerais metálicos (ferro, manganês em Carajás/MG)",
      "Paleozoico: bacias sedimentares antigas e carvão mineral fóssil",
      "Mesozoico: separação continental, vulcanismo basáltico (terra roxa) e formação do petróleo no Brasil",
      "Cenozoico: dobramentos modernos (Andes) e sedimentação quaternária recente (planícies de inundação)"
    ],
    "Para a prova do ENEM: o Brasil tem relevos do Pré-Cambriano, do Paleozoico, do Mesozoico e sedimentos do Cenozoico; a ÚNICA coisa que o Brasil NÃO TEM da Era Cenozoica são os dobramentos modernos (cordilheiras de alta montanha formadas no Terciário).",
    "Durante a Era Mesozoica (períodos Jurássico e Cretáceo), o supercontinente Gondwana sofreu gigantescas fraturas tectônicas decorrentes do afastamento das placas litosféricas e da abertura do Oceano Atlântico Sul, acompanhadas por derrames monumentais de lavas basálticas sobre a Bacia Sedimentar do Paraná.",
    "O desdobramento pedológico e econômico mais expressivo resultante desse evento vulcânico mesozoico no território brasileiro foi a formação da:",
    [
      "área de manguezais anóxicos salinos da Baixada Maranhense.",
      "reserva mineral de carvão vegetal renovável em cavernas do semiárido.",
      "cordilheira vulcânica ativa dos Andes centrais sul-americanos.",
      "fossa tectônica oceânica de Marianas com cotas negativas abaixo de dez mil metros.",
      "terra roxa, solo de alta fertilidade mineral que impulsionou o ciclo cafeeiro e o agronegócio paulista e paranaense."
    ],
    4,
    "Alternativa correta: E. Os colossais derrames basálticos ocorridos no Mesozoico cobriram centenas de milhares de quilômetros quadrados da Bacia do Paraná; com o intemperismo químico ocorrido sob clima tropical chuvoso, o basalto decompôs-se ao longo de milhões de anos, originando a famosa 'terra roxa' de excepcional riqueza de nutrientes agrícolas. As alternativas A, C, D e E citam formações não basálticas ou localizações fora do Brasil."
  ],
  "Hidrelétricas amazônicas a fio d'água": [
    "A expansão da geração de hidroeletricidade na Bacia Amazônica nas últimas décadas (com usinas como Belo Monte no Rio Xingu, e Santo Antônio e Jirau no Rio Madeira) defrontou-se com intensos dilemas socioambientais decorrentes do relevo de planície e platôs baixos da região. Em represas tradicionais de planalto no Centro-Sul (como Itaipu e Furnas), a topografia encaixada permite erguer barragens altas com grandes reservatórios de acumulação que estocam água das chuvas de verão para manter a geração firme durante os meses de seca de inverno. Na Amazônia, a construção de reservatórios convencionais exigiria alagar milhares de quilômetros quadrados de floresta primária e terras de comunidades indígenas e ribeirinhas. A solução de engenharia adotada foi projetar usinas a fio d'água (com reservatórios reduzidos ao mínimo estritamente necessário para manter o nível da água nas turbinas). Contudo, essa escolha gerou um grave dilema energético e financeiro: sem um reservatório de regularização, a produção de eletricidade fica refém da vazão natural do rio, de modo que usinas gigantescas como Belo Monte (capacidade instalada de 11.233 MW) chegam a produzir menos de 10% de sua capacidade durante a estiagem de inverno amazônico.",
    [
      "Usina a fio d'água: opera com reservatório mínimo de acumulação, gerando eletricidade com a vazão natural diária do rio",
      "Vantagem socioambiental: reduz drasticamente a área de floresta primária e terras indígenas inundadas",
      "Desvantagem energética: vulnerabilidade extrema à sazonalidade hídrica (queda brutal de geração na estiagem de inverno)",
      "Belo Monte (Rio Xingu/PA): maior usina 100% brasileira; polêmica com a 'Volta Grande do Xingu' e populações ribeirinhas"
    ],
    "Para o ENEM: a usina a fio d'água resolveu o problema do tamanho do alagamento florestal, mas criou outro: no inverno da seca amazônica, quase não gera energia, obrigando o país a ligar termelétricas poluentes e caras para cobrir o buraco elétrico no Sudeste.",
    "A Usina Hidrelétrica de Belo Monte, construída no Rio Xingu (Pará), foi projetada com a tecnologia a fio d'água para evitar a inundação permanente de extensas áreas de floresta nativa e reduzir o deslocamento de comunidades tradicionais ribeirinhas e povos indígenas.",
    "A limitação técnica e operacional inerente a essa escolha de engenharia hidrelétrica manifesta-se no fato de que a usina:",
    [
      "depende da combustão diária de milhões de toneladas de carvão mineral importado para girar as pás de suas turbinas.",

  "Conflitos internacionais pela água": [
    "A escassez hídrica global, agravada pelas mudanças climáticas e pelo crescimento populacional e da agricultura irrigada, transformou as bacias hidrográficas transfronteiriças em focos de tensão geopolítica e hidropolítica mundial. Como as bacias de rios não respeitam as fronteiras dos Estados-nações, as ações tomadas pelo país de montante (onde ficam as nascentes e o alto curso) afetam inevitavelmente a vazão, a qualidade e a segurança hídrica dos países de jusante (onde o rio corre em direção à foz). Três bacias fluviais emblemáticas destacam-se no cenário internacional: 1) Bacia do Rio Nilo: a construção pela Etiópia (país de montante) da colossal 'Grande Barragem do Renascimento Etíope' (GERD) no Nilo Azul gerou tensão militar com o Egito e Sudão (países de jusante), que dependem historicamente de quase 95% das águas do Nilo para a sobrevivência humana e agrícola; 2) Bacia do Tigre e Eufrates: represas construídas na Turquia (Projeto GAP) diminuem a vazão para a Síria e o Iraque no Oriente Médio; 3) Bacia do Rio Jordão: controle de aquíferos e nascentes em disputas territoriais entre Israel, Palestina e Jordânia.",

      "Grande Barragem do Renascimento (Etiópia): tensão geopolítica com o Egito no Rio Nilo",
      "Água como recurso geopolítico estratégico: previsões da ONU de que guerras futuras serão motivadas pela água potável"
    ],
    "Para o ENEM: a geopolítica da água envolve assimetria de poder: se o país da nascente for militarmente forte ou construir barragens gigantescas, ele pode fechar as comportas ou desviar o fluxo, chantageando ou ameaçando a agricultura e a vida dos países vizinhos que ficam rio abaixo.",
    "A conclusão das obras de enchimento do reservatório da Grande Barragem do Renascimento Etíope (GERD), erguida pela Etiópia no leito do Nilo Azul, despertou contundentes protestos diplomáticos e ameaças militares por parte do governo do Egito, que alega risco à segurança alimentar e ao abastecimento hídrico de sua população.",

  "Sensoriamento remoto: bandas espectrais e NDVI": [
    "O sensoriamento remoto é a tecnologia de obtenção de informações sobre a superfície terrestre por meio da medição e do registro da radiação eletromagnética refletida ou emitida por objetos na Terra, captada por sensores acoplados a satélites orbitais (como Landsat, Sentinel e CBERS) ou drones. Cada elemento da paisagem (água, vegetação densa, solo exposto, asfalto) possui uma 'assinatura espectral' própria: a água limpa absorve quase toda a radiação na faixa do infravermelho; o solo exposto apresenta reflectância homogênea; e a vegetação verde e sadia apresenta comportamento característico: absorve intensamente a luz solar vermelha (usada pelos cloroplastos para a fotossíntese) e reflete fortemente na faixa do infravermelho próximo (devido à estrutura celular interna das folhas). Com base nisso, cientistas desenvolveram o Índice de Vegetação por Diferença Normalizada (NDVI), calculado pela fórmula matemática: NDVI = (Infravermelho Próximo − Vermelho) ÷ (Infravermelho Próximo + Vermelho). O NDVI varia de -1 a +1; valores próximos de 0 indicam solo exposto ou áreas urbanas, enquanto valores próximos de 1 indicam florestas nativas densas, sadias e vigorosas, sendo vital para o INPE monitorar o desmatamento.",
    [
      "Assinatura espectral: padrão único de absorção e reflexão da radiação por cada alvo na superfície da Terra",
      "Vegetação sadia: absorve a luz vermelha para a fotossíntese e reflete fortemente o infravermelho próximo",
      "Fórmula do NDVI: (IVP − V) ÷ (IVP + V), variando de -1 a +1",
      "Aplicações: monitoramento de desmatamento em tempo real (DETER/INPE), previsão de safras e estresse hídrico em lavouras"
    ],
    "Para o ENEM: uma floresta verde cheia de folhas sadias aparece brilhante no canal do infravermelho próximo do satélite porque a estrutura do mesófilo foliar reflete essa onda para não 'cozinhar' a planta; se a floresta for desmatada ou queimada, o infravermelho despenca e o índice NDVI cai para perto de zero.",
    "Analistas do Instituto Nacional de Pesquisas Espaciais (INPE) utilizam imagens de satélites ópticos orbitais para calcular o Índice de Vegetação por Diferença Normalizada (NDVI) na Amazônia Legal, gerando alertas diários automáticos de desmatamento e queimadas para as equipes de fiscalização do Ibama.",
    "O princípio biofísico e óptico que permite ao sensor orbital identificar o corte raso de uma área florestada baseia-se na:",
    [
      "absorção completa de todas as ondas de calor do magma subterrâneo pelos troncos caídos.",
      "redução drástica na reflectância do infravermelho próximo e aumento na reflexão do vermelho após a remoção da cobertura foliar clorofilada.",
      "emissão contínua de luz ultravioleta azulada pelas raízes de árvores derrubadas.",
      "capacidade dos satélites de filmarem diretamente os rostos dos operadores de motosserras na escuridão.",
      "interrupção imediata da rotação da Terra sobre o perímetro do polígono desmatado."
    ],
    1,
    "Alternativa correta: B. A biomassa florestal viva e sadia reflete fortemente a radiação na faixa do infravermelho próximo e absorve a luz visível vermelha para a fotossíntese (gerando valores de NDVI altos, entre 0,6 e 0,9); quando ocorre a derrubada das árvores, o solo exposto substitui a folhagem, reduzindo a reflectância no infravermelho próximo e derrubando o NDVI para níveis próximos de zero, o que aciona o alerta automático do satélite. As alternativas A, C, D e E trazem formulações cientificamente absurdas."
  ],
  "Fusos horários e a Linha Internacional de Mudança de Data": [
    "A Terra é dividida matematicamente em 24 fusos horários de 15° de longitude cada, tendo o Meridiano de Greenwich (0°) como origem de contagem das horas. Como a Terra gira de oeste para leste, quem se desloca para o Leste adianta o relógio (soma horas), e quem viaja para o Oeste atrasa o relógio (subtrai horas). Na face oposta ao meridiano de Greenwich situa-se o meridiano de 180° de longitude, conhecido como o Antimeridiano ou a Linha Internacional de Mudança de Data (LID), traçada sobre o Oceano Pacífico com desvios políticos para não cortar arquipélagos ao meio. A LID marca oficialmente a transição de um dia do calendário para o outro: ao cruzar a linha no sentido OESTE ➔ LESTE (por exemplo, voando do Japão para o Havaí), subtrai-se um dia inteiro no calendário (ganha-se 24 horas, 'voltando' para o dia anterior); ao cruzar a linha no sentido LESTE ➔ OESTE (voando dos Estados Unidos para a Ásia ou Oceania), soma-se um dia inteiro no calendário (avança-se 24 horas no futuro).",
    [
      "Linha Internacional de Mudança de Data (LID): meridiano de 180° no meio do Oceano Pacífico",
      "Cruzando de Leste para Oeste (América ➔ Ásia/Oceania): AVANÇA 1 dia no calendário (+24 horas)",
      "Cruzando de Oeste para Leste (Ásia/Oceania ➔ América): VOLTA 1 dia no calendário (−24 horas)",
      "Desvios na linha: traçado em zigue-zague no Pacífico para evitar que um mesmo país (como Kiribati) tenha dois dias simultâneos"
    ],
    "Para a prova do ENEM: quem sai do Japão no domingo de manhã e cruza a LID em direção aos EUA aterrissa nos EUA no sábado! Você 'viaja no tempo' e ganha um dia de vida no calendário.",
    "Um empresário decola em voo direto de Tóquio, no Japão (longitude 140° Leste), às 18h00 de uma sexta-feira, dia 15 de novembro, com destino a Honolulu, no Havaí (longitude 155° Oeste), cruzando a Linha Internacional de Mudança de Data no meio do Oceano Pacífico após horas de voo.",
    "Ao cruzar a Linha Internacional de Mudança de Data navegando no sentido Oeste para Leste em direção ao Havaí, o sistema de navegação da aeronave deve obrigatoriamente:",
    [
      "adiantar a data em quarenta e oito horas comemorando o ano novo.",
      "anular a contagem do tempo e desligar todos os instrumentos de bordo do avião.",
      "retroceder um dia no calendário do sistema, retornando para o dia 14 de novembro.",
      "adicionar doze semanas ao fuso de Greenwich para compensar a gravidade.",
      "trocar o sentido de rotação da Terra para que o sol passe a nascer no polo sul."
    ],
    2,
    "Alternativa correta: C. Ao cruzar a Linha Internacional de Mudança de Data no sentido de quem vai do hemisfério oriental para o ocidental (Oeste ➔ Leste, da Ásia para as Américas), subtrai-se um dia do calendário civil oficial; dessa forma, o passageiro que decolou no dia 15 retorna para a data anterior (dia 14 de novembro) ao ingressar no fuso horário do Havaí. As alternativas A, C, D e E trazem formulações fantasiosas."
  ],
  "População Economicamente Ativa (PEA) e desemprego estrutural": [
    "A estrutura ocupacional da demografia classifica a população segundo sua relação com a força de trabalho: 1) População em Idade Ativa (PIA): no Brasil, pessoas a partir de 14 anos de idade; 2) População Economicamente Ativa (PEA ou Força de Trabalho): contingente populacional que está efetivamente empregado no mercado formal ou informal, somado aos desempregados que estão buscando ativamente trabalho; 3) População Não Economicamente Ativa (PNEA): estudantes que não trabalham, donas de casa sem remuneração, aposentados e os 'desalentados' (cidadãos que desistiram de procurar emprego por crer que não encontrarão vagas). O desemprego divide-se em: a) Desemprego Conjuntural (ou Cíclico): decorre de crises econômicas passageiras e queda do consumo; quando a economia retoma o crescimento, as vagas são reabertas; b) Desemprego Estrutural: decorre de transformações tecnológicas permanentes, robótica, automação e inteligência artificial que extinguem para sempre determinados postos de trabalho operacionais, exigindo requalificação profissional profunda.",
    [
      "PEA (Força de Trabalho): soma dos indivíduos ocupados (formais e informais) + desocupados em busca de emprego",
      "Desalentados: pessoas que desistiram de buscar trabalho por desânimo (não entram no índice formal de desemprego)",
      "Desemprego Conjuntural: provocado por recessão passageira do PIB (vagas retornam com o reaquecimento econômico)",
      "Desemprego Estrutural: extinção permanente de postos de trabalho operacionais pela introdução de robôs e automação"
    ],
    "Para o ENEM: a taxa de desemprego oficial (IBGE/PNAD) não mede quem está sem trabalhar no país todo; ela mede apenas quem está sem trabalho E PROCURANDO ativamente emprego nos últimos 30 dias. Quem desistiu de procurar vira 'desalentado' e some da estatística de desemprego.",
    "Nas montadoras de automóveis e no setor bancário brasileiro, a digitalização dos serviços, a proliferação de aplicativos financeiros no celular e a introdução de robôs autônomos de solda levaram ao fechamento de milhares de postos de trabalho de bancários e operários metalúrgicos ao longo da última década, vagas que nunca mais voltaram a ser ofertadas no mercado mesmo após a recuperação do PIB.",
    "A modalidade de desocupação profissional provocada pela substituição irreversível da mão de obra humana por tecnologias avançadas é classificada na Geografia como desemprego:",
    [
      "conjuntural passageiro decorrente de chuvas de verão.",
      "estrutural (ou tecnológico), gerado pela eliminação permanente de funções operacionais pela automação e inovação técnica.",
      "estacional involuntário de pescadores durante o período da piracema.",
      "voluntário de estudantes universitários subsidiados por bolsas internacionais.",
      "feudal agrário decorrente da abolição de ferramentas manuais de cobre."
    ],
    1,
    "Alternativa correta: B. O desemprego estrutural ocorre quando o posto de trabalho desaparece para sempre do processo produtivo em razão da modernização técnica, da robótica ou da reorganização produtiva, de modo que mesmo com o crescimento do PIB a vaga não é restabelecida, forçando o trabalhador à informalidade ou à reconversão profissional. As alternativas A, C, D e E descrevem outras situações de emprego."
  ],
  "Envelhecimento populacional e razão de dependência": [
    "O envelhecimento populacional é o fenômeno demográfico definidor do século XXI no Brasil, decorrente da combinação entre a queda contínua da taxa de fecundidade (que reduz a base de crianças e jovens) e o aumento progressivo da expectativa de vida ao nascer (que alarga o topo de idosos). O indicador demográfico chave para mensurar o impacto econômico dessa mudança é a Razão de Dependência: a proporção de indivíduos teoricamente dependentes (crianças de 0 a 14 anos somadas aos idosos com 65 anos ou mais) que precisam ser sustentados pela População em Idade Ativa (PIA, de 15 a 64 anos). Durante algumas décadas, o Brasil vivenciou a 'janela de oportunidade demográfica' ou 'bônus demográfico' (quando a razão de dependência é baixa e a proporção de trabalhadores ativos é máxima). Contudo, essa janela está se fechando rapidamente: com a inversão da pirâmide etária, o número de idosos cresce em ritmo vertiginoso, elevando a razão de dependência dos idosos, desafiando a sustentabilidade atuarial da Previdência Social, pressionando o orçamento do SUS e demandando a emergência de uma 'Economia do Cuidado' estruturada pelo Estado.",
    [
      "Razão de Dependência: (Jovens <15 anos + Idosos >65 anos) ÷ População Ativa (15 a 64 anos) × 100",
      "Bônus demográfico em declínio: proporção de adultos produtivos atinge o auge e começa a cair com o rápido envelhecimento",
      "Desafios fiscais: pressão no sistema de repartição da previdência (menos contribuintes ativos para mais aposentados)",
      "Economia do Cuidado: políticas públicas de cuidadores de idosos, centros de convivência e hospitais geriátricos"
    ],
    "Para a redação e para a prova do ENEM: o envelhecimento não é uma tragédia, é uma vitória da saúde pública e do saneamento; o desafio reside no fato de que o Brasil envelheceu na velocidade de países ricos, mas continua com renda per capita e serviços sociais de país emergente.",
    "Projeções demográficas do IBGE indicam que, em 2060, a proporção de idosos com 65 anos ou mais superará 25% de toda a população brasileira, enquanto a proporção de jovens de 0 a 14 anos cairá para cerca de 14%, gerando uma das mais rápidas inversões etárias já registradas no mundo contemporâneo.",
    "A principal consequência macroeconômica e demográfica gerada pelo encerramento do bônus demográfico e pela elevação contínua da razão de dependência no país consiste no(a):",
    [
      "aumento automático da quantidade de trabalhadores fabris para cada cidadão aposentado.",
      "abolição de qualquer modalidade de atendimento geriátrico no Sistema Único de Saúde.",
      "elevação da pressão sobre o financiamento do regime previdenciário e o aumento da demanda por serviços de saúde pública especializada e cuidados a idosos.",
      "proibição por lei federal do trabalho feminino no comércio e nos bancos.",
      "extinção absoluta de todas as aposentadorias de servidores e trabalhadores do setor privado."
    ],
    2,
    "Alternativa correta: C. Com a elevação da proporção de idosos e o recuo dos jovens, a base de trabalhadores formais contribuintes que sustentam o regime de repartição simples da previdência diminui relativamente, ao mesmo tempo em que as despesas com aposentadorias e cuidados de saúde crônica geriátrica aumentam substancialmente, exigindo adaptações nas finanças públicas e redes de assistência. As alternativas A, C, D e E trazem formulações distorcidas."
  ],
  "Desconcentração industrial e o interior paulista": [
    "A desconcentração industrial no Brasil iniciou-se no final da década de 1970 e consolidou-se nas décadas de 1980 e 1990, rompendo com o modelo histórico de hiperconcentração fabril na Região Metropolitana de São Paulo (particularmente no cinturão do ABC Paulista). O principal destino dessa migração produtiva foi o interior do próprio estado de São Paulo, estruturando um dos mais dinâmicos complexos industriais e tecnológicos da América Latina ao longo dos eixos rodoviários modernos (Rodovias Anhanguera, Bandeirantes, Washington Luís e Presidente Dutra). Cidades médias e centros regionais como Campinas, Sorocaba, Ribeirão Preto, Piracicaba, São José dos Campos e São Carlos atraíram fábricas modernas devido às vantagens locacionais: terrenos mais baratos e amplos para galpões horizontais, incentivos fiscais municipais, malha viária moderna sem congestionamentos crônicos e proximidade de universidades de excelência (Unicamp, USP, Unesp, UFSCar, ITA) que formam mão de obra qualificada, dando origem a importantes tecnopolos (aeroespacial em São José dos Campos e bioenergia/computação em Campinas e São Carlos).",
    [
      "Desconcentração industrial: fuga da capital paulista em direção ao interior e outros estados do país",
      "Eixos rodoviários indutores: Anhanguera, Bandeirantes, Dutra e Washington Luís conectam os polos industriais",
      "Tecnopolos no interior paulista: São José dos Campos (Embraer/aeroespacial) e Campinas/São Carlos (biotecnologia e TI)",
      "Deseconomias de aglomeração: congestionamentos, terrenos caros, altos impostos e custo de vida na capital de SP"
    ],
    "Para o ENEM: a metrópole de São Paulo perdeu muitas fábricas de chaminé tradicionais (que foram para o interior), mas continuou sendo o centro hegemônico do Brasil porque concentrou as sedes administrativas, as finanças, os bancos e os escritórios de comando corporativo.",
    "Ao analisar a geografia da indústria no estado de São Paulo no final do século XX, constata-se a perda relativa da participação fabril da capital e do grande ABC em favor de municípios situados ao longo das rodovias Anhanguera, Bandeirantes e Dutra, onde se instalaram complexos automotivos, empresas farmacêuticas e tecnopolos aeronáuticos e de software.",
    "O fator geográfico que atuou decisivamente como vetor de atração para a instalação de indústrias de alta tecnologia e montadoras no interior paulista foi a:",

  ],
  "Flexibilização das leis trabalhistas e informalidade": [
    "A flexibilização das relações de trabalho é a marca da reestruturação produtiva do capitalismo sob o paradigma neoliberal, visando reduzir os 'custos do trabalho' para ampliar a competitividade empresarial na globalização. No Brasil, o marco dessa transformação foi a Reforma Trabalhista (Lei Federal nº 13.467/2017), que alterou profundamente a Consolidação das Leis do Trabalho (CLT de 1943). A reforma consagrou o princípio do 'negociado sobre o legislado' (acordos entre patrão e empregado passam a ter força superior à lei trabalhista em diversos pontos), autorizou o contrato de trabalho intermitente (onde o trabalhador é pago apenas pelas horas convocadas), permitiu a terceirização irrestrita de todas as atividades da empresa e dificultou o acesso do trabalhador à Justiça do Trabalho pela imposição de custas processuais em caso de perda da ação. Embora tenha sido prometida para gerar milhões de empregos formais, a reforma aprofundou a precarização do trabalho e convive com taxas estruturais de informalidade superiores a 38% a 40% da população ocupada (trabalhadores sem carteira assinada, camelôs, bicos e autônomos sem CNPJ ou proteção do INSS).",
    [
      "Reforma Trabalhista de 2017: primazia do negociado sobre o legislado, trabalho intermitente e terceirização ampla",
      "Trabalho intermitente: sem salário fixo mensal; pagamento proporcional apenas às horas trabalhadas sob demanda",
      "Informalidade no Brasil: cerca de 39% a 40% da PEA ocupada sem direitos da CLT, FGTS ou previdência social",
      "Pejotização: exigência fraudulenta de que o empregado abra CNPJ para ocultar subordinação e não pagar encargos trabalhistas"
    ],
    "Para a redação e para a prova do ENEM: informalidade não é 'empreendedorismo por vocação'; a imensa maioria dos trabalhadores informais está na rua vendendo bala ou entregando marmita de moto porque não conseguiu um emprego com carteira assinada e direitos trabalhistas protegidos.",
    "A Pesquisa Nacional por Amostra de Domicílios Contínua (PNAD Contínua/IBGE) indica que cerca de 39% de todos os trabalhadores ocupados no Brasil atuam no mercado de trabalho informal, exercendo funções como diaristas sem registro, vendedores ambulantes e motoristas de aplicativo sem contribuição previdenciária e sem garantias de descanso semanal remunerado ou FGTS.",
    "A prevalência de elevados contingentes de trabalhadores na informalidade expressa no espaço geográfico nacional um cenário de:",
    [
