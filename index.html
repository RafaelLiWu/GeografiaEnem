    1,
    "Alternativa correta: B. Os manguezais fornecem abrigo, nutrientes orgânicos e águas calmas protegidas por raízes emaranhadas, sendo essenciais como berçário de crustáceos, moluscos e peixes de alto valor ecológico e alimentar; sua destruição desarticula a cadeia alimentar marinha e prejudica comunidades pesqueiras tradicionais. As alternativas A, C, D e E trazem hipóteses sem fundamento biológico ou geográfico."
  ],
  "Ciclo das rochas e tipos de rochas": [
    "A litosfera é formada por minerais agregados em rochas, que se dividem em três grandes grupos genéticos interconectados pelo ciclo das rochas: 1) Rochas Magmáticas (ou Ígneas): formadas pela solidificação do magma; subdividem-se em plutônicas/intrusivas (resfriamento lento no interior da crosta, com cristais visíveis, como o granito) e vulcânicas/extrusivas (resfriamento rápido na superfície pela lava, como o basalto); 2) Rochas Sedimentares: formadas pelo intemperismo, erosão, transporte, deposição e compactação (diagênese) de fragmentos de rochas preexistentes ou restos orgânicos; são dispostas em camadas (estratificadas) e são as únicas rochas que abrigam fósseis e combustíveis fósseis (como arenito, calcário, folhelho e carvão mineral); 3) Rochas Metamórficas: originadas da transformação de rochas pré-existentes submetidas a altas pressões e temperaturas no interior da Terra sem atingir a fusão, alterando sua estrutura cristalina (como o gnaisse, derivado do granito; o mármore, derivado do calcário; e o quartzito, derivado do arenito).",
    [
      "Magmáticas intrusivas: resfriamento lento no subsolo (granito); extrusivas: resfriamento rápido na superfície (basalto)",
      "Sedimentares: formadas por diagênese e acúmulo de sedimentos; únicas que contêm fósseis e petróleo",
      "Metamórficas: alteração por pressão e temperatura elevadas (calcário ➔ mármore; granito ➔ gnaisse)",
      "Ciclo das rochas: dinamismo litosférico que transforma um tipo de rocha em outro ao longo do tempo geológico"
    ],
    "Para o ENEM: fósseis, petróleo, gás natural e carvão mineral ocorrem EXCLUSIVAMENTE em rochas sedimentares; se uma alternativa falar em fóssil ou petróleo encontrado dentro de rocha magmática ou metamórfica, ela está incorreta.",
    "Durante escavações de engenharia para a implantação de uma rodovia em uma bacia sedimentar, geólogos identificaram camadas paralelas estratificadas contendo conchas fossilizadas e pegadas preservadas de répteis datadas da Era Mesozoica.",
    "A presença de fósseis preservados na formação geológica estudada explica-se pelo fato de que as rochas sedimentares:",
    [
      "solidificam-se a partir de lava vulcânica incandescente que queima qualquer vestígio mineral.",
      "passam por fusão atômica completa que recria o DNA original dos organismos extintos.",
      "formam-se pela deposição e compactação gradual de sedimentos em baixas temperaturas, permitindo a fossilização de restos biológicos.",
      "são rochas ígneas plutônicas originadas na astenosfera profunda a 3.000 graus de temperatura.",
      "inexistem na superfície continental do planeta Terra, ocorrendo apenas na Lua."
    ],
    2,
    "Alternativa correta: C. As rochas sedimentares formam-se pelo acúmulo de partículas e matéria orgânica em bacias sob temperaturas e pressões brandas; o soterramento rápido por lamas e areias protege os restos biológicos da oxigenação e decomposição bacteriana total, permitindo a mineralização e formação de fósseis. As alternativas A e D confundem com rochas magmáticas em fusão (onde qualquer fóssil seria incinerado). As alternativas C e E trazem formulações fantasiosas."
  ],
  "Curvas de nível e leitura de relevo": [
    "A representação tridimensional do relevo em mapas bidimensionais realiza-se por meio de curvas de nível (ou isoípsas): linhas imaginárias que unem todos os pontos de mesma altitude em relação ao nível médio do mar. A leitura de mapas topográficos apoia-se em regras geométricas rígidas: 1) Pontos de mesma cota altimétrica possuem o mesmo valor numérico; 2) A distância gráfica entre as curvas indica a declividade do terreno: quando as curvas de nível estão muito próximas e densas, o terreno é íngreme e escarpado (alta declividade, vertente abrupta); quando as curvas estão afastadas e espaçadas, o relevo é plano e suave (baixa declividade, planície ou colina suave); 3) Curvas concêntricas fechadas cujos valores aumentam em direção ao centro representam topos de morros ou picos; curvas concêntricas cujos valores diminuem para o centro representam depressões ou dolinas; 4) Em vales fluviais, as curvas de nível formam desenhos em 'V' com o vértice apontando para a nascente (montante), e a água corre morro abaixo no sentido oposto.",
    [
      "Curvas de nível (isoípsas): unem pontos de mesma altitude em relação ao mar",
      "Curvas muito próximas: encosta íngreme, escarpada e de alta declividade (risco de erosão e deslizamento)",
      "Curvas espaçadas: relevo plano, suave e de baixa declividade (ideal para mecanização agrícola)",
      "Curvas em 'V': vértice aponta para a nascente; o rio corre no sentido em que as cotas diminuem"
    ],
    "Para a prova do ENEM: curvas de nível coladas umas nas outras = abismo, serra ou escarpa íngreme. Curvas de nível bem longe umas das outras = descampado plano ou chapada horizontal.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Mapa Topográfico: Curvas de Nível</text><circle cx='100' cy='85' r='55' fill='none' stroke='#2F5BFF' stroke-width='1.5'/><circle cx='100' cy='85' r='40' fill='none' stroke='#2F5BFF' stroke-width='1.5'/><circle cx='100' cy='85' r='25' fill='none' stroke='#2F5BFF' stroke-width='1.5'/><circle cx='100' cy='85' r='10' fill='none' stroke='#2F5BFF' stroke-width='1.5'/><text x='92' y='89' font-size='8' fill='#D12D20' font-weight='700'>400m</text><text x='100' y='65' font-size='8' fill='#2F5BFF'>300m</text><text x='100' y='48' font-size='8' fill='#2F5BFF'>200m</text><text x='100' y='32' font-size='8' fill='#2F5BFF'>100m</text><text x='180' y='65' font-size='9' fill='var(--tx)' font-weight='700'>➔ Curvas espaçadas a leste: declive suave</text><text x='180' y='95' font-size='9' fill='var(--tx)' font-weight='700'>➔ Curvas próximas a oeste: escarpa íngreme</text></svg>Um engenheiro agrônomo analisa uma carta topográfica para decidir o melhor traçado de uma estrada rural e o local para o plantio mecanizado de cana-de-açúcar. Ele observa que a encosta leste de uma elevação apresenta curvas de nível bastante separadas entre si, enquanto a encosta oeste exibe curvas de nível muito densas e sobrepostas.",
    "Com base na interpretação técnica das curvas de nível, o profissional deve optar por traçar a rota e mecanizar a lavoura na vertente leste porque ela apresenta:",
    [
      "um abismo vertical com paredões de granito inexpugnáveis.",
      "ausência de gravidade terrestre que facilita a elevação dos veículos pesados.",
      "altitude nula exatamente no nível das marés salgadas oceânicas.",
      "presença exclusiva de solos hidromórficos permanentemente inundados por água doce.",
      "relevo de declividade suave e relevo menos acidentado, favorecendo o trânsito seguro de máquinas e reduzindo a erosão."
    ],
    4,
    "Alternativa correta: E. O espaçamento largo entre curvas de nível consecutivas indica que a variação de altitude ocorre de maneira suave e gradual ao longo de uma grande distância horizontal, caracterizando relevo plano ou colinoso brando, ideal para o tráfego de colheitadeiras e com menor velocidade de escoamento superficial da água. As alternativas A, C, D e E trazem conclusões erradas ou estapafúrdias."
  ],
  "Estrutura de uma bacia hidrográfica": [
    "A bacia hidrográfica é a área territorial drenada por um rio principal e seus afluentes e subafluentes, delimitada geograficamente pelos pontos mais altos do relevo que funcionam como 'divisores de águas' (interflúvios). Toda a precipitação pluvial que cai no interior dessa área converge pela gravidade em direção ao canal principal até o ponto mais baixo de saída da bacia, denominado foz ou exutório. Uma bacia divide-se morfologicamente em: 1) Alto curso (montante): nascentes em áreas elevadas, com grande declividade, vales em 'V', águas rápidas e predomínio de erosão; 2) Médio curso: relevo mais brando, águas com velocidade moderada e balanço entre erosão e transporte; 3) Baixo curso (jusante): planícies aluviais, águas lentas com meandros e predomínio de sedimentação e deposição de aluviões próximo à foz. A gestão territorial moderna adota a bacia hidrográfica como a unidade física ideal para o planejamento integrado dos recursos hídricos e do solo.",
    [
      "Divisor de águas (interflúvio): linha de cumeada de relevo que separa bacias hidrográficas vizinhas",
      "Montante: sentido em direção à nascente (rio acima); Jusante: sentido em direção à foz (rio abaixo)",
      "Alto curso: erosão intensa; Médio curso: transporte; Baixo curso: sedimentação e meandros",
      "Foz: ponto onde o rio deságua (estuário em canal único ou delta em vários canais ramificados)"
    ],
    "Para a prova do ENEM: tudo o que acontece no alto curso (desmatamento, lixo, defensivos agrícolas) afeta inevitavelmente as cidades e populações que vivem no baixo curso (jusante), porque a gravidade faz a água e os poluentes descerem o rio.",
    "O Comitê de Bacia Hidrográfica de um rio estadual identificou que o assoreamento crônico do canal principal no baixo curso, responsável por inundações periódicas na cidade portuária situada na foz, tem origem no desmatamento de matas ciliares ocorrido em pequenas propriedades agrícolas localizadas no alto curso do rio.",
    "A conexão hidrogeográfica entre o problema registrado a jusante e as intervenções humanas a montante demonstra que a bacia hidrográfica:",
    [
      "funciona como um sistema integrado em que as ações antrópicas realizadas nas nascentes repercutem diretamente no escoamento e transporte de sedimentos ao longo de todo o leito fluvial.",
      "comporta-se como um sistema isolado onde as partes altas não mantêm nenhuma troca física com as partes baixas.",
      "tem seu sentido de fluxo determinado exclusivamente pelo vento que sopra da foz para a nascente.",
      "é imune a qualquer processo erosivo provocado pela supressão da vegetação ciliar.",
      "deságua suas águas no topo das montanhas mais elevadas da cordilheira continental."
    ],
    0,
    "Alternativa correta: A. Uma bacia hidrográfica é um sistema geomorfológico integrado pela gravidade: o desmatamento nas nascentes (alto curso/montante) expõe o solo à erosão; as enxurradas lavam a terra e a transportam canal abaixo, provocando o assoreamento do leito e inundações catastróficas na foz (baixo curso/jusante). As alternativas A, C, D e E trazem absurdos hidrológicos."
  ],
  "Anamorfose geográfica e cartogramas": [
    "A anamorfose geográfica é uma forma contemporânea de representação cartográfica temática na qual as fronteiras, áreas e formas geométricas reais dos países ou estados são distorcidas propositalmente em proporção direta ao valor estatístico de uma variável quantitativa específica (como população absoluta, PIB, consumo de energia, mortes por conflitos armados ou emissões de CO₂). Nesse tipo de cartograma, o território que possui o maior valor absoluto da grandeza analisada aparece visualmente agigantado e hiperdimensionado no mapa, enquanto países com valores numéricos baixos aparecem encolhidos ou atrofiados, independentemente de sua área geográfica real em quilômetros quadrados. A anamorfose é um recurso didático de alto impacto visual utilizado no ENEM para denunciar contrastes globais e disparidades socioeconômicas e demográficas.",
    [
      "Anamorfose: mapa com distorção geométrica proposital proporcional a um dado estatístico",
      "Anamorfose Demográfica: Índia e China aparecem gigantescas; Canadá, Rússia e Austrália aparecem finos e atrofiados",
      "Anamorfose de Riqueza (PIB): EUA, Europa Ocidental e Japão dominam o mapa; continente africano encolhe",
      "Objetivo: comunicação visual imediata de disparidades geográficas e hierarquias socioeconômicas"
    ],
    "Para ler uma anamorfose no ENEM: identifique quem está 'inchado' e quem está 'murcho'! Se a Índia e a China estão enormes e a Austrália minúscula, o mapa retrata População Absoluta. Se a África sumiu e os EUA/Europa estão imensos, o mapa retrata Riqueza, PIB ou Patentes.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Anamorfose Demográfica Mundial (Esquemática)</text><rect x='30' y='50' width='35' height='25' fill='#5B6785' rx='3'/><text x='35' y='66' font-size='8' fill='#fff'>Am. Norte</text><rect x='75' y='50' width='45' height='30' fill='#2F5BFF' rx='3'/><text x='85' y='68' font-size='8' fill='#fff'>Europa</text><rect x='130' y='40' width='140' height='75' fill='#D12D20' rx='6'/><text x='160' y='80' font-size='12' font-weight='800' fill='#fff'>ÁSIA (Índia + China)</text><text x='170' y='96' font-size='9' fill='#fff'>~60% da população mundial</text><rect x='50' y='90' width='30' height='25' fill='#FFB400' rx='3'/><text x='53' y='106' font-size='7' fill='var(--tx)'>Am. Sul</text><rect x='85' y='90' width='35' height='35' fill='#2E7D32' rx='3'/><text x='92' y='110' font-size='8' fill='#fff'>África</text></svg>Em uma prova do ENEM, apresenta-se um mapa-múndi no qual a Ásia oriental e meridional ocupa quase dois terços de toda a superfície representada na página, enquanto o Canadá e a Federação Russa (dois dos maiores países do planeta em área territorial) aparecem como estreitas faixas de terra finas e espremidas.",
    "A técnica cartográfica adotada e a variável socioeconômica representada no mapa são, respectivamente:",
    [
      "projeção cônica conforme e volume de reservas de petróleo cru submarino.",
      "anamorfose geográfica e contingente de população absoluta dos países.",
      "projeção azimutal equidistante e área territorial física em quilômetros quadrados.",
      "carta náutica topográfica e altitude média das cordilheiras de dobramentos modernos.",
      "planta cadastral urbana e taxa de analfabetismo funcional infantil."
    ],
    1,
    "Alternativa correta: B. A técnica da anamorfose redimensiona as fronteiras espaciais em proporção direta a um dado estatístico; como a China e a Índia somam mais de 2,8 bilhões de habitantes, o continente asiático agiganta-se no cartograma populacional, ao passo que nações de áreas imensas porém pouco povoadas (como Canadá e Rússia) aparecem reduzidas. As alternativas A, C, D e E citam projeções ou variáveis incompatíveis."
  ],
  "Teorias demográficas: Malthus, Neomalthus e Reformista": [
    "As teorias demográficas analisam as causas e consequências do crescimento populacional humano sobre os recursos e a sociedade: 1) Teoria Malthusiana (Thomas Malthus, 1798): formulada na Inglaterra da 1ª Revolução Industrial, afirmava que a população crescia em progressão geométrica (PG: 1, 2, 4, 8, 16...) enquanto a produção de alimentos crescia apenas em progressão aritmética (PA: 1, 2, 3, 4, 5...); previa a fome generalizada e propunha a 'sujeição moral' (abstinência sexual e casamento tardio dos pobres); errou por não prever o salto de produtividade trazido pela mecanização agrícola e pela Revolução Verde; 2) Teoria Neomalthusiana (pós-Segunda Guerra Mundial): culpava o crescimento da população pobre pelo subdesenvolvimento e pela miséria no Terceiro Mundo; propunha o controle estrito de natalidade (planejamento familiar forçado, pílulas, esterilização em massa); 3) Teoria Reformista (ou Marxista): inverte a lógica neomalthusiana; defende que a superpopulação e a pobreza não são a causa, mas a consequência da desigualdade social e da má distribuição de renda; a prioridade deve ser reformas sociais básicas (educação, saúde, reforma agrária e trabalho digno), pois quando a população tem acesso à renda e instrução, a natalidade cai espontaneamente.",
    [
      "Malthusiana (1798): População em PG vs Alimentos em PA (proposta: abstinência sexual)",
      "Neomalthusiana: Superpopulação causa pobreza (proposta: controle estatal compulsório da natalidade)",
      "Reformista (Marxista): Pobreza causa superpopulação; solução é justiça social e distribuição de renda",
      "Ecomalthusiana: culpam a população pelo esgotamento ecológico do planeta (ignoram a desigualdade de consumo)"
    ],
    "Para o ENEM: a Teoria Reformista é a base das políticas das Nações Unidas: para reduzir o número de filhos no mundo, não se impõe castigo aos pobres; investe-se na educação das mulheres e na distribuição de renda, que a natalidade cai de forma natural.",
    "Durante conferência sobre desenvolvimento humano, um representante oficial argumentou que 'a proliferação de famílias numerosas nas periferias dos países do Sul global é o principal obstáculo ao crescimento econômico, devendo os governos condicionar benefícios sociais à laqueadura tubária obrigatória de mulheres de baixa renda'. Em resposta, outro debatedor declarou que 'a fecundidade elevada decorre da falta de acesso à educação e da exclusão econômica; superar a miséria exige investir em escolas públicas de qualidade e em distribuição justa de renda'.",
    "As duas posições políticas e ideológicas expostas no debate correspondem, respectivamente, às teorias demográficas:",
    [
      "Malthusiana tradicional e Ecomalthusiana preservacionista.",
      "Positivista darwinista e Neoliberal pura.",
      "Neomalthusiana e Reformista (ou Crítica).",
      "Reformista marxista e Malthusiana de transição.",
      "Anarquista coletivista e Fisiocrata agrária."
    ],
    2,
    "Alternativa correta: C. O primeiro debatedor expressa a tese neomalthusiana clássica (culpar o número de filhos dos pobres pelo atraso econômico e defender controle compulsório de natalidade); o segundo debatedor expressa a tese reformista (a alta natalidade é fruto da carência de direitos sociais e renda, devendo o Estado atacar as causas da pobreza para que a fecundidade caia organicamente). As alternativas A, C, D e E trazem enquadramentos teóricos incorretos."
  ],
  "Tipos de indústrias: de base, bens de capital e consumo": [
    "A classificação econômica e tecnológica dos setores industriais subdivide as fábricas segundo a sua posição na cadeia de transformação dos insumos: 1) Indústria de Base (ou de Bens de Produção / Indústria Pesada): transforma matérias-primas brutas em matérias-primas processadas para outras indústrias; é intensiva em capital, instalações gigantescas e energia pesada (ex.: siderúrgicas que produzem chapas de aço, petroquímicas, refinarias de petróleo e cimenteiras); no Brasil, foi historicamente financiada pelo Estado na Era Vargas; 2) Indústria de Bens de Capital (ou de Intermediários): produz máquinas, motores, tratores e equipamentos utilizados por outras fábricas; 3) Indústria de Bens de Consumo (ou Indústria Leve): produz mercadorias diretamente destinadas ao consumidor final; subdivide-se em: a) Bens de consumo duráveis (automóveis, eletrodomésticos, eletrônicos), intensivos em tecnologia e crédito financeiro; b) Bens de consumo não duráveis e semiduráveis (alimentos processados, bebidas, vestuário, calçados e medicamentos), com ampla dispersão territorial e intensivos em mão de obra direta.",
    [
      "Indústria de Base: aço, cimento, derivados de petróleo, química pesada (sustenta as demais fábricas)",
      "Indústria de Bens de Capital: máquinas operatrizes, tratores industriais e motores fabris",
      "Indústria de Bens de Consumo Duráveis: carros, geladeiras, televisores e computadores",
      "Indústria de Bens de Consumo Não Duráveis: alimentos, tecidos, calçados e remédios (ampla geração de empregos)"
    ],
    "Para a prova do ENEM: na industrialização brasileira, a Era Vargas (anos 1930/40) focou na indústria de BASE estatal (CSN, Vale, Petrobras); o Plano de Metas de JK (anos 1950) focou na indústria de bens de consumo DURÁVEIS atraindo montadoras multinacionais de carros.",
    "Na formação histórica do parque manufatureiro brasileiro, a instalação da Companhia Siderúrgica Nacional (CSN) em Volta Redonda (RJ), inaugurada na década de 1940 pelo governo Getúlio Vargas, forneceu os primeiros trilhos de trem e chapas de aço laminadas nacionais para abastecer a futura instalação de fábricas de tratores e montadoras de veículos no país.",
    "Pela sua função essencial na cadeia industrial e na transformação das matérias-primas brutas, a CSN classifica-se tipologicamente como uma:",
    [
      "indústria de bens de consumo não duráveis especializada em tecidos finos.",
      "empresa multinacional de montagem de calçados esportivos importados.",
      "indústria de base (ou de bens de produção) voltada à siderurgia pesada.",
      "cooperativa camponesa de cultivo e moagem artesanal de café.",
      "agência financeira de intermediação de títulos da bolsa de valores."
    ],
    2,
    "Alternativa correta: C. As siderúrgicas transformam minério de ferro e carvão em aço bruto, material indispensável para a construção civil e para a fabricação de máquinas e automóveis, caracterizando o núcleo clássico da indústria pesada ou de base. A alternativa A erra porque o aço é bem de base duradouro. As alternativas C, D e E trazem setores que nada têm a ver com a siderurgia."
  ],
  "Energia nuclear e Angra dos Reis": [
    "A energia nuclear é gerada em usinas termonucleares a partir da fissão controlada de núcleos de átomos pesados de urânio enriquecido (urânio-235) no reator, liberando calor colossal que ferve água, produz vapor de alta pressão e gira turbinas geradoras de eletricidade. O Brasil detém a sexta maior reserva de urânio do planeta e domina todo o ciclo do enriquecimento isotópico (desenvolvido pelas Forças Armadas e Indústrias Nucleares do Brasil - INB). O parque nuclear brasileiro concentra-se na Central Nuclear Almirante Álvaro Alberto, em Angra dos Reis (RJ), com os reatores operacionais Angra 1 e Angra 2 (e as obras inacabadas de Angra 3). A energia nuclear apresenta a vantagem de não emitir gases de efeito estufa durante a operação e de gerar energia constante na base do sistema elétrico sem depender do regime de chuvas. Em contrapartida, impõe riscos de acidentes catastróficos com vazamento radioativo (como Chernobyl em 1986 e Fukushima em 2011), custos elevadíssimos de construção e descomissionamento e o problema insolúvel do armazenamento seguro de lixo atômico altamente radioativo por milhares de anos.",
    [
      "Fissão nuclear do urânio-235: reação em cadeia controlada que libera grande quantidade de calor",
      "Angra dos Reis (RJ): usinas Angra 1 e Angra 2 integradas ao Sistema Interligado Nacional (SIN)",
      "Vantagens: não emite CO₂ durante a geração elétrica, ocupa pouca área e fornece energia constante sem depender do clima",
      "Desvantagens: lixo nuclear perigoso com radiação milenar, risco de contaminação e altíssimo custo de implantação"
    ],
    "Para o ENEM: a usina nuclear é, no fundo, uma usina térmica! A diferença é que, em vez de queimar carvão ou gás, ela ferve a água com o calor da fissão nuclear do urânio; portanto, ela precisa de muita água fria para o condensador, e por isso as usinas ficam no litoral (como em Angra dos Reis).",
    "A Central Nuclear de Angra dos Reis responde por cerca de 2% a 3% do suprimento elétrico da rede nacional brasileira. Embora grupos ambientalistas apontem os riscos do destino final dos combustíveis exauridos (rejeitos de alta radioatividade) e a proximidade com áreas urbanas na Costa Verde, defensores da tecnologia sustentam sua utilidade como fonte termelétrica limpa quanto a emissões gasosas.",
    "A principal vantagem ambiental apresentada pela operação normal de usinas termonucleares em comparação com as usinas termelétricas tradicionais movidas a carvão fóssil reside na:",
    [
      "capacidade do reator de purificar rios retirando todo o esgoto doméstico da bacia.",
      "garantia de que seus resíduos nucleares perdem toda a radioatividade em apenas três dias.",
      "produção simultânea de petróleo cru sintético que abastece motores a combustão.",
      "ausência de emissão direta de gases de efeito estufa (como CO₂) e poluentes precursores de chuva ácida na atmosfera durante a geração.",
      "inexistência de consumo de água para resfriamento de seus condensadores industriais."
    ],
    3,
    "Alternativa correta: D. No processo de fissão do urânio não ocorre combustão de hidrocarbonetos; assim, a chaminé do reator emite apenas vapor de água puro, sem lançar dióxido de carbono (CO₂), cinzas ou dióxido de enxofre (SO₂), operando sem contribuir diretamente para o aquecimento global nem para a chuva ácida. A alternativa A é absurda. A C e a E trazem afirmativas falsas (usinas consomem bilhões de litros de água para resfriamento). A D mente sobre o decaimento radioativo, que dura milênios."
  ],
  "Amazônia Legal e Zona Franca de Manaus": [
    "A 'Amazônia Legal' é um conceito de planejamento geopolítico e regional criado pelo governo brasileiro em 1953 (Governo Vargas, Lei nº 1.806) e atualizado pela Constituição de 1988, abrangendo a totalidade dos sete estados da Região Norte (AC, AP, AM, PA, RO, RR, TO), mais o estado de Mato Grosso (Centro-Oeste) e a porção do Maranhão a oeste do meridiano 44° W (Nordeste). Corresponde a quase 60% do território nacional. A demarcação da Amazônia Legal visa planejar incentivos fiscais, crédito e fiscalização ambiental em todo o ecossistema florestal contínuo. Em 1967, o governo militar criou a Zona Franca de Manaus (ZFM), administrada pela Suframa: um enclave industrial com isenção de impostos federais (IPI, Imposto de Importação) para atrair indústrias de montagem de bens duráveis (eletroeletrônicos, motocicletas e componentes) para a capital amazonense, visando integrar a região ao mercado nacional e gerar empregos urbanos.",
    [
      "Amazônia Legal: conceito político-estatístico criado em 1953 (Norte + Mato Grosso + oeste do Maranhão)",
      "Amazônia Internacional: abrange 9 países da América do Sul detentores do bioma florestal",
      "Zona Franca de Manaus (1967): polo fabril incentivado por isenções fiscais (polo eletroeletrônico e duas rodas)",
      "Paradoxo da ZFM: gera empregos urbanos que desestimulam a derrubada da floresta, mas depende de insumos importados"
    ],
    "Cuidado: Amazônia Legal NÃO é a mesma coisa que Região Norte! O estado de Mato Grosso é do Centro-Oeste e o Maranhão é do Nordeste, mas ambos integram a Amazônia Legal para fins de preservação e incentivos fiscais.",
    "Para efeitos de aplicação de alíquotas diferenciadas do Código Florestal (que exige a preservação de 80% da vegetação nativa como Reserva Legal em imóveis rurais de floresta) e para o planejamento da Superintendência do Desenvolvimento da Amazônia (Sudam), a legislação brasileira utiliza a delimitação geográfica da Amazônia Legal.",
    "A configuração territorial oficial da Amazônia Legal engloba a totalidade dos estados da Região Norte e inclui também:",
    [
      "a totalidade dos estados de São Paulo e Minas Gerais na Região Sudeste.",
      "o Distrito Federal e a totalidade do polígono das secas do Ceará.",
      "exclusivamente as ilhas oceânicas do arquipélago de São Pedro e São Paulo.",
      "os três estados que compõem a macrorregião Sul do Brasil.",
      "o estado de Mato Grosso (Centro-Oeste) e a porção ocidental do estado do Maranhão (Nordeste)."
    ],
    4,
    "Alternativa correta: E. A Amazônia Legal ultrapassa os limites da Região Norte ao incorporar o estado de Mato Grosso e a área a oeste do meridiano 44° W no Maranhão, totalizando cerca de 5 milhões de km² de território sob regime especial de conservação ambiental e desenvolvimento regional. As alternativas A, C, D e E citam estados que não fazem parte da bacia ou do bioma amazônico."
  ],
  "Guerra na Ucrânia e expansão da OTAN": [
    "O conflito armado deflagrado pela invasão militar da Ucrânia pela Federação Russa em fevereiro de 2022 reconfigurou a geopolítica e a segurança energética mundial. A crise tem raízes históricas no colapso da União Soviética (1991) e na sucessiva expansão para o Leste Europeu da Organização do Tratado do Atlântico Norte (OTAN) — aliança militar ocidental liderada pelos Estados Unidos —, incorporando antigas repúblicas soviéticas (como Estônia, Letônia e Lituânia) e países do extinto Pacto de Varsóvia (como Polônia e Hungria). O governo de Moscou enxerga a perspectiva de adesão da Ucrânia à OTAN como uma ameaça existencial inaceitável às suas fronteiras e à sua zona de influência histórica. A guerra gerou sanções econômicas severas do Ocidente contra a Rússia, crise inflacionária de combustíveis e fertilizantes (a Rússia é grande exportadora de gás, petróleo e potássio; e a Ucrânia de trigo e grãos), reaproximação estratégica de Moscou com a China e aceleração da militarização de países europeus (com o ingresso da Finlândia e Suécia na OTAN).",
    [
      "OTAN: aliança militar ocidental liderada pelos EUA criada na Guerra Fria (Art. 5º de defesa mútua)",
      "Guerra na Ucrânia (2022): disputa territorial, choque entre expansão da OTAN e pretensões hegemônicas da Rússia",
      "Impactos econômicos: choque global no preço de combustíveis (gás russo) e fertilizantes agrícolas essenciais ao Brasil",
      "Multipolaridade tensa: fortalecimento do eixo Moscou-Pequim e divisão nas votações da Assembleia Geral da ONU"
    ],
    "Para o ENEM: o Brasil depende da importação de fertilizantes minerais químicos para o agronegócio (como o potássio e o nitrogênio); a guerra na Ucrânia e as sanções à Rússia acenderam o alerta vermelho sobre a vulnerabilidade da safra agrícola brasileira frente a conflitos no Leste Europeu.",
    "A eclosão da guerra no Leste Europeu em 2022 e as sanções financeiras internacionais impostas a Moscou provocaram ondas de choque nas cadeias globais de suprimentos, desestabilizando o abastecimento de gás natural na União Europeia e elevando os custos de importação de fertilizantes nitrogenados e fosfatados consumidos pelo agronegócio no Brasil.",
    "O contexto geopolítico estrutural que motivou o acirramento das tensões de segurança e a deflagração da intervenção militar russa na Ucrânia envolveu a:",
    [
      "tentativa de anexação do território russo pelo Parlamento da Austrália.",
      "extinção definitiva de todas as forças armadas dos países que integram a União Europeia.",
      "proibição global da navegação comercial de navios petroleiros no Mar Vermelho.",
      "rejeição da Rússia ao avanço progressivo da OTAN em direção ao Leste Europeu e à sua área de fronteira imediata.",
      "decisão de Kiev de adotar a moeda russa em substituição ao euro ocidental."
    ],
    3,
    "Alternativa correta: D. Do ponto de vista geopolítico russo, a expansão contínua da aliança militar da OTAN em direção às fronteiras da Rússia após o fim da Guerra Fria rompeu promessas diplomáticas de segurança coletiva; a perspectiva de adesão da Ucrânia ao bloco militar ocidental foi tratada pelo Kremlin como uma linha vermelha que justificou a ação armada. As alternativas A, C, D e E trazem fatos falsos ou disparatados."
  ],
  "Redes geográficas: nós, fixos e fluxos": [
    "A análise contemporânea do espaço geográfico operacionaliza-se por meio do conceito de redes geográficas: estruturas espaciais integradas formadas pela articulação entre 'fixos' (objetos técnicos imóveis no espaço, como portos, aeroportos, fábricas, antenas de satélite, ferrovias e cabos submarinos de fibra óptica) e 'fluxos' (movimentos contínuos de mercadorias, capitais, informações e pessoas que circulam por essas linhas). As cidades, nós logísticos e centros de decisão política e financeira funcionam como 'nós' da rede, concentrando o poder de comando e conexão. O geógrafo Milton Santos destacava que as redes geográficas produzem uma 'desterritorialização' aparente, mas criam novas hierarquias espaciais rígidas: pontos conectados em alta velocidade comunicam-se instantaneamente, enquanto áreas que não possuem fixos técnicos de conexão tornam-se 'espaços opacos', marginalizados dos benefícios da modernidade informacional.",
    [
      "Fixos: objetos materiais enraizados no solo (fábricas, portos, estradas, torres, armazéns)",
      "Fluxos: movimentos de matéria e informação que circulam entre os fixos (dinheiro, internet, cargas)",
      "Nós da rede: centros que concentram conexões e decisões de comando (metrópoles e cidades globais)",
      "Espaços luminosos vs opacos: os luminosos têm densidade de fixos e fluxos; os opacos são isolados"
    ],
    "Para a redação e para a prova de Humanas do ENEM: a rede geográfica une lugares distantes através de conexões técnicas (um clique transfere um bilhão de dólares de Tóquio para Londres), mas desarticula a vizinhança local quando quem mora ao lado não tem dinheiro nem internet para participar desses fluxos.",
    "Ao discutir a geografia das redes na globalização, o geógrafo Milton Santos formulou o par dialético 'fixos e fluxos': os fixos são os instrumentos e aparelhos técnicos fixados na terra que permitem o trabalho; os fluxos são os movimentos e circulações gerados pela ação humana sobre esses fixos.",
    "Um exemplo prático e contemporâneo que materializa a articulação indissociável entre um 'fixo' geográfico e um 'fluxo' no território brasileiro é a relação entre:",
    [
      "a queima espontânea de gases no vácuo espacial e o silêncio da noite.",
      "o Porto de Santos com seus guindastes e cais (fixos) e o trânsito contínuo de contêineres e navios com soja (fluxos).",
      "a linha do Equador imaginária e o congelamento dos icebergs na Groenlândia.",
      "o magma derretido no manto inferior e a formação de dunas eólicas na praia.",
      "o fuso horário de Greenwich e a altitude das falésias da bacia do Paraná."
    ],
    1,
    "Alternativa correta: B. O terminal portuário, os cais de atracação, as esteiras rolantes e os galpões de granéis são objetos materiais permanentes cravados na paisagem (os 'fixos'); os grãos de soja transportados em carretas, os navios atracando e os dados telemáticos de exportação são as matérias e informações em movimento (os 'fluxos'). As alternativas A, C, D e E trazem paralelos incoerentes ou desconexos."
  ],
  "Eutrofização de corpos hídricos": [
    "A eutrofização é o processo de poluição aquática decorrente do aporte excessivo de nutrientes minerais — principalmente compostos nitrogenados (nitratos) e fosfatados (fosfatos) — em rios, lagos, represas e baías. As fontes antrópicas principais são o despejo de esgoto doméstico in natura sem tratamento e o escoamento superficial de fertilizantes químicos sintéticos (N-P-K) carreados pelas chuvas a partir de lavouras agrícolas. O excesso de nutrientes provoca a proliferação descontrolada e explosiva de algas e fitoplâncton na superfície, formando uma camada espessa que bloqueia a penetração da luz solar, impedindo a fotossíntese da vegetação submersa. Com a morte maciça de algas, bactérias decompositoras aeróbias proliferam e consomem todo o oxigênio dissolvido na água (anoxia), provocando a morte generalizada de peixes e a liberação de gases fétidos por decomposição anaeróbia.",
    [
      "Eutrofização: excesso de nitrogênio (N) e fósforo (P) em corpos d'água",
      "Fontes: esgoto sanitário sem tratamento e lixiviação de fertilizantes químicos agrícolas",
      "Mecanismo: 'boom' de algas ➔ bloqueio da luz solar ➔ morte da flora submersa ➔ consumo total de O₂ (anoxia)",
      "Consequência: mortandade em massa de peixes e proliferação de bactérias anaeróbias"
    ],
    "Para o ENEM: a eutrofização não mata os peixes por 'envenenamento direto', mas sim por asfixia (falta de oxigênio dissolvido na água, consumido pelas bactérias decompositoras).",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Etapas da Eutrofização Aquática</text><rect x='20' y='45' width='80' height='30' fill='#2F5BFF' rx='4'/><text x='25' y='63' font-size='9' fill='#fff' font-weight='700'>1. Esgoto + N e P</text><rect x='110' y='45' width='90' height='30' fill='#2E7D32' rx='4'/><text x='115' y='63' font-size='9' fill='#fff' font-weight='700'>2. Boom de Algas</text><rect x='210' y='45' width='95' height='30' fill='#D12D20' rx='4'/><text x='215' y='63' font-size='9' fill='#fff' font-weight='700'>3. Anoxia (Zero O₂)</text><text x='30' y='105' font-size='10' fill='var(--tx)'>➔ Camada verde bloqueia a luz solar submersa</text><text x='30' y='125' font-size='10' fill='#D12D20' font-weight='700'>➔ Mortandade em massa da fauna aquática</text></svg>Em uma lagoa costeira cercada por condomínios desprovidos de rede de coleta de esgotos e por plantações de hortaliças intensivas, moradores registraram a súbita cobertura da superfície por uma espessa biomassa verde-esmeralda, seguida, dias depois, pelo aparecimento de milhares de peixes mortos boiando na água escura com forte odor fétido.",
    "A causa biológica e química direta da mortandade da fauna aquática no processo descrito consiste no(a):",
    [
      "aumento abrupto da salinidade que transformou a lagoa em água do mar cristalina.",
      "emissão contínua de ondas de calor vulcânicas pelo assoalho sedimentar da lagoa.",
      "congelamento repentino das camadas profundas da lagoa em pleno verão equatorial.",
      "elevação da taxa de fotossíntese dos peixes motivada pela abundância de luz ultravioleta.",
      "esgotamento do oxigênio dissolvido na água consumido pela decomposição bacteriana da biomassa vegetal excedente."
    ],
    4,
    "Alternativa correta: E. O aporte excessivo de nutrientes nitrogenados e fosfatados provoca a multiplicação explosiva de algas; ao morrerem, essas algas são decompostas por bactérias que consomem vorazmente o oxigênio dissolvido na água, gerando anoxia extrema e asfixiando os peixes. As alternativas A, C, D e E trazem formulações fisicamente falsas."
  ],
  "Lixo eletrônico e obsolescência programada": [
    "O lixo eletrônico (e-waste ou Resíduos de Equipamentos Eletroeletrônicos - REEE) é a categoria de resíduos sólidos que mais cresce no mundo contemporâneo, reflexo da sociedade de hiperconsumo e da obsolescência programada — estratégia deliberada da indústria de conceber produtos com vida útil artificialmente encurtada ou rapidamente superada por atualizações de software para forçar a compra contínua de novos aparelhos. O descarte inadequado de smartphones, computadores, televisores e baterias em lixões ou aterros comuns acarreta graves impactos ecológicos e de saúde pública: esses aparelhos contêm metais pesados altamente bioacumulativos e tóxicos (chumbo, mercúrio, cádmio, berílio e arsênio) que contaminam o solo e os lençóis freáticos. A Política Nacional de Resíduos Sólidos (PNRS) estabelece a obrigatoriedade da logística reversa, responsabilizando fabricantes, importadores e comerciantes pelo recolhimento, desmontagem e reciclagem de componentes eletrônicos.",
    [
      "Obsolescência programada: redução artificial da durabilidade de produtos para acelerar o ciclo de consumo",
      "Lixo eletrônico (e-waste): resíduos com componentes de alta periculosidade química (metais pesados)",
      "Metais pesados tóxicos: chumbo (danos neurológicos), mercúrio (neurotóxico) e cádmio (danos renais)",
      "Logística reversa obrigatória (PNRS): dever dos fabricantes de coletar e reciclar os eletrônicos descartados"
    ],
    "Para a redação e para a prova do ENEM: a obsolescência não é apenas física (peça que quebra de propósito), ela também é perceptiva ou psicológica (o produto ainda funciona perfeitamente, mas a publicidade faz o consumidor sentir vergonha de usar um modelo antigo).",
    "Estudo da Organização das Nações Unidas (ONU) apontou que a humanidade gera mais de 50 milhões de toneladas de lixo eletrônico anualmente, mas menos de um quarto desse volume é adequadamente reciclado em centros formais, sendo grande parte exportada ilegalmente para lixões informais em países da África e Ásia.",
    "A estratégia industrial do capitalismo contemporâneo que acelera a geração do lixo eletrônico ao encurtar o ciclo de vida útil das mercadorias é denominada:",
    [
      "produção artesanal sob encomenda familiar descentralizada.",
      "logística reversa universal financiada integralmente por catadores de rua.",
      "obsolescência programada associada à indução mercadológica do hiperconsumo.",
      "economia circular com garantia de reparabilidade perpétua dos aparelhos.",
      "estatização soviética compulsória de todas as fábricas de computadores."
    ],
    2,
    "Alternativa correta: C. A obsolescência programada é a prática capitalista de projetar deliberadamente a falha precoce de baterias, telas e placas de circuito ou cessar o suporte de software para obrigar o consumidor a adquirir a versão mais recente, inflando os lucros das marcas e sobrecarregando aterros com resíduos tóxicos. As alternativas A, C, D e E descrevem outros modelos de produção ou práticas opostas."
  ],
  "Desastres de barragens e mineração": [
    "A mineração predatória e a gestão negligente de rejeitos minerais geraram os dois maiores desastres socioambientais da história brasileira: o rompimento da barragem de Fundão (Samarco/Vale/BHP Billiton), em Mariana (MG) em 2015, e o rompimento da barragem do Córrego do Feijão (Vale), em Brumadinho (MG) em 2019. Ambas as estruturas foram construídas pelo método de alteamento 'a montante' (a tecnologia mais barata e de maior instabilidade geotécnica, erguida sobre a própria lama de rejeitos). Os colapsos liberaram dezenas de milhões de metros cúbicos de lama e rejeitos de minério de ferro que soterraram distritos e ceifaram centenas de vidas humanas. No plano hidrográfico, a onda de lama destruiu integralmente as matas ciliares, assoreou os leitos e contaminou as bacias do Rio Doce (Mariana) e do Rio Paraopeba (Brumadinho), exterminando peixes, inviabilizando o abastecimento de água potável de dezenas de cidades e alcançando o litoral do Espírito Santo.",
    [
      "Mariana (2015): rompimento de Fundão na bacia do Rio Doce; maior desastre ambiental do Brasil",
      "Brumadinho (2019): rompimento no Córrego do Feijão na bacia do Rio Paraopeba; 272 mortes humanas",
      "Alteamento a montante: método frágil que causou as duas tragédias por liquefação da lama",
      "Impactos: aniquilação da ictiofauna, perda de renda de pescadores e agricultores e assoreamento crônico"
    ],
    "Para o ENEM: a lama de rejeitos de ferro não é altamente tóxica por si mesma (é composta de óxido de ferro, sílica e argila), mas sua passagem destrói a vida por sufocamento mecânico (turbidez extrema zera a luz e a fotossíntese; a lama veda as guelras dos peixes e cimenta o fundo do rio).",
    "O rompimento da barragem de rejeitos de mineração no município de Mariana liberou uma colossal avalanche de lama que percorreu mais de 650 km ao longo da calha do Rio Doce, destruindo o distrito de Bento Rodrigues e atingindo o Oceano Atlântico na foz do rio em Linhares (ES).",
    "O principal impacto ecológico imediato provocado pela passagem da onda de lama de rejeitos ao longo da bacia fluvial foi a:",
    [
      "redução repentina da temperatura das águas que congelou todo o leito do rio.",
      "transformação do Rio Doce em um canal de navegação oceânica de calado profundo.",
      "elevação brutal da turbidez da água, bloqueando a luz solar e asfixiando a ictiofauna por colmatação branquial.",
      "eliminação do ferro mineral da crosta, transformando o solo em jazida de carvão fóssil.",
      "irradiação nuclear provocada por vazamentos atômicos nas turbinas de Belo Monte."
    ],
    2,
    "Alternativa correta: C. A imensa quantidade de sedimentos finos suspensos na água provocou aumento extremo na turbidez, impedindo a penetração da luz solar e extinguindo a fotossíntese de algas subaquáticas; além disso, as partículas de argila e sílica aderiram às brânquias dos peixes, matando-os por asfixia mecânica. As alternativas A, C, D e E trazem afirmações sem qualquer respaldo factual."
  ],
  "Estatuto da Cidade e Plano Diretor": [
    "O Estatuto da Cidade (Lei Federal nº 10.257/2001) é o marco regulatório que regulamentou os artigos 182 e 183 da Constituição Federal de 1988, estabelecendo as diretrizes gerais da política urbana no Brasil. O princípio estruturante da legislação é o da 'função social da cidade e da propriedade urbana', determinando que o direito de propriedade não é absoluto e deve submeter-se ao interesse coletivo da população por moradia, meio ambiente saudável e mobilidade. A lei tornou obrigatória a elaboração de um Plano Diretor participativo para municípios com mais de 20 mil habitantes, integrantes de regiões metropolitanas ou áreas turísticas. Entre os instrumentos urbanísticos de combate à especulação imobiliária destacam-se: 1) IPTU progressivo no tempo e desapropriação com pagamento em títulos da dívida pública para terrenos mantidos vazios à espera de valorização; 2) Zonas Especiais de Interesse Social (ZEIS), reservadas para habitação popular; 3) Outorga onerosa do direito de construir (solo criado).",
    [
      "Estatuto da Cidade (Lei 10.257/2001): consolida o princípio da função social da propriedade urbana",
      "Plano Diretor: lei municipal obrigatória (cidades >20 mil hab.) que planeja o crescimento e uso do solo",
      "IPTU progressivo: imposto aumenta a cada ano para proprietários que mantêm terrenos ociosos especulando",
      "ZEIS (Zonas Especiais de Interesse Social): áreas destinadas por lei à moradia digna para famílias de baixa renda"
    ],
    "Para o ENEM: combater vazios urbanos centrais é ecológico e financeiramente sustentável: a cidade já gastou dinheiro público levando asfalto, água e luz até ali; deixar o terreno vazio enquanto a população pobre é jogada para periferias a 30 km de distância sobrecarrega os cofres públicos e o trânsito.",
    "O Artigo 182 da Constituição Federal determina que a propriedade urbana cumpre sua função social quando atende às exigências fundamentais de ordenação da cidade expressas no Plano Diretor municipal, assegurando o bem-estar dos seus habitantes.",
    "O instrumento urbanístico legalmente previsto no Estatuto da Cidade para penalizar o proprietário que mantém imóvel urbano ocioso e desocupado em área dotada de infraestrutura é o(a):",
    [
      "isenção perpétua de todos os tributos federais e municipais.",
      "IPTU progressivo no tempo, podendo culminar na desapropriação do imóvel com pagamento em títulos da dívida pública.",
      "autorização irrestrita para construção de pistas de pouso clandestinas no terreno.",
      "conversão compulsória do terreno em base militar de lançamento de foguetes.",
      "proibição aos órgãos públicos de asfaltarem a rua onde se localiza o imóvel."
    ],
    1,
    "Alternativa correta: B. O Estatuto da Cidade prevê a aplicação de instrumentos coercitivos sucessivos contra a retenção especulativa de terrenos: primeiro a notificação para parcelamento ou edificação compulsória; se desobedecida, a cobrança do IPTU progressivo com alíquotas aumentadas ano a ano; persistindo a ociosidade, o poder público pode desapropriar o terreno com títulos da dívida pública. As alternativas A, C, D e E trazem opções descabidas."
  ],
  "Enchentes e impermeabilização do solo": [
    "As enchentes e alagamentos nas grandes metrópoles brasileiras são desastres socioambientais urbanos de causa eminentemente antrópica. Na bacia hidrográfica natural, a vegetação e o solo permeável interceptam a água das chuvas, permitindo a lenta infiltração que abastece o lençol freático e alimenta os rios de forma gradual e contínua. No ambiente urbano cimentado, a substituição da cobertura vegetal por asfalto, calçadas e telhados impermeabiliza mais de 80% da superfície; a água da chuva não consegue infiltrar no solo e converte-se em escoamento superficial torrencial imediato (run-off). Somam-se a isso a canalização e retificação de rios em calhas de concreto estreitas (que aceleram a velocidade da água para jusante), a perda das planícies naturais de inundação (várzeas) ocupadas por marginais e avenidas de fundo de vale, o acúmulo de lixo que entope bueiros e o assoreamento dos leitos. As soluções modernas preconizam a drenagem sustentável: bacias de amortecimento (piscinões), jardins de chuva, pavimentos drenantes e renaturalização de córregos.",
    [
      "Impermeabilização do solo: impede a infiltração da água da chuva e multiplica o escoamento superficial (run-off)",
      "Retificação de rios: canais retos de concreto eliminam as curvas (meandros) e jogam a água rápido para jusante",
      "Ocupação das várzeas: construção de avenidas marginais no leito maior de inundação natural dos rios",
      "Drenagem sustentável: piscinões de retenção, jardins de chuva permeáveis e recuperação de calhas naturais"
    ],
    "Para a prova do ENEM: o rio que 'invade' a marginal em dias de chuva forte não está cometendo nenhuma invasão; a cidade é quem invadiu a várzea (leito de inundação periódica natural do rio) ao construir pistas sobre a planície aluvial.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Hidrograma: Cidade vs Ambiente Natural</text><line x1='30' y1='130' x2='290' y2='130' stroke='var(--ln)' stroke-width='2'/><path d='M30 130 Q 70 30 130 130' fill='none' stroke='#D12D20' stroke-width='3'/><text x='65' y='28' font-size='10' fill='#D12D20' font-weight='700'>Pico Urbano (Enchente Rápida)</text><path d='M30 130 Q 140 85 270 130' fill='none' stroke='#2E7D32' stroke-width='3'/><text x='160' y='80' font-size='10' fill='#2E7D32' font-weight='700'>Curva Natural (Infiltração Suave)</text><text x='100' y='145' font-size='9' fill='var(--mu)'>Tempo após o início da tempestade</text></svg>Em metrópoles como São Paulo, tempestades de verão de apenas 45 minutos são suficientes para paralisar as vias marginais sob metros de água barrenta, arrastando veículos e inundando comércios construídos ao longo das calhas dos rios Tietê e Pinheiros.",
    "A alteração física da paisagem urbana que explica o pico abrupto de vazão e a eclosão das enchentes urbanas é a:",
    [
      "expansão contínua de florestas primárias no topo de todos os espigões centrais.",
      "impermeabilização generalizada do solo associada à canalização de rios e ocupação das planícies de inundação naturais.",
      "proibição municipal da circulação de veículos de passeio em dias de chuva torrencial.",
      "retirada de todas as comportas de hidrelétricas instaladas no leito das avenidas centrais.",
      "abertura de cavernas calcárias subterrâneas que atraem as marés salinas atlânticas."
    ],
    1,
    "Alternativa correta: B. A substituição do solo florestal permeável pelo concreto e asfalto elimina a capacidade natural de infiltração da água da chuva; o escoamento superficial corre rapidamente para os córregos retificados, que transbordam nas avenidas marginais que foram construídas exatamente sobre a área natural de várzea do rio. As alternativas A, C, D e E trazem hipóteses falsas."
  ],
  "Transgênicos e sementes modificadas": [
    "Os organismos geneticamente modificados (OGMs ou transgênicos) são cultivares cujo DNA foi alterado em laboratório pela inserção de genes de outras espécies para conferir resistência a herbicidas químicos (como a soja e o milho resistentes ao glifosato) ou para produzir toxinas contra pragas agrícolas (variedades Bt). Introduzidos em larga escala no Brasil a partir dos anos 2000 e regulados pela Comissão Técnica Nacional de Biossegurança (CTNBio), os transgênicos dominam atualmente mais de 90% das safras nacionais de soja, milho e algodão. O modelo agroindustrial defende que a biotecnologia aumenta a produtividade e reduz o número de pulverizações. Em contrapartida, movimentos socioambientais e camponeses criticam os impactos negativos: dependência crônica de sementes patenteadas por poucas multinacionais químicas (que cobram royalties e impedem o agricultor de guardar sementes para a safra seguinte), contaminação genética de variedades nativas crioulas e surgimento de 'superpragas' e ervas daninhas resistentes que exigem doses cada vez mais altas e tóxicas de agrotóxicos.",
    [
      "Transgênicos (OGMs): plantas com genes exógenos de resistência a pragas ou herbicidas químicos",
      "Domínio no Brasil: mais de 90% das áreas de soja, milho e algodão utilizam sementes transgênicas",
      "Monopólio corporativo: grandes transnacionais de biotecnologia controlam a patente das sementes e vendem o veneno casado",
      "Contaminação de sementes crioulas: pólen transgênico viaja pelo vento e contamina lavouras orgânicas e tradicionais"
    ],
    "Para o ENEM: atente para o símbolo oficial obrigatório de transgênicos em rótulos de alimentos no Brasil: um triângulo amarelo com a letra 'T' maiúscula em preto no centro.",
    "A disseminação das lavouras de soja transgênica no Centro-Oeste e no Matopiba gerou expressivo aumento na produtividade agrícola, mas resultou na dependência financeira anual dos produtores rurais em relação a pacotes fechados de sementes patenteadas e defensivos químicos fornecidos por um pequeno grupo de oligopólios multinacionais de biotecnologia.",
    "A principal contradição socioeconômica decorrente do monopólio tecnológico das sementes geneticamente modificadas no campo reside no(a):",
    [
      "obrigação legal de que todas as fazendas de grãos doem 100% de sua colheita para cooperativas indígenas.",
      "impossibilidade técnica de colher grãos transgênicos utilizando tratores e colheitadeiras mecanizadas.",
      "perda da autonomia dos agricultores sobre a reprodução de suas sementes e dependência contínua do pagamento de royalties.",
      "isenção total concedida pelo governo para que as transnacionais distribuam sementes gratuitas aos camponeses.",
      "erradicação absoluta de qualquer espécie de inseto ou planta invasora em todo o continente sul-americano."
    ],
    2,
    "Alternativa correta: C. Ao adquirir sementes transgênicas patenteadas, o produtor rural fica juridicamente proibido de guardar e replantar os grãos colhidos na safra anterior, sendo obrigado a comprar novas sementes e pagar royalties contratuais a cada novo plantio para as multinacionais detentoras das patentes genéticas. As alternativas A, C, D e E trazem formulações incoerentes ou falsas."
  ],
  "Pastoreio rotacionado e ILPF": [
    "A pecuária bovina brasileira, detentora do maior rebanho comercial do planeta, é historicamente criticada pelo modelo extensivo tradicional em pastagens degradadas, associado ao desmatamento e à baixa produtividade por hectare. Para mitigar esses passivos, a pesquisa agropecuária nacional (liderada pela Embrapa) desenvolveu sistemas integrados sustentáveis, com destaque para a Integração Lavoura-Pecuária-Floresta (ILPF) e o pastoreio rotacionado. No pastoreio rotacionado, a pastagem é subdividida em piquetes menores: o gado pasteja intensamente em um piquete por poucos dias e em seguida é transferido para o seguinte, permitindo que o capim do primeiro piquete repouse e se recupere sem ser exaurido até a raiz, evitando a compactação do solo. Na ILPF, combinam-se na mesma área a produção de grãos (soja ou milho), a engorda de gado e fileiras de árvores florestais (como eucalipto ou espécies nativas). O sistema recupera solos degradados, melhora o bem-estar animal pelo sombreamento térmico, sequestra carbono da atmosfera no solo e diversifica a renda do produtor.",
    [
      "Pecuária tradicional extensiva: gado solto em pastos degradados, baixa lotação por hectare e desmatamento contínuo",
      "Pastoreio rotacionado: divisão em piquetes com tempo de descanso para o capim recuperar a folhagem",
      "ILPF (Integração Lavoura-Pecuária-Floresta): consórcio de grãos, gado e árvores na mesma propriedade",
      "Ganhos ecológicos: sequestro de carbono no solo, redução da erosão, conforto térmico do gado e solo fértil"
    ],
    "Para o ENEM: a ILPF é uma das principais estratégias do Plano ABC (Agricultura de Baixa Emissão de Carbono) do governo brasileiro para cumprir as metas climáticas do Acordo de Paris sem precisar desmatar novas áreas nativas.",
    "Um pecuarista substituiu o pastoreio contínuo tradicional por um sistema de Integração Lavoura-Pecuária-Floresta (ILPF), intercalando fileiras de eucaliptos para corte de madeira com pastagens adubadas e safras de milho no inverno. Em três anos, o rebanho atingiu o peso de abate mais cedo devido ao conforto térmico das sombras das árvores, enquanto a erosão do solo foi praticamente zerada.",
    "O benefício ecológico fundamental gerado pela adoção da ILPF em propriedades agropecuárias brasileiras consiste na:",
    [
      "aceleração do desmatamento da floresta nativa para ampliar as queimadas de pastos estéreis.",
      "eliminação da presença de matéria orgânica no solo para evitar o surgimento de minhocas benéficas.",
      "recuperação de solos degradados e intensificação sustentável da produção sem necessidade de abertura de novas áreas florestadas.",
      "proibição da colheita de qualquer produto agrícola ou florestal com valor comercial de mercado.",
      "dependência compulsória de irrigação contínua por inundação total das pastagens o ano inteiro."
    ],
    2,
    "Alternativa correta: C. A ILPF permite produzir mais carne, grãos e madeira na mesma área ao melhorar a fertilidade do solo e sequestrar carbono nas árvores; com a elevação da capacidade produtiva por hectare, o sistema viabiliza o aumento da produção sem a necessidade de desmatar novas florestas (efeito poupa-terra). As alternativas A, C, D e E descrevem degradações ambientais ou proibições descabidas."
  ],
  "Paraísos fiscais e fluxos financeiros ilícitos": [
    "Os paraísos fiscais (ou centros financeiros offshore) são jurisdições soberanas ou territórios autônomos (como Ilhas Cayman, Panamá, Suíça, Luxemburgo e Bermudas) que oferecem tributação nula ou irrisória sobre capitais estrangeiros, combinada a rígidas leis de sigilo bancário e opacidade jurídica e contábil. No contexto da globalização financeira desregulada, corporações transnacionais e indivíduos ultrarricos utilizam empresas de fachada (shell companies) sediadas nesses territórios para ocultar ativos, praticar a elisão ou evasão fiscal e registrar lucros artificialmente em países onde não pagam impostos. Esse fluxo ilícito de capitais drena trilhões de dólares das economias nacionais (especialmente de países do Sul global), privando os governos de receitas orçamentárias fundamentais para investimentos em hospitais, escolas e infraestrutura pública, aprofundando a concentração da riqueza e a desigualdade socioeconômica global.",
    [
      "Paraísos fiscais (offshore): tributação quase nula, sigilo bancário estrito e empresas de fachada",
      "Planejamento tributário agressivo: transnacionais transferem lucros contábeis para países sem impostos",
      "Evasão fiscal global: trilhões de dólares sonegados anualmente que deixam de financiar saúde e educação pública",
      "OCDE e G20: debates internacionais para instituir uma alíquota tributária corporativa mínima global"
    ],
    "Para a redação e para a prova do ENEM: enquanto os trabalhadores assalariados têm o imposto retido na fonte sem escapatória, corporações multinacionais utilizam escritórios em paraísos fiscais para driblar impostos de bilhões de dólares, configurando uma das faces mais perversas da globalização financeira.",
    "Investigações jornalísticas e financeiras internacionais (como os Panama Papers e Pandora Papers) revelaram que conglomerados multinacionais e fortunas privadas transferem rotineiramente participações societárias para ilhas do Caribe e centros europeus sob sigilo financeiro estrito, pagando alíquotas de imposto de renda inferiores a 1%.",
    "A proliferação dos paraísos fiscais no sistema financeiro internacional contemporâneo tem como consequência socioeconômica estrutural o(a):",
    [
      "distribuição automática e paritária de recursos monetários para todas as escolas públicas da América Latina.",
      "erosão da arrecadação tributária dos Estados soberanos e o aprofundamento das desigualdades socioeconômicas mundiais.",
      "abolição do uso de moedas digitais e o retorno ao padrão-ouro monetário nos bancos centrais.",
      "proibição legal de investimentos privados no setor industrial de telecomunicações.",
      "transferência compulsória de todas as sedes de corporações globais para aldeias rurais africanas."

    1,
    "Alternativa correta: B. Ao permitirem a ocultação de fortunas e lucros corporativos sem tributação efetiva, os paraísos fiscais retiram capacidade fiscal dos Estados soberanos, forçando os governos a cortar gastos sociais ou a sobretaxar o consumo e o trabalho das classes médias e pobres, agravando a disparidade de renda no planeta. As alternativas A, C, D e E trazem hipóteses sem nexo com a dinâmica fiscal internacional."
  ],
  "Guerra dos chips e semicondutores": [
    "Os semicondutores (microchips) são o coração tecnológico e geopolítico da economia contemporânea: componentes microscópicos de silício essenciais para o funcionamento de smartphones, computadores, inteligência artificial, automóveis, usinas e sistemas de defesa militar avançada. A cadeia global de semicondutores é altamente concentrada e vulnerável: os EUA dominam os softwares e as patentes de arquitetura dos chips; a Holanda (empresa ASML) monopoliza as máquinas de litografia ultravioleta extrema que imprimem os circuitos; e a ilha de Taiwan (empresa TSMC) fabrica mais de 60% dos chips do mundo e mais de 90% dos semicondutores mais avançados do planeta. A rivalidade hegemônica entre os Estados Unidos e a República Popular da China gerou a 'guerra dos chips': Washington impôs embargos e restrições à exportação de chips e maquinários avançados para a China, enquanto Pequim investe centenas de bilhões de dólares em subsídios para alcançar autossuficiência tecnológica nacional.",
    [
      "Semicondutores: o novo 'petróleo' da economia digital e da inteligência artificial",
      "Taiwan (TSMC): polo hegemônico que fabrica a imensa maioria dos chips mais avançados do planeta",
      "Litografia ultravioleta extrema: monopólio da tecnologia de impressão de circuitos na Holanda (ASML)",
      "Guerra tecnológica: sanções dos EUA contra a China para conter o avanço chinês em semicondutores e defesa militar"
    ],
    "Para o ENEM: a disputa geopolítica em torno da ilha de Taiwan não envolve apenas questões históricas de soberania; controlar Taiwan ou ter acesso às fábricas da TSMC significa controlar o fornecimento dos cérebros eletrônicos que movem o mundo.",
    "O governo dos Estados Unidos aprovou o 'Chips and Science Act', destinando mais de 50 bilhões de dólares em subsídios estatais para a atração de novas fábricas de semicondutores para o solo norte-americano, ao mesmo tempo em que proibiu corporações globais de fornecerem microchips avançados e softwares de inteligência artificial para o mercado chinês.",
    "A relevância estratégica e militar dos semicondutores no cenário geopolítico contemporâneo reside no fato de que esses componentes:",
    [
      "são extraídos diretamente em estado líquido nas fossas abissais do Polo Norte.",
      "tornaram-se obsoletos após a invenção da imprensa de tipos mecânicos de chumbo.",
      "substituem integralmente o consumo de alimentos e água nas áreas urbanas conurbadas.",
      "são fabricados com madeira nativa renovável em comunidades camponesas da Patagônia.",
      "constituem a base material e insubstituível para o avanço da computação quântica, inteligência artificial, telecomunicações e armamentos de precisão."
    ],
    4,
    "Alternativa correta: E. Os semicondutores são os componentes essenciais de todo o ecossistema tecnológico contemporâneo; o domínio sobre sua fabricação define a liderança militar, aeroespacial, econômica e de inteligência artificial no século XXI, justificando o empenho das superpotências para evitar dependências externas. As alternativas A, C, D e E trazem formulações absurdas e tecnicamente falsas."
  ],
  "Furacões, tufões e tornados": [
    "Os ciclones tropicais são os fenômenos meteorológicos mais violentos e energéticos da atmosfera, formados sobre águas oceânicas tropicais aquecidas a temperaturas superiores a 26,5 °C. O calor evapora imensos volumes de água; o ar quente ascende rapidamente gerando um centro de baixíssima pressão barométrica, que passa a girar velozmente impulsionado pela Força de Coriolis. Recebem nomes diferentes segundo a bacia oceânica: Furacões no Atlântico Norte e Caribe; Tufões no Oceano Pacífico Ocidental (costa da Ásia); e Ciclones Tropicais no Oceano Índico e Pacífico Sul. Apresentam ventos sustentados superiores a 119 km/h (podendo superar 250 km/h na categoria 5 da escala Saffir-Simpson) e um 'olho' central calmo. Já o Tornado é um fenômeno de escala espacial muito menor: um funil giratório estreito (dezenas a centenas de metros de diâmetro) que desce de uma nuvem Cumulonimbus sobre o continente (muito frequente na 'Alameda dos Tornados' nos EUA e no Sul do Brasil), com ventos pontuais destrutivos que podem superar 400 km/h.",
    [
      "Ciclone tropical: sistema giratório de baixa pressão sobre oceanos quentes (>26,5 °C) de centenas de km de diâmetro",
      "Nomenclatura regional: Furacão (Atlântico), Tufão (Pacífico Asiático) e Ciclone (Índico)",
      "Força de Coriolis: desvia o giro (sentido horário no Hemisfério Sul e anti-horário no Hemisfério Norte)",
      "Tornado: funil estreito de vento extremo sobre o continente associado a nuvens de tempestade violentas"
    ],
    "Para o ENEM: no Brasil NÃO ocorrem furacões tropicais típicos porque a água do Atlântico Sul raramente atinge as condições térmicas contínuas combinadas com o cisalhamento de vento necessário (embora ocorram ciclones extratropicais frios no Sul).",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Estrutura de um Ciclone Tropical (Furacão)</text><path d='M40 85 Q 110 30 150 85 Q 160 85 170 85 Q 210 30 280 85' fill='none' stroke='#2F5BFF' stroke-width='4'/><circle cx='160' cy='85' r='10' fill='#FFB400'/><text x='145' y='110' font-size='9' fill='#14213D' font-weight='700'>Olho do Furacão</text><text x='140' y='122' font-size='8' fill='var(--mu)'>(Calmaria e Baixa Pressão)</text><text x='35' y='60' font-size='9' fill='#D12D20' font-weight='700'>Ventos >200 km/h</text><text x='215' y='60' font-size='9' fill='#D12D20' font-weight='700'>Ventos >200 km/h</text><text x='30' y='142' font-size='9' fill='var(--tx)'>Águas oceânicas superficiais aquecidas a >26,5 °C</text></svg>Imagens de satélites meteorológicos no Golfo do México mostram uma colossal espiral de nuvens de 500 km de diâmetro avançando sobre a costa da Flórida, gerando ondas de tempestade costeira (storm surge) e ventos que ultrapassam 220 km/h.",
    "A condição oceânica e térmica indispensável para a formação e intensificação do ciclone tropical descrito é a:",
    [
      "presença de blocos de gelo marinho e temperaturas de água próximas de 0 °C.",
      "ocorrência de águas superficiais oceânicas aquecidas a temperaturas superiores a 26,5 °C fornecendo vapor d'água e energia térmica contínua.",
      "ausência completa de rotação da Terra na linha do Equador.",
      "emissão de cinzas por vulcões submarinos que resfriam a atmosfera estratosférica.",
      "paralisação absoluta de todos os ventos alísios na bacia do Atlântico Norte."
    ],
    1,
    "Alternativa correta: B. A formação de furacões e ciclones tropicais depende da evaporação maciça de águas oceânicas mornas (acima de 26,5 °C); o vapor ascendente condensa-se e libera calor latente, abastecendo o motor térmico do ciclone que é colocado em rotação pelo efeito Coriolis. As alternativas A, C, D e E trazem formulações fisicamente incorretas."
  ],
  "Ciclones extratropicais no Brasil meridional": [
    "Os ciclones extratropicais são sistemas meteorológicos de baixa pressão atmosférica que se formam em médias e altas latitudes (fora dos trópicos), associados ao encontro e contraste térmico abrupto entre massas de ar polar frias e massas de ar tropical quentes e úmidas ao longo de frentes frias. Na América do Sul, esses ciclones formam-se com frequência na foz do Rio da Prata e no litoral da Região Sul do Brasil (Rio Grande do Sul e Santa Catarina). Ao contrário dos furacões tropicais que possuem núcleo quente e são alimentados pelo calor oceânico, os ciclones extratropicais possuem núcleo frio e alimentam-se do gradiente de temperatura horizontal entre massas de ar distintas. Quando se aprofundam e se deslocam para o oceano Atlântico Sul, provocam rajadas de vento intensas (superando 100 km/h), chuvas volumosas, quedas de árvores e destelhamentos, além de ressacas marítimas violentas com ondas de mais de 4 metros na orla costeira das regiões Sul e Sudeste.",
    [
      "Ciclone extratropical: sistema de baixa pressão em médias latitudes associado ao encontro de frentes frias e quentes",
      "Núcleo frio: alimentado pelo contraste térmico entre a massa polar (mPa) e a massa tropical (mTa)",
      "Região de ocorrência no Brasil: litoral do Rio Grande do Sul, Santa Catarina e costa Sudeste",
      "Impactos costeiros: ressacas marítimas severas, vendavais fortes e tempestades pontuais com inundações"
    ],
    "Para o ENEM: furacão tropical tem núcleo QUENTE e se forma sobre água muito quente no verão do Caribe; ciclone extratropical tem núcleo FRIO e se forma pelo contraste de frentes de ar nas latitudes médias temperadas (comum no inverno e primavera do Sul do Brasil).",
    "Em boletins da Defesa Civil de Santa Catarina e do Rio Grande do Sul, meteorologistas emitiram alertas vermelhos sobre a formação de um intenso ciclone extratropical na costa leste, provocando rajadas de vento de mais de 100 km/h, chuvas torrenciais e alertas de ressaca violenta para a navegação portuária de Rio Grande e Santos.",
    "A gênese dinâmica dos ciclones extratropicais que afetam a Região Sul do território brasileiro fundamenta-se no:",
    [
      "contraste térmico e barométrico entre massas de ar polares frias e massas de ar tropicais quentes e úmidas ao longo de sistemas frontais.",
      "aquecimento de lavas vulcânicas subaquáticas na praia de Copacabana.",
      "enfraquecimento definitivo de todos os ventos alísios na faixa equatorial amazônica.",
      "derretimento súbito de geleiras continentais no planalto das Araucárias paranaense.",
      "efeito estufa provocado exclusivamente pelo cultivo de arroz irrigado nos vales pampeanos."
    ],
    0,
    "Alternativa correta: A. Os ciclones extratropicais são gerados pelo gradiente de temperatura e densidade entre a massa de ar polar (mPa) e a massa de ar tropical (mTa) que se encontram ao longo de uma frente; a rotação em torno do centro de baixa pressão resulta em fortes vendavais e ressacas no litoral meridional brasileiro. As alternativas A, C, D e E trazem hipóteses sem fundamento climatológico."
  ],
  "Biomas mundiais: Tundra e Taiga boreal": [
    "Os biomas das altas latitudes setentrionais ocupam as faixas contíguas ao Círculo Polar Ártico (Canadá, Alasca, norte da Escandinávia e Sibéria russa) sob regimes de frio extremo. A Tundra desenvolve-se na borda polar mais gélida: clima polar com invernos longos, escuros e secos e verões curtíssimos de apenas 2 a 3 meses. Sua vegetação é rasteira e pioneira, dominada por musgos, líquens, gramíneas e pequenos arbustos anões, sem árvores (ausência de arbóreas devido ao frio e ao permafrost — solo permanentemente congelado abaixo da superfície). Ao sul da Tundra estende-se a Taiga (ou Floresta Boreal / Floresta de Coníferas): maior bioma florestal contínuo do planeta, caracterizado pelo predomínio de árvores coníferas (pinheiros e abetos) em formato cônico e com folhas perenes aciculadas (em agulha) revestidas de resina, adaptadas a suportar o peso da neve sem quebrar e reduzir a transpiração. A Taiga é historicamente explorada pela indústria papeleira e madereira global, e a Tundra sofre com o aquecimento global, cujo derretimento do permafrost libera volumes gigantescos de gás metano (CH₄) para a atmosfera.",
    [
      "Tundra: vegetação rasteira de musgos e líquens; ausência de árvores; solo com permafrost congelado",
      "Taiga (Floresta Boreal): coníferas (pinheiros/abetos) em formato de cone e folhas aciculadas resistentes à neve",
      "Permafrost: solo congelado que armazena matéria orgânica ancestral; o degelo libera metano (CH₄)",
      "Altas latitudes: biomas adaptados a invernos polares rigorosos no Hemisfério Norte"
    ],
    "Para o ENEM: o derretimento do permafrost na Tundra ártica cria um ciclo de retroalimentação perigoso: o planeta aquece ➔ o permafrost derrete ➔ matéria orgânica congelada apodrece e libera metano (gás estufa 28x mais potente que o CO₂) ➔ o planeta aquece ainda mais rápido.",
    "Pesquisadores climáticos que monitoram a Sibéria e o Alasca documentaram que o aumento térmico acelerado no Ártico está provocando o descongelamento do permafrost, gerando o colapso estrutural de solos, afundamento de edifícios e a liberação massiva de gases de efeito estufa (metano e CO₂) retidos na biomassa congelada há milhares de anos.",
    "A vegetação típica que ocupa a faixa de maior rigor climático sobre o permafrost na zona ártica polar é a:",
    [
      "Tundra, caracterizada por musgos, líquens e ausência de estratos arbóreos de grande porte.",
      "Mata de cocais com palmeiras de grande porte.",
      "Floresta latifoliada equatorial úmida com vitórias-régias.",
      "Caatinga hiperxerófila com cactos e espinhos.",
      "Savana arborizada tropical com solos profundos latossólicos."
    ],
    0,
    "Alternativa correta: A. A Tundra situa-se nas franjas polares do Ártico, onde o verão curtíssimo e o congelamento perpétuo do subsolo (permafrost) impedem o desenvolvimento de raízes profundas e o crescimento de árvores, sustentando apenas formações vegetais rasteiras de musgos e líquens adaptadas a temperaturas negativas. As alternativas A, C, D e E descrevem biomas tropicais e subtropicais quentes."
  ],
  "Mata dos Cocais e babaçuais": [
    "A Mata dos Cocais é uma clássica zona de transição (ecótono) fitogeográfica brasileira, situada predominantemente nos estados do Maranhão, Piauí e norte do Tocantins. Essa formação estende-se entre a Floresta Amazônica úmida a oeste, a Caatinga semiárida a leste e o Cerrado ao sul, congregando elementos florísticos e climáticos desses domínios adjacentes. A fisionomia vegetal é marcada pelo predomínio exuberante de palmeiras de grande porte, destacando-se a palmeira de babaçu (Orbignya phalerata) nas áreas mais úmidas e a palmeira de carnaúba (Copernicia prunifera, a 'árvore da providência', da qual se extrai cera de alto valor industrial) nas áreas de transição semiárida. A economia regional apoia-se no extrativismo vegetal tradicional conduzido pelas comunidades tradicionais de 'Quebradeiras de Coco Babaçu', mulheres que utilizam amêndoas para fabricar óleo, sabão e farinha, e que lutam pela 'Lei do Babaçu Livre' para garantir o livre acesso aos babaçuais situados no interior de fazendas privadas.",
    [
      "Mata dos Cocais: faixa de transição ecotonal entre Amazônia, Cerrado e Caatinga (Maranhão e Piauí)",
      "Espécies dominantes: palmeiras de babaçu (amêndoas, óleo, carvão) e carnaúba (cera vegetal)",
      "Quebradeiras de Coco Babaçu: comunidade tradicional de mulheres extrativistas que defendem o manejo comunitário",
      "Lei do Babaçu Livre: legislação municipal/estadual que garante acesso camponês aos babaçuais em terras particulares"
    ],
    "Para o ENEM: a Mata dos Cocais não é um bioma isolado nem um domínio morfoclimático de Ab'Sáber; ela é oficialmente classificada na Geografia como uma 'Faixa de Transição' (ecótono).",
    "No Maranhão e no Piauí, movimentos de Quebradeiras de Coco Babaçu organizam-se em cooperativas comunitárias para defender seus modos de vida e a coleta sustentável dos cocos de palmeiras nativas, reivindicando a aprovação de leis que proíbam fazendeiros de derrubar babaçuais e de erguer cercas elétricas que bloqueiem o trânsito das extrativistas.",
    "A formação biogeográfica brasileira em que se insere o modo de vida tradicional das quebradeiras de coco descritas corresponde à:",
    [
      "Mata das Araucárias de clima subtropical frio.",
      "Vegetação de dunas móveis da restinga sul-rio-grandense.",
      "Floresta boreal de coníferas aciculadas das altas latitudes.",
      "Mata dos Cocais, uma formação de transição dominada por palmeiras extrativistas.",
      "savana estépica de gramíneas limpas do pampa gaúcho."
