      "estatização de todas as oficinas mecânicas e comércios populares por decretos municipais.",
      "erradicação absoluta da pobreza e das desigualdades de renda nos centros metropolitanos."
    ],
    1,
    "Alternativa correta: B. A informalidade em patamares próximos a 40% evidencia a incapacidade estrutural do modelo econômico de absorver a força de trabalho em postos com garantias trabalhistas e previdenciárias formais; esses trabalhadores ficam desprovidos de rede de seguridade em caso de doença, acidente de trabalho ou aposentadoria, acentuando a vulnerabilidade social. As alternativas A, C, D e E trazem conclusões contrárias à realidade."
  ],
  "Biomassa, etanol e biometano": [
    "A bioenergia representa um dos mais sólidos pilares da matriz energética renovável brasileira, alicerçada no pioneirismo do Programa Nacional do Álcool (Proálcool, criado em 1975 após a primeira crise do petróleo) e consolidada a partir de 2003 com a invenção e disseminação dos veículos bicombustíveis (motores flex-fuel, que rodam indistintamente com gasolina ou etanol). A cana-de-açúcar é a principal matéria-prima energética do país: o caldo da cana é fermentado e destilado originando o etanol anidro (misturado à gasolina comercial) e o etanol hidratado (vendido diretamente na bomba de combustível); paralelamente, o bagaço e a palha da cana são queimados em caldeiras industriais para a cogeração de energia termoelétrica renovável, que abastece a própria usina e injeta excedentes bilionários de eletricidade limpa no Sistema Interligado Nacional (SIN) durante o período da seca no Centro-Sul. A fronteira mais recente da bioenergia é a produção de biometano a partir da biodigestão anaeróbia da vinhaça e da torta de filtro da cana e dos dejetos orgânicos da suinocultura e avicultura intensiva, gerando um combustível com poder calorífico idêntico ao gás natural fóssil, mas com pegada de carbono neutra.",
    [
      "Etanol de cana-de-açúcar: biocombustível pioneiro com redução de até 80% das emissões de CO₂ frente à gasolina",
      "Cogeração com bagaço de cana: queima de resíduos da moagem gera vapor e eletricidade para o SIN na safra seca de inverno",
      "Biometano: gás combustível renovável produzido pela purificação do biogás da decomposição de resíduos orgânicos e vinhaça",
      "Carros Flex-Fuel (2003): tecnologia nacional que permite ao consumidor abastecer com qualquer proporção de etanol e gasolina"
    ],
    "Para o ENEM: a bioenergia da cana é renovável e limpa no escapamento do carro, mas sua cadeia produtiva impõe impactos que o ENEM cobra com frequência: avanço da monocultura sobre áreas de produção de alimentos, uso intensivo de água e defensivos e histórico de exploração de trabalhadores rurais temporários (os boias-frias cortadores de cana).",
    "Durante a safra canavieira nos estados de São Paulo e Goiás, as usinas sucroalcooleiras produzem milhões de litros de etanol hidratado para veículos automotores e, simultaneamente, aproveitam a combustão do bagaço fibroso da cana em turbogeradores para injetar eletricidade contínua na rede elétrica nacional.",
    "O aproveitamento energético do bagaço e da palha da cana-de-açúcar descrito no texto constitui um exemplo de:",
    [
      "fissão termonuclear espontânea em reatores de urânio enriquecido.",
      "energia geotérmica produzida pelo resfriamento de magmas vulcânicos do interior da Terra.",
      "extração de petróleo cru pesado na plataforma continental marítima do pré-sal.",
      "despejo in natura de resíduos tóxicos que aniquilam todas as bacias hidrográficas vizinhas.",
      "cogeração de energia a partir da biomassa vegetal, valorizando subprodutos agrícolas e gerando eletricidade renovável."
    ],
    4,
    "Alternativa correta: E. A cogeração a partir do bagaço da cana reaproveita a biomassa residual que sobra após a moagem do caldo, queimando a fibra vegetal em caldeiras que produzem vapor de alta pressão para girar geradores elétricos, abastecendo as instalações industriais e fornecendo energia limpa para a rede pública de eletricidade. As alternativas A, C, D e E trazem outras fontes energéticas sem conexão com a biomassa."
  ],
  "Geração solar distribuída e marco legal da microgeração": [
    "A energia solar fotovoltaica é a fonte de eletricidade que mais cresce na matriz elétrica brasileira, impulsionada pelos excepcionais índices de irradiação solar que incidem sobre o território nacional ao longo do ano inteiro. Essa tecnologia divide-se em dois segmentos: 1) Geração Centralizada: usinas solares de grande porte formadas por milhares de módulos em solo (fazendas solares), concentradas no semiárido do Nordeste e no norte de Minas Gerais, conectadas à rede de transmissão; 2) Geração Distribuída (GD): sistemas fotovoltaicos de microgeração (até 75 kW) e minigeração (até 5 MW) instalados diretamente pelos próprios consumidores em telhados de residências, galpões comerciais e propriedades rurais, regulados pela Resolução Normativa nº 482/2012 da Aneel e consolidados pelo Marco Legal da Micro e Minigeração Distribuída (Lei Federal nº 14.300/2022). Sob esse modelo, a energia solar gerada durante o dia e não consumida de imediato é injetada na rede da concessionária local, gerando 'créditos de energia' que abatem o consumo noturno na fatura, descentralizando a matriz elétrica e reduzindo perdas por transmissão a longas distâncias.",
    [
      "Geração Distribuída (GD): energia gerada pelo próprio consumidor junto ou perto do local de consumo (telhados solares)",
      "Compensação de créditos de energia: excedente diurno injetado na rede vira crédito para abater a conta de luz",
      "Marco Legal da Microgeração (Lei 14.300/2022): segurança jurídica e regras para a transição dos encargos de distribuição",
      "Vantagens: fonte inesgotável e limpa, baixo impacto de área (telhados existentes) e geração sem emissão de gases poluentes"
    ],
    "Para o ENEM: a geração solar distribuída democratiza a energia porque transforma o consumidor tradicional em 'prosumidor' (aquele que consome e produz a sua própria energia elétrica ao mesmo tempo), diminuindo a dependência exclusiva de hidrelétricas em tempos de seca.",
    "O Marco Legal da Micro e Minigeração Distribuída disciplinou o regime de compensação de energia elétrica no Brasil, viabilizando que famílias e comércios instalem placas fotovoltaicas em seus telhados e utilizem a rede elétrica da distribuidora como uma bateria virtual para injetar o excedente gerado ao meio-dia e abater o valor de suas contas mensais.",
    "O impacto socioeconômico e territorial proporcionado pela expansão da microgeração solar distribuída no país consiste no(a):",
    [
      "descentralização da matriz de geração elétrica, redução de perdas na transmissão a longa distância e economia na fatura dos consumidores.",
      "aumento da queima contínua de óleo diesel em termelétricas móveis instaladas em praças públicas.",
      "proibição aos cidadãos comuns de utilizarem aparelhos eletrodomésticos no período noturno.",
      "obrigação legal de que toda placa solar seja fabricada exclusivamente com madeira fóssil do carvão mineral.",
      "fechamento compulsório de todas as redes de saneamento básico em municípios que utilizam energia solar."
    ],
    0,
    "Alternativa correta: A. A geração solar distribuída em telhados produz energia exatamente onde ela é consumida, evitando as perdas de eletricidade que ocorrem ao transportar energia por milhares de quilômetros em linhões de alta tensão de grandes hidrelétricas, além de baratear os custos de energia das famílias e expandir a parcela renovável da matriz sem precisar desmatar novas áreas de solo. As alternativas A, C, D e E trazem formulações descabidas."
  ],
  "Políticas regionais de desenvolvimento: SUDENE e SUDAM": [
    "As disparidades socioeconômicas regionais entre o Centro-Sul dinâmico e as regiões Norte e Nordeste levaram o Estado brasileiro a criar, em meados do século XX, agências de planejamento e desenvolvimento regional para tentar integrar o mercado nacional e desconcentrar a riqueza. Em 1959, sob a liderança intelectual do economista Celso Furtado no governo de Juscelino Kubitschek, foi criada a Superintendência do Desenvolvimento do Nordeste (SUDENE): Furtado diagnosticou que a seca sertaneja era um problema social e fundiário (a 'indústria da seca', que enriquecia latifundiários com verbas públicas emergenciais) e propôs reformas estruturais, incentivos fiscais para industrializar o litoral nordestino e ampliação da produção de alimentos. Em 1966, os governos militares criaram a Superintendência do Desenvolvimento da Amazônia (SUDAM), concedendo incentivos fiscais e créditos subsidiados (via Banco da Amazônia - BASA) para atrair grandes grupos econômicos do Sudeste dispostos a implantar projetos agropecuários e mineradores na floresta, promovendo a abertura de rodovias (Transamazônica, Belém-Brasília) e iniciando o ciclo de desmatamento da Amazônia Legal.",
    [
      "SUDENE (1959): idealizada por Celso Furtado para combater a desigualdade regional e a 'indústria da seca' via industrialização",
      "SUDAM (1966): incentivos fiscais federais para projetos agropecuários e mineração na Amazônia",
      "Indústria da seca: apropriação política de verbas federais de socorro por oligarquias rurais sem resolver a miséria do sertão",
      "Incentivos fiscais (34/18): isenção de impostos de renda corporativos em troca de investimentos fabris no Nordeste e Norte"
    ],
    "Para o ENEM: a SUDENE gerou a criação de indústrias modernas em capitais nordestinas (como Salvador, Recife e Fortaleza), mas não resolveu a pobreza rural do interior porque a estrutura fundiária concentrada e os baixos salários continuaram intactos.",
    "No final da década de 1950, o economista paraibano Celso Furtado elaborou o clássico relatório 'Uma Política de Desenvolvimento Econômico para o Nordeste', demonstrando que a renda per capita nordestina equivalia a menos de um terço da registrada no Centro-Sul, propondo a criação de um órgão federal de planejamento regional que superasse o assistencialismo tradicional.",
    "A concepção teórica e política de Celso Furtado que fundamentou a criação da SUDENE caracterizou-se pela:",
    [
      "distribuição de cestas básicas permanentes sem qualquer tipo de projeto industrial na região.",
      "proibição legal de investimentos estatais em rodovias, ferrovias e escolas técnicas no Nordeste.",
      "defesa de reformas de base, industrialização regional planejada com incentivos fiscais e reestruturação da economia para romper com a exploração oligárquica da seca.",
      "ordem expressa para que toda a população nordestina emigrasse em massa para o Rio de Janeiro.",
      "estatização de todas as padarias e comércios familiares do interior de Pernambuco."
    ],
    2,
    "Alternativa correta: C. Celso Furtado demonstrou que a miséria nordestina não era fatalidade da natureza nem mera falta de chuva, mas sim um problema estrutural de subdesenvolvimento mantido por oligarquias agrárias ('indústria da seca'); a SUDENE nasceu para atrair investimentos industriais modernos, fomentar a infraestrutura energética (usinas do São Francisco como Paulo Afonso) e transformar a economia regional. As alternativas A, C, D e E trazem assertivas que deturpam o pensamento de Furtado."
  ],
  "Povos tradicionais: ribeirinhos, seringueiros e caiçaras": [
    "A sociodiversidade do território brasileiro congrega, para além dos povos indígenas e quilombolas, dezenas de Comunidades Tradicionais: grupos culturalmente diferenciados que se reconhecem como tais, que possuem formas próprias de organização social e que ocupam e usam territórios e recursos naturais como condição para sua reprodução cultural, social, religiosa, ancestral e econômica, utilizando conhecimentos e práticas gerados e transmitidos pela tradição (Decreto Federal nº 6.040/2007). Destacam-se: 1) Ribeirinhos: habitam as margens de rios amazônicos em casas de palafita de madeira, com modo de vida ritmado pela dinâmica sazonal de cheia e vazante das águas, praticando a pesca artesanal, agricultura de várzea e extrativismo de baixo impacto; 2) Seringueiros: comunidades extrativistas da floresta amazônica (com destaque histórico no Acre) que realizam a sangria da Hevea brasiliensis para extração do látex natural e castanha, cuja luta liderada por Chico Mendes gerou o conceito e a criação das Reservas Extrativistas (RESEX); 3) Caiçaras: comunidades tradicionais litorâneas situadas entre o litoral do Paraná, São Paulo e Rio de Janeiro (Mata Atlântica), formadas pela miscigenação de indígenas, europeus e africanos, que vivem da pesca artesanal costeira, agricultura de coivara e manejo florestal tradicional. Todos enfrentam graves ameaças decorrentes da especulação imobiliária, grilagem de terras, pesca predatória industrial e grandes obras de infraestrutura que desrespeitam seu direito à consulta prévia (Convenção 169 da OIT).",
    [
      "Comunidades Tradicionais (Decreto 6.040/2007): povos com modos de vida singulares e manejo ecológico ancestral",
      "Ribeirinhos: palafitas nas margens dos rios da Amazônia, pesca de subsistência e vida regulada pelas cheias",
      "Seringueiros: extrativismo de látex e castanha na Amazônia; legado de Chico Mendes e criação das RESEX",
      "Caiçaras: pescadores artesanais tradicionais do litoral sudeste sob as encostas da Mata Atlântica",
      "Convenção 169 da OIT: direito obrigatório à consulta prévia, livre, informada e de boa-fé antes de obras em suas terras"
    ],
    "Para a redação e para a prova de Humanas do ENEM: povos e comunidades tradicionais não são 'obstáculos ao progresso'; pelo contrário, são os maiores guardiões da floresta em pé e da biodiversidade brasileira, conservando a natureza sem destruir a sua base ecológica.",
    "Na Reserva Extrativista Chico Mendes, no Acre, famílias de seringueiros e castanheiros exercem o manejo comunitário da floresta em pé, extraindo látex de seringueiras nativas e coletando ouriços de castanha-da-amazônia, combinando a geração de renda local com a conservação integral da biodiversidade amazônica.",
    "O instrumento territorial instituído no ordenamento ambiental brasileiro que viabiliza legalmente a permanência e a exploração sustentável dos recursos florestais por essas populações é a:",
    [
      "Estação Ecológica intangível com proibição de qualquer presença humana.",
      "plantação de monoculturas florestais de pinus exótico financiada por bancos internacionais.",
      "concessão minerária perpétua concedida a multinacionais mineradoras estrangeiras.",
      "Reserva Biológica de proteção integral onde se proíbe a coleta de sementes e frutos nativos.",
      "Reserva Extrativista (RESEX), uma Unidade de Conservação de Uso Sustentável onde a posse da terra é coletiva e pública."
    ],
    4,
    "Alternativa correta: E. As Reservas Extrativistas (RESEX) são unidades do Sistema Nacional de Unidades de Conservação (SNUC) criadas a partir das lutas do movimento dos seringueiros; a terra permanece sob domínio público da União, mas a concessão de uso e usufruto dos recursos é outorgada coletivamente às populações tradicionais extrativistas, garantindo a floresta preservada. As alternativas A e D são unidades de proteção integral onde a moradia humana é proibida. As alternativas C e E trazem atividades destrutivas."
  ],
  "Conflitos na África Subsaariana e herança colonial": [
    "A instabilidade geopolítica e os conflitos armados crônicos em diversos países da África Subsaariana (como na República Democrática do Congo, Sudão, Sudão do Sul, Nigéria e Ruanda) têm raízes históricas profundas na partilha imperialista do continente europeu durante a Conferência de Berlim (1884-1885). As potências coloniais europeias (Reino Unido, França, Bélgica, Alemanha, Portugal) desenharam as fronteiras dos países africanos utilizando réguas geométricas e meridianos abstratos ('fronteiras artificiais'), sem qualquer consideração pela história, idiomas, etnias e lealdades dos povos nativos. Esse processo compeliu grupos étnicos com rivalidades históricas ancestrais a conviverem confinados no interior do mesmo território estatal (como tutsis e hutus em Ruanda, resultando no trágico genocídio de 1994) e fraturou povos com a mesma identidade cultural entre dois ou mais Estados distintos. No pós-independência (a partir dos anos 1960), governos autocráticos herdaram essas fronteiras arbitrárias; a disputa pelo controle de governos centrais corruptos e pela apropriação predatória de recursos minerais valiosos de alto interesse das transnacionais ocidentais e asiáticas (diamantes de sangue, ouro, petróleo e coltan — mineral indispensável para capacitores de celulares e baterias) alimenta milícias armadas, tráfico de armas e graves crises humanitárias de refugiados.",
    [
      "Conferência de Berlim (1884-1885): partilha imperialista da África pelas potências europeias que traçou fronteiras artificiais",
      "Fronteiras artificiais: união forçada de etnias rivais no mesmo Estado e divisão de povos irmãos em países diferentes",
      "Genocídio de Ruanda (1994): massacre de cerca de 800 mil tutsis por extremistas hutus, derivado da segregação colonial belga",
      "Coltan e minerais de sangue na RDC: mineração ilegal de tântalo e columbita financia milícias violentas na África Central"
    ],
    "Para o ENEM: os conflitos e a pobreza em países da África Subsaariana não decorrem de 'inferioridade' nem de suposto 'atraso cultural natural'; são o resultado trágico e direto da espoliação colonial imperialista europeia, que destruiu as sociedades nativas e deixou Estados fragmentados e dependentes de exportar minérios.",
    "Na República Democrática do Congo, no coração da África Central, milícias armadas disputam com violência o controle de minas artesanais de coltan (mistura de columbita e tantalita), mineral crítico utilizado na indústria eletrônica global para a fabricação de capacitores de microcomputadores e celulares comercializados em todo o mundo.",
    "A raiz histórica e geopolítica fundamental que perpetua a instabilidade institucional, os golpes de Estado e as guerras civis multiétnicas na África Subsaariana contemporânea apoia-se no(a):",
    [
      "traçado artificial das fronteiras coloniais imposto pelas potências europeias na Conferência de Berlim, que reuniu etnias rivais no mesmo Estado e fragmentou nações nativas.",
      "proibição legal de exportação de qualquer mercadoria africana pelos portos do Oceano Índico.",
      "ausência completa de recursos minerais, florestais ou energéticos em todo o subsolo do continente africano.",
      "congelamento perene dos solos da bacia do Rio Congo provocado por invernos glaciais rigorosos.",
      "adesão unânime e pacífica de todos os países africanos a uma monarquia parlamentar unificada."
    ],
    1,
    "Alternativa correta: B. A partilha da África em Berlim impôs limites territoriais exógenos aos povos africanos com base estrita no interesse colonial europeu de escoar matérias-primas; ao conquistarem a independência nas décadas de 1960/70, os novos Estados herdaram essas fronteiras artificiais sem coesão nacional, gerando disputas étnicas armadas pelo poder e pelo saque dos recursos minerais. As alternativas A, C, D e E trazem fatos históricos ou geográficos comprovadamente errados."
  ],
  "O Canal de Suez e as rotas marítimas no Mar Vermelho": [
    "O Canal de Suez é uma das vias navegáveis mais estratégicas e movimentadas da geopolítica mundial, inaugurado em 1869 no território do Egito para conectar diretamente o Mar Mediterrâneo ao Mar Vermelho. O canal possui cerca de 193 km de extensão em nível do mar (sem eclusas) e transformou o comércio mundial: eliminou a necessidade de os navios circum-navegarem todo o continente africano pelo Cabo da Boa Esperança, encurtando em mais de 7.000 a 9.000 km e em cerca de duas semanas o trajeto marítimo entre a Europa e a Ásia. Por Suez transita cerca de 12% a 15% de todo o comércio marítimo global e mais de 20% do tráfego de navios porta-contêineres, além de fluxos vitais de petróleo cru do Golfo Pérsico e gás natural liquefeito do Catar. A vulnerabilidade dessa rota manifesta-se em crises geopolíticas: no final de 2023 e em 2024, ataques de rebeldes houthis do Iêmen no Estreito de Babelmândebe (a entrada sul do Mar Vermelho) forçaram as maiores companhias mundiais de navegação a desviar navios pelo sul da África, elevando as taxas de frete marítimo, atrasando a entrega de eletrônicos e pressionando a inflação global de mercadorias.",
    [
      "Canal de Suez (Egito, 1869): conecta o Mar Mediterrâneo ao Mar Vermelho (rota mais curta Europa ➔ Ásia)",
      "Estreito de Babelmândebe ('Porta das Lágrimas'): gargalo marítimo de entrada sul no Mar Vermelho fronteiriço com o Iêmen",
      "Chokepoint estratégico: cerca de 12% do comércio mundial em contêineres e hidrocarbonetos atravessam o canal",
      "Impacto de bloqueios: desvio pelo Cabo da Boa Esperança soma 14 dias de navegação, consome mais combustível e encarece fretes globais"
    ],
    "Para o ENEM: Suez e Babelmândebe são o clássico exemplo de 'chokepoint' (estrangulamento geográfico): uma passagem estreita onde qualquer míssil ou navio encalhado (como o Ever Given em 2021) é capaz de travar a economia global e elevar o preço das coisas nas prateleiras dos supermercados.",
    "Ataques com drones e mísseis lançados a partir do litoral do Iêmen contra navios cargueiros no Estreito de Babelmândebe obrigaram as principais armadoras mundiais de navios porta-contêineres a suspender o trânsito pelo Mar Vermelho e pelo Canal de Suez, desviando frotas mercantes para contornar a ponta sul do continente africano pelo Cabo da Boa Esperança.",
    "A principal consequência logística e econômica internacional provocada pelo desvio forçado do tráfego marítimo para a rota africana mais longa consiste no(a):",
    [
      "aumento expressivo dos prazos de entrega e elevação das tarifas de frete marítimo internacional e do consumo de combustível.",
      "congelamento perpétuo das águas salgadas tropicais do Oceano Índico meridional.",
      "proibição aos navios de descarregarem matérias-primas nos terminais portuários da Europa Ocidental.",
      "redução definitiva dos custos globais de transporte de mercadorias em mais de 90%.",
      "estatização de todas as embarcações mercantes privadas por tribunais egípcios."
    ],
    3,
    "Alternativa correta: D. Ao abandonar o atalho estratégico de Suez e contornar a África pelo Cabo da Boa Esperança, os navios mercantes viajam cerca de duas semanas a mais, queimando milhares de toneladas adicionais de óleo combustível (bunker), elevando o custo dos seguros de carga e encarecendo os fretes internacionais, gerando pressões inflacionárias sobre os produtos de consumo global. As alternativas A, C, D e E trazem assertivas que contrariam a lógica econômica do transporte marítimo."
  ],
  "O conceito de ciberespaço e territorialidades virtuais": [
    "No contexto da globalização informacional e da revolução digital contemporânea, o espaço geográfico expandiu-se para além da sua materialidade física estrita através da emergência do ciberespaço: o meio de comunicação e interação desterritorializado estruturado pela interconexão mundial de computadores, servidores, antenas de telecomunicação, constelações de satélites e cabos submarinos de fibra óptica. Conceituado por teóricos como Pierre Lévy e Manuel Castells (o 'espaço de fluxos'), o ciberespaço não elimina o espaço geográfico real, mas sobrepõe-se a ele, reconfigurando as relações de poder, as identidades culturais e o trabalho através das 'territorialidades virtuais'. Nessas redes digitais operam os novos atores hegemônicos do capitalismo (as 'Big Techs': corporações multinacionais de tecnologia que controlam redes sociais, motores de busca, dados de navegação e algoritmos preditivos). A soberania digital tornou-se uma questão geopolítica de primeira grandeza: governos disputam o controle sobre o fluxo e armazenamento de dados de seus cidadãos (leis de proteção de dados como a LGPD no Brasil e o RGPD na Europa), censura digital ('A Grande Muralha Digital' da China) e enfrentam ataques cibernéticos a infraestruturas críticas (redes de energia, bancos e sistemas eleitorais).",
    [
      "Ciberespaço: meio de comunicação e troca informacional virtual suportado por infraestrutura técnica física de cabos e servidores",
      "Espaço de fluxos (Castells): simultaneidade e conexões virtuais em rede que redefinem o tempo e o espaço",
      "Territorialidades virtuais: disputas de poder, controle de dados de usuários e influência algorítmica por Big Techs",
      "Soberania de dados e ciberguerra: ataques cibernéticos contra infraestruturas essenciais (redes elétricas, hospitais, eleições)"
    ],
    "Para a redação e para a prova de Humanas do ENEM: o ciberespaço parece uma 'nuvem imaterial e livre', mas ele é profundamente material e vigiado: depende de cabos de fibra de vidro estendidos no fundo do mar, queima muita eletricidade em centros de dados poluentes e é monopolizado por poucas corporações que monetizam os dados da nossa atenção diária.",
    "Na obra 'A Sociedade em Rede', o sociólogo Manuel Castells afirma que a revolução da tecnologia da informação e a reestruturação do capitalismo induziram uma nova forma espacial: o 'espaço de fluxos', que conecta lugares fisicamente distantes em tempo real, subordinando as lógicas territoriais locais às decisões de corporações transnacionais.",
    "A caracterização geográfica correta do ciberespaço e das redes digitais na contemporaneidade estabelece que essas estruturas:",
    [
      "eliminam totalmente qualquer dependência de objetos materiais físicos, cabos de fibra óptica ou antenas territoriais.",
      "operam exclusivamente a partir de sinais de rádio analógicos emitidos por cavernas de minério de ferro.",
      "sobrepõem-se ao espaço geográfico físico, reconfigurando fluxos e relações de poder através de infraestruturas técnicas materiais controladas por grandes corporações e Estados.",
      "garantem a distribuição perfeitamente equitativa de renda e computadores a todos os camponeses do planeta.",
      "são controladas de modo autônomo e exclusivo por pescadores artesanais de comunidades caiçaras."
    ],
    2,
    "Alternativa correta: C. O ciberespaço não flutua no ar como algo puramente mágico ou imaterial; ele está alicerçado em uma pesada infraestrutura física territorial (servidores, cabos de fibra submarinos, satélites, usinas de energia) gerida por corporações transnacionais e governos que exercem poder, vigilância e acumulação de capital sobre as informações de bilhões de usuários. As alternativas A, C, D e E trazem formulações distorcidas."
  ],
  "Trabalho e a transformação da natureza em espaço geográfico": [
    "O espaço geográfico é o objeto central de estudo da ciência geográfica, definido classicamente como a natureza transformada, modificada e produzida continuamente pelo trabalho humano ao longo do processo histórico de reprodução social. Antes da intervenção antrópica, existia a 'natureza primeira' (o ambiente biofísico intocado, com suas leis biológicas e ecológicas primitivas). Pelo trabalho mediado pelas técnicas e ferramentas (da pedra lascada à inteligência artificial), a sociedade apropria-se dos elementos naturais, transforma florestas em lavouras, aplaina morros para construir cidades, canaliza rios para gerar energia e cobre a terra com redes de asfalto e fibras de vidro, instituindo a 'segunda natureza' (o espaço geográfico socializado e artificializado). O geógrafo Milton Santos enfatizava que o espaço geográfico é um 'híbrido indissociável de sistemas de objetos (casas, ruas, fábricas, represas) e sistemas de ações (leis, relações de trabalho, fluxos de capitais, compras e vivências humanas)', não sendo um mero palco passivo, mas um fator ativo das relações sociais que espelha as desigualdades de classe da sociedade que o produz.",
    [
      "Espaço Geográfico: produto social da relação dialética entre natureza e trabalho humano",
      "Natureza primeira: ambiente natural primitivo sem alteração antrópica direta",
      "Segunda natureza: ambiente artificializado e transformado pela técnica e trabalho acumulado",
      "Sistemas de objetos e sistemas de ações (Milton Santos): objetos técnicos imóveis associados aos movimentos humanos cotidianos"
    ],
    "Para o ENEM: a paisagem que vemos pela janela (mesmo um parque com árvores ou uma plantação de soja) não é 'natureza pura'; ela é quase sempre espaço geográfico, resultado de árvores plantadas por mãos humanas, terra arada e tecnologia acumulada pela sociedade.",
    "Ao refletir sobre a ontologia do espaço geográfico, o geógrafo Milton Santos destacou que o espaço não é uma coisa ou um palco estático onde as coisas acontecem, mas sim um conjunto indissociável de sistemas de objetos e sistemas de ações que resulta do trabalho social transformador sobre a natureza ao longo da história.",
    "A passagem do meio biofísico primitivo ('natureza primeira') para a configuração do 'espaço geográfico' consuma-se primordialmente por meio do(a):",
    [
      "paralisação de todas as atividades produtivas humanas para contemplação mística da vegetação.",
      "resfriamento glacial instantâneo dos continentes que extingue todas as cidades construídas.",
      "trabalho humano mediado pelo desenvolvimento das técnicas e pela organização socioeconômica da sociedade ao longo do tempo.",
      "deslocamento aleatório de placas tectônicas sem qualquer interferência da ação antrópica.",
      "proibição legal de fabricação de ferramentas mecânicas por conselhos municipais de meio ambiente."
    ],
    2,
    "Alternativa correta: C. O espaço geográfico é a materialização do trabalho social acumulado sobre a natureza; através da técnica, a humanidade apropria-se do solo, das águas e dos minerais para suprir suas necessidades materiais e de reprodução cultural, construindo cidades, campos e redes de transporte que expressam a história de cada formação socioespacial. As alternativas A, C, D e E trazem formulações incoerentes com o método e a epistemologia geográfica."
  ],
  "Ilhas de plástico oceânicas e microplásticos marinhos": [
    "A poluição por plásticos tornou-se uma das crises ambientais marinhas mais graves do Antropoceno, com o acúmulo de milhões de toneladas de resíduos sintéticos nos giros oceânicos subtropicais do planeta, formando as chamadas 'ilhas de plástico' (como a Grande Mancha de Lixo do Pacífico). Pela ação mecânica das ondas e pela degradação fotoquímica causada pela radiação ultravioleta do sol, o plástico macroscópico fragmenta-se em partículas milimétricas ou microscópicas denominadas microplásticos (diâmetro inferior a 5 mm). Esses microplásticos adsorvem poluentes químicos hidrofóbicos persistentes (como PCBs, dioxinas e pesticidas agrícolas), são ingeridos acidentalmente pelo zooplâncton, peixes, tartarugas e aves marinhas, e desencadeiam o processo de bioacumulação e biomagnificação trófica ao longo de toda a teia alimentar marinha, atingindo o organismo humano através do consumo de frutos do mar e sal.",
    [
      "Microplásticos: fragmentos plásticos menores que 5 mm gerados pela fragmentação fotomecânica no oceano",
      "Giros oceânicos: correntes marinhas circulares subtropicais que aprisionam lixo flutuante no centro",
      "Biomagnificação trófica: aumento progressivo da concentração de substâncias tóxicas nos níveis tróficos superiores",
      "Adsorção de poluentes: partículas plásticas atraem e concentram pesticidas e metais pesados nas águas marinhas"
    ],
    "Para o ENEM: microplásticos não desaparecem; o plástico não se biodegrada em escala humana, ele apenas se fragmenta em pedaços cada vez menores que entram na célula dos seres vivos através da cadeia alimentar marinha.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Dinamica da Poluição por Microplásticos</text><rect x='20' y='45' width='80' height='30' fill='#2F5BFF' rx='5'/><text x='25' y='64' font-size='9' fill='#fff' font-weight='700'>Lixo Urbano/Rios</text><text x='105' y='65' font-size='14' fill='var(--tx)'>➔</text><rect x='125' y='45' width='80' height='30' fill='#5B6785' rx='5'/><text x='130' y='64' font-size='9' fill='#fff' font-weight='700'>Giro Oceânico</text><text x='210' y='65' font-size='14' fill='var(--tx)'>➔</text><rect x='230' y='45' width='75' height='30' fill='#D12D20' rx='5'/><text x='235' y='64' font-size='9' fill='#fff' font-weight='700'>Cadeia Trófica</text><text x='25' y='110' font-size='9' fill='var(--tx)'>Fragmentação fotoquímica (UV) ➔ Partículas &lt; 5 mm ➔ Ingestão</text><text x='25' y='130' font-size='9' fill='#D12D20' font-weight='700'>Biomagnificação: acúmulo progressivo de toxinas até o topo da teia</text></svg>Pesquisadores da Organização das Nações Unidas para a Alimentação e a Agricultura (FAO) identificaram a presença de partículas sintéticas menores que 5 milímetros no trato digestório de mais de 70% das espécies de peixes comerciais analisadas no Atlântico Sul, constatando a transferência de substâncias tóxicas persistentes adsorvidas pelos polímeros para os tecidos musculares dos animais marinhos.",
    "O impacto ecológico mais danoso provocado pela dispersão e fragmentação desses materiais nos ambientes oceânicos decorre do fato de que eles:",
    [
      "aumentam a taxa de oxigenação da água nas fossas abissais oceânicas profundas.",
      "transformam o sal marinho em carbonato de cálcio puro sem qualquer risco biológico.",
      "neutralizam as correntes oceânicas quentes e provocam o congelamento das praias tropicais.",
      "promovem o crescimento acelerado de recifes de corais em altas latitudes árticas.",
      "são ingeridos pela fauna aquática e introduzem compostos tóxicos na teia trófica marinha por biomagnificação."
    ],
    4,
    "Alternativa correta: E. Os microplásticos afetam a base das cadeias alimentares marinhas (como zooplâncton e pequenos peixes), liberando e concentrando aditivos químicos danosos e compostos tóxicos persistentes que se acumulam em doses crescentes nos predadores de topo (biomagnificação), impactando inclusive a saúde humana. As alternativas A, C, D e E trazem formulações cientificamente absurdas."
  ],
  "Crise climática e refugiados ambientais": [
    "O agravamento do aquecimento global e a maior frequência de eventos climáticos extremos têm impulsionado a mobilidade humana forçada, gerando o contingente dos chamados 'refugiados ambientais' ou migrantes climáticos. Populações inteiras em atóis do Oceano Pacífico (como Tuvalu e Kiribati) enfrentam a submersão iminente de seus territórios nacionais pela elevação do nível médio dos mares; no Sahel africano e no Chifre da África, secas plurianuais catastróficas destroem a agricultura de subsistência e desencadeiam fome e conflitos intercomunitários; na América Central e no Caribe, furacões devastadores sucessivos destroem cidades inteiras. O grande dilema humanitário e jurídico reside no fato de que o Estatuto dos Refugiados da ONU (Convenção de Genebra de 1951) não reconhece a degradação ambiental ou o desastre ecológico como motivo formal de refúgio, reconhecendo apenas perseguição política, étnica, religiosa ou de gênero, o que deixa milhões de migrantes climáticos em situação de desproteção internacional e vulnerabilidade legal.",
    [
      "Refugiados ambientais: populações forçadas a migrar em razão de desastres ecológicos e mudanças climáticas",
      "Convenção de Genebra de 1951: estatuto que NÃO inclui motivos ecológicos/climáticos na concessão formal de refúgio",
      "Países insulares em risco: atóis do Pacífico (Tuvalu, Kiribati) ameaçados de desaparecimento físico total",
      "Deslocamento interno: a maioria dos migrantes climáticos desloca-se dentro das fronteiras de seus próprios países"
    ],
    "Para o ENEM: a ONU ainda não dá visto oficial de 'refugiado' para quem foge da seca ou do furacão; no papel eles são apenas migrantes forçados sem status de refúgio diplomático, um dos maiores desafios do direito internacional contemporâneo.",
    "Relatório do Banco Mundial (Groundswell) estima que, até 2050, mais de 216 milhões de pessoas poderão ser forçadas a migrar dentro de seus próprios países e através de fronteiras devido à escassez hídrica crônica, quebra sistemática de safras e elevação das marés sobre deltas densamente povoados.",
    "A principal contradição jurídica internacional enfrentada pelas populações compelidas a abandonar suas terras natais em decorrência do colapso ecológico consiste na:",
    [
      "obrigatoriedade de retorno imediato aos locais inundados por ordem do Tribunal Penal Internacional.",
      "proibição estrita de migração interna de famílias rurais para centros urbanos do mesmo país.",
      "imposição de serviço militar forçado em bases de pesquisa científica na Antártida.",
      "inexistência de previsão legal do motivo ambiental nos tratados internacionais clássicos de refúgio, privando os migrantes de proteção jurídica formal garantida.",
      "concessão compulsória de cidadania diplomática e passaporte perpétuo em todas as nações ocidentais."
    ],
    3,
    "Alternativa correta: D. A Convenção de 1951 sobre o Estatuto dos Refugiados foi elaborada no pós-Segunda Guerra e protege indivíduos perseguidos por raça, religião, nacionalidade, grupo social ou opiniões políticas. Desastres ecológicos e secas severas não constam dessa definição clássica, o que impede que essas populações requeiram formalmente asilo como 'refugiados' nos termos do direito internacional. As alternativas A, C, D e E trazem alegações infundadas."
  ],
  "Desmetropolização e cidades médias no Brasil": [
    "A dinâmica do processo de urbanização brasileiro nas últimas décadas foi marcada pelo fenômeno da desmetropolização relativa: enquanto as grandes metrópoles nacionais e pioneiras (como São Paulo e Rio de Janeiro) registraram desaceleração ou estagnação nas suas taxas de crescimento populacional e na geração de empregos industriais, as cidades médias (municípios com população entre 100 mil e 500 mil habitantes, localizadas sobretudo no interior paulista, sul de Minas, Paraná, Santa Catarina e eixos do agronegócio no Centro-Oeste) tornaram-se os principais polos de atração demográfica e de expansão econômica do país. Esse movimento decorre das chamadas 'deseconomias de aglomeração' das grandes capitais (custo estratosférico da terra, trânsito congestionado, violência urbana e elevados tributos municipais) combinadas com incentivos fiscais e melhor qualidade de vida oferecida pelos centros médios do interior, impulsionando fluxos de migração de retorno e interiorização produtiva.",
    [
      "Deseconomias de aglomeração: trânsito caótico, solo caro, poluição e tributos altos que expulsam fábricas das metrópoles",
      "Cidades médias (100k a 500k hab): principais vetores de atração de investimentos e migração no Brasil atual",
      "Migração de retorno: trabalhadores que saem das metrópoles saturadas de volta às suas regiões ou cidades do interior",
      "Interiorização: dispersão industrial e de serviços modernos conectada ao agronegócio e rodovias expressas"
    ],
    "Para o ENEM: desmetropolização não significa que São Paulo ou Rio estão encolhendo em tamanho absoluto de prédios; significa que a sua velocidade de crescimento diminuiu e as cidades do interior estão crescendo muito mais rápido em termos proporcionais.",
    "O Censo Demográfico do IBGE revelou que os municípios brasileiros com população entre 100 mil e 500 mil habitantes apresentaram taxas de crescimento demográfico médio anuais sistematicamente superiores às registradas pelas capitais de regiões metropolitanas históricas, acompanhadas de atração de plantas fabris e redes de ensino superior privadas.",
    "O fator socioespacial e econômico preponderante que impulsiona a interiorização demográfica e o dinamismo das cidades médias brasileiras é o(a):",
    [
      "isolamento geográfico deliberado que impede a conexão desses municípios com rodovias nacionais.",
      "impacto das deseconomias de aglomeração nas metrópoles combinado ao menor custo do solo e incentivos nas cidades do interior.",
      "esgotamento integral da energia elétrica nas capitais litorâneas por falta de linhas de transmissão.",
      "decreto governamental que tornou ilegal a residência de trabalhadores assalariados nas capitais.",
      "retorno das cidades médias ao modelo econômico agrário de subsistência feudal sem uso de moeda."
    ],
    1,
    "Alternativa correta: B. As metrópoles históricas sofrem com custos imobiliários abusivos, salários inflacionados pela caristia urbana, poluição e congestionamentos crônicos (deseconomias de aglomeração). Isso motiva empresas e trabalhadores qualificados a migrarem para cidades médias do interior, dotadas de boa infraestrutura viária, menor custo de instalação e melhor índice de qualidade de vida. As alternativas A, C, D e E trazem hipóteses sem fundamento."
  ],
  "Movimentos pendulares e cidades-dormitório": [
    "Nas regiões metropolitanas contemporâneas, a segregação socioespacial e a disparidade entre a localização dos postos de trabalho e as áreas de moradia acessíveis geraram a intensificação dos movimentos pendulares (ou migração pendular): o deslocamento diário regular de ida e volta que trabalhadores e estudantes realizam entre o município onde residem e o município polo onde trabalham ou estudam. Esse padrão territorial gerou a proliferação das 'cidades-dormitório' (como Nova Iguaçu e Belford Roxo no Rio de Janeiro, Osasco e Carapicuíba em São Paulo, ou Alvorada e Viamão em Porto Alegre): municípios periféricos que oferecem moradia a preços mais baixos, mas possuem arrecadação fiscal tributária deficiente e escassez de empregos locais, funcionando essencialmente como abrigo noturno de uma massa trabalhadora que passa horas diárias confinada em trens, metrôs e ônibus metropolitanos superlotados.",
    [
      "Movimento pendular: deslocamento diário regular de ida e volta entre municípios metropolitanos por trabalho/estudo",
      "Cidade-dormitório: município periférico com baixa geração de empregos locais e alta dependência do polo metropolitano",
      "Mobilidade urbana precarizada: tempo excessivo gasto em trânsito gera estresse e esgotamento da força de trabalho",
      "Segregação espacial: o centro concentra as oportunidades econômicas e a periferia metropolitana absorve a moradia barata"
    ],
    "Para o ENEM: movimento pendular NÃO é migração definitiva! A pessoa não muda de casa; ela vai de manhã trabalhar na metrópole e volta à noite para dormir no seu município, repetindo o trajeto como o pêndulo de um relógio de parede.",
    "Levantamento do IPEA sobre mobilidade urbana nas metrópoles brasileiras constatou que trabalhadores residentes em municípios periféricos conurbados chegam a despender mais de quatro horas diárias no transporte público coletivo para cumprir jornadas de trabalho no município polo central.",
    "A configuração das chamadas cidades-dormitório e a intensidade dos movimentos pendulares descritos decorrem essencialmente da:",
    [
      "concentração das atividades econômicas e postos de trabalho qualificados no núcleo central e segregação da moradia acessível nas franjas metropolitanas.",
      "distribuição homogênea e equitativa de empregos e empresas por todos os bairros da região metropolitana.",
      "proibição do uso de transportes ferroviários para travessia de divisas intermunicipais.",
      "ausência completa de transporte público automotivo rodoviário nos estados brasileiros.",
      "eliminação da divisão social do trabalho nas capitais desenvolvidas do país."
    ],
    0,
    "Alternativa correta: A. A lógica especulativa do solo urbano empurra os trabalhadores de menor poder aquisitivo para municípios vizinhos distantes (cidades-dormitório), enquanto o centro metropolitano monopoliza os empregos formais, os serviços médicos e a vida cultural, forçando deslocamentos pendulares diários extenuantes. As alternativas A, C, D e E contradizem a realidade metropolitana."
  ],
  "Grilagem de terras públicas e conflitos fundiários": [
    "A grilagem de terras é uma prática histórica e criminosa de apropriação ilegal, fraudulenta e violenta de terras públicas devolutas e de áreas de preservação ou uso tradicional no Brasil. O termo remonta ao artifício arcaico de colocar títulos de posse falsificados dentro de uma caixa com grilos para que as fezes e o ácido emitidos pelos insetos dessem ao papel um aspecto envelhecido e amarelado, conferindo falsa aparência de documento secular. Na fronteira agrícola contemporânea da Amazônia e do Cerrado, a grilagem opera através de consórcios criminosos: madeireiros e grileiros invadem florestas públicas não destinadas ou reservas extrativistas, desmatam a vegetação nativa com correntões, queimam a madeira de menor valor, realizam cadastros fraudulentos no Sistema de Cadastro Ambiental Rural (CAR) e colocam gado para simular posse consolidada ('pecuária de ocupação'), expulsando e ameaçando posseiros camponeses, ribeirinhos e indígenas por meio de pistoleiros particulares.",
    [
      "Grilagem de terras: apropriação criminosa e falsificação documental de terras públicas e comunitárias",
      "Origem do termo: envelhecimento artificial de escrituras forjadas em caixas com grilos",
      "Fraude no CAR: sobreposição indevida de cadastros privados sobre florestas públicas e terras indígenas",
      "Pecuária de ocupação: colocação de gado em área recém-desmatada para fingir atividade produtiva consolidada"
    ],
    "Para o ENEM: a pecuária na fronteira amazônica não tem como único objetivo vender carne no açougue; muitas vezes o boi é só uma 'cerca viva' colocada pelo grileiro para justificar a posse ilegal da terra pública desmatada e revender o lote por milhões no mercado imobiliário rural.",
    "Relatório da Comissão Pastoral da Terra (CPT) sobre conflitos no campo registrou que mais de 80% dos assassinatos de lideranças rurais, indígenas e extrativistas na Amazônia Legal ocorreram em áreas públicas não destinadas disputadas por consórcios ilegais de grilagem associados à extração predatória de madeira e pecuária especulativa.",
    "A prática da grilagem nas áreas de expansão da fronteira agrícola fundamenta-se principalmente na:",
    [
      "compra legalizada de terras privadas com escritura registrada em cartório mediante pagamento de impostos devidos.",
      "criação compulsória de parques ecológicos federais intangíveis para pesquisa científica pura.",
      "distribuição gratuita de títulos de terra do INCRA para camponeses sem-terra e cooperativas comunitárias.",
      "ocupação violenta e fraudulenta de patrimônio público fundiário combinada à falsificação de cadastros e expulsão de comunidades tradicionais.",
      "restituição integral dos territórios ancestrais aos povos indígenas originários sem indenização financeira."
    ],
    3,
    "Alternativa correta: D. A grilagem é uma fraude fundiária na qual criminosos apropriam-se de florestas e terras devolutas da União e dos estados mediante violência, intimidação armada e falsificação de certidões cartoriais, lucrando com a especulação imobiliária rural após o desmatamento criminoso. As alternativas A, C, D e E descrevem procedimentos legais ou opostos à grilagem."
  ],
  "Agrotóxicos e contaminação de bacias hidrográficas": [
    "O Brasil consolidou-se como um dos maiores consumidores mundiais de defensivos agrícolas químicos (agrotóxicos ou pesticidas), impulsionado pela escala monumental de suas monoculturas de exportação de soja, milho, algodão e cana-de-açúcar. A aplicação massiva desses agentes químicos sintéticos por pulverização aérea com aviões agrícolas ou por tratores pulverizadores gera o fenômeno da 'deriva': parte expressiva do veneno é carreada pelo vento para fora das lavouras-alvo, atingindo assentamentos rurais, escolas do campo e rios vizinhos. Pelo processo de lixiviação e escoamento superficial pluvial durante as chuvas, compostos organoclorados, organofosforados e herbicidas sistêmicos (como o glifosato e a atrazina) infiltram-se nos solos e atingem o lençol freático e os cursos d'água das bacias hidrográficas, causando a mortandade em massa de polinizadores (especialmente abelhas nativas), desregulação endócrina na fauna aquática e intoxicações agudas e crônicas em trabalhadores rurais e populações que consomem a água das torneiras.",
    [
      "Agrotóxicos (defensivos químicos): inseticidas, herbicidas e fungicidas sintéticos aplicados em larga escala",
      "Deriva de pulverização: arraste do defensivo pelo vento para além dos limites da lavoura pulverizada",
      "Lixiviação e contaminação hídrica: penetração dos produtos químicos no lençol freático e escoamento para rios",
      "Impacto nos polinizadores: desaparecimento e morte em massa de abelhas provocada por pesticidas neonicotinoides"
    ],
    "Para o ENEM: a contaminação por agrotóxicos não atinge apenas o trabalhador do campo; os resíduos químicos descem os rios, acumulam-se nos peixes e chegam à mesa das cidades através da água encanada e dos alimentos processados.",
    "Análises laboratoriais do Ministério da Saúde no âmbito do Programa de Vigilância da Qualidade da Água (Sisagua) identificaram a presença simultânea de resíduos de múltiplos agrotóxicos — incluindo substâncias banidas na União Europeia por riscos cancerígenos — na água tratada distribuída em centenas de municípios agrícolas do Centro-Oeste e Sul do país.",

      "escoamento superficial provocado pelas chuvas e a lixiviação através do perfil de solo em direção aos aquíferos e cursos fluviais.",

  ],
  "Protecionismo comercial e subsídios agrícolas no Norte Global": [
    "Apesar da retórica do livre mercado e da liberalização comercial propalada por organismos como a OMC e governos das potências centrais durante a globalização, os países do Norte Global (destacando-se os Estados Unidos através da 'Farm Bill' e a União Europeia mediante a Política Agrícola Comum - PAC) praticam um severo e persistente protecionismo agrário. Esses governos repassam centenas de bilhões de dólares anuais em subsídios diretos e incentivos fiscais aos seus próprios produtores rurais, reduzindo artificialmente os custos da safra doméstica. Além disso, erguem sofisticadas barreiras não-tarifárias (fitossanitárias, técnicas e ambientais rigorosas) para restringir a entrada de alimentos provenientes de nações do Sul Global. Essa distorção estrutural gera uma concorrência desleal no mercado internacional: alimentos subsidiados das potências ricas são despejados a preços aviltados nos países pobres (prática de 'dumping'), desestruturando as economias camponesas locais da África, Ásia e América Latina que não têm como competir com os tesouros estatais de Washington e Bruxelas.",
    [
      "PAC europeia e Farm Bill norte-americana: gigantescos programas estatais de subsídios a fazendeiros ricos",
      "Barreiras tarifárias vs não-tarifárias: taxas alfandegárias diretas contra exigências fitossanitárias e ecológicas protecionistas",
      "Dumping agrícola: venda internacional de commodities a preços artificiais abaixo do custo real de produção",
      "Contradição da globalização: liberalismo exigido para manufaturados do Norte e protecionismo mantido para o agro do Norte"
    ],
    "Para o ENEM: os países ricos cobram que o Brasil abra seus mercados para os carros e remédios deles, mas fecham suas fronteiras com cotas e barreiras sanitárias quando o assunto é açúcar, carne, etanol e frango brasileiro.",
    "Durante conferências ministeriais da Organização Mundial do Comércio (OMC), delegações de países em desenvolvimento integrantes do G20 Comercial protestaram formalmente contra os desembolsos de centenas de bilhões de dólares transferidos pelos tesouros da União Europeia e dos EUA aos seus agropecuaristas sob a alegação de garantia de renda mínima rural.",
    "A consequência socioeconômica mais evidente da concessão sistemática desses subsídios agrícolas governamentais pelas potências centrais para o comércio internacional é a:",
    [
      "geração de concorrência desleal no mercado internacional de alimentos, prejudicando produtores do Sul Global que não dispõem de apoio financeiro estatal comparável.",
      "democratização do comércio mundial com igualdade perfeita de custos para pequenos agricultores de todo o globo.",
      "eliminação imediata de qualquer exigência sanitária e aduaneira nas fronteiras alfandegárias da Europa.",
      "estatização de todas as propriedades rurais da América Latina pela Corte Internacional de Justiça.",
      "falência de todas as agroindústrias norte-americanas diante do avanço da agricultura manual africana."
    ],
    0,

  ],
  "Nearshoring e reconfiguração das cadeias globais de suprimento": [
    "Nas últimas quatro décadas, o modelo hegemônico de organização das multinacionais sob o toyotismo baseou-se no 'offshoring': a transferência maciça de fábricas para países distantes da Ásia (especialmente a China) em busca de mão de obra barata, incentivos fiscais e logística 'just-in-time'. Contudo, eventos disruptivos recentes (como a paralisação das cadeias de suprimento na pandemia de Covid-19, o bloqueio do Canal de Suez e a guerra comercial e tecnológica entre Estados Unidos e China) expuseram a extrema vulnerabilidade dessa hiperglobalização dispersa. Em resposta, as corporações globais e governos ocidentais estão adotando a estratégia do 'nearshoring' (ou 'friendshoring'): a relocalização de fábricas e fornecedores estratégicos para países vizinhos ou geograficamente próximos dos seus principais mercados consumidores, com regimes políticos confiáveis e aliados. O México desponta como o maior polo de nearshoring do planeta em relação ao mercado dos Estados Unidos, beneficiado por acordos comerciais (USMCA) e fronteira contígua, alterando a geografia da manufatura global.",
    [
      "Offshoring: deslocamento de fábricas para a Ásia em busca de mão de obra e insumos ultrabaratos",
      "Nearshoring: trazer a produção para países vizinhos ou geograficamente próximos do mercado consumidor",
      "Friendshoring: concentrar cadeias de suprimento e parceiros industriais em nações politicamente amigáveis",
      "Resiliência vs Custo: a segurança e previsibilidade logística passam a importar mais do que economizar centavos em frete"
    ],
    "Para o ENEM: se a China fechar os portos ou entrar em conflito, o Ocidente fica sem chips, carros e remédios; o nearshoring é a estratégia de montar fábricas 'no quintal de casa' (como o México e o Leste Europeu) para não depender das rotas marítimas asiáticas.",
    "Em decorrência de gargalos logísticos globais e tensões geopolíticas sino-americanas, dezenas de indústrias automobilísticas e eletrônicas fecharam linhas de montagem no Sudeste Asiático e anunciaram investimentos de bilhões de dólares para construir novas plantas fabris no norte do México e no leste europeu, próximos aos centros consumidores norte-americano e alemão.",
    "A alteração nas estratégias de localização geográfica das corporações multinacionais descrita no texto representa o avanço do:",
    [
      "colonialismo mercantilista baseado em companhias monopolistas da navegação à vela do século XVII.",
      "desmantelamento integral da infraestrutura portuária e ferroviária do continente europeu.",
      "fechamento autárquico de todas as fronteiras nacionais e retorno ao escambo pré-capitalista de mercadorias.",
      "monopólio soviético de planejamento estatal centralizado sobre a economia mundial.",
      "nearshoring, priorizando a segurança logística e a proximidade geográfica em detrimento da busca exclusiva pelo menor custo salarial na Ásia."
    ],
    4,
    "Alternativa correta: E. O nearshoring visa encurtar as distâncias logísticas e reduzir os riscos de desabastecimento em crises geopolíticas, alocando a produção fabril em territórios parceiros vizinhos ou regionais (como o México em relação aos EUA), superando a vulnerabilidade extrema gerada pelo offshoring asiático excessivo. As alternativas A, C, D e E são anacrônicas ou inconsistentes."
  ],
  "Rios Voadores e bombeamento biótico amazônico": [
    "Os 'Rios Voadores' constituem um colossal fenômeno de circulação atmosférica e transporte hidrológico de vapor d'água invisível impulsionado pela Floresta Amazônica em direção ao Centro-Oeste, Sudeste e Sul do Brasil, bem como a países vizinhos (como o Paraguai e a Argentina). A exuberante biomassa florestal amazônica funciona como uma gigantesca bomba biótica (teoria da Bomba Biótica de Makarieva e Gorshkov): cada árvore de grande porte da floresta bombeia do solo e lança na atmosfera mais de 1.000 litros de água por dia pelo processo de evapotranspiração, gerando um volume diário de vapor superior à vazão do próprio Rio Amazonas. Esse ar supersaturado de umidade é soprado para oeste pelos ventos alísios de leste; ao alcançar a colossal barreira orográfica da Cordilheira dos Andes, a massa de umidade não consegue transpor as montanhas e é defletida para o sul, alimentando as chuvas que abastecem os reservatórios hidrelétricos, os aquíferos e as safras agrícolas das regiões mais populosas e produtivas da América do Sul.",
    [
      "Rios Voadores: cursos aéreos de vapor d'água gerados pela evapotranspiração da Floresta Amazônica",
      "Bomba Biótica: a condensação intensa sobre a floresta cria centros de baixa pressão que sugam umidade oceânica",
      "Barreira dos Andes: paredão orográfico de 6.000 m que desvia as massas de ar amazônicas em direção ao Centro-Sul do Brasil",
      "Segurança hídrica e agrícola: as chuvas de verão em SP, MG e bacia do Prata dependem vitalmente da floresta preservada"
    ],
    "Para a redação e para o ENEM: desmatar a Amazônia não é apenas perder árvores em Manaus; significa cortar as torneiras de água que enchem as represas de São Paulo e fazem a soja e o milho brotarem no Centro-Oeste e Paraná.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Dinamica dos Rios Voadores da Amazônia</text><rect x='25' y='45' width='80' height='35' fill='#2E7D32' rx='6'/><text x='30' y='62' font-size='9' fill='#fff' font-weight='700'>Floresta Amazônica</text><text x='30' y='74' font-size='8' fill='#fff'>Evapotranspiração diária</text><text x='110' y='65' font-size='12' fill='var(--tx)'>➔ Alísios</text><path d='M160 35 L 160 120' stroke='#D12D20' stroke-width='4'/><text x='168' y='75' font-size='9' fill='#D12D20' font-weight='700'>Andes (Barreira)</text><path d='M155 100 Q 180 130 250 120' stroke='#2F5BFF' stroke-width='4' fill='none'/><text x='190' y='140' font-size='9' fill='#2F5BFF' font-weight='700'>➔ Chuvas no Centro-Sul</text></svg>Estudos de climatologia do Instituto Nacional de Pesquisas Espaciais (INPE) demonstram que as massas de ar úmido formadas sobre a bacia amazônica transportam diariamente cerca de 20 bilhões de toneladas de vapor de água para o interior do continente sul-americano, alimentando os sistemas frontais e as chuvas convectivas que enchem os reservatórios do Cantareira e de Itaipu.",
    "O papel ecológico e meteorológico determinante exercido pela cobertura vegetal primária da Amazônia nesse mecanismo de transporte hídrico apoia-se no(a):",
    [
      "aquecimento estático da terra que impede a formação de qualquer tipo de condensação de nuvens.",
      "produção mineral de gás metano pelas copas das árvores que repele os ventos atlânticos.",
      "reflexão integral da radiação solar que congela o ar sobre os estados do Pará e Amazonas.",
      "elevadíssima taxa de evapotranspiração da vegetação arbórea, que injeta massas gigantescas de vapor d'água na circulação atmosférica regional.",
      "desvio forçado de todos os ventos alísios em direção ao deserto do Saara africano."
    ],
    3,
    "Alternativa correta: D. As árvores amazônicas transpiram ativamente sob calor e radiação solar, atuando como um gigantesco umidificador atmosférico biológico; o vapor produzido é carregado pelos ventos alísios, encontra o anteparo da Cordilheira dos Andes e curva-se para o Centro-Sul brasileiro na forma de rios voadores benfazejos. As alternativas A, C, D e E trazem formulações cientificamente errôneas."
  ],
  "Zona de Convergência do Atlântico Sul (ZCAS)": [
    "A Zona de Convergência do Atlântico Sul (ZCAS) é o principal sistema meteorológico responsável pelas chuvas generalizadas e abundantes no verão no Centro-Oeste e Sudeste do Brasil, estendendo-se com frequência até o sul da Bahia e parte da Região Norte. Trata-se de uma persistente e extensa banda de nebulosidade e instabilidade atmosférica orientada no sentido Noroeste-Sudeste, que conecta a umidade da bacia amazônica ao Oceano Atlântico Sul subtropical. Para ser configurada tecnicamente pela meteorologia, a ZCAS exige a permanência de chuvas contínuas e cobertura de nuvens por pelo menos quatro dias consecutivos sobre a mesma faixa de território. Seus impactos socioambientais são marcados pela dualidade: de um lado, é indispensável para recarregar as cabeceiras das grandes represas hidrelétricas (Furnas, Três Marias) e os lençóis freáticos que sustentam a agricultura; por outro lado, quando atua com intensidade extraordinária, precipita acumulados pluviométricos superiores a 200 mm em poucos dias, desencadeando inundações de vales e deslizamentos trágicos de encostas habitadas na Serra do Mar e Serra da Mantiqueira.",
    [
      "ZCAS: faixa persistente de nuvens e chuvas orientada no sentido Noroeste-Sudeste durante os meses de verão",
      "Origem da umidade: acoplamento entre o calor e vapor da Amazônia e frentes frias vindas do Sul no Atlântico",
      "Recarga hídrica: essencial para o nível dos reservatórios hidrelétricos do Sudeste e Centro-Oeste",
      "Desastres urbanos: precipitações volumosas contínuas por dias provocam movimentos de massa e enchentes mortais"
    ],
    "Para o ENEM: no verão, quando você vê na previsão do tempo aquela 'faixa de nuvens diagonal cortando o mapa do Brasil da Amazônia até o Rio de Janeiro ou São Paulo chovendo por dias seguidos', isso é a clássica ZCAS.",
    "No mês de janeiro, imagens de satélite meteorológico registraram uma extensa e densa faixa de nebulosidade convectiva posicionada por mais de 96 horas consecutivas desde o sul da Amazônia até a costa dos estados do Rio de Janeiro e Espírito Santo, provocando acumulados pluviais recordes e enxurradas.",
    "O fenômeno climatológico de grande escala caracterizado no texto que comanda o regime de precipitações estivais no Centro-Sudeste brasileiro é a:",
    [
      "brisa marinha diurna provocada exclusivamente pelo resfriamento noturno das areias de praia.",
      "inversão térmica de superfície restrita aos vales industriais durante as madrugadas de outono.",
      "geada negra decorrente da invasão de massas polares secas no auge do inverno gaúcho.",
      "Zona de Convergência do Atlântico Sul (ZCAS), estruturada pela canalização do fluxo de umidade amazônica em direção ao oceano.",
      "Monção de Inverno continental que sopra ventos ressecados da Patagônia para a bacia do São Francisco."
    ],
    3,
    "Alternativa correta: D. A ZCAS é o corredor de nebulosidade que conecta o fluxo de umidade transportado pelos ventos amazônicos a uma frente fria quase estacionária no Atlântico, resultando em vários dias de chuvas torrenciais contínuas nas regiões Sudeste e Centro-Oeste no verão. As alternativas A, C, D e E citam fenômenos locais, polares ou de inverno."
  ],
  "Desertos globais e adaptações da vegetação xerófila": [
    "Os biomas desérticos ocupam mais de um terço das terras emersas do planeta, localizando-se primordialmente ao longo dos trópicos de Câncer e Capricórnio (como o Saara na África, o Deserto da Arábia, o Kalahari e o Grande Deserto Australiano), bem como em bacias interiores isoladas por cordilheiras montanhosas (Gobi) ou faixas litorâneas banhadas por correntes marítimas frias (Atacama no Chile e Namíbia na África). O clima desértico hiperárido é pautado por pluviosidade insignificante (inferior a 250 mm anuais), elevada insolação e amplitude térmica diária colossal (temperaturas que ultrapassam 45 °C de dia e despencam para perto de 0 °C à noite por ausência de umidade para reter o calor na atmosfera). A vegetação característica é a xerófila: plantas adaptadas à escassez hídrica crônica que desenvolveram mecanismos fisiológicos e morfológicos notáveis, como redução de folhas em espinhos (para minimizar a transpiração e repelir herbívoros), caules suculentos que armazenam água (como os cactos), raízes profundas ou horizontais extensas, cutícula espessa e cerosa e fechamento diurno dos estômatos pelo metabolismo ácido das crassuláceas (CAM).",
    [
      "Deserto hiperárido: precipitação < 250 mm/ano, evaporação muito superior à chuva e alta amplitude térmica diária",
      "Causas geográficas dos desertos: células de alta pressão subtropical descendente, correntes oceânicas frias e barreiras orográficas",
      "Vegetação xerófila: espinhos no lugar de folhas, tecidos clorofilianos no caule e reserva hídrica em parênquimas suculentos",
      "Metabolismo CAM: abertura dos estômatos exclusivamente à noite para absorver CO₂ sem perder água por transpiração"
    ],
    "Para o ENEM: a grande amplitude térmica do deserto (fervendo de dia e congelando de noite) acontece porque NÃO tem vapor d'água no ar; como o ar é sequíssimo, não há efeito estufa para segurar o calor à noite, que se dissipa instantaneamente para o espaço.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Adaptações Morfológicas das Plantas Xerófilas</text><rect x='25' y='45' width='125' height='40' fill='#2E7D32' rx='6'/><text x='30' y='62' font-size='9' fill='#fff' font-weight='700'>Folhas ➔ Espinhos</text><text x='30' y='76' font-size='8' fill='#fff'>Reduz a evapotranspiração</text><rect x='170' y='45' width='125' height='40' fill='#5B6785' rx='6'/><text x='175' y='62' font-size='9' fill='#fff' font-weight='700'>Caule Suculento Verde</text><text x='175' y='76' font-size='8' fill='#fff'>Armazena água e faz fotossíntese</text><rect x='60' y='98' width='200' height='35' fill='#14213D' rx='6'/><text x='75' y='115' font-size='9' fill='#fff' font-weight='700'>Raízes Extensas + Cutícula Cerosa</text><text x='85' y='126' font-size='8' fill='#fff'>Captação rápida e impermeabilização</text></svg>Em expedição científica botânica pelo deserto do Atacama e pelo planalto da Arábia, biólogos coletaram espécimes vegetais que apresentavam ausência completa de folhas lamelares largas, caules verdes carnosos revestidos por ceras impermeáveis e sistemas radiculares superficiais que se estendem por dezenas de metros ao redor da planta.",
    "As características morfológicas e anatômicas descritas conferem às espécies xerófilas a capacidade adaptativa de:",
    [
      "maximizar a retenção hídrica interna e diminuir a perda de água por transpiração sob severo estresse hídrico.",
      "aumentar a perda contínua de água para resfriar a superfície do solo em volta da planta.",
      "absorver sal marinho concentrado para fertilizar depósitos de neve invernal.",
      "eliminar todo o oxigênio celular para impedir o processo biológico da respiração mitocondrial.",
      "impedir a chegada de luz solar aos tecidos para inibir permanentemente a fotossíntese."
    ],
    0,
    "Alternativa correta: A. A conversão de folhas em espinhos, a cutícula cerosa grossa e o acúmulo de água no caule suculento são estratégias evolutivas cruciais das plantas xerófitas para sobreviver em climas hiperáridos, minimizando ao extremo a perda de água por evapotranspiração e permitindo a fotossíntese mesmo em secas extremas. As alternativas A, C, D e E contrariam a função biológica de sobrevivência vegetal."
  ],
  "Faixas de transição ecológica (ecótonos) no Brasil": [
    "Os limites territoriais entre os grandes domínios morfoclimáticos brasileiros não são linhas abruptas ou cercas divisórias nítidas, mas sim extensas faixas de transição ecológica denominadas biogeograficamente de ecótonos. Nesses ambientes de contato, elementos de relevo, clima, solo e vegetação pertencentes a domínios vizinhos misturam-se e interpenetram-se, resultando em ecossistemas híbridos de altíssima complexidade e expressiva biodiversidade. Destacam-se no Brasil: 1) A Mata dos Cocais (situada no Meio-Norte, entre a Amazônia úmida e a Caatinga semiárida, dominada pelas palmeiras do babaçu e da carnaúba); 2) O Pantanal Mato-Grossense (o maior complexo de áreas úmidas do mundo, encravado na depressão do Rio Paraguai, que reúne espécies do Cerrado, Amazônia, Chaco e Mata Atlântica); 3) A Zona dos Agrestes (faixa de transição entre a Zona da Mata úmida litorânea e o Sertão semiárido nordestino, influenciada pela barreira orográfica do Planalto da Borborema). Os ecótonos são áreas de especial fragilidade ambiental, pois qualquer desequilíbrio afeta simultaneamente espécies de diferentes biomas.",
    [
      "Ecótono: zona de transição e contato ecológico entre dois ou mais biomas adjacentes",
      "Mata dos Cocais: ecótono clássico entre a Amazônia, o Cerrado e a Caatinga no Maranhão e Piauí",
      "Pantanal: mosaico e complexo ecológico de transição que amalgama fauna e flora de múltiplos biomas",
      "Agreste nordestino: transição entre a umidade atlântica (Zona da Mata) e a aridez do Sertão"
    ],
    "Para o ENEM: ecótono não é 'terra de ninguém'; é justamente onde a biodiversidade pode ser maior porque espécies dos dois biomas vizinhos conseguem conviver juntas, mas também é onde a destruição causa impactos cruzados irreversíveis.",
    "Ao viajar do litoral oriental do Nordeste em direção ao interior semiárido, o viajante atravessa uma faixa intermediária caracterizada pela policultura camponesa e pecuária leiteira, onde a vegetação tropical exuberante das escarpas cede progressivamente espaço a arbustos espinhosos com a redução das chuvas provocada pelo relevo da Borborema.",
    "A faixa ecológica descrita, representativa de um ecótono de transição entre a umidade da Zona da Mata e o semiárido sertanejo, corresponde regionalmente ao:",
    [
      "Agreste nordestino, funcionando como área de transição climática, vegetacional e socioeconômica.",
      "Quadrilátero Ferrífero no estado de Minas Gerais.",
      "Polígono das Araucárias nos planaltos frios de Santa Catarina.",
      "Vale do Paraíba no interior do estado de São Paulo.",
      "Chaco boliviano na fronteira com o Mato Grosso do Sul."
