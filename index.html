  "Complexos geoeconômicos de Pedro Pinchas Geiger": [
    "A proposta de regionalização geoeconômica formulada pelo geógrafo Pedro Pinchas Geiger em 1967 dividiu o território brasileiro em três grandes macrocomplexos: Amazônia, Nordeste e Centro-Sul. A principal característica metodológica dessa divisão é que ela não respeita as fronteiras político-administrativas dos estados, pois as relações socioeconômicas, as redes urbanas e as dinâmicas de mercado transcendem os limites das linhas no mapa. No Complexo do Centro-Sul (o coração econômico do país), congrega-se o Sudeste, o Sul e a maior parte do Centro-Oeste, onde a indústria, a agricultura moderna e os serviços avançados impulsionam a acumulação de capital. O Complexo do Nordeste abrange o semiárido e a faixa litorânea, marcado por heranças agrárias e disparidades de renda. O Complexo da Amazônia é a grande fronteira de recursos naturais e terras, sob forte pressão de expansão agropecuária e madeireira.",
    [
      "Centro-Sul: polo econômico hegemônico (Sudeste + Sul + maior parte do Centro-Oeste + sul de Tocantins)",
      "Nordeste: herança açucareira litorânea e sertão semiárido (inclui o norte de Minas Gerais no Vale do Jequitinhonha)",
      "Amazônia: domínio da floresta e fronteira mineral/agrícola em expansão (inclui o oeste do Maranhão)",
      "Critério de Geiger: formação histórico-econômica e relações capitalistas reais, sem amarras em fronteiras estaduais"
    ],
    "Para o ENEM: por que o norte de Minas Gerais (Vale do Jequitinhonha) foi colocado por Geiger no Complexo do Nordeste? Porque histórica e socialmente a região compartilha a seca semiárida e os indicadores de pobreza sertanejos, muito diferentes da dinâmica urbano-industrial do Centro-Sul.",
    "<svg viewBox='0 0 320 160' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='160' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Os 3 Complexos Geoeconômicos (Pedro Pinchas Geiger, 1967)</text><rect x='20' y='45' width='90' height='45' fill='#2E7D32' rx='6'/><text x='35' y='64' font-size='10' font-weight='700' fill='#fff'>Amazônia</text><text x='25' y='78' font-size='9' fill='#fff'>Fronteira e Recursos</text><rect x='115' y='45' width='90' height='45' fill='#FFB400' rx='6'/><text x='130' y='64' font-size='10' font-weight='700' fill='var(--tx)'>Nordeste</text><text x='120' y='78' font-size='9' fill='var(--tx)'>Disparidades/Histórico</text><rect x='210' y='45' width='95' height='45' fill='#2F5BFF' rx='6'/><text x='225' y='64' font-size='10' font-weight='700' fill='#fff'>Centro-Sul</text><text x='215' y='78' font-size='9' fill='#fff'>Coração Econômico</text><text x='25' y='125' font-size='10' fill='var(--tx)'>➔ Não obedece aos limites das fronteiras políticas estaduais</text><text x='25' y='142' font-size='9' fill='var(--mu)'>Exemplo: Norte de MG pertence ao Complexo do Nordeste</text></svg>A divisão do Brasil nos três Complexos Geoeconômicos (Amazônia, Nordeste e Centro-Sul) é frequentemente utilizada em análises sociopolíticas por retratar de forma mais fiel as dinâmicas capitalistas reais de ocupação do solo.",
    "A justificativa teórica para que o norte do estado de Minas Gerais tenha sido integrado ao Complexo do Nordeste na regionalização de Geiger baseia-se no fato de que essa área:",
    [
      "apresenta os mais elevados salários fabris do setor automobilístico e aeroespacial da América Latina.",
      "abriga as mais ricas jazidas de petróleo do Pré-sal do Atlântico Equatorial.",
      "está localizada ao norte da linha do Equador em plena bacia sedimentar caribenha.",
      "compartilha traços climáticos semiáridos, estrutura agrária tradicional e desafios socioeconômicos idênticos aos do Sertão nordestino.",
      "possui densa floresta equatorial de terra firme idêntica ao centro da Amazônia ocidental."
    ],
    3,
    "Alternativa correta: D. o norte de Minas Gerais (como o Vale do Jequitinhonha e o Vale do Mucuri) e o norte fluminense compartilham o clima semiárido/tropical seco, a seca sertaneja periódica e os baixos índices de desenvolvimento humano que historicamente definem o espaço geoeconômico nordestino, distanciando-se da dinâmica do Centro-Sul. As alternativas A, C, D e E trazem formulações geográficas totalmente inverídicas e descompassadas da realidade mineira."
  ],
  "Territórios indígenas e comunidades quilombolas": [
    "A Constituição Federal de 1988 representou um marco histórico na consagração dos direitos territoriais e identitários de minorias no Brasil. O Artigo 231 reconheceu aos povos indígenas seus direitos originários e ancestrais sobre as terras que tradicionalmente ocupam, competindo à União demarcá-las e protegê-las como terras públicas inalienáveis e indisponíveis. A demarcação garante a sustentabilidade física e cultural dos povos originários e preserva a floresta em pé (dados de satélite comprovam que as Terras Indígenas demarcadas são as barreiras ecológicas mais eficientes contra o desmatamento no país). O Artigo 68 do Ato das Disposições Constitucionais Transitórias (ADCT) reconheceu a propriedade definitiva das terras aos remanescentes das comunidades dos quilombos (comunidades formadas pela resistência histórica à escravidão). Ambas as populações enfrentam contínuas invasões ilegais de grileiros, madeireiros e garimpeiros, além de entraves na titulação de suas terras.",
    [
      "Artigo 231 da CF/88: Direitos originários indígenas sobre terras ancestrais (bens da União de usufruto exclusivo indígena)",
      "Terras Indígenas como escudo ecológico: menores taxas de desmatamento da Amazônia e Cerrado comprovadas pelo INPE",
      "Comunidades Quilombolas: territórios coletivos titulados pelo Incra sob o Art. 68 do ADCT",
      "Convenção 194 da OIT: consulta prévia, livre, informada e de boa-fé a povos tradicionais antes de obras em suas terras"
    ],
    "Para a redação e para a prova de Humanas do ENEM: a demarcação de Terras Indígenas não é uma 'concessão de favores' do Estado, mas o cumprimento de um dever constitucional de reconhecimento de um direito originário e ancestral que antecede a própria criação do Estado brasileiro.",
    "O Censo Demográfico de 2022 do IBGE realizou o levantamento censitário inédito e específico da população quilombola e indígena no território nacional, revelando que o Brasil possui mais de 1,7 milhão de indígenas e mais de 1,3 milhão de quilombolas distribuídos por todas as grandes regiões do país, com destaque para a liderança demográfica dos estados da Bahia e do Maranhão no contingente quilombola.",
    "Sob a perspectiva ambiental e jurídica da preservação dos biomas brasileiros, a garantia da demarcação e fiscalização contínua das Terras Indígenas atua estrategicamente como um:",
    [
      "fator de aceleração imediata da extração mineral a céu aberto autorizada pela ONU.",
      "método de cancelamento dos direitos civis e eleitorais dos cidadãos nativos brasileiros.",
      "mecanismo de expulsão de povos originários para periferias degradadas de grandes metrópoles litorâneas.",
      "processo de conversão compulsória de todas as florestas tropicais em monocultivos de eucalipto transgênico.",
      "instrumento de proteção territorial que freia o avanço do desmatamento ilegal e preserva os serviços ecossistêmicos."
    ],
    4,
    "Alternativa correta: E. dados científicos e de sensoriamento remoto (INPE, MapBiomas) comprovam reiteradamente que as Terras Indígenas demarcadas e fiscalizadas apresentam os menores índices de perda florestal do território nacional, funcionando como barreiras intransponíveis contra o avanço predatório de madeireiros, garimpeiros e grileiros de terras. As alternativas A, C, D e E trazem assertivas que violam os direitos indígenas assegurados pela Constituição de 1988."
  ],
  "Fronteiras e soberania territorial": [
    "O Brasil possui a terceira maior fronteira terrestre do planeta, com mais de 16.800 km de extensão, fazendo divisa com quase todos os países da América do Sul (exceto Chile e Equador). A Faixa de Fronteira é uma zona de segurança nacional definida por lei federal com 150 km de largura paralela à linha divisória internacional, onde se aplicam restrições a empreendimentos privados e aquisição de terras por estrangeiros. Ao contrário das fronteiras europeias fortificadas, grande parte da fronteira brasileira atravessa rios e densas matas amazônicas e pantaneiras, configurando 'fronteiras porosas'. Em diversas cidades-gêmeas conurbadas (como Ponta Porã/MS com Pedro Juan Caballero no Paraguai, e Foz do Iguaçu com Ciudad del Este), os cidadãos convivem em simbiose cultural e comercial com intensa circulação diária de mercadorias. Os desafios estratégicos envolvem o combate ao narcotráfico, contrabando e garimpo ilegal, coordenados pelo Sistema de Proteção da Amazônia (Sipam) e pelo Sistema Integrado de Monitoramento de Fronteiras (Sisfron).",
    [
      "Faixa de Fronteira: faixa territorial de 150 km ao longo da divisa internacional com restrições jurídicas",
      "Extensão terrestre: 16.886 km de fronteira continental limítrofe com 10 países sul-americanos",
      "Cidades-gêmeas: municípios de países distintos conurbados ou integrados por pontes fronteiriças (ex.: Foz do Iguaçu / Ciudad del Este)",
      "Sisfron / Sipam: tecnologias de radares orbitais, sensores terrestres e inteligência para monitoramento militar e ambiental"
    ],
    "Para o ENEM: o Brasil faz fronteira com DEZ países sul-americanos; os únicos dois países da América do Sul que NÃO fazem fronteira com o Brasil são o Chile e o Equador.",
    "Na fronteira entre o Brasil e o Paraguai, as cidades de Ponta Porã (Mato Grosso do Sul) e Pedro Juan Caballero (Paraguai) são separadas fisicamente apenas por uma ampla avenida urbana internacional de mão dupla, sem muros ou aduanas físicas no trânsito local de pedestres e moradores.",
    "Essa configuração espacial urbana e transfronteiriça é classificada nos estudos de geopolítica territorial como uma:",
    [
      "trincheira militarizada permanente de contenção bélica.",
      "zona desabitada de exclusão biológica estéril onde é proibida a presença de civis.",
      "área de soberania exclusiva de tribunais marítimos internacionais da ONU.",
      "cidade-gêmea transfronteiriça com intensa interação social, cultural e econômica cotidiana.",
      "fronteira hermética e fechada ao comércio bilateral sul-americano."
    ],
    3,
    "Alternativa correta: D. as cidades-gêmeas (como Ponta Porã e Pedro Juan Caballero) são municípios situados na linha de fronteira cujas malhas urbanas se integram física e funcionalmente, gerando intercâmbio comercial diário, bilinguismo e forte convivência social transfronteiriça. As alternativas A, C, D e E propõem descrições militarizadas, marítimas ou de isolamento que contradizem a integração real observada no local."
  ],
  "Geopolítica do Oriente Médio e recursos": [
    "O Oriente Médio ocupa uma posição geográfica estratégica de encruzilhada intercontinental entre Ásia, Europa e África, concentrando quase metade das reservas comprovadas de petróleo e gás natural do planeta (destacando-se nações do Golfo Pérsico como Arábia Saudita, Irã, Iraque, Emirados Árabes Unidos e Catar). A região é historicamente marcada por rivalidades geopolíticas, tensões étnico-religiosas (árabes e persas; correntes sunitas e xiitas do Islã) e disputas territoriais insolúveis, com ênfase na Questão Palestina (disputa histórica entre israelenses e palestinos por soberania, territórios na Cisjordânia e Faixa de Gaza e o estatuto de Jerusalém). Além do petróleo, o recurso mais escasso e crítico da região é a água doce potável: bacias transfronteiriças como a do Tigre-Eufrates (compartilhada por Turquia, Síria e Iraque) e a Bacia do Rio Jordão são focos crônicos de hidropolítica e disputas de segurança hídrica regional.",
    [
      "Recursos vitais: Petróleo fóssil abundante vs Água doce superficial extremamente escassa (hidropolítica)",
      "Golfo Pérsico e Estreito de Ormuz: principal gargalo marítimo de escoamento do petróleo exportado para Ásia e Europa",
      "Questão Palestina: conflito por território, criação de Estado soberano palestino e posse de Jerusalém",
      "Rivalidade regional: disputa hegemônica entre Arábia Saudita (sunita) e Irã (xiita)"
    ],
    "Para o ENEM: a escassez de água no Oriente Médio transforma a hidropolítica em questão militar; o controle de nascentes e barragens no Rio Jordão e no Tigre-Eufrates é tão estratégico quanto o controle de poços de petróleo.",
    "Em um cenário de intensificação das tensões militares no Oriente Médio, governos e analistas financeiros globais monitoram com alarme a circulação de navios petroleiros pelo Estreito de Ormuz, passagem marítima de apenas 39 km de largura em seu ponto mais estreito que conecta o Golfo Pérsico ao Oceano Índico.",
    "A extrema relevância geopolítica global atribuída ao controle do Estreito de Ormuz fundamenta-se no fato de que:",
    [
      "suas águas congeladas no verão impedem a circulação de qualquer embarcação de transporte de grãos.",
      "ele é a única passagem marítima que conecta a Amazônia brasileira ao Oceano Glacial Ártico.",
      "o estreito abriga as maiores usinas hidrelétricas de geração renovável do continente europeu.",
      "por ele escoa diariamente cerca de um quinto de todo o petróleo consumido no planeta transportado em superpetroleiros.",
      "ele foi declarado internacionalmente como propriedade particular exclusiva do governo de Tóquio."
    ],
    3,
    "Alternativa correta: D. o Estreito de Ormuz é o 'chokepoint' (estrangulamento marítimo estratégico) mais crítico da economia global de energia; navios transportando mais de 20 milhões de barris de petróleo bruto por dia (cerca de 20% do consumo mundial) partem do Golfo Pérsico através de Ormuz rumo a mercados da China, Índia, Japão e Europa. As alternativas B, C, D e E trazem disparates geográficos evidentes."
  ],
  "Conflitos territoriais e separatismos": [
    "Os conflitos territoriais e movimentos separatistas contemporâneos expressam a tensão entre o conceito jurídico de Estado-nação (fronteiras políticas soberanas reconhecidas internacionalmente) e o conceito de nação (comunidade de indivíduos unidos por laços históricos, linguísticos, culturais e sentimento de pertencimento). Quando fronteiras coloniais ou imperiais arbitrárias foram traçadas sem respeitar a distribuição de etnias nativas (como a 'Partilha da África' na Conferência de Berlim de 1884-1885), criaram-se Estados multiétnicos instáveis e nações sem território próprio. O povo curdo (mais de 30 milhões de pessoas espalhadas por Turquia, Síria, Iraque e Irã) constitui a maior nação sem Estado do mundo. Na Europa, aspirações autonômicas e separatistas manifestam-se em regiões prósperas com identidade cultural própria, como a Catalunha e o País Basco na Espanha, e a Escócia no Reino Unido, demandando soberania mediante plebiscitos e negociações políticas.",
    [
      "Nação: povo com identidade cultural, língua, história e sentimento de pertencimento compartilhado",
      "Estado: instituição jurídica, política e administrativa soberana com território e forças armadas",
      "Povo sem Estado: nação consolidada desprovida de território soberano autônomo (ex.: Curdos no Oriente Médio)",
      "Partilha da África (Conferência de Berlim): fronteiras artificiais europeias que uniram etnias rivais e dividiram povos irmãos"
    ],
    "Distinga com clareza: Estado é a organização política soberana (ex.: Estado Espanhol); Nação é o grupo humano e cultural (ex.: Nação Catalã). Nem todo Estado é formado por uma só nação, e nem toda nação possui um Estado próprio.",
    "O povo curdo, com população estimada em mais de 30 milhões de habitantes que compartilham idioma próprio, costumes ancestrais e identidade histórica consolidada, encontra-se territorialmente fragmentado entre as fronteiras soberanas de quatro países distintos do Oriente Médio: Turquia, Síria, Iraque e Irã.",
    "A condição geopolítica internacional que define formalmente a situação do povo curdo é a de uma:",
    [
      "monarquia absolutista islâmica dotada de assento permanente no Conselho de Segurança da ONU.",
      "nação sem Estado soberano próprio, submetida às legislações e fronteiras dos países em que reside.",
      "colônia ultramarina controlada exclusivamente pela coroa britânica desde o Tratado de Madri.",
      "federação militarizada detentora do controle acionário do Fundo Monetário Internacional.",
      "potência atômica independente com mar territorial no Oceano Atlântico Norte."
    ],
    1,
    "Alternativa correta: B. os curdos formam a maior nação do planeta que não possui um Estado soberano e independente; a despeito de sua expressiva densidade populacional e de sua identidade cultural coesa, suas reivindicações por um Curdistão autônomo são reprimidas pelas autoridades dos quatro Estados vizinhos em que seu povo foi compulsoriamente dividido. As alternativas A, C, D e E trazem assertivas que descolam da realidade geopolítica curda."
  ],
  "Disputas por recursos e rotas marítimas estratégicas": [
    "O controle de rotas marítimas estratégicas e passagens estreitas (conhecidas na geopolítica como 'chokepoints') é vital para o comércio e a segurança energética mundial, visto que mais de 80% do comércio global em volume de cargas é transportado por vias marítimas. Além do Estreito de Ormuz e do Canal de Suez (que conecta o Mediterrâneo ao Mar Vermelho e à Ásia), destaca-se o Estreito de Malaca (entre a Malásia, Cingapura e Indonésia), por onde transita o grosso dos insumos energéticos que abastecem a China, o Japão e a Coreia do Sul. Na geopolítica asiática contemporânea, o Mar do Sul da China converteu-se em um dos mais sensíveis focos de tensão internacional: a China reivindica a posse histórica de quase todo esse mar (a 'linha dos nove traços'), construindo ilhas artificiais militarizadas, colidindo com as reivindicações de soberania de nações vizinhas (Filipinas, Vietnã, Malásia, Taiwan e Brunei) e com a defesa norte-americana da livre navegação internacional.",
    [
      "Chokepoints: canais e estreitos estratégicos (Ormuz, Malaca, Suez, Bósforo, Panamá, Babelmândebe)",
      "Estreito de Malaca: rota vital de abastecimento de petróleo do Oriente Médio para a China e Ásia Oriental",
      "Mar do Sul da China: disputa por rotas comerciais, reservas de gás submarinas e recursos pesqueiros (Linha dos Nove Traços)",
      "Convenção da ONU sobre o Direito do Mar (UNCLOS): estabelece Mar Territorial (12 milhas náuticas) e Zona Econômica Exclusiva - ZEE (200 milhas)"
    ],
    "Para o ENEM: Mar Territorial = 12 milhas náuticas a partir da costa (soberania total do país); Zona Econômica Exclusiva (ZEE) = 200 milhas náuticas (o país tem exclusividade de exploração de recursos econômicos no mar e subsolo, como o Pré-sal).",
    "A rota marítima do Estreito de Malaca é o principal corredor logístico que interliga o Oceano Índico ao Oceano Pacífico. Cerca de 80% das importações de petróleo e matérias-primas que alimentam o colossal parque industrial da China atravessam obrigatoriamente essa estreita passagem marítima.",
    "A dependência estratégica chinesa em relação ao fluxo contínuo de navios por esse estrangulamento marítimo inspirou o conceito geopolítico do 'Dilema de Malaca', que motivou Pequim a:",
    [
      "fechar definitivamente seus portos marítimos e cancelar o comércio internacional com a Europa.",
      "transferir sua capital nacional para um porta-aviões nuclear ancorado no Atlântico Sul.",
      "investir em rotas terrestres alternativas e gasodutos continentais por meio da iniciativa da Nova Rota da Seda.",
      "declarar guerra naval aberta contra todas as nações do sudeste asiático.",
      "proibir navios mercantes de transportarem petróleo em direção ao continente asiático."
    ],
    2,
    "Alternativa correta: C. o 'Dilema de Malaca' descreve a extrema vulnerabilidade da economia da China caso potências rivais bloqueiem o Estreito de Malaca em um conflito; para contornar esse risco, o governo chinês investe na Nova Rota da Seda (Belt and Road Initiative), abrindo corredores terrestres com oleodutos, ferrovias e portos no Paquistão, Mianmar e Ásia Central para acessar o mar sem depender unicamente de Malaca. As alternativas A, C, D e E são formulações fantasiosas e incorretas."
  ],
  "Categorias geográficas: paisagem, lugar, região e território": [
    "A ciência geográfica estuda a produção do espaço geográfico através de quatro categorias conceituais fundamentais e complementares: 1) Paisagem: é a dimensão perceptível do espaço, tudo aquilo que a nossa visão e os demais sentidos humanos apreendem em um dado momento; divide-se em paisagem natural (sem intervenção humana direta) e paisagem cultural/humanizada (marcada pelo trabalho social e pela técnica acumulada ao longo da história); 2) Lugar: é a dimensão afetiva e existencial do espaço, caracterizada pelas relações de pertencimento, afetividade, vivência cotidiana e identidade construída pelos indivíduos (ex.: a rua de infância, a casa, a aldeia); 3) Território: é o espaço delimitado e apropriado por relações de poder, domínio ou posse exercidas por um sujeito individual ou coletivo (como o Estado nacional, facções do crime organizado, empresas ou comunidades indígenas); 4) Região: é uma porção do espaço delimitada a partir de critérios de diferenciação e homogeneidade interna (físicos, econômicos ou culturais).",
    [
      "Espaço geográfico: produto social da relação dinâmica entre natureza e trabalho humano",
      "Paisagem: aquilo que os sentidos humanos apreendem (visão, sons, cheiros) — dimensão morfológica",
      "Lugar: dimensão afetiva, subjetiva, de identidade e vivência cotidiana dos indivíduos",
      "Território: delimitado por relações de poder, controle e fronteiras (estatais ou de grupos sociais)",
      "Região: diferenciação espacial delimitada por critérios de homogeneidade ou complementaridade"
    ],
    "Memorize a chave das categorias para o ENEM: Paisagem ➔ SENTIDOS e percepção visual; Lugar ➔ AFETO e pertencimento diário; Território ➔ PODER e controle social; Região ➔ HOMOGENEIDADE e planejamento.",
    "Um estudante redigiu em sua redação: 'Ao caminhar pela calçada da vila onde nasci e brinquei na infância, sinto um acolhimento imediato nas lembranças de vizinhos e cheiros da padaria local; porém, ao subir a rua principal, avisto as barricadas montadas por grupos armados que controlam militarmente quem pode entrar e sair do bairro sob toque de recolher estrito'.",
    "Os dois trechos sublinhados no relato do estudante correspondem rigorosamente e de forma sequencial às categorias geográficas de:",
    [
      "bioma e bacia hidrográfica sedimentar.",
      "continente geológico e zona abissal submarina.",
      "projeção conforme e escala cartográfica grande.",
      "lugar (vínculo afetivo e identitário) e território (espaço delimitado por relações de poder e controle).",
      "região geoeconômica e tempo meteorológico instável."
    ],
    3,
    "Alternativa correta: D. a primeira experiência descreve a categoria de 'lugar', caracterizada pela afetividade, memória, laços subjetivos e identidade pessoal; a segunda cena ilustra a categoria de 'território', definida classicamente por geógrafos como Claude Raffestin e Marcelo Lopes de Souza como o espaço delimitado, vigiado e apropriado pelo exercício do poder e do controle social (no caso, por grupos armados locais). As alternativas A, C, D e E misturam categorias analíticas com conceitos biogeográficos ou cartográficos inadequados."
  ],
  "Meio técnico-científico-informacional de Milton Santos": [
    "O geógrafo brasileiro Milton Santos formulou uma das mais influentes teorias da geografia crítica mundial sobre a periodização do espaço geográfico em três etapas históricas: 1) Meio Natural: a sociedade vivia subordinada aos ritmos e limitações biológicas da natureza, utilizando técnicas rudimentares de caça e agricultura primitiva; 2) Meio Técnico: com a Revolução Industrial, a paisagem é transformada pela proliferação de máquinas a vapor, ferrovias, portos e fábricas, impondo uma 'segunda natureza' mecanizada e artificial; 3) Meio Técnico-Científico-Informacional (período atual): consolidado a partir da década de 1970, caracteriza-se pela fusão orgânica entre a ciência, a tecnologia de ponta e a informação digital instantânea. Nesse meio, a informação atua como o vetor hegemônico que comanda a produção, as finanças e as telecomunicações. Esse meio distribui-se de modo desigual pelo planeta, gerando 'espaços luminosos' (hiperconectados e ricos em redes de fibra óptica) e 'espaços opacos' (marginalizados e desconectados dos fluxos da globalização).",
    [
      "Milton Santos: maior geógrafo brasileiro, laureado com o Prêmio Vautrin Lud (o 'Nobel da Geografia')",
      "Meio Natural: primazia das forças da natureza e técnicas agrícolas arcaicas",
      "Meio Técnico: proliferação das máquinas fabris e infraestrutura mecânica industrial",
      "Meio Técnico-Científico-Informacional: união indissociável de ciência, técnica e informática digital comandando o espaço",
      "Espaços luminosos vs opacos: os luminosos concentram fluxos e tecnologia; os opacos sofrem exclusão digital"
    ],
    "Para a redação e questões do ENEM: Milton Santos demonstrava que a globalização contemporânea é perversa porque se apresenta como uma fábula de integração universal, mas na prática aprofunda a desigualdade socioespacial entre os espaços que têm acesso ao meio técnico-científico-informacional e aqueles que dele são excluídos.",
    "Na obra 'A Natureza do Espaço', Milton Santos afirma que o meio geográfico contemporâneo é profundamente marcado pela indissociabilidade entre a produção científica avançada e a tecnologia da informação, de modo que objetos técnicos inteligentes e redes telemáticas condicionam o funcionamento das cidades e dos próprios campos agrícolas modernos.",
    "A denominação conceitual atribuída por Milton Santos a essa fase contemporânea do espaço geográfico globalizado é:",
    [
      "Meio Geológico Primitivo Arqueano.",
      "Território Feudal Coletivista Comunitário.",
      "Espaço Rural Autárquico Pré-Capitalista.",
      "Paisagem Natural Intangível Silvícola.",
      "Meio Técnico-Científico-Informacional."
    ],
    4,
    "Alternativa correta: E. Milton Santos cunhou a categoria do 'meio técnico-científico-informacional' para definir o atual estágio da globalização capitalista, no qual o espaço geográfico é permeado por objetos técnicos dotados de informação e inteligência artificial (satélites, fibras ópticas, computadores, sementes geneticamente modificadas) que operam em rede global. As alternativas A, C, D e E referem-se a eras geológicas remotas ou a modos de produção arcaicos que antecedem a revolução informacional moderna."
  ],
  "Chuva ácida e poluição do ar": [
    "A chuva ácida decorre da reação entre o vapor d'água atmosférico e óxidos ácidos liberados pela queima de combustíveis fósseis em refinarias, termelétricas e motores a combustão, principalmente o dióxido de enxofre (SO₂) e os óxidos de nitrogênio (NOx). Essa reação origina os ácidos sulfúrico (H₂SO₄) e nítrico (HNO₃), reduzindo o pH das precipitações abaixo de 5,6. A precipitação ácida provoca corrosão de monumentos históricos e estruturas metálicas, acidificação de corpos hídricos com mortandade de peixes, e corrosão da camada de cera das folhas das florestas, tornando a vegetação vulnerável a pragas e reduzindo a fertilidade dos solos por lixiviação de nutrientes minerais.",
    [
      "Chuva ácida: emissão de SO₂ e NOx por queima fóssil ➔ formação de H₂SO₄ e HNO₃ (pH < 5,6)",
      "Impactos: acidificação de lagos e solos, corrosão de monumentos de calcário e perda foliar em florestas",
      "Poluição transfronteiriça: poluentes emitidos em uma região industrial viajam com o vento e precipitam a centenas de km",
      "Solução técnica: filtros em chaminés industriais, transição para combustíveis de baixo enxofre e mobilidade elétrica"
    ],
    "Para o ENEM: a chuva ácida é um exemplo típico de poluição transfronteiriça; uma indústria poluente na Inglaterra ou nos EUA pode provocar chuva ácida e degradar florestas e lagos em países vizinhos (como na Escandinávia e Canadá).",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Gênese da Chuva Ácida</text><rect x='25' y='105' width='40' height='35' fill='#5B6785'/><line x1='35' y1='105' x2='35' y2='80' stroke='#D12D20' stroke-width='4'/><text x='15' y='75' font-size='9' fill='#D12D20' font-weight='700'>SO₂ e NOx</text><path d='M45 70 Q 120 40 180 50' stroke='#5B6785' stroke-width='2' stroke-dasharray='4' fill='none'/><ellipse cx='210' cy='50' rx='35' ry='20' fill='#9AA7C2'/><text x='185' y='54' font-size='9' fill='#14213D' font-weight='700'>H₂SO₄ + HNO₃</text><line x1='200' y1='75' x2='190' y2='115' stroke='#2F5BFF' stroke-width='2' stroke-dasharray='3'/><line x1='220' y1='75' x2='210' y2='115' stroke='#2F5BFF' stroke-width='2' stroke-dasharray='3'/><rect x='240' y='110' width='30' height='30' fill='#2E7D32' rx='4'/><text x='160' y='140' font-size='9' fill='#D12D20'>Corrosão de solo e biomassa</text></svg>Em bacias lacustres do sudeste canadense e em florestas da Europa Central, ecólogos constataram a acidificação severa de lagos e a redução drástica das populações de peixes nativos, embora as bacias afetadas não abrigassem indústrias em suas margens imediatas.",
    "A explicação biogeográfica para a ocorrência da degradação ecológica descrita em áreas florestais e corpos hídricos distantes dos polos emissores baseia-se na:",
    [
      "infiltração de correntes marinhas hipersalinas em lençóis freáticos interiores.",
      "interrupção da fotossíntese motivada pela extinção de fungos do solo florestal.",
      "emissão natural contínua de ácido clorídrico pela transpiração das árvores nativas locais.",
      "circulação atmosférica que transporta os gases precursores de ácidos por longas distâncias até a condensação e precipitação ácida.",
      "queda de meteoritos ricos em enxofre radioativo no subsolo dessas regiões temperadas."
    ],
    3,
    "Alternativa correta: D. A queima de combustíveis fósseis libera SO₂ e NOx, que são dispersados pelas massas de ar e ventos dominantes na troposfera por centenas de quilômetros; ao reagirem com as gotículas de vapor d'água das nuvens, formam ácidos fortes que precipitam sobre ecossistemas distantes das fontes emissoras (poluição transfronteiriça). As alternativas A, C, D e E trazem hipóteses sem respaldo geoquímico."
  ],
  "Inversão térmica e poluição urbana": [
    "A inversão térmica é um fenômeno meteorológico natural que ocorre com maior frequência nas madrugadas e manhãs frias de inverno em regiões de planalto, bacias e fundos de vale (como na Grande São Paulo). Em condições atmosféricas normais, o ar quente perto do solo sobe por convecção e o ar frio desce, permitindo a dispersão dos poluentes. Na inversão térmica, o solo perde calor rapidamente por irradiação noturna e resfria a camada de ar imediatamente sobre ele; uma camada de ar mais quente posiciona-se sobre essa camada fria superficial, atuando como uma 'tampa' térmica que impede a convecção. O ar fica estagnado e os poluentes emitidos por veículos e fábricas (monóxido de carbono, material particulado e ozônio troposférico) ficam retidos próximos ao solo, gerando fumaça cinzenta (smog) e agravando doenças respiratórias.",
    [
      "Inversão térmica: fenômeno meteorológico natural (ar frio aprisionado sob camada de ar quente)",
      "Condições favoráveis: madrugadas secas de inverno, pouco vento, relevo de vale e noites límpidas",
      "Smog fotoquímico: mistura tóxica de óxidos de nitrogênio, compostos orgânicos voláteis e ozônio troposférico sob luz solar",
      "Impacto social: explosão de internações hospitalares por bronquite, asma e rinite alérgica nas metrópoles"
    ],
    "Cuidado: a inversão térmica em si NÃO é provocada pela poluição; ela é um fenômeno natural do clima. A poluição humana torna a inversão perigosa porque fica presa junto ao solo sem se dispersar.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Inversão Térmica: Bloqueio Convectivo</text><rect x='30' y='40' width='260' height='25' fill='#9AA7C2' rx='4'/><text x='110' y='57' font-size='10' fill='#fff' font-weight='700'>Ar Frio Superior</text><rect x='30' y='70' width='260' height='25' fill='#FFB400' rx='4'/><text x='85' y='87' font-size='10' fill='var(--tx)' font-weight='700'>Camada de Ar Quente (Tampa)</text><rect x='30' y='100' width='260' height='35' fill='#5B6785' rx='4'/><text x='70' y='116' font-size='10' fill='#fff' font-weight='700'>Ar Frio Próximo ao Solo + Poluentes Retidos</text><text x='50' y='130' font-size='8' fill='#FF7A6B'>Falta de convecção acumula material particulado</text></svg>Nas manhãs de inverno na Região Metropolitana de São Paulo, uma espessa névoa cinzenta cobre a bacia sedimentar, coincidindo com picos nos atendimentos de emergência pediátrica por crises de asma e infecções das vias aéreas superiores.",
    "A dinâmica meteorológica que impede a dispersão vertical dos poluentes atmosféricos no cenário descrito é a:",
    [
      "ocorrência de ciclones extratropicais com ventanias constantes que dispersam a atmosfera.",
      "abertura temporária da camada de ozônio sobre as refinarias de petróleo litorâneas.",
      "elevação contínua da umidade relativa do ar provocada pelo derretimento de calotas polares.",
      "entrada da massa equatorial continental que carrega fumaça quente de queimadas da Patagônia.",
      "estagnação do ar frio denso na superfície coberto por uma camada de ar mais quente, inibindo os movimentos convectivos ascendentes."
    ],
    4,
    "Alternativa correta: E. Na inversão térmica, o ar em contato com o solo resfriado na madrugada de inverno torna-se mais denso e frio que a camada de ar imediatamente superior; essa sobreposição de ar quente sobre ar frio interrompe as correntes de convecção normais, represando a fuligem e os gases tóxicos na faixa habitada pelas pessoas. As alternativas A, C, D e E contêm explicações meteorologicamente falsas."
  ],
  "Pegada ecológica e biocapacidade": [
    "A Pegada Ecológica (Ecological Footprint) é uma métrica de contabilidade ambiental desenvolvida pela Global Footprint Network que calcula a área de terra e água biologicamente produtiva (expressa em hectares globais per capita - gha) necessária para produzir todos os recursos renováveis consumidos por uma população e absorver os resíduos que ela gera, com ênfase no dióxido de carbono. A Biocapacidade, por sua vez, expressa a capacidade dos ecossistemas de regenerar recursos e absorver carbono. Quando a pegada ecológica da humanidade ou de um país supera a biocapacidade disponível, instala-se o 'déficit ecológico' (ou 'Dia da Sobrecarga da Terra'), indicando que a sociedade está liquidando o capital natural do planeta em ritmo não sustentável. Os países ricos do Norte global possuem pegadas ecológicas desproporcionalmente gigantescas devido a padrões hiperconsumistas de energia, carnes e transportes individuais.",
    [
      "Pegada Ecológica: hectares globais (gha) necessários para sustentar o consumo e absorver resíduos",
      "Biocapacidade: capacidade biológica dos ecossistemas de fornecer recursos e absorver impactos",
      "Déficit Ecológico: pegada ecológica maior que a biocapacidade (consumo acima da regeneração)",
      "Dia da Sobrecarga da Terra: data do ano em que a humanidade consome tudo o que o planeta consegue regenerar em 12 meses"
    ],
    "Para o ENEM: a pegada ecológica denuncia a extrema desigualdade no consumo global; se toda a população do planeta consumisse recursos no padrão médio de um cidadão dos Estados Unidos ou do Catar, seriam necessários cerca de 5 planetas Terra para sustentar a demanda.",
    "Relatórios ambientais anuais da Global Footprint Network demonstram que, desde a década de 1970, a demanda da humanidade sobre os recursos naturais renováveis da biosfera ultrapassou a capacidade regenerativa anual da Terra, de modo que atualmente seriam necessários cerca de 1,7 planeta Terra para sustentar os padrões médios de consumo e emissão de carbono globais.",
    "A condição socioecológica que expressa a discrepância em que a demanda humana supera a capacidade de recomposição dos ecossistemas é definida como:",
    [
      "equilíbrio ecológico perene autoajustável.",
      "expansão ilimitada da biocapacidade dos oceanos polares.",
      "estagnação total da produção industrial global de commodities.",
      "déficit ecológico com sobrecarga dos serviços ecossistêmicos planetários.",
      "eliminação das pegadas de carbono pelo avanço da agricultura tradicional itinerante."
    ],
    3,
    "Alternativa correta: D. O déficit ecológico ocorre quando a Pegada Ecológica da população humana supera a biocapacidade da biosfera, forçando a degradação de florestas, a sobrepesca em oceanos e o acúmulo descontrolado de gases-estufa na atmosfera. As alternativas A, C, D e E trazem formulações incoerentes com os conceitos da economia ecológica."
  ],
  "Favelização e direito à moradia": [
    "A favelização é a manifestação mais aguda do déficit habitacional e da segregação socioespacial nas cidades brasileiras. O IBGE classifica as favelas como 'favelas e comunidades urbanas' (antigos aglomerados subnormais): assentamentos com precariedade de posse da terra, carência crônica de serviços públicos essenciais (saneamento, água encanada, coleta de lixo, iluminação e transporte público regular) e ocupação de terrenos geomorfologicamente frágeis (encostas íngremes de morros e margens alagáveis de córregos). O direito à moradia digna é um direito social fundamental previsto no Artigo 6º da Constituição Federal de 1988 e reiterado no Estatuto da Cidade (Lei nº 10.257/2001). A urbanização de favelas — por meio de contenção de encostas, regularização fundiária, saneamento básico integrado e abertura de áreas de convivência pública — contrapõe-se às antigas políticas estatais de remoção forçada e higienista, garantindo a permanência comunitária e o direito à cidade.",
    [
      "Favelas e comunidades urbanas: ocupações irregulares com carência de infraestrutura básica e serviços essenciais",
      "Artigo 6º da CF/88: moradia como direito social fundamental de todo cidadão brasileiro",
      "Urbanização de favelas: contenção de encostas, drenagem pluvial, saneamento e regularização da posse da terra",
      "Higienismo urbano histórico: remoções forçadas de cortiços e favelas centrais para embelezamento da cidade burguesa"
    ],
    "No ENEM, conecte as favelas com a autoconstrução e a história urbana: no início do século XX, a Reforma Pereira Passos no Rio de Janeiro demoliu cortiços centrais ('bota-abaixo') sem dar moradia alternativa, empurrando a população pobre para os morros e iniciando a expansão das favelas.",
    "O Censo Demográfico do IBGE identificou que mais de 16 milhões de brasileiros residem em comunidades e favelas, com forte concentração nas regiões metropolitanas de São Paulo, Rio de Janeiro, Belém e Salvador. Em diversos municípios, movimentos populares reivindicam a regularização fundiária e investimentos públicos em saneamento e contenção de encostas em vez da remoção compulsória de suas casas.",
    "A política pública urbanística orientada pelos princípios constitucionais do direito à cidade e da justiça socioespacial deve priorizar:",
    [
      "a urbanização integrada dos assentamentos populares com saneamento, contenção de áreas de risco e titulação fundiária.",
      "a expulsão imediata de todos os moradores das favelas para cidades agrícolas isoladas.",
      "o confinamento militar das comunidades por muralhas de concreto armado intransponíveis.",
      "a proibição de entrada de linhas de transporte coletivo e redes de energia nas periferias.",
      "a privatização de todas as ruas e travessas populares para cobrança de pedágios urbanos."
    ],
    0,
    "Alternativa correta: A. O Estatuto da Cidade e a Constituição preconizam a regularização fundiária de interesse social e a intervenção urbana sustentável nas favelas, dotando-as de redes de esgoto, contenção de encostas, água potável, postos de saúde e escolas, reconhecendo a legitimidade da moradia popular. As alternativas A, C, D e E propõem violações flagrantes de direitos humanos e medidas segregacionistas medievais."
  ],
  "Macrocefalia urbana e cidades globais": [
    "A macrocefalia urbana é a hipertrofia e desequilíbrio demográfico e funcional de uma grande cidade (frequentemente a metrópole principal) em relação ao restante da rede urbana do país ou região. Característica de países subdesenvolvidos e emergentes que passaram por urbanização tardia e acelerada, a macrocefalia decorre da incapacidade do sistema urbano e do mercado de trabalho de absorver dignamente o contingente expulso pelo êxodo rural, resultando em hipertrofia do setor terciário informal (vendedores ambulantes, camelôs, bicos), déficit habitacional massivo e saturação crônica de hospitais, escolas e vias de transporte. Paralelamente, no topo da hierarquia urbana mundial, situam-se as 'Cidades Globais' (ou metrópoles mundiais, como Nova York, Londres, Tóquio e, no Brasil, São Paulo): nós estratégicos de comando do capitalismo global que concentram bolsas de valores, sedes de corporações transnacionais, consultorias jurídicas, telecomunicações de ponta e aeroportos internacionais de conexões globais.",
    [
      "Macrocefalia urbana: hipertrofia desordenada de uma metrópole com saturação de serviços e explosão da informalidade",
      "Hipertrofia do terciário: expansão de empregos precários e bicos informais no comércio de rua",
      "Cidades Globais: polos de comando da economia mundial conectados por redes virtuais e financeiras (São Paulo)",
      "Primazia urbana: quando a maior cidade concentra uma parcela desmedida da população urbana total do país"
    ],
    "Diferença essencial para o ENEM: Megacidade é um critério estritamente demográfico (aglomeração urbana com mais de 10 milhões de habitantes, como São Paulo, Mumbai, Cairo); Cidade Global é um critério qualitativo e econômico de comando e influência financeira no planeta.",
    "Na classificação de centros urbanos elaborada por Saskia Sassen e por redes internacionais de estudos urbanos, a cidade de São Paulo é reconhecida como a principal Cidade Global da América do Sul, polarizando fluxos financeiros e telecomunicações que ligam o continente às bolsas de valores de Nova York e Londres, ao mesmo tempo em que vivencia problemas históricos decorrentes da macrocefalia urbana em sua mancha periférica.",
    "O atributo funcional que qualifica a metrópole de São Paulo como uma Cidade Global de comando estratégico reside na sua:",
    [
      "dedicação exclusiva à produção agrária de cana-de-açúcar orgânica em propriedades comunais.",
      "erradicação absoluta de todas as formas de trabalho informal e de problemas habitacionais em sua periferia.",
      "ausência completa de conexões aeroportuárias ou de fibra óptica com outros países do globo.",
      "concentração de sedes de multinacionais, bolsas de valores, escritórios de finanças e serviços avançados conectados aos fluxos mundiais de capital.",
      "subordinação administrativa direta a tribunais municipais de capitais rurais do interior amazônico."
    ],
    3,
    "Alternativa correta: D. Uma Cidade Global se define pelo seu poder de articulação e comando na economia mundial: abriga a B3 (Bolsa de Valores), centros financeiros, bancos globais, agências de publicidade e escritórios de auditoria que coordenam investimentos transnacionais. A alternativa A erra porque São Paulo é urbano-financeira. A C contradiz a conectividade da cidade. A D é falsa, pois a desigualdade urbana é marcante. A E é geograficamente descabida."
  ],
  "Gentrificação e revitalização urbana": [
    "A gentrificação (do inglês gentry, nobreza) é o processo de transformação socioespacial de bairros populares, operários, áreas centrais históricas ou zonas portuárias degradadas por meio de reformas urbanísticas, restauros arquitetônicos e implantação de novos equipamentos culturais e comerciais de alto padrão. Essa 'revitalização' atrai investimentos imobiliários privados e eleva acentuadamente o preço do solo, os aluguéis, o IPTU e o custo dos serviços locais. Como resultado direto, os antigos moradores de baixa renda e pequenos comerciantes tradicionais são economicamente expulsos dessas áreas para periferias ainda mais distantes por não conseguirem arcar com o novo custo de vida, sendo o espaço apropriado por classes sociais de maior poder aquisitivo. Exemplos no Brasil incluem o Porto Maravilha no Rio de Janeiro, o Pelourinho em Salvador e intervenções em bairros boêmios de capitais metropolitanas.",
    [
      "Gentrificação: valorização imobiliária e elitização de bairros populares centrais ou históricos",
      "Expulsão econômica: moradores pobres saem não por decreto, mas pela alta de aluguéis e do custo de vida",
      "Porto Maravilha (RJ) e Pelourinho (BA): intervenções urbanísticas com forte viés turístico e especulativo",
      "Cidade-mercadoria: espaço público produzido e remodelado para o consumo de classes médias e turistas"
    ],
    "Para a redação e para a prova de Humanas do ENEM: o termo 'revitalização' muitas vezes esconde uma armadilha ideológica; dizer que um bairro precisa ser 'revitalizado' pressupõe que ele não tinha vida antes, ignorando a história, o pertencimento e os moradores populares que já viviam ali.",
    "Projetos de reurbanização de antigos galpões industriais e docas portuárias desativadas em uma capital brasileira transformaram armazéns históricos em museus, galerias de arte, cafés sofisticados e torres empresariais espelhadas. Dois anos após as obras, o valor do metro quadrado triplicou, e a maior parte das famílias que alugavam sobrados populares no bairro mudou-se para loteamentos periféricos fora da cidade polo.",
    "A dinâmica de transformação socioespacial descrita no texto expressa um clássico processo de:",
    [
      "gentrificação, marcada pela valorização imobiliária seletiva e substituição de classes sociais no espaço urbano central.",
      "reforma agrária urbana cooperativa com subsídios para habitação camponesa.",
      "êxodo rural forçado em direção a reservas ecológicas florestais intocadas.",
      "macrocefalia agrária decorrente do fechamento de indústrias calçadistas litorâneas.",
      "distribuição paritária de moradias gratuitas para a totalidade dos trabalhadores precarizados."
    ],

  "Sistemas agrícolas: intensivo e extensivo": [
    "Os sistemas agrícolas classificam-se fundamentalmente segundo o grau de capitalização, uso de tecnologia e produtividade da terra e do trabalho em dois grandes grupos: 1) Sistema Intensivo: caracterizado por elevado investimento de capital por hectare, emprego maciço de tecnologias avançadas (mecanização, sementes transgênicas, fertilizantes químicos, biotecnologia e irrigação de precisão) e alta produtividade por área, utilizando pouca mão de obra direta (típico do agronegócio de grãos no Centro-Oeste e de cinturões verdes tecnificados); 2) Sistema Extensivo: caracterizado por baixo investimento de capital e insumos técnicos por hectare, técnicas tradicionais ou rudimentares (rotação de terras, pousio, tração animal, queimada para limpeza de terreno) e baixa produtividade por área, dependendo da fertilidade natural do solo e exigindo grandes extensões de terra (como a pecuária bovina extensiva em pastos nativos e a agricultura camponesa de subsistência itinerante).",
    [
      "Agricultura Intensiva: muito capital, alta tecnologia (sementes, maquinário), alta produtividade por hectare",
      "Agricultura Extensiva: pouco capital, técnicas tradicionais, baixa produtividade por hectare, dependente da natureza",
      "Pousio: tempo de descanso da terra para recomposição natural dos nutrientes do solo",
      "Plantation histórica: latifúndio monocultor, escravista e voltado à exportação no período colonial"
    ],
    "Cuidado: 'extensivo' não significa necessariamente propriedade pequena! A pecuária bovina no Pantanal ou na Amazônia é extensiva porque o gado fica solto em pastagens gigantescas com baixíssimo uso de tecnologia por hectare.",
    "Em uma fazenda no Mato Grosso, computadores de bordo em tratores guiados por sinal de satélite realizam a aplicação georreferenciada de defensivos em taxas variáveis conforme o mapa de fertilidade do solo, colhendo mais de 65 sacas de soja por hectare. A centenas de quilômetros dali, um pequeno posseiro utiliza enxada e queimada de capoeira com descanso da terra de três anos para cultivar milho e mandioca com baixa produtividade.",
    "Os dois modelos produtivos representados no trecho correspondem, respectivamente, a sistemas agrícolas do tipo:",
    [
      "extensivo tradicional e plantation colonial escravista.",

      "orgânico agroflorestal mecanizado e agroecologia familiar cooperativa de alta precisão.",
      "itinerante de subsistência urbana e jardinagem asiática de inundação permanente.",
      "hidropônico de estufa fria e pecuária leiteira confinado intensiva."

  ],
  "Trabalho análogo à escravidão no campo": [
    "O trabalho análogo à escravidão no Brasil contemporâneo não se confunde com a escravidão jurídica colonial (que foi formalmente extinta pela Lei Áurea em 1888), mas caracteriza-se por condições degradantes que violam a dignidade humana. O Artigo 149 do Código Penal Brasileiro define o crime de redução a condição análoga à de escravo por quatro situações fundamentais: 1) submissão a trabalhos forçados; 2) submissão a jornada exaustiva que ameace a integridade física; 3) sujeição a condições degradantes de alojamento, higiene e alimentação; 4) restrição de locomoção por dívida contraída com o empregador ou preposto (o 'gato'), que cobra preços exorbitantes por transporte, ferramentas e comida ('truck system'). As fiscalizações móveis do Ministério do Trabalho e Emprego resgatam milhares de trabalhadores anualmente, concentrando-se na pecuária bovina, desmatamento para pastagem, colheitas temporárias de cana, café e na construção civil.",
    [
      "Artigo 149 do Código Penal: trabalho forçado, jornada exaustiva, condições degradantes e servidão por dívida",
      "O 'gato': intermediário aliciador de mão de obra que engana trabalhadores com falsas promessas de salário",
      "Servidão por dívida: retenção de documentos e desconto arbitrário de comida superfaturada, impedindo a saída do trabalhador",
      "Lista Suja do Trabalho Escravo: cadastro público de empregadores autuados que sofrem bloqueio de crédito em bancos públicos"
    ],
    "Para a redação e para as questões de Ciências Humanas do ENEM: não é necessária a presença de correntes físicas ou cárcere armado para configurar escravidão moderna; a retenção de documentos e a imposição de dívidas fraudulentas com alojamentos desumanos e sem água potável bastam para tipificar o crime.",
    "Durante operação do Grupo Especial de Fiscalização Móvel em uma fazenda de gado no Pará, auditores fiscais constataram trabalhadores alojados em barracos de lona sem água potável, sem instalações sanitárias e consumindo água da mesma poça utilizada pelo gado, impedidos de deixar a propriedade sob a alegação de que acumulavam dívidas impagáveis de alimentação e ferramentas com o encarregado da fazenda.",
    "A prática descrita enquadra-se juridicamente e sociologicamente como trabalho análogo à escravidão na modalidade de:",
    [
      "servidão por dívida combinada a condições degradantes de alojamento e labor.",
      "trabalho temporário com benefícios de previdência complementar.",
      "aprendizagem profissional juvenil monitorada por sindicatos rurais autônomos.",
      "parceria agrícola societária com divisão equitativa do lucro pecuário final.",
      "cooperativismo agrário familiar subsidiado pelo Banco da Amazônia."
    ],
    0,
    "Alternativa correta: A. A situação descrita reúne os elementos tipificados no Artigo 149 do Código Penal: condições degradantes de vida e trabalho (falta de saneamento básico e água potável) associadas à servidão por dívida, mecanismo no qual o trabalhador é mantido preso à propriedade por cobranças forjadas de transporte e comida. As alternativas A, C, D e E tentam maquiar o crime como relação de trabalho legal ou cooperativa."
  ],
  "Agroecologia e agricultura sustentável": [
    "A agroecologia é o campo da ciência agronômica e do movimento social que integra princípios ecológicos, agronômicos e socioculturais para o desenho e manejo de agroecossistemas sustentáveis. Contrapõe-se frontalmente ao modelo da Revolução Verde: elimina o uso de agrotóxicos químicos sintéticos e adubos nitrogenados industriais, rejeita sementes transgênicas, valoriza sementes crioulas ancestrais e adota adubação orgânica, compostagem, controle biológico de pragas e conservação da biodiversidade do solo. Destacam-se os Sistemas Agroflorestais (SAFs), que consorciam espécies agrícolas (hortaliças, grãos, frutas) com árvores nativas em múltiplos estratos, imitando a estrutura da floresta natural. A agroecologia fortalece a soberania alimentar da agricultura familiar, recupera bacias hidrográficas assoreadas, sequestra carbono da atmosfera no solo e gera alimentos saudáveis livres de resíduos tóxicos.",
    [
      "Agroecologia: matriz ecológica sem agrotóxicos ou transgênicos, focada na harmonia com os ciclos naturais",
      "Sistemas Agroflorestais (SAFs): consórcio de árvores florestais com culturas agrícolas imitando a floresta",
      "Controle biológico de pragas: uso de predadores naturais e bioinsumos no lugar de pesticidas químicos",
      "Sementes crioulas: variedades tradicionais adaptadas localmente e preservadas por comunidades camponesas"
    ],
    "Para o ENEM: a agroecologia prova que é possível produzir alimentos em alta escala regenerando a natureza; enquanto a monocultura degrada o solo e precisa de veneno químico, o SAF recupera a fertilidade natural da terra através da matéria orgânica das árvores consorciadas.",
    "Em um assentamento de reforma agrária, famílias camponesas implantaram Sistemas Agroflorestais (SAFs), plantando feijão, milho e mandioca intercalados com mudas de árvores frutíferas e espécies arbóreas nativas da Mata Atlântica. Em cinco anos, o solo antes compactado recuperou a umidade, nascentes de água voltaram a brotar na encosta e a produção de alimentos diversificados foi direcionada para a merenda escolar do município.",
    "O benefício ecológico e agronômico estrutural gerado pela adoção do modelo agroflorestal reside na:",
    [
      "eliminação da biodiversidade vegetal para acelerar a queima mecânica da palhada com lança-chamas.",
      "reprodução da estratificação da floresta nativa, promovendo a ciclagem natural de nutrientes e a conservação da água no solo.",
      "exigência do aumento anual na aplicação de herbicidas sintéticos importados da Ásia.",
      "proibição do cultivo de alimentos destinados ao consumo humano na propriedade rural.",
      "transformação definitiva do solo em lajedos rochosos cristalinos estéreis."
    ],
    1,
    "Alternativa correta: B. Os Sistemas Agroflorestais consorciam árvores e cultivos agrícolas em diferentes andares de copa (estratos), imitando o ecossistema florestal; as folhas que caem protegem o solo do sol e da chuva, enriquecem a terra com matéria orgânica e retêm umidade, recuperando nascentes e dispensando fertilizantes químicos sintéticos. As alternativas A, C, D e E descrevem agressões ambientais opostas à agroecologia."
  ],
  "Neoliberalismo e Consenso de Washington": [
    "O Neoliberalismo é a doutrina político-econômica que defende a redução do papel do Estado na economia e a desregulamentação máxima dos mercados, ganhando hegemonia global a partir das décadas de 1970 e 1980 com os governos de Margaret Thatcher (Reino Unido) e Ronald Reagan (EUA). Em 1989, economistas do FMI, Banco Mundial e Tesouro norte-americano formularam o 'Consenso de Washington', receituário de reformas estruturais prescrito aos países em desenvolvimento da América Latina e do Leste Europeu para renegociação de suas dívidas externas. O pacote neoliberal exigia: 1) privatização de empresas estatais de energia, telecomunicações e transportes; 2) desregulamentação financeira e comercial (abertura aos produtos e capitais estrangeiros); 3) flexibilização das leis trabalhistas; 4) austeridade fiscal com corte de gastos públicos em saúde e educação. No Brasil, o neoliberalismo foi adotado nos governos Collor e FHC (anos 1990), atraindo capital externo mas ampliando o desemprego estrutural e a vulnerabilidade externa.",
    [
      "Neoliberalismo: Estado mínimo na economia, livre mercado e supremacia do capital financeiro",
      "Consenso de Washington (1989): privatizações, abertura comercial, austeridade fiscal e desregulamentação financeira",
      "Privatizações no Brasil dos anos 1990: Vale do Rio Doce, Telebrás, CSN e distribuidoras de energia",
      "Impactos sociais: desmonte de serviços públicos universais, flexibilização do trabalho e aumento da informalidade"
    ],
    "Para o ENEM: a política neoliberal preconiza o 'Estado Mínimo' para investimentos sociais e controle do mercado, mas frequentemente intervém de forma 'máxima' para socorrer bancos e grandes empresas falimentares em momentos de crise financeira global.",
    "Durante a década de 1990, sob a influência das diretrizes do Consenso de Washington, o governo federal brasileiro transferiu o controle acionário de grandes corporações estatais estratégicas (como a Companhia Vale do Rio Doce e o sistema Telebrás de telecomunicações) para consórcios privados nacionais e internacionais.",
    "A justificativa ideológica e econômica adotada pelos formuladores do receituário neoliberal para defender o programa de privatizações afirmava que a medida:",
    [
      "reduziria o endividamento público e promoveria maior eficiência e investimentos mediante a livre concorrência de mercado.",
      "aumentaria o controle estatal direto sobre a fixação dos preços dos bens de primeira necessidade.",
      "garantiria a estabilidade de emprego vitalício para todos os trabalhadores fabris do país.",
      "proibiria a remessa de lucros de corporações transnacionais para suas matrizes no exterior.",
      "fecharia as fronteiras nacionais a qualquer tipo de produto importado por tempo indeterminado."
    ],
    0,
    "Alternativa correta: A. A retórica neoliberal sustentava que as empresas estatais eram ineficientes e sobrecarregavam o caixa do governo; a venda ao setor privado (privatização) serviria para quitar dívidas públicas, modernizar a infraestrutura com capital internacional e baixar custos ao consumidor via concorrência (embora muitas vezes tenha gerado oligopólios privados). As alternativas A, C, D e E trazem premissas socialistas ou protecionistas opostas ao livre-mercado."
  ],
  "Organismos internacionais: ONU, OMC e FMI": [
    "A arquitetura institucional e financeira da governança global foi desenhada majoritariamente no pós-Segunda Guerra Mundial para regular as relações interestatais e conter crises sistêmicas. Em 1944, a Conferência de Bretton Woods criou o Fundo Monetário Internacional (FMI), voltado a conceder empréstimos a países com crises no balanço de pagamentos em troca de rigorosas reformas fiscais ortodoxas, e o Banco Mundial (BIRD), voltado a empréstimos para infraestrutura e desenvolvimento. Em 1945, foi fundada a Organização das Nações Unidas (ONU), cuja estrutura de segurança é dominada pelo Conselho de Segurança (com 5 membros permanentes detentores de poder de veto: EUA, Rússia, China, Reino Unido e França). Em 1995, o antigo GATT foi substituído pela Organização Mundial do Comércio (OMC), com a missão de mediar disputas comerciais multilaterais, combater subsídios desleais e liberalizar fluxos de mercadorias no planeta.",
    [
      "FMI e Banco Mundial: criados em Bretton Woods (1944) sob hegemonia do dólar e do modelo ocidental",
      "Conselho de Segurança da ONU: 5 membros permanentes com poder de veto (EUA, Rússia, China, Reino Unido e França)",
      "OMC (1995): tribunal multilateral de comércio que julga barreiras alfandegárias, dumping e subsídios agrícolas ilegais",
      "Reforma da governança global: demanda dos países emergentes (como o Brasil) por ampliação dos assentos no Conselho de Segurança da ONU"
    ],
    "Para o ENEM, guarde as disputas agrícolas na OMC: o Brasil já ganhou disputas históricas na OMC contra subsídios agrícolas dados pelos EUA a produtores de algodão e pela União Europeia a produtores de açúcar, que barateavam artificialmente seus produtos e prejudicavam exportadores do Sul global.",
    "O governo brasileiro acionou o Órgão de Solução de Controvérsias da Organização Mundial do Comércio (OMC) para contestar subsídios estatais ilegais e barreiras tarifárias protecionistas aplicadas por nações ricas sobre commodities agrícolas nacionais, obtendo pareceres favoráveis que autorizaram retaliações comerciais legítimas.",
    "O papel institucional da OMC no comércio internacional contemporâneo consiste fundamentalmente em:",
    [
      "impor o embargo naval de guerra a países que adotam energia eólica em suas matrizes.",
