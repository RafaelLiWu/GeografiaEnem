    "Durante as negociações climáticas multilaterais da ONU, representantes de nações insulares e de países em desenvolvimento destacaram que os custos da adaptação climática recaem desproporcionalmente sobre populações que historicamente pouco contribuíram para a elevação dos gases-estufa acumulados na atmosfera desde a Primeira Revolução Industrial.",
    "O princípio jurídico-político internacional que embasa essa demanda por justiça climática e financiamento internacional é o da:",
    [
      "responsabilidades comuns, porém diferenciadas, considerando o histórico de emissões e as capacidades econômicas de cada país.",
      "responsabilidade estrita e idêntica aplicada de modo linear a todas as economias mundiais sem ponderação histórica.",
      "precaução militar para intervenção em reservas florestais internacionais sob controle dos países membros do G7.",
      "isenção total e perpétua de qualquer compromisso ecológico para nações produtoras de combustíveis hidrocarbonetos.",
      "soberania irrestrita e exclusiva de cada Estado-membro sobre o ar atmosférico circunscrito à sua fronteira nacional."
    ],
    0,
    "Alternativa correta: A. o princípio das 'responsabilidades comuns, porém diferenciadas' reconhece que a proteção do sistema climático é um dever compartilhado por todos os países, mas os países desenvolvidos, que se industrializaram primeiro e acumularam gases-estufa na atmosfera durante mais de dois séculos, devem liderar o financiamento e a redução de emissões. A alternativa A desconsidera que a atmosfera é um bem comum global. A B ignora as disparidades históricas. A C e a D defendem teses militaristas ou negacionistas sem respaldo nos tratados diplomáticos."
  ],
  "Conflitos socioambientais e desenvolvimento sustentável": [
    "O conceito de desenvolvimento sustentável, consagrado no Relatório Brundtland ('Nosso Futuro Comum', 1987), propõe suprir as necessidades da geração presente sem comprometer a capacidade das gerações futuras de suprirem suas próprias necessidades. Ele envolve o equilíbrio entre eficiência econômica, justiça social e conservação ambiental. No Brasil, o avanço da fronteira mineral e agropecuária gera graves conflitos socioambientais com comunidades tradicionais (indígenas, quilombolas, ribeirinhos, seringueiros e caiçaras), que praticam manejo de baixo impacto e dependem da posse e integridade do território para a sua reprodução física e cultural. O conceito de 'racismo ambiental' denuncia que impactos e passivos ecológicos recaem predominantemente sobre grupos vulneráveis.",
    [
      "Desenvolvimento sustentável: tripé social, ambiental e econômico (Triple Bottom Line)",
      "Comunidades tradicionais: povos com modos de vida integrados aos biomas nativos (Art. 231 CF e Convenção 169 OIT)",
      "Unidades de Conservação (SNUC): Proteção Integral (ex.: Parques Nacionais) e Uso Sustentável (ex.: Reservas Extrativistas)",
      "Racismo ambiental: concentração desproporcional de rejeitos, aterros e poluição em territórios de minorias e periferias"
    ],
    "Lembre-se da criação das Reservas Extrativistas (RESEX), idealizadas por Chico Mendes: são Unidades de Uso Sustentável onde a terra permanece pública e as comunidades exercem o direito de extrativismo tradicional sustentável.",
    "O Sistema Nacional de Unidades de Conservação (SNUC, Lei nº 9.985/2000) divide as áreas protegidas em dois grandes grupos: Unidades de Proteção Integral (onde se permite apenas o uso indireto dos recursos naturais, como pesquisa e turismo ecológico) e Unidades de Uso Sustentável (onde se compatibiliza a conservação da natureza com o uso sustentável de parcela dos recursos). Em uma região amazônica de floresta primária, famílias de extrativistas seringueiros e castanheiros reivindicam a titulação coletiva para garantir o manejo sustentável frente ao avanço de madeireiras clandestinas.",
    "A categoria de Unidade de Conservação legalmente vocacionada para atender aos direitos territoriais e ao modo de vida dessas populações tradicionais é a:",
    [
      "Estação Ecológica.",
      "Reserva Extrativista.",
      "Área de Proteção Ambiental restrita a monoculturas intensivas.",
      "Reserva Biológica.",
      "Monumento Natural Intangível."
    ],
    1,
    "Alternativa correta: B. a Reserva Extrativista (RESEX) é uma Unidade de Uso Sustentável destinada a salvaguardar o modo de vida e a cultura de populações tradicionais extrativistas, permitindo a extração racional dos recursos (como borracha e castanha) sem devastação da floresta. As alternativas A e B são Unidades de Proteção Integral que proíbem habitação humana e uso direto dos recursos naturais. A alternativa C distorce a finalidade de preservação ambiental. A E refere-se a monumentos naturais, voltados a sítios geológicos de rara beleza cênica."
  ],
  "Urbanização brasileira e mundial": [
    "A urbanização é o processo demográfico e socioespacial caracterizado pelo crescimento do percentual da população residente nas cidades em ritmo superior ao da população do campo, derivado fundamentalmente do êxodo rural. No Brasil, esse processo intensificou-se vigorosamente a partir da década de 1950, estimulado pela industrialização concentrada no Sudeste e pela modernização conservadora da agricultura, que expeliu milhões de camponeses. O país tornou-se majoritariamente urbano no início da década de 1970 (conforme os Censos Demográficos do IBGE) e atualmente ultrapassa 85% de taxa de urbanização, caracterizando-se por um modelo rápido, desordenado e marcado por carências agudas de infraestrutura básica.",
    [
      "Urbanização: taxa de população urbana crescendo mais que a rural",
      "Crescimento urbano: expansão territorial e demográfica da mancha da cidade",
      "Êxodo rural: migração em massa do campo para a cidade (fatores de atração industrial e repulsão no campo)",
      "Década de 1970: Brasil atinge mais de 50% de população residente em cidades"
    ],
    "Distinga com clareza: urbanização NÃO é o mero crescimento físico da cidade (expansão urbana), mas sim o aumento da proporção de moradores urbanos em relação ao total da população do país.",
    "<svg viewBox='0 0 320 160' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='160' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Evolução da População Urbana no Brasil (IBGE)</text><line x1='40' y1='130' x2='290' y2='130' stroke='var(--ln)' stroke-width='2'/><line x1='40' y1='30' x2='40' y2='130' stroke='var(--ln)' stroke-width='2'/><text x='15' y='40' font-size='9' fill='var(--mu)'>100%</text><text x='20' y='80' font-size='9' fill='var(--mu)'>50%</text><text x='25' y='130' font-size='9' fill='var(--mu)'>0%</text><path d='M40 100 Q 140 85 190 60 T 290 42' fill='none' stroke='#2F5BFF' stroke-width='3'/><circle cx='40' cy='100' r='4' fill='#2F5BFF'/><text x='40' y='145' font-size='9' fill='var(--mu)'>1940 (31%)</text><circle cx='180' cy='67' r='4' fill='#FFB400'/><text x='155' y='145' font-size='9' fill='var(--tx)' font-weight='700'>1970 (~56%)</text><circle cx='290' cy='42' r='4' fill='#2F5BFF'/><text x='255' y='145' font-size='9' fill='var(--mu)'>2022 (~87%)</text></svg>Entre as décadas de 1950 e 1980, o território brasileiro passou por uma drástica reconfiguração espacial decorrente da transferência de mais de 30 milhões de pessoas das zonas rurais para as capitais e regiões metropolitanas. Esse movimento populacional vertiginoso gerou a formação de extensas periferias desprovidas de serviços de saneamento, transporte coletivo e habitação digna.",
    "O principal fator de repulsão no campo que catalisou a intensa onda migratória para os centros urbanos brasileiros no período citado foi a:",
    [
      "adoção generalizada da agricultura orgânica agroecológica com eliminação de agrotóxicos.",
      "reforma agrária distributiva promovida pelo Estatuto da Terra que fixou o pequeno camponês no solo.",
      "desregulamentação do trabalho urbano no setor de serviços que gerou pleno emprego no campo.",
      "mecanização das lavouras em latifúndios monocultores combinada à elevada concentração da propriedade da terra.",
      "proibição legal de investimentos industriais na Região Sudeste do país imposta pelos governos militares."
    ],
    3,
    "Alternativa correta: D. a chamada 'modernização conservadora' introduziu tratores, colheitadeiras e insumos químicos nas grandes propriedades rurais exportadoras sem alterar a estrutura concentrada da posse da terra; isso desempregou meeiros, posseiros e assalariados rurais, forçando-os a migrar para as cidades. A alternativa A cita a agroecologia, que preserva mão de obra e não causou êxodo. A B erra ao dizer que houve reforma agrária ampla (o Estatuto da Terra de 1964 não desconcentrou a posse da terra). A D e a E trazem proposições historicamente incorretas e contraditórias com o crescimento industrial do Sudeste."
  ],
  "Metropolização e conurbação": [
    "A metropolização consiste na concentração demográfica, política, financeira e de serviços avançados em torno de uma cidade principal (metrópole), que passa a exercer comando e polarização sobre dezenas de municípios adjacentes. Quando o crescimento territorial dessas cidades limítrofes é tão contínuo que as suas manchas urbanas se unem fisicamente, ocorre o fenômeno da conurbação. Esse tecido urbano conurbado dá origem às Regiões Metropolitanas (instituídas para planejar serviços públicos de interesse comum, como transporte intermunicipal, destinação de lixo e saneamento) e gera fluxos diários intensos de trabalhadores, conhecidos como migração pendular.",
    [
      "Conurbação: união física das manchas urbanas de dois ou mais municípios vizinhos",
      "Região Metropolitana: conjunto de municípios integrados socioeconomicamente a uma cidade polo",
      "Migração pendular: deslocamento diário de ida e volta entre cidade de moradia e cidade de trabalho",
      "Megalópole: união e integração de duas ou mais metrópoles (ex.: Bos-Wash nos EUA e Tokaido no Japão)"
    ],
    "Cuidado: conurbação é um fenômeno espacial e físico (as cidades se encostam e fundem seus perímetros), enquanto migração pendular é um movimento demográfico diário entre cidades.",
    "Dois municípios limítrofes na Baixada Fluminense apresentaram contínua expansão de loteamentos habitacionais e eixos viários, a ponto de ser impossível para o cidadão comum identificar fisicamente onde termina o território de um e começa o do outro, restando apenas placas viárias limítrofes. Todos os dias, às 5h30, trens e ônibus lotados transportam centenas de milhares de trabalhadores dessas localidades rumo ao centro da capital estadual, retornando no final da tarde.",
    "Os dois fenômenos geográficos descritos no trecho — o primeiro de natureza morfológica urbana e o segundo de caráter de mobilidade populacional — correspondem, respectivamente, à:",
    [
      "gentrificação e à transumância pastoril.",
      "segregação étnica e ao êxodo rural forçado.",
      "macrocefalia urbana e ao nomadismo sazonal.",
      "conurbação e à migração pendular.",
      "favelização horizontal e à desmetropolização periférica."
    ],
    3,
    "Alternativa correta: D. a junção física contínua das manchas urbanas de cidades vizinhas denomina-se conurbação; o deslocamento diário de ida e volta por motivos de estudo ou trabalho denomina-se migração pendular. A alternativa A erra porque gentrificação é a valorização e elitização de bairros degradados e transumância é migração sazonal ligada ao clima ou pastoreio. A C cita nomadismo (não há nomadismo diário com trens urbanos). A D cita êxodo rural (o texto trata de deslocamentos urbanos cotidianos). A E confunde conceitos funcionais com categorias estruturais."
  ],
  "Segregação socioespacial e periferização": [
    "A segregação socioespacial expressa a materialização das desigualdades de classe no espaço geográfico das cidades. Em virtude da especulação imobiliária e da atuação seletiva dos investimentos estatais em infraestrutura (iluminação, asfalto, redes de água, metrô e saneamento), as classes de maior renda ocupam as áreas centrais e vetorizadas mais bem providas de serviços e lazer, enquanto as famílias de baixa renda são empurradas para as periferias distantes ou para terrenos geomorfologicamente frágeis e de risco, como encostas íngremes de morros e planícies de inundação (favelas e ocupações irregulares). O processo de gentrificação aprofunda esse quadro ao reurbanizar áreas degradadas para o consumo de classes médias e altas, expulsando os antigos moradores por aumento do custo de vida.",
    [
      "Segregação socioespacial: divisão física do espaço urbano segundo a renda das classes sociais",
      "Especulação imobiliária: retenção de terrenos ociosos à espera de valorização gerada por obras públicas",
      "Áreas de risco: encostas sujeitas a escorregamentos e várzeas sujeitas a inundações",
      "Gentrificação: enobrecimento e elitização de bairros populares centrais ou portuários"
    ],
    "No ENEM, relacione desastres 'naturais' (deslizamentos e enchentes) com vulnerabilidade social: o evento hidrometeorológico é natural, mas o desastre é uma construção social gerada pela segregação espacial.",
    "O Estatuto da Cidade (Lei nº 10.257/2001) define instrumentos urbanísticos como o Plano Diretor participativo e o Imposto Predial e Territorial Urbano (IPTU) progressivo no tempo para imóveis subutilizados, visando assegurar a função social da propriedade urbana e combater a retenção especulativa de vazios urbanos em áreas providas de redes de infraestrutura.",
    "A reprodução do modelo de periferização nas grandes metrópoles brasileiras decorre preponderantemente da dinâmica em que:",
    [
      "o Estado direciona a maior parte dos investimentos em transporte sobre trilhos e saneamento para as áreas rurais periféricas.",
      "o mercado imobiliário retém áreas centrais equipadas para valorização, induzindo o assentamento das classes populares em áreas desprovidas de serviços.",
      "as famílias de menor poder aquisitivo preferem residir em topos de morros declivosos por razões de preservação bioclimática.",
      "o Plano Diretor municipal obriga legalmente a dispersão das moradias unifamiliares ao longo das fronteiras estaduais.",
      "a ausência total de leis de uso e ocupação do solo impede qualquer diferenciação no preço do metro quadrado construído."
    ],
    1,
    "Alternativa correta: B. a lógica da produção capitalista da cidade combina a especulação da terra urbana (que encarece terrenos bem localizados e dotados de infraestrutura) com a omissão estatal, forçando as populações mais pobres a autoconstruir em periferias desprovidas de saneamento ou em áreas ambientais impróprias à ocupação segura. A alternativa A erra pois o Estado historicamente privilegia os bairros nobres com obras de vulto. A C culpabiliza a vítima e desconsidera a falta de alternativa financeira. A D e a E contêm assertivas fictícias e juridicamente inverídicas."
  ],
  "Mobilidade urbana e transportes": [
    "A mobilidade urbana nas metrópoles brasileiras é historicamente marcada pelo privilégio dado ao transporte individual motorizado (automóveis) em detrimento do transporte público coletivo (metrô, trens, BRT, ônibus) e dos modos ativos (pedestres e ciclovias). Esse modelo rodoviarista, consolidado desde a implantação da indústria automobilística na era JK (1956-1961), acarreta congestionamentos diários crônicos, poluição atmosférica por queima de combustíveis fósseis, elevados custos econômicos com tempo perdido no trânsito e ampliação da segregação socioespacial, visto que os trabalhadores que residem nas periferias chegam a gastar mais de 4 horas por dia em deslocamentos pendulares precarizados.",
    [
      "Modelo rodoviarista: priorização de vias expressas, viadutos e compra de veículos privados",
      "Transporte de massa sobre trilhos: alta capacidade de passageiros, menor emissão de poluentes e menor tempo de viagem",
      "Mobilidade ativa: calçadas acessíveis e ciclovias integradas a terminais intermodais",
      "Tarifa zero / subsídio público: instrumentos para viabilizar o direito social ao transporte (Art. 6º da CF)"
    ],
    "Para o ENEM, lembre-se: a solução sustentável para a mobilidade metropolitana não é alargar ruas e construir mais túneis (o que gera tráfego induzido), mas priorizar transportes coletivos integrados de média e alta capacidade (metrô, VLT, corredores de ônibus).",
    "Estudo sobre mobilidade metropolitana em uma capital brasileira indicou que os passageiros do sistema rodoviário convencional de ônibus enfrentam tempo médio de viagem 70% superior ao dos usuários das linhas metropolitanas de metrô para percorrer a mesma distância de 25 km entre a periferia e a região central. Simultaneamente, o espaço ocupado por automóveis particulares nas vias arteriais representa 75% da área útil das pistas, embora eles transportem menos de 30% dos cidadãos que transitam no horário de pico.",
    "Para alcançar sustentabilidade socioambiental e equidade no acesso ao espaço urbano, a política municipal de mobilidade deve priorizar:",
    [
      "o investimento prioritário em sistemas de transporte público de alta e média capacidade e a integração tarifária intermodal.",
      "a isenção total de impostos para a compra do segundo automóvel individual por família.",
      "a eliminação dos corredores exclusivos de ônibus para liberar faixas de tráfego aos veículos de passeio.",
      "o fechamento definitivo de passarelas e ciclovias para evitar atritos com o fluxo contínuo de motocicletas.",
      "a construção irrestrita de viadutos e anéis rodoviários no perímetro central tombado como patrimônio histórico."
    ],
    0,
    "Alternativa correta: A. a Política Nacional de Mobilidade Urbana (Lei nº 12.587/2012) preconiza a prioridade dos modos de transporte não motorizados e dos serviços de transporte público coletivo sobre o transporte individual motorizado, destacando a integração física e tarifária como vetor de inclusão social. As alternativas A, B e E reforçam o modelo rodoviarista autofágico causador dos congestionamentos e da poluição. A alternativa D atenta contra a segurança do trânsito e os modos de locomoção ativa sustentáveis."
  ],
  "Problemas ambientais urbanos e ilhas de calor": [
    "A alteração antrópica da paisagem natural nas cidades cria um clima urbano específico. O fenômeno da ilha de calor caracteriza-se pela elevação das médias térmicas do ar nas áreas centrais e densamente edificadas em comparação com as áreas periféricas, arborizadas ou rurais do entorno. Esse gradiente de temperatura é gerado pela intensa impermeabilização do solo pelo asfalto e concreto (materiais com alto calor específico e baixo albedo, que retêm calor solar ao longo do dia e o liberam à noite), pela verticalização que barra a circulação de ventos, pela poluição atmosférica (efeito estufa local) e pelo calor antropogênico liberado por motores de veículos e aparelhos de ar-condicionado. Outros impactos urbanos graves incluem a inversão térmica no inverno (retenção de poluentes perto do solo) e enchentes por canalização e impermeabilização.",
    [
      "Ilha de calor: centro urbano mais quente que áreas periféricas/rurais adjacentes",
      "Albedo: capacidade de reflexão da radiação solar (asfalto escuro tem baixo albedo e absorve muito calor)",
      "Inversão térmica: camada de ar frio aprisionada no solo sob camada de ar quente no inverno, represando fuligem",
      "Enchentes urbanas: impermeabilização impede infiltração natural da água, elevando o escoamento superficial (run-off)"
    ],
    "Inversão térmica NÃO é causada pela poluição: trata-se de um fenômeno meteorológico natural comum nas manhãs frias de inverno. O problema grave é que ela impede a dispersão da poluição gerada pela cidade, causando crises respiratórias.",
    "<svg viewBox='0 0 320 160' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='160' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Perfil Térmico do Clima Urbano: Ilha de Calor</text><path d='M30 115 Q 160 30 290 115' fill='none' stroke='#D12D20' stroke-width='3'/><text x='130' y='38' font-size='12' font-weight='800' fill='#D12D20'>+5 °C a +8 °C</text><rect x='25' y='120' width='35' height='20' fill='#2E7D32' rx='4'/><text x='20' y='152' font-size='9' fill='var(--tx)'>Área Rural</text><rect x='80' y='105' width='25' height='35' fill='#5B6785'/><rect x='110' y='90' width='25' height='50' fill='#5B6785'/><rect x='140' y='70' width='35' height='70' fill='#14213D'/><rect x='180' y='85' width='25' height='55' fill='#5B6785'/><rect x='210' y='105' width='25' height='35' fill='#5B6785'/><text x='130' y='152' font-size='9' font-weight='700' fill='var(--tx)'>Centro Comercial</text><rect x='260' y='120' width='35' height='20' fill='#2E7D32' rx='4'/><text x='255' y='152' font-size='9' fill='var(--tx)'>Parque / Subúrbio</text></svg>Em uma metrópole litorânea com mais de 3 milhões de habitantes, sensores meteorológicos registraram temperaturas de 34 °C nos bairros com grandes avenidas e espigões de edifícios de concreto no centro financeiro, enquanto parques florestais e áreas periféricas vegetadas a apenas 12 km de distância registravam 28 °C no mesmo horário de verão.",
    "A intervenção urbanística sustentável capaz de amenizar de forma direta a intensidade da anomalia microclimática representada no gráfico é a:",
    [
      "asfaltagem maciça de leitos de rios e córregos para acelerar o escoamento hídrico.",
      "derrubada dos maciços vegetais remanescentes para uniformizar a rugosidade da paisagem.",
      "elevação do gabarito das edificações periféricas para impedir a entrada de brisas oceânicas frescas.",
      "instalação de sistemas de aquecimento térmico em praças públicas e canteiros centrais.",
      "ampliação da cobertura vegetal por meio de parques lineares, tetos verdes e plantio de árvores viárias."
    ],
    4,
    "Alternativa correta: E. a arborização, a criação de áreas verdes e a adoção de tetos verdes diminuem a absorção de calor por substituírem superfícies de baixo albedo (asfalto e concreto) por vegetação, além de aumentarem a umidade do ar e o resfriamento evaporativo por evapotranspiração foliar. A alternativa A piora a impermeabilização e o aquecimento superficial. A B e a E intensificam o confinamento térmico. A D é incoerente, pois agravaria o calor na cidade."
  ],
  "Redes urbanas e hierarquia das cidades": [
    "A rede urbana é o sistema integrado de cidades conectadas por fluxos materiais (mercadorias, pessoas) e imateriais (informações, ordens financeiras, capitais). Na visão clássica e rígida da hierarquia urbana, a cidade de menor porte vinculava-se estritamente à cidade imediatamente superior (vila → cidade local → centro regional → metrópole). Com o advento do meio técnico-científico-informacional e da modernização dos transportes e telecomunicações, essa hierarquia tornou-se flexível e em rede: um morador de uma pequena cidade do interior pode acessar diretamente serviços financeiros, compras virtuais ou comandos sediados em uma Grande Metrópole Nacional, sem passar pelos centros intermediários. A pesquisa 'Regiões de Influência das Cidades' (REGIC/IBGE) classifica a hierarquia brasileira em Metrópoles (São Paulo como Grande Metrópole Nacional, Rio de Janeiro e Brasília), Capitais Regionais, Centros Sub-regionais, Centros de Zona e Centros Locais.",
    [
      "Rede urbana moderna: conexões em rede com fluxos virtuais diretos e descontinuidades espaciais",
      "REGIC/IBGE: estudo geográfico do raio de polarização e alcance de comando das cidades brasileiras",
      "Metrópole Global / Grande Metrópole Nacional: nós de comando conectados à economia mundial (São Paulo)",
      "Cidades médias: polos dinâmicos que absorvem serviços e indústrias no interior brasileiro"
    ],
    "Lembre-se: São Paulo é a única Grande Metrópole Nacional na classificação do REGIC/IBGE, polarizando todo o território brasileiro e conectando o país aos fluxos globais de capital.",
    "Na análise geográfica contemporânea sobre o território nacional, observa-se que empresas do agronegócio instaladas em municípios médios do Mato Grosso ou do Oeste Baiano mantêm vínculos comerciais, logísticos e de assessoria jurídica e financeira diretamente com consultorias sediadas na cidade de São Paulo, utilizando redes de fibra óptica e transporte aéreo corporativo diário.",
    "Esse padrão contemporâneo de articulação do espaço geográfico comprova que a hierarquia urbana:",
    [
      "eliminou em definitivo a primazia econômica e a capacidade de comando das grandes metrópoles nacionais.",
      "retornou ao modelo medieval de autossuficiência isolada em que as pequenas cidades não têm conexões externas.",
      "perdeu a linearidade mecânica tradicional e passou a operar por fluxos em rede de alta conectividade técnica.",
      "obedece obrigatoriamente a uma ordem estrita e piramidal em que toda informação passa pela capital municipal local.",
      "restringe-se unicamente ao comércio presencial e físico de bens de primeira necessidade alimentar."
    ],
    2,
    "Alternativa correta: C. a evolução dos sistemas de transporte e comunicação no meio técnico-científico-informacional permitiu a emergência da 'hierarquia em rede', na qual cidades de diferentes escalas conectam-se de forma direta aos centros hegemônicos de decisão política e financeira sem intermediação física obrigatória. A alternativa B é anacrônica. A C é falsa, pois metrópoles globais como São Paulo concentram mais poder de comando do que nunca. A D descreve o esquema rígido superado. A E desconsidera os fluxos de serviços e finanças."
  ],
  "Estrutura fundiária e concentração de terras": [
    "A estrutura fundiária brasileira é uma das mais concentradas e desiguais do planeta, herança histórica que remonta à Lei de Terras de 1850 e ao regime colonial das capitanias e sesmarias. O Censo Agropecuário do IBGE revela que estabelecimentos com mais de 1.000 hectares representam menos de 1% do total de propriedades, mas controlam quase metade de toda a área agricultável do país. O Índice de Gini da posse da terra no Brasil permanece historicamente em torno de 0,86 (onde 1 indica concentração máxima). Essa disparidade resulta na coexistência conflituosa entre imensos latifúndios monocultores voltados à exportação e milhões de minifúndios e trabalhadores rurais sem terra lutando por reforma agrária.",
    [
      "Lei de Terras de 1850: instituiu a compra formal em dinheiro como única forma de acesso legal à terra pública (devoluta)",
      "Índice de Gini fundiário: próximo a 0,86 (elevadíssima concentração da propriedade)",
      "Módulo fiscal: unidade de medida agrária em hectares fixada pelo Incra para cada município",
      "Função social da propriedade: cumprir simultaneamente critérios de produtividade, respeito ambiental e legislação trabalhista (Art. 186 CF)"
    ],
    "Memorize para o ENEM: a Lei de Terras de 1850 foi promulgada justamente quando o tráfico negreiro foi extinto (Lei Eusébio de Queirós), com o intuito deliberado de impedir que escravizados libertos e imigrantes pobres se tornassem proprietários de terra.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Estrutura Fundiária Brasileira (Censo Agropecuário IBGE)</text><rect x='30' y='45' width='120' height='30' fill='#2F5BFF' rx='6'/><text x='35' y='64' font-size='10' font-weight='700' fill='#fff'>Minifúndios (<10 ha): 50% dos imóveis</text><rect x='30' y='85' width='25' height='25' fill='#2F5BFF' rx='4'/><text x='62' y='102' font-size='10' fill='var(--tx)'>Ocupam apenas ~2,3% da área total</text><rect x='160' y='45' width='130' height='30' fill='#D12D20' rx='6'/><text x='165' y='64' font-size='10' font-weight='700' fill='#fff'>Latifúndios (>1000 ha): ~1% dos imóveis</text><rect x='160' y='85' width='110' height='25' fill='#D12D20' rx='4'/><text x='170' y='102' font-size='10' font-weight='700' fill='#fff'>Ocupam ~45% da área total</text></svg>A Constituição Federal de 1988 estabelece em seu Artigo 184 que compete à União desapropriar por interesse social, para fins de reforma agrária, o imóvel rural que não esteja cumprindo sua função social, mediante prévia e justa indenização em títulos da dívida agrária.",
    "Com base nos dados espaciais e no ordenamento jurídico brasileiro, a persistência de elevados índices de concentração fundiária no campo nacional é explicada historicamente pela:",
    [
      "eliminação integral do latifúndio após a aplicação das diretrizes universais do Estatuto da Terra de 1964.",
      "manutenção secular de privilégios oligárquicos associada à barreira histórica de acesso à terra consolidada desde a Lei de Terras de 1850.",
      "redistribuição compulsória e homogênea de lotes agrícolas pelo Incra a todos os povos e comunidades tradicionais.",
      "predominância de minifúndios de subsistência que ocupam mais de 90% da área agrícola do Centro-Oeste.",
      "proibição constitucional definitiva de investimentos do capital financeiro nas cadeias agroexportadoras."
    ],
    1,
    "Alternativa correta: B. a extrema concentração fundiária brasileira é um processo histórico enraizado no período colonial e consolidado pela Lei de Terras de 1850, mantendo-se até hoje pelas alianças políticas da bancada ruralista e pela frágil execução da reforma agrária. A alternativa A mente ao afirmar que o latifúndio foi eliminado. A C é incorreta, pois a demarcação e reforma agrária enfrentam lentidão crônica. A D inverte a realidade (o Centro-Oeste é dominado por grandes latifúndios de soja e gado). A E é falsa, já que o agronegócio é fortemente amparado pelo capital financeiro e bancário."
  ],
  "Agronegócio e commodities": [
    "O agronegócio (agribusiness) brasileiro representa um dos pilares da balança comercial do país, alicerçado na produção em larga escala de commodities agrícolas e minerais voltadas à exportação, tais como soja, milho, cana-de-açúcar, café, carne bovina e frango. Esse setor é intensivo em capital, tecnologia de ponta (biotecnologia com sementes transgênicas, colheitadeiras com GPS e satélites), crédito bancário subsidiado (Plano Safra) e infraestrutura logística (hidrovias, ferrovias e portos graneleiros). Embora gere superávits comerciais expressivos, o modelo agroexportador está associado a fortes contradições socioambientais: desmatamento de biomas nativos (Cerrado e Amazônia), contaminação de bacias hidrográficas por agrotóxicos e baixa geração direta de empregos por unidade de área cultivada.",
    [
      "Commodities: produtos primários padronizados negociados em bolsas de valores internacionais (ex.: Chicago)",
      "Biotecnologia: sementes geneticamente modificadas (transgênicas) e agricultura de precisão",
      "Balança comercial: superávit impulsionado pelas exportações agropecuárias (Ásia e China como maiores destinos)",
      "Impactos: desmatamento no Cerrado (Matopiba), contaminação hídrica por pesticidas e esvaziamento demográfico do campo"
    ],
    "Commodities têm seus preços fixados no mercado financeiro global (dólar). Portanto, se os preços internacionais caem ou o dólar desvaloriza, as receitas dos exportadores diminuem bruscamente, configurando vulnerabilidade externa.",
    "Dados da Secretaria de Comércio Exterior (SECEX/MDIC) apontam que mais de 50% das exportações totais brasileiras são compostas por produtos do agronegócio e bens minerais básicos. A produção de soja concentra-se em estados como Mato Grosso, Goiás, Paraná e nos estados do Matopiba (Maranhão, Tocantins, Piauí e Bahia), tendo a República Popular da China como principal compradora das safras anuais de grãos.",
    "A vulnerabilidade econômica inerente a um modelo nacional altamente dependente da pauta agroexportadora de commodities fundamenta-se na:",
    [
      "impossibilidade de transporte desses produtos por ferrovias e hidrovias modernas.",
      "exigência internacional de que todas as fazendas de grãos pertençam exclusivamente a cooperativas camponesas.",
      "isenção total de mecanismos de defesa sanitária e fitossanitária nos portos europeus e asiáticos.",
      "sujeição das receitas cambiais às oscilações de preços e cotações das bolsas de mercadorias internacionais.",
      "ausência de aplicação de tecnologias químicas e mecânicas no cultivo intensivo das lavouras de exportação."
    ],
    3,
    "Alternativa correta: D. as commodities agrícolas têm preços estipulados internacionalmente em bolsas (como a de Chicago) em moeda forte (dólar), o que deixa o país vulnerável a oscilações climáticas globais, variações cambiais e crises de demanda dos países compradores. A alternativa A erra porque o setor investe prioritariamente em ferrovias e hidrovias. A B é absurda, pois predominam corporações do agronegócio. A D é falsa, pois barreiras fitossanitárias são cada vez mais severas. A E contradiz a realidade da agricultura de precisão altamente tecnificada."
  ],
  "Agricultura familiar e segurança alimentar": [
    "A agricultura familiar define-se pela gestão compartilhada pela família, residência no próprio estabelecimento rural e predomínio de mão de obra familiar na execução das atividades agrícolas e pecuárias. Segundo os dados oficiais do Censo Agropecuário do IBGE, a agricultura familiar abrange cerca de 77% do total de estabelecimentos rurais do Brasil, embora ocupe apenas aproximadamente 23% da área agricultável total. Apesar do território restrito e de receber apenas uma fração menor dos subsídios estatais em comparação ao grande agronegócio, a agricultura familiar é a principal responsável pela segurança alimentar do país, fornecendo a maior parcela de alimentos básicos da mesa brasileira, como mandioca (80%), feijão (42%), leite e hortifrutigranjeiros.",
    [
      "Agricultura familiar: até 4 módulos fiscais, mão de obra predominantemente familiar e gestão vinculada à família",
      "Segurança alimentar: disponibilidade e acesso regular e permanente a alimentos seguros e nutritivos",
      "PRONAF: Programa Nacional de Fortalecimento da Agricultura Familiar (crédito rural)",
      "Policultura vs Monocultura: familiar cultiva diversidade de alimentos; agronegócio patronal foca em monocultura de exportação"
    ],
    "Memorize o paradoxo agrário brasileiro para o ENEM: quem detém mais terra (agronegócio) produz commodities para exportação e ração animal; quem detém menos terra (agricultura familiar) produz os alimentos que abastecem o mercado interno diário.",
    "<svg viewBox='0 0 320 160' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='160' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Agricultura Familiar vs Patronal (IBGE)</text><rect x='30' y='45' width='120' height='40' fill='#2E7D32' rx='6'/><text x='35' y='62' font-size='10' font-weight='700' fill='#fff'>77% dos Estabelecimentos</text><text x='35' y='76' font-size='9' fill='#E8F5E9'>Agricultura Familiar</text><rect x='170' y='45' width='120' height='40' fill='#5B6785' rx='6'/><text x='175' y='62' font-size='10' font-weight='700' fill='#fff'>23% dos Estabelecimentos</text><text x='175' y='76' font-size='9' fill='#fff'>Agronegócio Patronal</text><rect x='30' y='100' width='60' height='30' fill='#2E7D32' rx='4'/><text x='35' y='118' font-size='10' font-weight='700' fill='#fff'>23% da Área</text><rect x='110' y='100' width='180' height='30' fill='#5B6785' rx='4'/><text x='125' y='118' font-size='10' font-weight='700' fill='#fff'>77% da Área Total dos Imóveis</text></svg>O Programa de Aquisição de Alimentos (PAA) e o Programa Nacional de Alimentação Escolar (PNAE) exigem por lei que parcelas mínimas dos recursos da merenda escolar sejam obrigatoriamente destinadas à compra direta de alimentos produzidos pela agricultura familiar e por cooperativas camponesas locais.",
    "A importância estratégica da agricultura familiar para a sustentabilidade socioeconômica e a soberania alimentar no Brasil reside primordialmente na sua:",
    [
      "dedicação exclusiva à exportação de algodão em pluma e soja transgênica para os países do Oriente Médio.",
      "utilização irrestrita de maquinários robotizados pesados que extinguiram a presença humana nos estabelecimentos agrícolas.",
      "subordinação jurídica aos grandes conglomerados mineradores multinacionais que controlam a extração de bauxita.",
      "capacidade de abastecer a rede interna de consumo alimentar básico, combinando policultura com geração intensiva de postos de trabalho no campo.",
      "rejeição a qualquer modalidade de venda direta de legumes e frutas em feiras livres de centros urbanos."
    ],
    3,
    "Alternativa correta: D. a agricultura familiar emprega a maioria dos trabalhadores do campo brasileiro e é a responsável por abastecer a população com feijão, arroz, mandioca, milho, hortaliças e leite, mantendo a policultura e preservando redes de comércio comunitárias. A alternativa A descreve o grande agronegócio exportador. A C cria relação inexistente com a mineração. A D é falsa, pois a agricultura familiar é justamente a maior empregadora de mão de obra direta. A E contradiz a prática tradicional das feiras de produtores familiares."
  ],
  "Revolução Verde e modernização agrícola": [
    "A Revolução Verde foi o processo de transformação tecnológica da agropecuária mundial iniciado nas décadas de 1950 e 1960, promovido por centros de pesquisa dos países desenvolvidos (com destaque para os EUA e as fundações Rockefeller e Ford). Baseou-se na difusão de um 'pacote tecnológico' padronizado que combinava sementes híbridas e geneticamente modificadas de alto rendimento, uso massivo de agrotóxicos (pesticidas e herbicidas), fertilizantes químicos sintéticos (N-P-K), mecanização pesada e sistemas avançados de irrigação. Embora tenha aumentado de forma espetacular os índices de produtividade por hectare, a Revolução Verde não eliminou a fome no mundo (pois a fome é decorrente da falta de renda e de acesso aos alimentos, não da falta de produção) e gerou sérios impactos ambientais e sociais: expulsão de pequenos agricultores, contaminação de solos e aquíferos e redução da biodiversidade genética cultivada.",
    [
      "Pacote tecnológico: sementes selecionadas/transgênicas + fertilizantes químicos + agrotóxicos + tratores/colheitadeiras",
      "Fome mundial: problema de distribuição de renda e acesso, não de escassez absoluta de calorias produzidas",
      "Impactos ambientais: lixiviação de fertilizantes químicos (eutrofização de rios), resistência biológica de pragas e erosão",
      "Modernização conservadora brasileira: crédito subsidiado para grandes proprietários sem alteração da estrutura fundiária"
    ],
    "Cuidado com a afirmação falaciosa: 'a Revolução Verde acabou com a fome no mundo'. A produção global de alimentos cresceu mais que a população, mas a fome persiste porque milhões não têm dinheiro para comprar os alimentos mercantilizados.",
    "Na década de 1970, o governo federal brasileiro fundou a Empresa Brasileira de Pesquisa Agropecuária (Embrapa), que desenvolveu pesquisas genéticas e de manejo agronômico para corrigir a acidez dos solos do Cerrado (mediante calagem com calcário moído) e adaptar a soja aos climas tropicais de baixa latitude.",
    "A consequência socioeconômica mais marcante decorrente da disseminação do pacote tecnológico da modernização agrícola no campo brasileiro foi a:",
    [
      "reversão imediata do fluxo migratório nacional com retorno de milhões de citadinos às lavouras tradicionais.",
      "desconcentração fundiária automática com desapropriação de todos os latifúndios monocultores.",
      "ampliação da produtividade por área associada à intensificação do êxodo rural de trabalhadores não qualificados e ao endividamento de pequenos produtores.",
      "erradicação absoluta das desigualdades de renda entre as famílias camponesas e as corporações do agronegócio.",
      "substituição completa das matrizes de grãos por florestas nativas intangíveis no planalto central."
    ],
    2,
    "Alternativa correta: C. a modernização aumentou exponencialmente a produtividade agrícola e os volumes de colheita, mas, ao exigir vultosos investimentos em maquinário e insumos caros, endividou pequenos produtores e substituiu trabalhadores braçais por tratores, acelerando o êxodo rural. A alternativa A erra, pois intensificou o êxodo do campo para a cidade, não o retorno. A B é falsa, pois a concentração fundiária aumentou. A D é absurda, pois as desigualdades no campo se acentuaram. A E descreve o oposto: a vegetação nativa do Cerrado foi desmatada para ceder lugar às lavouras."
  ],
  "Conflitos no campo e movimentos sociais": [
    "A persistência da histórica concentração de terras e a expansão contínua da fronteira agropecuária e mineral no Brasil alimentam frequentes conflitos no campo. De acordo com os relatórios anuais da Comissão Pastoral da Terra (CPT), os conflitos envolvem disputas pela posse da terra, contaminação e apropriação privada de cursos d'água e violência contra lideranças camponesas, indígenas, quilombolas e ribeirinhos, concentrando-se com extrema gravidade na região conhecida como 'Bico do Papagaio' e no Arco do Desmatamento da Amazônia Legal. Movimentos sociais do campo — como o Movimento dos Trabalhadores Rurais Sem Terra (MST), o Movimento dos Atingidos por Barragens (MAB) e a Articulação dos Povos Indígenas do Brasil (APIB) — reivindicam a democratização da terra, demarcação de territórios ancestrais, soberania alimentar e agroecologia.",
    [
      "CPT: Comissão Pastoral da Terra (registra dados de assassinatos, ameaças e disputas no campo)",
      "Grilagem de terras: apropriação criminosa de terras públicas devolutas mediante falsificação documental",
      "Fronteira agrícola: linha dinâmica de avanço do agronegócio sobre florestas e territórios tradicionais",
      "Agroecologia: modelo produtivo sustentável sem agrotóxicos e voltado à soberania camponesa"
    ],
    "Para a redação e para as questões de Ciências Humanas do ENEM, conecte grilagem com violência no campo: grileiros contratam pistoleiros para expulsar posseiros e comunidades tradicionais de terras públicas da União.",
    "O relatório 'Conflitos no Campo Brasil' da Comissão Pastoral da Terra documentou que, ao longo das últimas décadas, centenas de lideranças comunitárias, seringueiros, indígenas e defensores ambientais sofreram violências decorrentes da invasão de terras públicas devolutas por grileiros, madeireiros ilegais e garimpeiros na Amazônia.",
    "A causa estrutural que perpetua o cenário de violência e tensão nas fronteiras rurais brasileiras consiste na:",
    [
      "vigência de uma reforma agrária radical e compulsória que extinguiu todas as fazendas particulares no país.",
      "substituição pacífica e consensual de todas as áreas de preservação permanente por cidades planejadas.",
      "rejeição dos povos indígenas à posse de suas terras ancestrais, preferindo a mineração industrial predatória.",
      "inexistência de qualquer legislação ambiental ou florestal vigente na jurisprudência do território brasileiro.",
      "fragilidade da fiscalização estatal e morosidade na demarcação de terras públicas, gerando impunidade para a grilagem e a expropriação violenta."
    ],
    4,
    "Alternativa correta: E. a grilagem de terras e a violência contra populações tradicionais e camponeses proliferam especialmente onde a presença do Estado na fiscalização ambiental e fundiária é precária, gerando sensação de impunidade para fraudadores e criminosos ambientais. A alternativa A erra porque não houve reforma agrária radical. A C ofende a luta histórica dos povos indígenas pela conservação de seus territórios. A D é inverídica (existe o Código Florestal, Lei 12.651/2012). A E propõe uma situação fictícia e irreal."
  ],
  "Fases da globalização e DIT": [
    "A Divisão Internacional do Trabalho (DIT) expressa a especialização produtiva dos países no comércio mundial ao longo das sucessivas fases do capitalismo. Na DIT Clássica (séculos XVI a meados do XX), as colônias e periferias forneciam matérias-primas e gêneros agrícolas, enquanto as metrópoles e potências industriais vendiam produtos manufaturados de alto valor agregado. Na Nova DIT (pós-Segunda Guerra Mundial e consolidada a partir dos anos 1970), países emergentes (como Brasil, México, Tigres Asiáticos e China) passaram a industrializar-se e a exportar bens manufaturados, mas de média/baixa tecnologia e intensivos em mão de obra ou recursos naturais, enquanto as nações desenvolvidas retêm o controle financeiro, a inovação tecnológica (P&D), marcas, royalties e softwares.",
    [
      "DIT Clássica: Países ricos (manufaturas) vs Países pobres/colônias (matérias-primas e minérios)",
      "Nova DIT: Países ricos (tecnologia de ponta, finanças, patentes, P&D) vs Emergentes (manufaturados padrão e commodities)",
      "Termos de troca: deterioração histórica dos preços de bens primários em relação aos industriais (tese de Prebisch)",
      "Desconcentração espacial: transnacionais transferem fábricas para o Sul em busca de mão de obra barata e incentivos fiscais"
    ],
    "Atenção para o ENEM: mesmo exportando produtos industrializados, os países emergentes na Nova DIT ainda dependem da importação de insumos tecnológicos caros, máquinas de ponta e pagamento de patentes para os países centrais.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Evolução da Divisão Internacional do Trabalho</text><rect x='20' y='45' width='130' height='40' fill='#5B6785' rx='6'/><text x='25' y='62' font-size='10' font-weight='700' fill='#fff'>Países Centrais (Norte)</text><text x='25' y='76' font-size='9' fill='#fff'>P&D, Finanças, Softwares</text><rect x='170' y='45' width='130' height='40' fill='#2F5BFF' rx='6'/><text x='175' y='62' font-size='10' font-weight='700' fill='#fff'>Países Emergentes (Sul)</text><text x='175' y='76' font-size='9' fill='#fff'>Manufaturas e Commodities</text><path d='M150 55 L 170 55' stroke='#FFB400' stroke-width='3'/><path d='M170 75 L 150 75' stroke='#2E7D32' stroke-width='3'/><text x='55' y='110' font-size='10' fill='var(--tx)'>➔ Patentes, lucros e royalties</text><text x='55' y='130' font-size='10' fill='var(--tx)'>➔ Bens montados e produtos primários</text></svg>Ao analisar a cadeia global de suprimentos de um smartphone contemporâneo, constata-se que o design de interface, o sistema operacional e a arquitetura dos processadores são concebidos nos Estados Unidos; os semicondutores avançados são fabricados em Taiwan; os minerais raros são extraídos na África; a montagem final é realizada na China; e os lucros e royalties revertem primordialmente para acionistas sediados no Vale do Silício.",
    "A configuração produtiva contemporânea apresentada reflete a Nova Divisão Internacional do Trabalho ao demonstrar que:",
    [
      "todas as etapas da produção e as patentes tecnológicas foram totalmente transferidas para os países periféricos.",
      "os países centrais conservam a hegemonia sobre a inovação e o capital imaterial, enquanto a manufatura física é dispersada globalmente.",
      "o comércio internacional aboliu qualquer tipo de fronteira alfandegária e padronizou os salários dos operários em escala global.",
      "os países produtores de matérias-primas controlam a precificação de todos os aparelhos eletrônicos de consumo.",
      "a indústria de alta tecnologia dispensou o uso de semicondutores e recursos minerais em sua linha de montagem."
    ],
    1,

  "Blocos econômicos e comércio internacional": [
    "Os blocos econômicos surgiram como estratégia de integração regional e ampliação de mercados para aumentar a competitividade dos países-membros frente à globalização. Existem quatro níveis evolutivos de integração econômica: 1) Zona de Livre Comércio: eliminação ou redução gradativa de tarifas aduaneiras entre os membros (ex.: antigo NAFTA / atual USMCA); 2) União Aduaneira: livre comércio interno somado à adoção de uma Tarifa Externa Comum (TEC) para importações de terceiros países (ex.: Mercosul); 3) Mercado Comum: união aduaneira ampliada pela livre circulação de capitais, serviços e cidadãos/trabalhadores (ex.: União Europeia antes de Maastricht); 4) União Econômica e Monetária: mercado comum dotado de moeda única e banco central integrado (ex.: União Europeia com a Zona do Euro).",
    [
      "Zona de Livre Comércio: zero tarifas internas entre membros (ex.: USMCA)",
      "União Aduaneira: livre comércio interno + Tarifa Externa Comum - TEC (ex.: Mercosul)",
      "Mercado Comum: livre circulação de mercadorias, serviços, capitais e pessoas",
      "União Econômica e Monetária: mercado comum + moeda única integrada (ex.: Euro)",
      "OMC: Organização Mundial do Comércio (regula disputas multilaterais e combate subsídios desleais)"
    ],
    "Não confunda Mercosul com Mercado Comum: apesar do nome oficial, o Mercosul é tecnicamente uma União Aduaneira imperfeita (possui TEC, mas não atingiu a livre circulação plena de pessoas e capitais).",
    "Fundado em 1991 pelo Tratado de Assunção por Brasil, Argentina, Paraguai e Uruguai, o Mercosul estabeleceu acordos comerciais para zerar tarifas aduaneiras em milhares de itens intra-bloco e instituiu, a partir de 1995, uma Tarifa Externa Comum (TEC), com o objetivo de padronizar as taxas de importação cobradas quando qualquer um dos países-membros adquire mercadorias de nações de fora do bloco.",
    "Sob a perspectiva da teoria da integração econômica regional, a adoção de uma Tarifa Externa Comum (TEC) caracteriza o bloco como uma:",
    [
      "União Aduaneira.",
      "Zona de Livre Comércio simples.",
      "União Econômica e Monetária com moeda única.",
      "Área de Preferência Tarifária bilateral provisória.",
      "Confederação de Estados supranacionais unificados."
    ],
    0,
    "Alternativa correta: A. a adoção de uma Tarifa Externa Comum (TEC) para importações de países que não fazem parte do bloco é o elemento definidor que eleva uma Zona de Livre Comércio ao status de União Aduaneira. A alternativa A define apenas a isenção tributária entre os sócios, sem taxa externa única. A C exige moeda única e política monetária centralizada (como na Zona do Euro). A D é um estágio prévio ainda mais rudimentar. A E implicaria a unificação de governos soberanos em um único país."
  ],
  "Corporações multinacionais e cadeias globais": [
    "As corporações transnacionais (multinacionais) são os agentes hegemônicos da globalização produtiva contemporânea. Com sedes mantidas nos países centrais ou em potências emergentes, essas empresas fragmentam espacialmente seus processos industriais pelo globo, buscando 'vantagens locacionais comparativas': isenções tributárias (guerra fiscal), mão de obra abundante e de baixo custo, frágil legislação ambiental e trabalhista, proximidade de fontes de matérias-primas e facilidades de infraestrutura logística. Essa dispersão gera cadeias globais de valor, nas quais o fechamento de uma fábrica em um país pode gerar desemprego imediato por decisão corporativa tomada a milhares de quilômetros de distância.",
    [
      "Transnacionalização: dispersão produtiva global com concentração do capital acionário na matriz",
      "Guerra fiscal: disputa entre estados e municípios oferecendo isenção de impostos para atrair fábricas",
      "Vantagens comparativas: mão de obra barata, incentivos tributários, proximidade de portos e matérias-primas",
      "Cadeias globais de valor: produção fatiada entre dezenas de países integrados por logística just-in-time"
    ],
    "Para o ENEM, conecte as transnacionais com a terceirização e precarização do trabalho: ao transferir unidades para países de legislação trabalhista permissiva, as empresas reduzem custos e aumentam a margem de lucro líquido.",
    "Na década de 1990, grandes montadoras automobilísticas globais instalaram complexos fabris no interior paulista, no Paraná, na Bahia e no Rio Grande do Sul, negociando com governos estaduais isenções de impostos por até 20 anos, doação de terrenos públicos e execução de obras viárias exclusivas às custas do erário municipal.",
    "A dinâmica geográfica de atração de filiais multinacionais ilustrada pelo texto decorre da prática socioespacial denominada:",
    [
      "estatização compulsória do parque industrial de base.",
      "nacionalização forçada de patentes químicas e farmacêuticas internacionais.",
      "guerra fiscal entre entes federativos em busca de investimentos privados externos.",
      "reconcentração fabril exclusiva no cinturão metropolitano do ABC paulista.",
      "abolição dos subsídios estatais para obras de infraestrutura e saneamento."
    ],
    2,
    "Alternativa correta: C. a 'guerra fiscal' ocorre quando estados e municípios oferecem incentivos tributários (como isenção de ICMS), terrenos doados e obras de infraestrutura para atrair empresas transnacionais, disputando empregos que muitas vezes têm pouca contrapartida em arrecadação local. A alternativa A contraria a atração do capital privado. A C é inverídica no contexto do livre mercado. A D descreve o fenômeno oposto: o ABC paulista passou por desconcentração industrial. A E é refutada pelo próprio texto, que cita a construção de obras com recursos públicos."
  ],
  "Nova Ordem Mundial e multipolaridade": [
    "A Nova Ordem Mundial teve início com a queda do Muro de Berlim (1989) e o colapso da União Soviética (1991), encerrando quatro décadas de ordem bipolar da Guerra Fria (marcada pela disputa ideológica, militar e espacial entre EUA e URSS). O novo cenário internacional é definido como unipolar sob o prisma militar (supremacia bélica incomparável dos Estados Unidos), mas multipolar sob o prisma geoeconômico, caracterizado pela dispersão do poder produtivo, tecnológico e financeiro entre múltiplos polos: os EUA, a União Europeia, o Japão e as potências emergentes, com destaque vertiginoso para a República Popular da China. A geopolítica contemporânea é tensionada pelo ressurgimento de rivalidades hegemônicas entre Washington e Pequim, pelo controle de rotas comerciais marítimas e pela liderança em inteligência artificial e telecomunicações (5G/6G).",
    [
      "Ordem Bipolar (Guerra Fria): EUA x URSS (capitalismo x socialismo; corrida armamentista e espacial)",
      "Nova Ordem Mundial: militarmente unipolar (EUA) e economicamente multipolar (EUA, UE, China, Japão)",
      "Soft power: influência cultural, diplomática e ideológica (em oposição ao hard power militar)",
      "Guerra comercial e tecnológica: tarifas protecionistas e disputas entre EUA e China por semicondutores e 5G"
    ],
    "Pegadinha do ENEM: a ordem atual NÃO é multipolar em todos os aspectos. No campo militar, os EUA ainda possuem um orçamento de defesa equivalente ao da soma das dezenas de países seguintes; a multipolaridade é expressa sobretudo no comércio, economia e tecnologia.",
    "Nos anos 1970, a China de Deng Xiaoping implementou as 'Quatro Modernizações' e criou as Zonas Econômicas Especiais (ZEEs), áreas litorâneas abertas à atração de capital estrangeiro e joint-ventures com corporações ocidentais. Em quatro décadas, o país transformou-se na 'fábrica do mundo', ultrapassou o PIB da Alemanha e do Japão e lançou a colossal iniciativa da Nova Rota da Seda (Belt and Road Initiative), financiando portos, ferrovias e infraestrutura em dezenas de países da Ásia, África e América Latina.",
    "A ascensão geoestratégica da China na Nova Ordem Mundial desafia a hegemonia norte-americana principalmente porque:",
    [
      "a China proibiu terminantemente o funcionamento de indústrias manufatureiras em seu território.",
      "o governo de Pequim dissolveu o comércio marítimo internacional e aboliu a navegação comercial nos estreitos.",
      "o país combina liderança fabril global com capacidade autônoma de investimento financeiro externo e avanço em tecnologias de fronteira.",
      "a economia chinesa tornou-se estritamente dependente de subsídios concedidos pelo Tesouro dos Estados Unidos.",
      "a diplomacia de Pequim recusa assinar qualquer tratado multilateral de cooperação econômica regional."
    ],
    2,
    "Alternativa correta: C. a China tornou-se a segunda maior economia do mundo combinando seu parque fabril integrado a investimentos massivos em infraestrutura global (Nova Rota da Seda), tecnologia de telecomunicações, semicondutores e inteligência artificial, projetando-se como contrapeso geopolítico ao poder dos EUA. A alternativa A mente ao negar a indústria chinesa. A B é absurda, pois a China é a maior exportadora de mercadorias via portos marítimos. A D é falsa, já que a China é credora de trilhões em títulos públicos dos EUA. A E contraria a liderança chinesa em blocos como os BRICS e a RCEP."
  ],
  "BRICS e potências emergentes": [
    "O acrônimo BRIC foi cunhado em 2001 pelo economista Jim O'Neill (Goldman Sachs) para designar as quatro grandes economias emergentes com potencial de crescimento superior às potências tradicionais do G7: Brasil, Rússia, Índia e China. Em 2011, com o ingresso da África do Sul (South Africa), o agrupamento formalizou-se como BRICS, operando como um mecanismo político e diplomático de cooperação multilateral voltado à reforma da governança global (como do FMI, Banco Mundial e Conselho de Segurança da ONU). O grupo criou o Novo Banco de Desenvolvimento (NBD, sediado em Xangai) para financiar projetos de infraestrutura sustentável sem as condicionalidades ortodoxas do FMI. Em 2024, o bloco oficializou a adesão histórica de novos membros (incluindo Arábia Saudita, Egito, Emirados Árabes Unidos, Etiópia e Irã), ampliando sua influência demográfica e seu peso no mercado global de petróleo.",
    [
      "BRICS: Brasil, Rússia, Índia, China e África do Sul (com expansão recente para Oriente Médio e África)",
      "Novo Banco de Desenvolvimento (NBD): alternativa ao FMI e Banco Mundial para crédito a países do Sul global",
      "Desdolarização parcial: comércio bilateral liquidado em moedas locais (como yuan, rúpias e reais)",
      "Sul Global: coalizão política de países em desenvolvimento que contestam a ordem unipolar ocidental"
    ],
    "O BRICS NÃO é um bloco econômico tradicional (não é zona de livre comércio nem união aduaneira com tarifa comum). É um mecanismo de cooperação política, diplomática e financeira multilateral entre economias emergentes.",
    "Reunidos em conferência de cúpula, os chefes de Estado dos países que compõem os BRICS aprovaram linhas de crédito do Novo Banco de Desenvolvimento (NBD) destinadas a projetos de modernização portuária e transição energética limpa no Sul global, além de incentivarem a utilização de moedas locais em substituição ao dólar norte-americano nas transações comerciais bilaterais entre as nações participantes.",
    "A principal reivindicação diplomática e geopolítica expressa na atuação coordenada dos BRICS no cenário internacional é a:",
    [
      "reforma das instituições de governança internacional para conferir maior representatividade às economias emergentes do Sul global.",
      "consolidação da hegemonia militar unipolar dos Estados Unidos em todos os continentes.",
      "dissolução definitiva de todos os bancos comerciais e supressão das relações comerciais marítimas.",
      "proibição do uso de combustíveis fósseis e minérios nos países do continente africano.",
      "adoção mandatória do dólar norte-americano como moeda única de curso forçado em todo o território nacional chinês."
    ],
    0,
    "Alternativa correta: A. os BRICS atuam politicamente para reformar instituições criadas em Bretton Woods (FMI e Banco Mundial) e a ONU, exigindo maior poder de voto para os países emergentes e fomentando a multipolaridade na geopolítica global. A alternativa A descreve o que o grupo explicitamente contesta. A C é uma formulação anárquica e irreal. A D é incoerente com as exportações de petróleo e minérios dos membros. A E contraria as metas explícitas de desdolarização do comércio do bloco."
  ],
  "Fatores e elementos do clima": [
    "Na climatologia geográfica, é essencial distinguir elementos de fatores climáticos. Os elementos climáticos são as grandezas atmosféricas diretamente mensuráveis: temperatura do ar, umidade atmosférica, pressão atmosférica, precipitação (chuva, neve, granizo) e ventos. Já os fatores climáticos são as características geográficas que condicionam, alteram e determinam os elementos climáticos: latitude (quanto menor a latitude, mais perpendicular a radiação solar e mais quente o clima), altitude (quanto maior a altitude, menor a pressão e mais rarefeito e frio o ar: em média perde-se cerca de 0,65 °C a cada 100 m), maritimidade (reduz a amplitude térmica diária e anual pelo alto calor específico da água), continentalidade (alta amplitude térmica pelo rápido aquecimento e resfriamento do solo), relevo, vegetação e correntes marítimas.",
    [
      "Elementos do clima: temperatura, umidade, pressão atmosférica, vento, chuva",
      "Fatores do clima: latitude, altitude, maritimidade/continentalidade, correntes marinhas, massas de ar, relevo",
      "Gradiente térmico adiabático: diminuição média de ~0,65 °C a cada 100 m de altitude",
      "Amplitude térmica: diferença entre a temperatura máxima e a mínima (maior no interior seco do que no litoral)"
    ],
    "Tempo ≠ Clima: Tempo meteorológico é o estado passageiro da atmosfera em um dado momento e lugar (ex.: 'hoje está chovendo e frio em Curitiba'); Clima é o padrão médio e duradouro apurado após a observação e estatística de pelo menos 30 anos (Organização Meteorológica Mundial).",
    "Duas cidades brasileiras, Santos (SP) e Presidente Prudente (SP), situam-se em latitudes semelhantes no estado de São Paulo. Contudo, enquanto Santos registra variação média diária de apenas 5 °C entre o dia e a noite no verão, Presidente Prudente, localizada no interior a centenas de quilômetros da costa, registra variações de até 14 °C entre a temperatura mais quente da tarde e o amanhecer do mesmo dia.",
    "O fator geográfico responsável pela acentuada diferença na amplitude térmica diária entre as duas cidades mencionadas é a:",
    [
      "inversão da radiação solar provocada pelo buraco na camada de ozônio litorânea.",
      "variação latitudinal, dado que Santos localiza-se no Círculo Polar Antártico.",
      "atuação diferenciada da maritimidade em Santos e da continentalidade em Presidente Prudente.",
      "ausência completa de pressão atmosférica no interior do estado de São Paulo.",
      "presença de vulcões ativos permanentes nas encostas da Serra do Mar."
    ],
    2,
    "Alternativa correta: C. a água possui alto calor específico, demorando mais para esquentar e esfriar; por isso, a maritimidade amortece a variação de temperatura no litoral (Santos). Já os solos e rochas do continente aquecem e esfriam muito rapidamente, gerando elevada amplitude térmica sob o efeito da continentalidade (Presidente Prudente). A alternativa A confunde radiação UV com calor. A B é geograficamente descabida (Santos está no Sudeste tropical do Brasil). A D e a E inventam ausência de pressão e vulcões inexistentes no território paulista."
  ],
  "Massas de ar no Brasil": [
    "A dinâmica do tempo e do clima no território brasileiro é condicionada pela atuação de cinco massas de ar principais: 1) Massa Equatorial Continental (mEc): quente e excepcionalmente úmida (a única massa continental do mundo que é úmida, graças à intensa evapotranspiração da Floresta Amazônica); no verão ela se expande e atua sobre quase todo o território nacional, provocando chuvas torrenciais convectivas (chuvas de verão); 2) Massa Equatorial Atlântica (mEa): quente e úmida, atua no litoral Norte e Nordeste; 3) Massa Tropical Atlântica (mTa): quente e úmida, origina chuvas orográficas (de relevo) de barlavento na Serra do Mar; 4) Massa Tropical Continental (mTc): quente e seca, formada na depressão do Chaco paraguaio/boliviano, gerando veranicos secos no Centro-Oeste; 5) Massa Polar Atlântica (mPa): fria e úmida, atua com força no inverno, provocando frentes frias, geadas no Sul/Sudeste e o fenômeno da friagem (queda brusca de temperatura) na Amazônia ocidental.",
    [
      "mEc: Quente e úmida (Amazônia) — atua no verão levando chuvas ao Centro-Sul",
      "mPa: Fria e úmida (Sul) — responsável no inverno por geadas, frentes frias e a friagem na Amazônia",
      "mTa: Quente e úmida (Oceano Atlântico) — chuvas orográficas na Serra do Mar",
      "mTc: Quente e seca (Chaco) — veranicos secos no Centro-Oeste e Sudeste"
    ],
    "Pegadinha do ENEM: toda massa continental no planeta costuma ser seca, com UMA ÚNICA EXCEÇÃO: a mEc (Massa Equatorial Continental) na Amazônia, que é extremamente úmida porque a floresta amazônica bombeia vapor continuamente para o ar.",
    "<svg viewBox='0 0 320 180' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='180' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Massas de Ar e o Fenômeno da Friagem</text><path d='M80 60 C 120 70, 160 90, 200 120' stroke='#2E7D32' stroke-width='4' fill='none'/><text x='50' y='55' font-size='10' font-weight='700' fill='#2E7D32'>mEc (quente/úmida)</text><path d='M70 160 C 80 120, 85 90, 90 70' stroke='#2F5BFF' stroke-width='4' stroke-dasharray='4' fill='none'/><text x='20' y='145' font-size='10' font-weight='700' fill='#2F5BFF'>mPa sobe o vale</text><circle cx='90' cy='75' r='6' fill='#2F5BFF'/><text x='102' y='80' font-size='10' font-weight='700' fill='var(--tx)'>Friagem em RO, AC e AM</text><text x='102' y='95' font-size='9' fill='var(--mu)'>Queda súbita de 30 °C para 12 °C</text></svg>Durante os meses de junho e julho, meteorologistas noticiam que termômetros em Rio Branco (AC) e Porto Velho (RO) registraram temperaturas mínimas atípicas de 12 °C a 14 °C, acompanhadas de rajadas de vento frio e céu nublado, quebrando o padrão habitual de calor equatorial superior a 30 °C.",
    "O fenômeno regional de queda súbita de temperatura na Amazônia ocidental, conhecido popularmente como 'friagem', é causado pelo avanço da:",
    [
      "Massa Tropical Continental (mTc), que carrega ventos glaciais do deserto do Atacama.",
      "Massa Equatorial Atlântica (mEa), que perde calor ao colidir com o arquipélago de Fernando de Noronha.",
      "brisa marítima costeira, que contorna a Serra da Mantiqueira e se precipita sobre a floresta de terra firme.",
      "Massa Equatorial Continental (mEc), que congela suas nuvens ao transpor a foz do Rio Amazonas.",
      "Massa Polar Atlântica (mPa), que sobe as planícies e depressões do interior sul-americano canalizada pela Cordilheira dos Andes."
    ],
    4,
    "Alternativa correta: E. a friagem decorre do avanço da Massa Polar Atlântica (mPa) no inverno; ao encontrar a barreira orográfica da Cordilheira dos Andes a oeste e o Planalto Central a leste, a massa polar é canalizada pelas planícies do interior (Bacia do Prata e Pantanal) até adentrar os vales do sudoeste amazônico, derrubando bruscamente a temperatura. A alternativa A erra porque a mTc é quente e seca. A B e a D citam massas equatoriais que são estritamente quentes. A E propõe um trajeto impossível para a brisa marítima."
  ],
  "Climogramas e tipos climáticos brasileiros": [
    "O climograma é o gráfico clássico de análise climática que representa simultaneamente dois elementos fundamentais ao longo dos doze meses do ano: a precipitação pluvial média mensal (mostrada em barras verticais) e a temperatura média mensal (mostrada em uma linha contínua). No Brasil, predominam os climas quentes de baixa latitude: 1) Equatorial: quente o ano todo (médias > 25 °C), chuvas abundantes e bem distribuídas sem estação seca definida (> 2.000 mm/ano); 2) Tropical Típico/Semiúmido: duas estações bem nítidas — verão chuvoso e inverno seco (típico do Cerrado e Centro-Oeste); 3) Tropical Semiárido: altas temperaturas, chuvas escassas e irregulares com déficit hídrico prolongado (< 800 mm/ano no Sertão nordestino); 4) Tropical de Altitude: temperaturas mais amenas nas serras do Sudeste; 5) Tropical Litorâneo/Úmido: chuvas concentradas no outono/inverno no litoral leste; 6) Subtropical: ao sul do Trópico de Capricórnio, chuvas bem distribuídas o ano inteiro e as quatro estações bem definidas, com a maior amplitude térmica anual do país.",
    [
      "Climograma: barras = precipitação (mm); linha = temperatura (°C)",
      "Equatorial: chuvas abundantes o ano todo, sem estação seca (linha térmica quase reta no topo)",
      "Tropical típico: verão com barras altas (chuva), inverno com barras quase zeradas (seca)",
      "Subtropical: linha térmica em 'U' (inverno frio com temperaturas abaixo de 15 °C) e chuvas regulares"
    ],
    "Para ler climogramas no ENEM: 1º olhe a linha de temperatura (se afundar no meio do ano, junho/julho, estamos no inverno do Hemisfério Sul; se for reta no topo, é equatorial); 2º olhe as barras de chuva (se sumirem no inverno, é tropical típico; se forem baixas o ano todo, é semiárido).",
    "<svg viewBox='0 0 320 180' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='180' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Climograma Típico do Brasil Central (Cerrado)</text><line x1='35' y1='140' x2='290' y2='140' stroke='var(--ln)' stroke-width='1.5'/><line x1='35' y1='30' x2='35' y2='140' stroke='var(--ln)' stroke-width='1.5'/><rect x='45' y='60' width='12' height='80' fill='#2F5BFF'/><rect x='65' y='55' width='12' height='85' fill='#2F5BFF'/><rect x='85' y='65' width='12' height='75' fill='#2F5BFF'/><rect x='105' y='110' width='12' height='30' fill='#2F5BFF'/><rect x='125' y='132' width='12' height='8' fill='#2F5BFF'/><rect x='145' y='136' width='12' height='4' fill='#2F5BFF'/><rect x='165' y='134' width='12' height='6' fill='#2F5BFF'/><rect x='185' y='130' width='12' height='10' fill='#2F5BFF'/><rect x='205' y='115' width='12' height='25' fill='#2F5BFF'/><rect x='225' y='85' width='12' height='55' fill='#2F5BFF'/><rect x='245' y='50' width='12' height='90' fill='#2F5BFF'/><rect x='265' y='45' width='12' height='95' fill='#2F5BFF'/><path d='M45 80 Q 150 95 270 78' fill='none' stroke='#D12D20' stroke-width='3'/><circle cx='155' cy='95' r='3' fill='#D12D20'/><text x='40' y='155' font-size='8' fill='var(--mu)'>J F M A M J J A S O N D</text><text x='170' y='45' font-size='10' font-weight='700' fill='#D12D20'>T média ~23 °C</text><text x='105' y='125' font-size='9' font-weight='700' fill='#D12D20'>Inverno Seco</text></svg>O gráfico climatológico sintetiza o comportamento do tempo médio observado ao longo de trinta anos em uma localidade brasileira, exibindo elevada pluviosidade concentrada entre os meses de outubro e março e uma estação de seca pronunciada e rigorosa que se estende de maio a setembro, com temperaturas médias elevadas durante todo o ciclo.",

    "Alternativa correta: C. o clima Tropical Típico (ou Tropical Continental) é caracterizado pela alternância estacional clássica entre duas estações bem definidas: verão quente e chuvoso e inverno quente e seco (onde a precipitação mensal chega a níveis próximos de zero nos meses centrais do ano). A alternativa A erra porque o clima subtropical não possui estação seca e tem invernos bem mais frios (linha térmica em 'U'). A B não possui seca nos meses de inverno. A C possui totais anuais de chuva muito menores e irregulares. A E cita o clima mediterrâneo, inexistente no território brasileiro."
