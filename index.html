  ],
  "Tipos de chuvas: frontais, orográficas e convectivas": [
    "A precipitação pluvial ocorre quando o vapor d'água atmosférico sobe, atinge camadas mais frias da troposfera, satura-se, condensa-se e precipita sob a ação da gravidade. A climatologia classifica as chuvas em três tipos fundamentais segundo o mecanismo genético que força a subida do ar: 1) Chuvas Convectivas (ou de verão): ocorrem pelo aquecimento intenso da superfície pelo sol; o ar quente e úmido sobe rapidamente em colunas térmicas, formando nuvens gigantescas de grande desenvolvimento vertical (Cumulonimbus), gerando chuvas torrenciais de curta duração, acompanhadas de raios e trovoadas na tarde (comuns na Amazônia e no verão do Centro-Sul); 2) Chuvas Orográficas (ou de relevo): ocorrem quando uma massa de ar úmido em deslocamento encontra uma barreira de relevo (serra ou chapada); o ar é forçado a subir a encosta úmida (barlavento), esfria e chove; ao descer a encosta oposta (sotavento), o ar torna-se seco e quente; 3) Chuvas Frontais: ocorrem no choque entre duas massas de ar com temperaturas e densidades diferentes (uma frente fria com ar frio e denso empurrando o ar quente e úmido para cima), gerando precipitações contínuas, homogêneas e duradouras que cobrem grandes extensões territoriais.",
    [
      "Chuvas Convectivas: aquecimento do solo ➔ subida rápida de ar quente ➔ chuvas de verão de fim de tarde com trovoadas",
      "Chuvas Orográficas: massa de ar úmida sobe serra (barlavento chuvoso) e desce seca do outro lado (sotavento seco)",
      "Chuvas Frontais: encontro de frente fria (massa polar) com frente quente ➔ chuva fina e duradoura",
      "Barlavento: vertente da serra voltada para o vento úmido; Sotavento: vertente abrigada e seca"
    ],
    "Para o ENEM: a Serra da Borborema no Nordeste é o clássico exemplo de barreira orográfica; ela barra as nuvens úmidas que vêm do mar, provocando chuvas no litoral (barlavento) e acentuando a seca no sertão semiárido que fica no sotavento (sombra de chuva).",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Chuva Orográfica (Morfoclimática)</text><path d='M30 135 L 140 50 L 220 135 L 290 135' fill='#5B6785' stroke='#14213D' stroke-width='2'/><path d='M30 100 Q 80 80 120 40' stroke='#2F5BFF' stroke-width='3' stroke-dasharray='4' fill='none'/><text x='20' y='80' font-size='9' fill='#1D3FC4' font-weight='700'>Ar Úmido Sobe</text><ellipse cx='125' cy='35' rx='25' ry='15' fill='#9AA7C2'/><line x1='115' y1='52' x2='105' y2='90' stroke='#2F5BFF' stroke-width='2' stroke-dasharray='3'/><text x='55' y='125' font-size='9' fill='#fff' font-weight='700'>Barlavento (Chuva)</text><path d='M160 45 Q 190 75 240 120' stroke='#D12D20' stroke-width='3' fill='none'/><text x='230' y='75' font-size='9' fill='#D12D20' font-weight='700'>Ar Seco Desce</text><text x='225' y='125' font-size='9' fill='#fff' font-weight='700'>Sotavento (Seco)</text></svg>Ao analisar a distribuição da pluviosidade na Serra do Mar, no estado de São Paulo, geógrafos observam que as vertentes voltadas para o oceano chegam a registrar mais de 3.500 mm de chuvas anuais, ao passo que áreas situadas no reverso da serra, a poucos quilômetros de distância no planalto, registram cerca de 1.400 mm anuais.",
    "O mecanismo físico da dinâmica atmosférica responsável por essa assimetria na precipitação é denominado chuva:",
    [
      "convectiva torrencial de brisa diurna.",
      "estratocúmulo ácida associada à irradiação solar de ondas curtas.",
      "frontal polar gerada pelo degelo repentino dos polos.",
      "orográfica, gerada pela ascensão forçada do ar úmido sobre o relevo e condensação no barlavento.",
      "submarina provocada pela evaporação de fossas tectônicas."
    ],
    3,
    "Alternativa correta: D. A chuva orográfica (ou de relevo) ocorre quando massas de ar marinhas carregadas de umidade encontram a escarpa da serra; ao serem forçadas a ascender para ultrapassar o relevo, sofrem resfriamento adiabático, saturação e condensação rápida na vertente voltada para o vento (barlavento). As alternativas A, C, D e E citam outras categorias ou formulações fisicamente incorretas."
  ],
  "Brisas marítimas e continentais": [
    "As brisas costeiras são ventos periódicos locais de ciclo diário que sopram na faixa litorânea, gerados pelo aquecimento diferencial e pelas propriedades térmicas contrastantes da terra (continente) e da água (oceano). A água do mar possui alto calor específico, demorando mais tempo para esquentar sob o sol e mais tempo para esfriar à noite; as rochas e solos do continente possuem baixo calor específico, aquecendo rapidamente durante o dia e resfriando rapidamente após o pôr do sol. Durante o dia, o continente aquece mais rápido que o mar; o ar sobre a terra fica quente, menos denso e sobe (baixa pressão local), atraindo o ar mais fresco e denso que está sobre a água: é a brisa marítima (mar ➔ terra). À noite, o continente esfria rápido e fica mais frio que o mar, que retém calor; o ar quente sobe sobre o oceano (baixa pressão) e o ar sopra do continente para a água: é a brisa terrestre (terra ➔ mar).",
    [
      "Calor específico: água demora a esquentar e a esfriar; solo esquenta e esfria depressa",
      "Brisa marítima (dia): sopra do mar para a terra (refresca praias e traz umidade litorânea)",
      "Brisa terrestre (noite): sopra da terra para o mar (utilizada por pescadores artesanais para sair para pescar)",
      "Vento: ar se move sempre da Alta Pressão (mais frio) para a Baixa Pressão (mais quente)"
    ],
    "Para lembrar na hora da prova: o vento sempre sopra DAQUELE QUE ESTÁ MAIS FRIO (alta pressão) PARA AQUELE QUE ESTÁ MAIS QUENTE (baixa pressão). De dia o mar está mais frio (brisa do mar); de noite a terra está mais fria (brisa da terra).",
    "Pescadores artesanais de comunidades litorâneas tradicionais no litoral do Ceará e da Bahia utilizam jangadas a vela há gerações: aproveitam a brisa da madrugada para adentrar o mar aberto com facilidade e utilizam o vento da tarde para retornar à praia impulsionados pelas correntes de ar costeiras.",
    "O princípio termodinâmico e barométrico que rege a inversão diária do sentido desses ventos locais baseia-se na:",
    [
      "atração magnética exercida pelas marés vivas lunares que puxam o oxigênio gasoso.",
      "diferença de calor específico entre o solo continental e a água do oceano, gerando centros térmicos de pressão que se invertem entre o dia e a noite.",
      "ação contínua de tornados de baixa latitude que invertem o sentido de rotação da Terra.",
      "mudança na inclinação do eixo planetário que ocorre a cada seis horas em zonas costeiras.",
      "emissão de ondas de rádio submarinas pelas placas tectônicas abissais."
    ],
    1,
    "Alternativa correta: B. A terra esquenta e esfria muito mais rápido que o mar devido ao baixo calor específico dos minerais em comparação com a água; de dia, o ar quente sobe sobre o solo aquecido e puxa a brisa marítima; à noite, o continente esfria rápido enquanto a água do mar permanece morna, fazendo a brisa soprar da terra para o oceano. As alternativas B, C, D e E trazem conceitos absurdos."
  ],
  "Domínio das Araucárias e Mata dos Pinhais": [
    "O Domínio das Araucárias (ou Mata dos Pinhais) desenvolve-se nos planaltos da Região Sul do Brasil (Paraná, Santa Catarina e norte do Rio Grande do Sul), em altitudes médias a elevadas (superiores a 500-800 m) e sob o clima Subtropical úmido, com chuvas bem distribuídas o ano inteiro e invernos frios com ocorrência de geadas e esporadicamente neve. A espécie arbórea dominante e emblemática é a Araucaria angustifolia (pinheiro-do-paraná), gimnosperma de grande porte com copa em formato de cálice ou taça e folhas aciculadas (em agulha). Os solos associados são a terra roxa (originada da decomposição do basalto vulcânico) e solos brunados, naturalmente férteis. Por possuir madeira de excelente qualidade para a construção civil e indústria de papel e celulose, e por ocupar solos agricultáveis nobres, a Mata das Araucárias sofreu intensa exploração predatória ao longo do século XX, restando hoje menos de 3% a 5% de sua cobertura florestal nativa primária.",
    [
      "Araucaria angustifolia: gimnosperma nativa de clima subtropical de planalto",
      "Clima Subtropical: quatro estações bem definidas, invernos frios com geadas e chuvas o ano todo",
      "Solos férteis: presença de terra roxa vulcânica da Bacia do Paraná",
      "Devastação histórica: ciclo da madeira e expansão da soja e trigo reduziram a floresta a menos de 4%"
    ],
    "Para o ENEM: a araucária é uma gimnosperma (não possui frutos carnosos verdadeiros; o pinhão é a sua semente comestível, dispersa pela fauna nativa como a gralha-azul).",
    "No início do século XX, ferrovias construídas no interior do Paraná e de Santa Catarina transportavam diariamente vagões repletos de toras gigantescas de pinheiro-do-paraná destinadas a serrarias, carpintarias e exportações portuárias, levando à quase extinção de um dos mais representativos ecossistemas florestais do planalto meridional brasileiro.",
    "O bioma e o domínio morfoclimático afetados pela histórica e predatória extração madeireira relatada correspondem à:",
    [
      "Mata das Araucárias (Floresta Ombrófila Mista) nos planaltos subtropicais do Sul.",
      "Mata de Igapó na planície de inundação equatorial.",
      "Mata dos Cocais no semiárido piauiense.",
      "Savana de Estépica nos manguezais salobros litorâneos.",
      "Vegetação de Restingas arenosas da Baixada Maranhense."
    ],
    0,
    "Alternativa correta: A. A Mata das Araucárias (Floresta Ombrófila Mista) ocupa os planaltos do Sul do Brasil sob o clima subtropical de altitude; o ciclo econômico da madeira e a expansão de lavouras sobre seus solos basálticos devastaram quase a totalidade de sua área original. As alternativas A, B, D e E citam formações vegetais do Norte, Nordeste ou litorâneas."
  ],
  "Manguezais e restingas litorâneas": [
    "Os manguezais e as restingas são ecossistemas costeiros pioneiros que integram a complexa zona de transição entre o continente e o oceano. O manguezal é um ecossistema halófilo (adaptado à água salobra) e hidrófilo que se desenvolve em áreas abrigadas de estuários, deltas e lagunas da costa brasileira onde há encontro da água doce dos rios com a água salgada das marés. Apresenta solo lodoso, movediço, fétido e com deficiência de oxigênio (anóxico); a vegetação típica possui adaptações singulares: raízes escoras (que garantem sustentação mecânica no lodo) e pneumatóforos (raízes respiratórias aéreas com poros que absorvem oxigênio do ar durante a maré baixa). O manguezal é considerado o grande 'berçário da vida marinha', onde peixes, caranguejos e camarões se reproduzem. As restingas são ecossistemas arenosos de praias e cordões litorâneos com vegetação rasteira fixadora de dunas. Ambos são Áreas de Preservação Permanente (APP) severamente ameaçados pela especulação imobiliária urbana, carcinicultura (criação de camarão) e poluição por esgoto.",
    [
      "Manguezal: berçário ecológico marinho em estuários protegidos (água salobra e solo lamoso anóxico)",
      "Adaptações da flora do mangue: raízes escoras (apoio no lodo) e pneumatóforos (raízes aéreas respiratórias)",
      "Restingas: vegetação fixadora de dunas e restingas arenosas sob influência marinha",
      "Ameaças antrópicas: aterros para condomínios litorâneos, tanques de carcinicultura e despejo de efluentes urbanos"
    ],
    "Para o ENEM: manguezais sequestram até 4 vezes mais carbono por hectare do que florestas terrestres ('carbono azul'); destruí-los para fazer condomínios ou criar camarão agrava o aquecimento global e destrói o sustento de comunidades tradicionais de catadores de caranguejo.",
    "Biólogos e pescadores artesanais denunciam que a instalação descontrolada de tanques escavados para a carcinicultura (criação de camarão em cativeiro) e o aterro de áreas costeiras em estuários do litoral nordestino provocaram o desmatamento de vastas faixas de manguezais, gerando a diminuição de mais de 70% na captura de caranguejo-uçá e peixes comerciais.",
    "A gravidade da degradação ecológica dos manguezais para o equilíbrio ambiental e para a pesca marinha decorre do fato de que esse ecossistema funciona como:",
    [
      "a principal fonte continental de extração de calcário fóssil para cimento civil.",
      "um berçário ecológico vital para a desova, alimentação e reprodução de inúmeras espécies marinhas e estuarinas.",
      "um deserto de areia movediça completamente desprovido de qualquer organismo animal nativo.",
      "uma usina natural de geração de energia nuclear a partir da decomposição do sal.",
      "a barreira orográfica que impede a chegada de tsunamis polares ao planalto central."
    ],
    1,
    "Alternativa correta: B. Os manguezais fornecem abrigo, nutrientes orgânicos e águas calmas protegidas por raízes emaranhadas, sendo essenciais como berçário de crustáceos, moluscos e peixes de alto valor ecológico e alimentar; sua destruição desarticula a cadeia alimentar marinha e prejudica comunidades pesqueiras tradicionais. As alternativas A, C, D e E trazem hipóteses sem fundamento biológico ou geográfico."
  ],
  "Ciclo das rochas e tipos de rochas": [
    "A litosfera é formada por minerais agregados em rochas, que se dividem em três grandes grupos genéticos interconectados pelo ciclo das rochas: 1) Rochas Magmáticas (ou Ígneas): formadas pela solidificação do magma; subdividem-se em plutônicas/intrusivas (resfriamento lento no interior da crosta, com cristais visíveis, como o granito) e vulcânicas/extrusivas (resfriamento rápido na superfície pela lava, como o basalto); 2) Rochas Sedimentares: formadas pelo intemperismo, erosão, transporte, deposição e compactação (diagênese) de fragmentos de rochas preexistentes ou restos orgânicos; são dispostas em camadas (estratificadas) e são as únicas rochas que abrigam fósseis e combustíveis fósseis (como arenito, calcário, folhelho e carvão mineral); 3) Rochas Metamórficas: originadas da transformação de rochas pré-existentes submetidas a altas pressões e temperaturas no interior da Terra sem atingir a fusão, alterando sua estrutura cristalina (como o gnaisse, derivado do granito; o mármore, derivado do calcário; e o quartzito, derivado do arenito).",
    [
      "Magmáticas intrusivas: resfriamento lento no subsolo (granito); extrusivas: resfriamento rápido na superfície (basalto)",
      "Sedimentares: formadas por diagênese e acúmulo de sedimentos; únicas que contêm fósseis e petróleo",
      "Metamórficas: alteração por pressão e temperatura elevadas (calcário ➔ mármore; granito ➔ gnaisse)",
      "Ciclo das rochas: dinamismo litosférico que transforma um tipo de rocha em outro ao longo do tempo geológico"
    ],
    "Para o ENEM: fósseis, petróleo, gás natural e carvão mineral ocorrem EXCLUSIVAMENTE em rochas sedimentares; se uma alternativa falar em fóssil ou petróleo encontrado dentro de rocha magmática ou metamórfica, ela está incorreta.",
    "Durante escavações de engenharia para a implantação de uma rodovia em uma bacia sedimentar, geólogos identificaram camadas paralelas estratificadas contendo conchas fossilizadas e pegadas preservadas de répteis datadas da Era Mesozoica.",
    "A presença de fósseis preservados na formação geológica estudada explica-se pelo fato de que as rochas sedimentares:",
    [
      "solidificam-se a partir de lava vulcânica incandescente que queima qualquer vestígio mineral.",
      "são rochas ígneas plutônicas originadas na astenosfera profunda a 3.000 graus de temperatura.",
      "passam por fusão atômica completa que recria o DNA original dos organismos extintos.",
      "formam-se pela deposição e compactação gradual de sedimentos em baixas temperaturas, permitindo a fossilização de restos biológicos.",
      "inexistem na superfície continental do planeta Terra, ocorrendo apenas na Lua."
    ],
    3,
    "Alternativa correta: D. As rochas sedimentares formam-se pelo acúmulo de partículas e matéria orgânica em bacias sob temperaturas e pressões brandas; o soterramento rápido por lamas e areias protege os restos biológicos da oxigenação e decomposição bacteriana total, permitindo a mineralização e formação de fósseis. As alternativas A e D confundem com rochas magmáticas em fusão (onde qualquer fóssil seria incinerado). As alternativas C e E trazem formulações fantasiosas."
  ],
  "Curvas de nível e leitura de relevo": [
    "A representação tridimensional do relevo em mapas bidimensionais realiza-se por meio de curvas de nível (ou isoípsas): linhas imaginárias que unem todos os pontos de mesma altitude em relação ao nível médio do mar. A leitura de mapas topográficos apoia-se em regras geométricas rígidas: 1) Pontos de mesma cota altimétrica possuem o mesmo valor numérico; 2) A distância gráfica entre as curvas indica a declividade do terreno: quando as curvas de nível estão muito próximas e densas, o terreno é íngreme e escarpado (alta declividade, vertente abrupta); quando as curvas estão afastadas e espaçadas, o relevo é plano e suave (baixa declividade, planície ou colina suave); 3) Curvas concêntricas fechadas cujos valores aumentam em direção ao centro representam topos de morros ou picos; curvas concêntricas cujos valores diminuem para o centro representam depressões ou dolinas; 4) Em vales fluviais, as curvas de nível formam desenhos em 'V' com o vértice apontando para a nascente (montante), e a água corre morro abaixo no sentido oposto.",
    [
      "Curvas de nível (isoípsas): unem pontos de mesma altitude em relação ao mar",
      "Curvas muito próximas: encosta íngreme, escarpada e de alta declividade (risco de erosão e deslizamento)",
      "Curvas espaçadas: relevo plano, suave e de baixa declividade (ideal para mecanização agrícola)",
      "Curvas em 'V': vértice aponta para a nascente; o rio corre no sentido em que as cotas diminuem"
    ],
    "Para a prova do ENEM: curvas de nível coladas umas nas outras = abismo, serra ou escarpa íngreme. Curvas de nível bem longe umas das outras = descampado plano ou chapada horizontal.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Mapa Topográfico: Curvas de Nível</text><circle cx='100' cy='85' r='55' fill='none' stroke='#2F5BFF' stroke-width='1.5'/><circle cx='100' cy='85' r='40' fill='none' stroke='#2F5BFF' stroke-width='1.5'/><circle cx='100' cy='85' r='25' fill='none' stroke='#2F5BFF' stroke-width='1.5'/><circle cx='100' cy='85' r='10' fill='none' stroke='#2F5BFF' stroke-width='1.5'/><text x='92' y='89' font-size='8' fill='#D12D20' font-weight='700'>400m</text><text x='100' y='65' font-size='8' fill='#2F5BFF'>300m</text><text x='100' y='48' font-size='8' fill='#2F5BFF'>200m</text><text x='100' y='32' font-size='8' fill='#2F5BFF'>100m</text><text x='180' y='65' font-size='9' fill='var(--tx)' font-weight='700'>➔ Curvas espaçadas a leste: declive suave</text><text x='180' y='95' font-size='9' fill='var(--tx)' font-weight='700'>➔ Curvas próximas a oeste: escarpa íngreme</text></svg>Um engenheiro agrônomo analisa uma carta topográfica para decidir o melhor traçado de uma estrada rural e o local para o plantio mecanizado de cana-de-açúcar. Ele observa que a encosta leste de uma elevação apresenta curvas de nível bastante separadas entre si, enquanto a encosta oeste exibe curvas de nível muito densas e sobrepostas.",
    "Com base na interpretação técnica das curvas de nível, o profissional deve optar por traçar a rota e mecanizar a lavoura na vertente leste porque ela apresenta:",
    [
      "um abismo vertical com paredões de granito inexpugnáveis.",
      "ausência de gravidade terrestre que facilita a elevação dos veículos pesados.",
      "altitude nula exatamente no nível das marés salgadas oceânicas.",
      "presença exclusiva de solos hidromórficos permanentemente inundados por água doce.",
      "relevo de declividade suave e relevo menos acidentado, favorecendo o trânsito seguro de máquinas e reduzindo a erosão."
    ],
    4,
    "Alternativa correta: E. O espaçamento largo entre curvas de nível consecutivas indica que a variação de altitude ocorre de maneira suave e gradual ao longo de uma grande distância horizontal, caracterizando relevo plano ou colinoso brando, ideal para o tráfego de colheitadeiras e com menor velocidade de escoamento superficial da água. As alternativas A, C, D e E trazem conclusões erradas ou estapafúrdias."
  ],
  "Estrutura de uma bacia hidrográfica": [
    "A bacia hidrográfica é a área territorial drenada por um rio principal e seus afluentes e subafluentes, delimitada geograficamente pelos pontos mais altos do relevo que funcionam como 'divisores de águas' (interflúvios). Toda a precipitação pluvial que cai no interior dessa área converge pela gravidade em direção ao canal principal até o ponto mais baixo de saída da bacia, denominado foz ou exutório. Uma bacia divide-se morfologicamente em: 1) Alto curso (montante): nascentes em áreas elevadas, com grande declividade, vales em 'V', águas rápidas e predomínio de erosão; 2) Médio curso: relevo mais brando, águas com velocidade moderada e balanço entre erosão e transporte; 3) Baixo curso (jusante): planícies aluviais, águas lentas com meandros e predomínio de sedimentação e deposição de aluviões próximo à foz. A gestão territorial moderna adota a bacia hidrográfica como a unidade física ideal para o planejamento integrado dos recursos hídricos e do solo.",
    [
      "Divisor de águas (interflúvio): linha de cumeada de relevo que separa bacias hidrográficas vizinhas",
      "Montante: sentido em direção à nascente (rio acima); Jusante: sentido em direção à foz (rio abaixo)",
      "Alto curso: erosão intensa; Médio curso: transporte; Baixo curso: sedimentação e meandros",
      "Foz: ponto onde o rio deságua (estuário em canal único ou delta em vários canais ramificados)"
    ],
    "Para a prova do ENEM: tudo o que acontece no alto curso (desmatamento, lixo, defensivos agrícolas) afeta inevitavelmente as cidades e populações que vivem no baixo curso (jusante), porque a gravidade faz a água e os poluentes descerem o rio.",
    "O Comitê de Bacia Hidrográfica de um rio estadual identificou que o assoreamento crônico do canal principal no baixo curso, responsável por inundações periódicas na cidade portuária situada na foz, tem origem no desmatamento de matas ciliares ocorrido em pequenas propriedades agrícolas localizadas no alto curso do rio.",
    "A conexão hidrogeográfica entre o problema registrado a jusante e as intervenções humanas a montante demonstra que a bacia hidrográfica:",
    [
      "comporta-se como um sistema isolado onde as partes altas não mantêm nenhuma troca física com as partes baixas.",
      "tem seu sentido de fluxo determinado exclusivamente pelo vento que sopra da foz para a nascente.",
      "funciona como um sistema integrado em que as ações antrópicas realizadas nas nascentes repercutem diretamente no escoamento e transporte de sedimentos ao longo de todo o leito fluvial.",
      "é imune a qualquer processo erosivo provocado pela supressão da vegetação ciliar.",
      "deságua suas águas no topo das montanhas mais elevadas da cordilheira continental."
    ],
    2,
    "Alternativa correta: C. Uma bacia hidrográfica é um sistema geomorfológico integrado pela gravidade: o desmatamento nas nascentes (alto curso/montante) expõe o solo à erosão; as enxurradas lavam a terra e a transportam canal abaixo, provocando o assoreamento do leito e inundações catastróficas na foz (baixo curso/jusante). As alternativas A, C, D e E trazem absurdos hidrológicos."
  ],
  "Anamorfose geográfica e cartogramas": [
    "A anamorfose geográfica é uma forma contemporânea de representação cartográfica temática na qual as fronteiras, áreas e formas geométricas reais dos países ou estados são distorcidas propositalmente em proporção direta ao valor estatístico de uma variável quantitativa específica (como população absoluta, PIB, consumo de energia, mortes por conflitos armados ou emissões de CO₂). Nesse tipo de cartograma, o território que possui o maior valor absoluto da grandeza analisada aparece visualmente agigantado e hiperdimensionado no mapa, enquanto países com valores numéricos baixos aparecem encolhidos ou atrofiados, independentemente de sua área geográfica real em quilômetros quadrados. A anamorfose é um recurso didático de alto impacto visual utilizado no ENEM para denunciar contrastes globais e disparidades socioeconômicas e demográficas.",
    [
      "Anamorfose: mapa com distorção geométrica proposital proporcional a um dado estatístico",
      "Anamorfose Demográfica: Índia e China aparecem gigantescas; Canadá, Rússia e Austrália aparecem finos e atrofiados",
      "Anamorfose de Riqueza (PIB): EUA, Europa Ocidental e Japão dominam o mapa; continente africano encolhe",
      "Objetivo: comunicação visual imediata de disparidades geográficas e hierarquias socioeconômicas"
    ],
    "Para ler uma anamorfose no ENEM: identifique quem está 'inchado' e quem está 'murcho'! Se a Índia e a China estão enormes e a Austrália minúscula, o mapa retrata População Absoluta. Se a África sumiu e os EUA/Europa estão imensos, o mapa retrata Riqueza, PIB ou Patentes.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Anamorfose Demográfica Mundial (Esquemática)</text><rect x='30' y='50' width='35' height='25' fill='#5B6785' rx='3'/><text x='35' y='66' font-size='8' fill='#fff'>Am. Norte</text><rect x='75' y='50' width='45' height='30' fill='#2F5BFF' rx='3'/><text x='85' y='68' font-size='8' fill='#fff'>Europa</text><rect x='130' y='40' width='140' height='75' fill='#D12D20' rx='6'/><text x='160' y='80' font-size='12' font-weight='800' fill='#fff'>ÁSIA (Índia + China)</text><text x='170' y='96' font-size='9' fill='#fff'>~60% da população mundial</text><rect x='50' y='90' width='30' height='25' fill='#FFB400' rx='3'/><text x='53' y='106' font-size='7' fill='var(--tx)'>Am. Sul</text><rect x='85' y='90' width='35' height='35' fill='#2E7D32' rx='3'/><text x='92' y='110' font-size='8' fill='#fff'>África</text></svg>Em uma prova do ENEM, apresenta-se um mapa-múndi no qual a Ásia oriental e meridional ocupa quase dois terços de toda a superfície representada na página, enquanto o Canadá e a Federação Russa (dois dos maiores países do planeta em área territorial) aparecem como estreitas faixas de terra finas e espremidas.",
    "A técnica cartográfica adotada e a variável socioeconômica representada no mapa são, respectivamente:",
    [
      "projeção cônica conforme e volume de reservas de petróleo cru submarino.",
      "carta náutica topográfica e altitude média das cordilheiras de dobramentos modernos.",
      "projeção azimutal equidistante e área territorial física em quilômetros quadrados.",
      "anamorfose geográfica e contingente de população absoluta dos países.",
      "planta cadastral urbana e taxa de analfabetismo funcional infantil."
    ],
    3,
    "Alternativa correta: D. A técnica da anamorfose redimensiona as fronteiras espaciais em proporção direta a um dado estatístico; como a China e a Índia somam mais de 2,8 bilhões de habitantes, o continente asiático agiganta-se no cartograma populacional, ao passo que nações de áreas imensas porém pouco povoadas (como Canadá e Rússia) aparecem reduzidas. As alternativas A, C, D e E citam projeções ou variáveis incompatíveis."
  ],
  "Teorias demográficas: Malthus, Neomalthus e Reformista": [
    "As teorias demográficas analisam as causas e consequências do crescimento populacional humano sobre os recursos e a sociedade: 1) Teoria Malthusiana (Thomas Malthus, 1798): formulada na Inglaterra da 1ª Revolução Industrial, afirmava que a população crescia em progressão geométrica (PG: 1, 2, 4, 8, 16...) enquanto a produção de alimentos crescia apenas em progressão aritmética (PA: 1, 2, 3, 4, 5...); previa a fome generalizada e propunha a 'sujeição moral' (abstinência sexual e casamento tardio dos pobres); errou por não prever o salto de produtividade trazido pela mecanização agrícola e pela Revolução Verde; 2) Teoria Neomalthusiana (pós-Segunda Guerra Mundial): culpava o crescimento da população pobre pelo subdesenvolvimento e pela miséria no Terceiro Mundo; propunha o controle estrito de natalidade (planejamento familiar forçado, pílulas, esterilização em massa); 3) Teoria Reformista (ou Marxista): inverte a lógica neomalthusiana; defende que a superpopulação e a pobreza não são a causa, mas a consequência da desigualdade social e da má distribuição de renda; a prioridade deve ser reformas sociais básicas (educação, saúde, reforma agrária e trabalho digno), pois quando a população tem acesso à renda e instrução, a natalidade cai espontaneamente.",
    [
      "Malthusiana (1798): População em PG vs Alimentos em PA (proposta: abstinência sexual)",
      "Neomalthusiana: Superpopulação causa pobreza (proposta: controle estatal compulsório da natalidade)",
      "Reformista (Marxista): Pobreza causa superpopulação; solução é justiça social e distribuição de renda",
      "Ecomalthusiana: culpam a população pelo esgotamento ecológico do planeta (ignoram a desigualdade de consumo)"
    ],
    "Para o ENEM: a Teoria Reformista é a base das políticas das Nações Unidas: para reduzir o número de filhos no mundo, não se impõe castigo aos pobres; investe-se na educação das mulheres e na distribuição de renda, que a natalidade cai de forma natural.",
    "Durante conferência sobre desenvolvimento humano, um representante oficial argumentou que 'a proliferação de famílias numerosas nas periferias dos países do Sul global é o principal obstáculo ao crescimento econômico, devendo os governos condicionar benefícios sociais à laqueadura tubária obrigatória de mulheres de baixa renda'. Em resposta, outro debatedor declarou que 'a fecundidade elevada decorre da falta de acesso à educação e da exclusão econômica; superar a miséria exige investir em escolas públicas de qualidade e em distribuição justa de renda'.",
    "As duas posições políticas e ideológicas expostas no debate correspondem, respectivamente, às teorias demográficas:",
    [
      "Neomalthusiana e Reformista (ou Crítica).",
      "Malthusiana tradicional e Ecomalthusiana preservacionista.",

function qb(n,sel,quiz){
  const c=C[n];

function pick(n){
  if(view=="s"){
    if(st.q!=null)return;
    const x=SUB[cur.i][cur.j];
    st.q=n;
    rec(x.n,n==C[x.n][6]);
    q("#qb").innerHTML=qb(x.n,n);
  } else if(view=="q"&&Q&&Q.k<Q.list.length){
    if(Q.sel!=null)return;
    const nm=Q.list[Q.k].n,ok=n==C[nm][6];
    Q.sel=n;
    if(ok)Q.score++;
    Q.ans[Q.k]={ok};
    rec(nm,ok);
    q("#qb").innerHTML=qb(nm,n,1);
    q("#qs").textContent="✔ "+Q.score;
  }
}

function vRes(){
  const n=Q.list.length,pc=Math.round(100*Q.score/n),by={};
  if(!Q.saved){Q.saved=1;Q.sec=Math.floor((Date.now()-Q.t0)/1000);S.sims.unshift({d:Date.now(),t:Q.title,s:Q.score,n,sec:Q.sec});S.sims=S.sims.slice(0,15);sv()}
  Q.ans.forEach((a,k)=>{const m=Q.list[k].i,o=by[m]||(by[m]={a:0,t:0});o.t++;if(a.ok)o.a++});

  return`<div class="res a">${ring(pc).replace('class="rg"','class="rg big"')}<h1>${pc>=80?"Excelente domínio geográfico! 🏆":pc>=60?"Bom rendimento! 💪":pc>=40?"Bom início, revise os pontos fracos! 📚":"Atenção aos conceitos fundamentais! 🔍"}</h1><p class="mu">${Q.score} de ${n} acertos em ${fmt(Q.sec)} · ${Q.title}</p><div class="row" style="justify-content:center">${wr?`<button class="bt" onclick="redo()">Refazer as ${wr} erradas</button>`:""}<a class="bt gh" href="#/sim">Novo Simulado</a><a class="bt gh" href="#/st">Ver Estatísticas</a></div></div><div class="bx a" style="--i:1"><h2>Desempenho por Módulo</h2>${Object.keys(by).map(m=>`<div class="mr hu" style="--h:${m*24}"><span>${IC[m]} ${M[m].n}</span>${bar(100*by[m].a/by[m].t)}<small>${by[m].a}/${by[m].t}</small></div>`).join("")}</div>`;

function vGl(){
  let items = [];
  M.forEach((m, i)=>{
    SUB[i].forEach((s, j)=>{
      const c = C[s.n];
      if(c && c[1]){
        c[1].forEach(conceito => {
          items.push({ mod: m.n, sub: s.n, txt: conceito, i, j });
        });
      }
    });
  });

  const t = nz(st.qs.trim());
  if(t){
    items = items.filter(x => nz(x.txt + " " + x.mod + " " + x.sub).includes(t));
  }

  return `<h1 class="a">📖 Glossário Geográfico Unificado</h1>
  <p class="a mu">Todos os conceitos-chave, leis ambientais, siglas e propriedades catalogados por módulo com busca rápida e cópia direta:</p>
  <div class="srch a" style="--i:1"><input id="gq" type="search" placeholder="Filtrar conceito no glossário..." value="${st.qs}" oninput="st.qs=this.value;q('#gl-list').innerHTML=renderGlList(this.value);" autocomplete="off"></div>
  <div id="gl-list" class="a" style="--i:2">${renderGlList(st.qs)}</div>`;
}

function renderGlList(query){
  let items = [];
  M.forEach((m, i)=>{
    SUB[i].forEach((s, j)=>{
      const c = C[s.n];
      if(c && c[1]){
        c[1].forEach(conceito => {
          items.push({ mod: m.n, sub: s.n, txt: conceito, i, j });
        });
      }
    });
  });

  const t = nz((query||"").trim());
  if(t){
    items = items.filter(x => nz(x.txt + " " + x.mod + " " + x.sub).includes(t));
  }

  if(!items.length) return `<p class="mu" style="padding:20px 0">Nenhum termo encontrado com "${query}".</p>`;

  return `<div style="display:grid;gap:8px;margin-top:14px">` + items.map(item => `
    <div class="rw" style="margin-bottom:6px" onclick="go('s/${item.i}/${item.j}')">
      <span class="rt">
        ${item.txt}
        <small>${item.sub} · <b>${item.mod}</b></small>
      </span>
      <button class="cp-btn" style="font-size:14px" onclick="event.stopPropagation();copyTxt('${item.txt.replace(/'/g, "\\'")}', this)" title="Copiar conceito">📋</button>
    </div>
  `).join("") + `</div>`;
}

    }
  ];

  return `<h1 class="a">⚠️ As 9 Pegadinhas Mais Clássicas do ENEM</h1>
  <p class="a mu">Revise as confusões conceituais que o Inep mais utiliza para construir os distratores da prova de Ciências Humanas:</p>
  <div class="a" style="--i:1;margin-top:16px">
    ${pegadinhas.map((p, idx)=>`
      <div class="err-card">
        <span class="err-badge" style="background:color-mix(in srgb,var(--er) 15%,transparent);color:var(--er)">Pegadinha #${idx+1}</span>
        <h3>${p.t}</h3>
        <p style="margin:4px 0 8px;font-size:13.5px"><b>❌ O erro comum:</b> <span class="mu">${p.errado}</span></p>
        <p style="margin:4px 0 8px;font-size:13.5px"><b>✔️ O correto na Geografia:</b> ${p.certo}</p>
        <div class="dc" style="margin-top:8px;font-size:13px"><b>💡 Macete ENEM:</b> ${p.dica}</div>
      </div>
    `).join("")}
  </div>`;
}

function vSt(){
  let A=0,E=0;Object.values(S.res).forEach(r=>{A+=r.a;E+=r.e});
  const T=A+E,
  cs=[
    ["✅",doneN()+"/"+FLAT.length,"assuntos concluídos"],
    ["🎯",T?Math.round(100*A/T)+"%":"—","taxa de acerto"],
    ["✔",A,"questões corretas"],
    ["✘",E,"questões erradas"],
    ["⏱",fmt(S.t),"tempo de estudo"],
    ["📝",S.sims.length,"simulados realizados"]
  ];
  return`<h1 class="a">📊 Suas Estatísticas de Estudo</h1><div class="g3">${cs.map((c,k)=>`<div class="bx stat a" style="--i:${k}"><span>${c[0]}</span><b>${c[1]}</b><small>${c[2]}</small></div>`).join("")}</div><h2 class="a">Desempenho por Módulo Temático</h2><div class="bx a">${M.map((m,i)=>{const s=ms(i);return`<div class="mr"><span>${IC[i]} ${m.n}</span><div class="sb"><i class="g1" data-w="${s.t?100*s.a/s.t:0}"></i><i class="e1" data-w="${s.t?100*s.e/s.t:0}"></i></div><small>${s.t?`${s.a} certas · ${s.e} erradas (${s.p}%)`:"—"}</small></div>`}).join("")}</div><h2 class="a">Histórico de Simulados Realizados</h2>${S.sims.length?`<div class="bx a">${S.sims.map(x=>`<div class="mr2"><span>${new Date(x.d).toLocaleDateString("pt-BR")} · ${x.t}</span><b>${x.s}/${x.n} (${Math.round(100*x.s/x.n)}%)</b><small>${fmt(x.sec)}</small></div>`).join("")}</div>`:`<p class="mu">Nenhum simulado finalizado ainda. Teste seus conhecimentos na aba Simulado!</p>`}<div class="row" style="margin-top:16px"><button class="bt gh" onclick="rst()">Zerar histórico e estatísticas</button></div>`;
}

function rst(){
  if(confirm("Deseja zerar estatísticas, acertos, erros e histórico de simulados? Seus temas concluídos e favoritos serão preservados.")){
    S.res={};S.wrong={};S.sims=[];S.t=0;sv();render();
  }
}

function vRv(){
  const l=uniq(FLAT).filter(x=>S.wrong[x.n]);
  return`<h1 class="a">🔁 Caderno de Erros</h1>`+(l.length?`<p class="a mu">Aqui estão as questões que você errou recentemente. Acertá-las retira automaticamente da lista de pendências:</p><div class="row a"><button class="bt" onclick="startRev()">▶ Refazer as ${l.length} questões com erro</button></div>`+l.map(row).join(""):`<div class="bx empty a">🎉<p>Nenhum erro pendente! Você acertou todas as questões praticadas até o momento.</p><a class="bt" href="#/sim">Iniciar novo simulado</a></div>`);
}

function vFv(){
  const l=FLAT.filter(x=>S.fav[x.i+"."+x.j]);
  return`<h1 class="a">⭐ Assuntos Favoritos</h1>`+(l.length?`<p class="a mu">Temas marcados com estrela para revisão prioritária antes da prova:</p>`+l.map(row).join(""):`<div class="bx empty a">⭐<p>Nenhum assunto favoritado. Toque na estrela de qualquer assunto para guardá-lo aqui.</p><a class="bt" href="#/">Explorar módulos</a></div>`);
}

function render(){
  const p=location.hash.replace(/^#\/?/,"").split("/"),v=p[0];
  view=v;st.q=null;let o;
  if(v=="m") o=vMod(+p[1]);
  else if(v=="s"){cur={i:+p[1],j:+p[2]};o=vSub(cur.i,cur.j)}
  else if(v=="sim") o=vSim();
  else if(v=="q") o=vQ();
  else if(v=="fc") o=vFc(p[1]);
  else if(v=="map") o=vMap();
  else if(v=="gl") o=vGl();
  else if(v=="err") o=vErr();
  else if(v=="st") o=vSt();
  else if(v=="rv") o=vRv();
  else if(v=="fv") o=vFv();
  else{view="";o=vHome()}

  if(o==null)return;
  q("#app").innerHTML=o;
  bars();
  const act=["m","s",""].includes(view)?"":view=="q"?"sim":view;
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r==act));
  scrollTo(0,0);
}

function th(){
  const d=document.documentElement,
  dark=d.dataset.theme?d.dataset.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  S.theme=dark?"light":"dark";
  d.dataset.theme=S.theme;
  sv();
}
if(S.theme)document.documentElement.dataset.theme=S.theme;

const tick=()=>{
  const e=q("#tm");
  if(e)e.textContent=(run?"⏸ ":"⏱ ")+fmt(S.t);
  const t=q("#qt");
  if(t&&Q&&Q.k<Q.list.length)t.textContent="⏱ "+fmt(Math.floor((Date.now()-Q.t0)/1000));
};

function tmT(){run=!run;tick()}
setInterval(()=>{if(run){S.t++;if(S.t%5==0)sv()}tick()},1000);

addEventListener("keydown",e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){
    if(e.key=="Escape")e.target.blur();
    return;
  }
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(k=="/"){
    const s=q("#sq")||q("#gq");
    if(s){e.preventDefault();s.focus()}
    return;
  }
  const oi=k.length==1&&"abcde".includes(k.toLowerCase())?"abcde".indexOf(k.toLowerCase()):"12345".indexOf(k);
  if((view=="s"||view=="q")&&oi>=0&&k.length==1){pick(oi);return}
  if(k=="ArrowRight"){
    if(view=="s")navS(1);
    else if(view=="q"&&Q&&Q.sel!=null)nextQ();
    else if(view=="fc")fcGo(1);
  } else if(k=="ArrowLeft"){
    if(view=="s")navS(-1);
    else if(view=="fc")fcGo(-1);
  } else if(k==" "&&view=="fc"){
    e.preventDefault();flipFc();
  } else if(k=="Enter"&&view=="q"&&Q&&Q.sel!=null){
    nextQ();
  } else if(k=="Escape"&&view!=""){
    go("");
  }
});

addEventListener("pagehide",sv);
addEventListener("hashchange",render);
render();
tick();
</script>
</body>
</html>
