    "Alternativa correta: B. o projeto de integração foi desenhado com a meta de aumentar a segurança hídrica e a resiliência de mais de 12 milhões de habitantes no semiárido nordestino (especialmente em Pernambuco, Ceará, Paraíba e Rio Grande do Norte), garantindo água potável permanente para populações sujeitas a secas cíclicas e sustentando pequenas atividades agropecuárias. As alternativas A, C, D e E trazem formulações descabidas ou geograficamente estapafúrdias."
  ],
  "Usos múltiplos da água e crise hídrica": [
    "A água doce é um recurso natural finito e dotado de valor econômico, regulado no Brasil pela Política Nacional de Recursos Hídricos (Lei Federal nº 9.433/1997, a 'Lei das Águas'). Essa legislação descentralizou a governança ao instituir a bacia hidrográfica como unidade territorial de planejamento e criou os Comitês de Bacia Hidrográfica (compostas pelo poder público, usuários da água e sociedade civil). Dados consolidados da Agência Nacional de Águas e Saneamento Básico (ANA) demonstram a distribuição dos usos consuntivos (onde a água é consumida e não retorna de imediato ao manancial): a agricultura irrigada responde por cerca de 50% da retirada de água no Brasil, seguida pelo abastecimento urbano humano (~24%), indústria (~9%), pecuária (~8%) e termelétricas. As crises hídricas metropolitanas decorrem não apenas de anomalias pluviométricas (estiagens), mas de falhas de gestão, desmatamento de mananciais, poluição crônica de rios e perdas nas redes de distribuição.",
    [
      "Lei das Águas (9.433/1997): comitês de bacia, cobrança pelo uso da água e prioridade absoluta para consumo humano e animal",
      "Maior consumidor de água doce no Brasil: agricultura irrigada (responde por cerca de metade do consumo consuntivo total)",
      "Crise hídrica urbana: decorre de poluição de mananciais, perdas por vazamentos na rede física (>30%) e degradação de florestas ciliares",
      "Pegada hídrica: volume de água doce consumido direta e indiretamente para produzir bens e alimentos"
    ],
    "Pegadinha clássica do ENEM: quem mais consome água no Brasil NÃO é a população nas torneiras das casas! A agricultura irrigada é disparada a maior usuária consuntiva de água doce do país (cerca de 50% do total segundo a ANA).",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Uso da Água no Brasil (Dados ANA)</text><rect x='30' y='45' width='140' height='26' fill='#2F5BFF' rx='4'/><text x='35' y='62' font-size='10' font-weight='700' fill='#fff'>Irrigação Agrícola: ~50%</text><rect x='30' y='76' width='70' height='22' fill='#5B6785' rx='4'/><text x='35' y='91' font-size='9' font-weight='700' fill='#fff'>Urbano: ~24%</text><rect x='30' y='103' width='35' height='20' fill='#FFB400' rx='4'/><text x='70' y='117' font-size='9' fill='var(--tx)'>Indústria: ~9%</text><text x='180' y='62' font-size='9' fill='var(--mu)'>Maior parcela do consumo</text><text x='180' y='91' font-size='9' fill='var(--mu)'>Uso residencial/comércio</text><text x='180' y='117' font-size='9' fill='var(--mu)'>Processos fabris</text></svg>Em períodos de escassez prolongada e rebaixamento crítico dos reservatórios de represas hidrelétricas no Sudeste brasileiro, surgem disputas acirradas entre a vazão destinada à geração de eletricidade, o volume captado para irrigação de lavouras e a água reservada para as estações de tratamento que abastecem cidades de milhões de habitantes.",
    "Em conformidade com os princípios legais estabelecidos pela Lei nº 9.433/1997 (Lei das Águas), em caso de comprovada escassez hídrica crítica, a prioridade legal obrigatória no uso da água deve recair sobre:",
    [
      "o consumo humano e a dessedentação de animais.",
      "a lavagem industrial intensiva de minérios para exportação rápida.",
      "a irrigação ilimitada de campos de golfe e resorts turísticos litorâneos.",
      "o abastecimento exclusivo de fontes ornamentais de praças públicas centrais.",
      "a geração termelétrica de emergência movida a carvão mineral importado."
    ],
    0,
    "Alternativa correta: A. o Artigo 1º, inciso III, da Lei Federal nº 9.433/1997 estipula textualmente que 'em situações de escassez, o uso prioritário dos recursos hídricos é o consumo humano e a dessedentação de animais'. As alternativas A, C, D e E subordinam a vida humana a atividades econômicas ou supérfluas, contrariando frontalmente a legislação vigente."
  ],
  "Coordenadas geográficas: latitude e longitude": [
    "As coordenadas geográficas constituem a rede matemática de linhas imaginárias que permite a localização exata de qualquer ponto na superfície da Terra. A latitude é a distância angular medida em graus (°), minutos (′) e segundos (″) de qualquer ponto em relação à linha do Equador (0°), variando de 0° a 90° Norte ou Sul; a latitude determina as zonas térmicas da Terra e variações na insolação. A longitude é a distância angular medida em relação ao Meridiano de Greenwich (0°), variando de 0° a 180° Leste (E) ou Oeste (W); a longitude é a base astronômica para o cálculo dos fusos horários. Os paralelos são círculos paralelos ao Equador (como os Trópicos de Câncer e Capricórnio e os Círculos Polares), enquanto os meridianos são semicírculos que ligam o polo norte ao polo sul.",
    [
      "Latitude: distância angular ao Equador (0° a 90° N ou S) ➔ define clima e zonas térmicas",
      "Longitude: distância angular a Greenwich (0° a 180° Leste ou Oeste) ➔ define fusos horários",
      "Brasil no sistema de coordenadas: quase todo no Hemisfério Sul (~93%), pequena fração no Norte (~7%), e 100% no Hemisfério Ocidental (Oeste/W)",
      "Trópico de Capricórnio (23°27' S): corta os estados de SP, PR e MS"
    ],
    "Memorize as siglas em inglês ou português que aparecem nos mapas do ENEM: N = Norte, S = Sul, L/E = Leste (East), O/W = Oeste (West). Todo o território brasileiro está a OESTE (W) de Greenwich.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Coordenadas Geográficas (Mapa Esquemático sem escala)</text><line x1='30' y1='80' x2='290' y2='80' stroke='#D12D20' stroke-width='2'/><text x='35' y='75' font-size='9' fill='#D12D20' font-weight='700'>Equador (0°)</text><line x1='160' y1='25' x2='160' y2='135' stroke='#2F5BFF' stroke-width='2'/><text x='165' y='35' font-size='9' fill='#2F5BFF' font-weight='700'>Greenwich (0°)</text><circle cx='100' cy='110' r='6' fill='#FFB400'/><text x='70' y='128' font-size='10' font-weight='700' fill='var(--tx)'>Ponto P (20° S, 45° W)</text><text x='200' y='110' font-size='9' fill='var(--mu)'>Hemisfério Sul e Ocidental</text></svg>Em uma missão de resgate marítimo no Atlântico Sul, o sistema de rastreamento por satélite captou um sinal de emergência de uma embarcação posicionada nas coordenadas geográficas 23° Sul de latitude e 42° Oeste de longitude.",
    "A leitura geográfica rigorosa das coordenadas fornecidas indica que a embarcação em perigo encontra-se:",
    [
      "ao norte da linha do Equador e a leste do Meridiano de Greenwich.",
      "no Círculo Polar Ártico, em uma região de clima polar extremo e noites eternas.",
      "ao sul da linha do Equador e a oeste do Meridiano de Greenwich, próxima ao litoral do Sudeste brasileiro.",
      "exatamente sobre o Meridiano Central de Tóquio, na Ásia Oriental.",
      "ao sul da Antártida, no centro da placa tectônica do Oceano Índico."
    ],
    2,
    "Alternativa correta: C. a latitude 23° S situa o ponto no Hemisfério Sul, praticamente sobre o Trópico de Capricórnio (23°27' S); a longitude 42° W (Oeste) situa o ponto no Hemisfério Ocidental, nas proximidades do litoral do estado do Rio de Janeiro / São Paulo. A alternativa A inverte ambos os hemisférios. A C cita o Ártico (que fica a 66° N). A D cita Tóquio (que fica no Hemisfério Norte e Oriental, ~140° E). A E cita o Índico, quando a coordenada W indica o Atlântico/Américas."

  "Fusos horários e cálculos de hora": [
    "A rotação da Terra (360° em aproximadamente 24 horas) determina a existência de 24 fusos horários globais de 15° de longitude cada (360° ÷ 24 = 15° por hora). O meridiano de Greenwich (0°) é a referência internacional (GMT/UTC). Como a Terra gira de oeste para leste, as horas adiantam (somam-se) para o Leste e atrasam (subtraem-se) para o Oeste. O Brasil possui oficialmente quatro fusos horários, todos a oeste de Greenwich: 1) Fuso 1 (UTC -2): ilhas oceânicas (Fernando de Noronha, Trindade); 2) Fuso 2 (UTC -3, Hora Oficial de Brasília): todo o Nordeste, Sudeste, Sul, mais Goiás, Tocantins, Pará e Amapá; 3) Fuso 3 (UTC -4): Mato Grosso, Mato Grosso do Sul, Rondônia, Roraima e a porção oriental do Amazonas; 4) Fuso 4 (UTC -5): estado do Acre e os 13 municípios do extremo oeste do Amazonas.",
    [
      "1 fuso horário = 15° de longitude = 1 hora",
      "Sentido da conta: Para Leste ➔ SOMA horas (+); Para Oeste ➔ SUBTRAI horas (−)",
      "Brasil possui 4 fusos horários (todos atrasados em relação a Greenwich: UTC -2, UTC -3, UTC -4, UTC -5)",
      "Tempo de voo: Hora de saída ± diferença de fuso + tempo de viagem = hora de chegada no destino"
    ],
    "Passo a passo infalível no ENEM: 1) Calcule a diferença de fusos entre a cidade de origem e a de destino; 2) Ajuste o relógio da partida para o horário local do destino (somando se for para Leste, subtraindo se for para Oeste); 3) Some o tempo de voo.",
    "Um avião comercial de passageiros decola da cidade de Brasília (fuso horário oficial do Brasil: UTC -3) às 08h00 do dia 10 de maio com destino a Londres, no Reino Unido (fuso horário de Greenwich: UTC 0). O tempo de voo sem escalas é de exatamente 11 horas.",
    "Considerando apenas os fusos horários e a duração da viagem, qual será o horário local em Londres no momento exato da aterrissagem do avião?",
    [
      "16h00 do dia 10 de maio.",
      "19h00 do dia 10 de maio.",
      "05h00 do dia 11 de maio.",
      "22h00 do dia 10 de maio.",
      "14h00 do dia 10 de maio."
    ],
    3,
    "Alternativa correta: D. Cálculo por etapas verificado por script: 1) Diferença de fuso: Brasília está a UTC -3 e Londres a UTC 0; Londres está 3 fusos a leste de Brasília, portanto Londres está 3 horas adiantada em relação a Brasília (+3 h). 2) Quando o voo decola às 08h00 em Brasília, em Londres já são: 08h00 + 3h = 11h00. 3) Somando o tempo de voo de 11 horas: 11h00 + 11h = 22h00 do mesmo dia 10 de maio. A alternativa A erra subtraindo as 3 horas do fuso (08 - 3 + 11 = 16h00). A B esquece de considerar a diferença de fuso horário (08h00 + 11h = 19h00). A D e a E resultam de erros na contagem de horas."
  ],
  "Escalas cartográficas e proporção": [
    "A escala cartográfica é a relação matemática entre as dimensões lineares medidas no mapa (d) e as distâncias reais correspondentes no terreno (D). Pode ser apresentada na forma numérica (ex.: 1:250 000, significando que 1 cm no mapa equivale a 250 000 cm na realidade) ou gráfica (uma barra graduada). Fórmula fundamental: D = d × E (onde E é o denominador da escala). A escala é dita GRANDE quando o denominador é pequeno (ex.: 1:500 ou 1:5 000, como plantas urbanas), exibindo grande nível de detalhamento e cobrindo pequena área territorial. A escala é dita PEQUENA quando o denominador é muito grande (ex.: 1:50 000 000, como planisférios mundiais e mapas do Brasil), exibindo alto grau de generalização e cobrindo grandes extensões geográficas.",
    [
      "Fórmula da escala: D = d × E (onde D = real, d = gráfico/mapa, E = denominador da escala)",
      "Conversões de unidade métrica: 1 km = 1 000 m = 100 000 cm (para passar de cm para km, divida por 100 000 / corte 5 zeros)",
      "Escala grande: denominador pequeno (1:1 000) ➔ muito detalhe, pouca área (plantas, mapas cadastrais)",
      "Escala pequena: denominador grande (1:25 000 000) ➔ pouco detalhe, muita área (mapas-múndi, mapas continentais)"
    ],
    "A pegadinha clássica número um da cartografia: 'Escala Grande' NÃO significa mapa de país grande! Escala Grande tem denominador pequeno (é uma fração maior: 1/1 000 > 1/1 000 000), mostra uma área pequena com riqueza de detalhes (como uma rua ou bairro).",
    "Em um mapa rodoviário regional confeccionado na escala numérica de 1:250 000, a distância em linha reta entre duas cidades turísticas do interior paulista mede exatamente 8 cm na folha de papel.",
    "A distância real correspondente no terreno entre essas duas cidades, em quilômetros, é de:",
    [
      "2 km.",
      "20 km.",
      "200 km.",
      "50 km.",
      "2 000 km."
    ],
    1,
    "Alternativa correta: B. Cálculo conferido matematicamente: D = d × E ➔ D = 8 cm × 250 000 = 2 000 000 cm. Como 1 metro tem 100 cm e 1 km tem 1 000 metros (1 km = 100 000 cm), dividimos 2 000 000 por 100 000 para passar para quilômetros: 2 000 000 ÷ 100 000 = 20 km. A alternativa A erra a conversão de escala por um fator de 10 (2 km). A C erra multiplicando por 10 (200 km). A D calcula como se a escala fosse 1:625 000. A E esquece de converter centímetros para quilômetros."
  ],
  "Projeções cartográficas: Mercator e Peters": [
    "Como a Terra é um geoide esferoidal tridimensional, é matematicamente impossível representá-la em uma superfície plana (mapa) sem gerar distorções. As projeções cilíndricas dividem-se em dois modelos ideológicos e cartográficos históricos célebres: 1) Projeção de Mercator (1594): é uma projeção conforme (preserva as formas exatas dos continentes e os ângulos náuticos), mas distorce brutalmente as proporções de área; à medida que se afasta do Equador em direção aos polos, as áreas são exageradas, fazendo a Europa e a Groenlândia parecerem gigantescas (crítica do 'eurocentrismo' na era das Grandes Navegações); 2) Projeção de Peters (1973): é uma projeção equivalente (preserva rigorosamente a proporção real das áreas dos continentes), mas distorce as formas dos continentes, que aparecem alongados e esticados no sentido norte-sul; ficou conhecida como 'terceiro-mundista' por valorizar o tamanho territorial dos países do Sul global (África e América do Sul).",
    [
      "Projeção de Mercator (1594): CONFORME (mantém as formas e ângulos; distorce as áreas, hiperdimensionando o Norte)",
      "Projeção de Peters (1973): EQUIVALENTE (mantém a proporção real das áreas; distorce e alonga as formas no sentido vertical)",
      "Projeção de Robinson: afilática (projeção de compromisso; distorce um pouco a forma e a área para harmonizar o mapa visualmente)",
      "Toda projeção cartográfica tem distorções: nenhuma consegue preservar simultaneamente forma, área e distância"
    ],
    "Memorize a dupla para o ENEM: Mercator = Conforme (formas certas, áreas do Norte infladas, eurocêntrica); Peters = Equivalente (áreas proporcionais reais, formas esticadas, terceiro-mundista).",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Comparação Cartográfica das Projeções Cilíndricas</text><rect x='20' y='45' width='130' height='45' fill='#5B6785' rx='6'/><text x='25' y='62' font-size='10' font-weight='700' fill='#fff'>Mercator (Conforme)</text><text x='25' y='76' font-size='9' fill='#fff'>Preserva formas / Infla o Norte</text><rect x='170' y='45' width='130' height='45' fill='#2F5BFF' rx='6'/><text x='175' y='62' font-size='10' font-weight='700' fill='#fff'>Peters (Equivalente)</text><text x='175' y='76' font-size='9' fill='#fff'>Preserva áreas / Estica formas</text><text x='30' y='115' font-size='10' fill='var(--tx)'>Groenlândia parece do tamanho da África</text><text x='180' y='115' font-size='10' fill='var(--tx)'>África é 14x maior que a Groenlândia</text></svg>Ao comparar dois planisférios temáticos utilizados em livros didáticos, um professor salienta que em um deles a Groenlândia aparenta ter dimensões territoriais equivalentes às de todo o continente africano, enquanto no outro mapa a África aparece nitidamente catorze vezes maior que a ilha ártica, porém com seus contornos geográficos alongados verticalmente.",
    "A classificação cartográfica correta das propriedades geométricas adotadas nos dois mapas analisados é, respectivamente:",
    [
      "ambos são mapas afiláticos que preservam com precisão absoluta tanto as áreas quanto as formas planetárias.",
      "o primeiro mapa adota a projeção de Peters (equivalente) e o segundo adota a projeção de Mercator (conforme).",
      "o segundo mapa é uma representação anamórfica desprovida de qualquer critério matemático de projeção planar.",
      "o primeiro utiliza a projeção azimutal polar equidistante e o segundo emprega a projeção cônica de Lambert.",
      "o primeiro mapa emprega a projeção de Mercator (conforme, priorizando formas e distorcendo áreas) e o segundo utiliza a projeção de Peters (equivalente, priorizando a proporção das áreas continentais)."
    ],
    4,
    "Alternativa correta: E. a Projeção de Mercator é conforme (mantém a forma geométrica exata e ângulos de 90° entre paralelos e meridianos, mas agiganta áreas de alta latitude como a Groenlândia e a Europa); já a Projeção de Arno Peters é equivalente (mantém as áreas na exata proporção da realidade física da Terra, gerando o estiramento visual dos continentes do Sul). A alternativa A é impossível na geometria esférica. A B inverte a ordem dos autores. A D cita projeções cônicas e polares que não correspondem aos planisférios cilíndricos clássicos. A E confunde com anamorfose."
  ],
  "Sensoriamento remoto, SIG e GPS": [
    "As geotecnologias revolucionaram a produção e a análise do espaço geográfico. O Sensoriamento Remoto abrange a obtenção de imagens e dados da superfície terrestre à distância por meio de sensores óticos ou de radar acoplados a satélites orbitais (como Landsat, Sentinel, CBERS) e drones, permitindo o monitoramento do desmatamento (PRODES/DETER no INPE), queimadas e safras agrícolas. O Sistema de Posicionamento Global (GPS / GNSS) utiliza uma constelação de satélites para determinar coordenadas tridimensionais (latitude, longitude e altitude) com extrema precisão em tempo real. Os Sistemas de Informações Geográficas (SIG) são softwares especializados (como QGIS e ArcGIS) capazes de integrar, cruzar e analisar camadas de dados espaciais sobrepostos (solos, bacias, declividade, malha viária, densidade demográfica) para subsidiar o planejamento urbano, ambiental e a logística.",
    [
      "Sensoriamento remoto: sensores em satélites/drones captam radiação eletromagnética refletida/emitida pela superfície",
      "GPS / GNSS: triangulação de sinais de satélites para obter coordenadas precisas (lat, long, alt)",
      "SIG (Sistemas de Informações Geográficas): cruzamento de múltiplas camadas de dados georreferenciados (layers)",
      "PRODES e DETER (INPE): monitoramento por satélite do desmatamento e alertas em tempo real na Amazônia e Cerrado"
    ],
    "Para o ENEM, lembre-se: sensores remotos captam a reflectância das superfícies (vegetação sadia reflete muito no infravermelho próximo; água limpa absorve radiação; solo exposto reflete na faixa do visível).",
    "Analistas do Instituto Brasileiro do Meio Ambiente e dos Recursos Naturais Renováveis (Ibama) utilizam imagens orbitais diárias de radar de abertura sintética (SAR) para identificar clareiras clandestinas abertas na floresta amazônica mesmo sob espessa cobertura contínua de nuvens na estação chuvosa, combinando esses dados com o Cadastro Ambiental Rural (CAR) em um software de geoprocessamento.",
    "A ferramenta tecnológica que permite a sobreposição espacial e o cruzamento automatizado entre os dados de imagens de satélite e os limites fundiários das propriedades é denominada:",
    [

      "Barômetro aneroide de mercúrio líquido.",

    ],
    3,
    "Alternativa correta: D. o Sistema de Informações Geográficas (SIG) é o ambiente computacional que organiza, sobrepõe em camadas (layers) e correlaciona dados georreferenciados de diversas origens (como imagens orbitais de sensoriamento remoto, limites de imóveis rurais e bases de dados cartográficas) para análise espacial e tomada de decisão. As alternativas A, C, D e E citam instrumentos analógicos de campo (teodolito, bússola, barômetro, astrolábio) incapazes de cruzar camadas digitais de satélite."

  "Transição demográfica e taxas vitais": [
    "A transição demográfica é a teoria que descreve a passagem histórica de uma sociedade com altas taxas de natalidade e mortalidade para um regime moderno de baixas taxas de natalidade e mortalidade. O modelo divide-se em quatro fases: 1) Pré-transicional: alta natalidade e alta mortalidade (baixo crescimento, típico de sociedades agrárias arcaicas com epidemias e guerras); 2) Explosão demográfica: queda rápida da mortalidade (melhorias sanitárias, vacinas e antibióticos) mantendo-se a natalidade alta (forte crescimento vegetativo); 3) Desaceleração: queda da natalidade decorrente da urbanização, entrada da mulher no mercado de trabalho e disseminação de métodos contraceptivos; 4) Estabilização moderna: baixas taxas de natalidade e mortalidade, com crescimento vegetativo próximo de zero ou até negativo (como em países europeus e no Japão). O Brasil encontra-se plenamente na fase 3/4, com taxa de fecundidade abaixo do nível de reposição populacional (1,6 filho por mulher em 2022, abaixo de 2,1).",
    [
      "Crescimento Vegetativo = Taxa de Natalidade − Taxa de Mortalidade",
      "Taxa de Fecundidade: número médio de filhos por mulher (nível de reposição populacional = 2,1)",
      "Fatores da queda da natalidade no Brasil: urbanização acelerada, inserção da mulher no mercado de trabalho, custo de criação dos filhos e pílula anticoncepcional",
      "Bônus demográfico: período em que a população em idade ativa (15 a 64 anos) supera a população dependente (crianças e idosos)"
    ],
    "Cálculo conferido: Taxa de Crescimento Vegetativo = Taxa de Natalidade − Taxa de Mortalidade. Se um país tem natalidade de 14‰ e mortalidade de 6‰, seu crescimento vegetativo é 8‰ (ou 0,8% ao ano).",
    "Dados apurados pelo Censo Demográfico do IBGE revelaram que a taxa média de fecundidade no Brasil atingiu o patamar de 1,57 filho por mulher, confirmando a contínua e expressiva redução observada desde a década de 1960, quando a média superava 6 filhos por mulher.",
    "A transformação socioeconômica central que explica a queda vertiginosa da taxa de fecundidade e a desaceleração demográfica no Brasil contemporâneo foi a:",
    [
      "adoção compulsória de leis estatais coercitivas de controle de natalidade com política do filho único.",
      "urbanização maciça combinada à maior inserção da mulher na força de trabalho e ao acesso a métodos contraceptivos.",
      "reversão completa da expectativa de vida média que caiu para menos de 40 anos em todo o país.",
      "proibição legal do casamento civil e do planejamento familiar nas regiões metropolitanas.",
      "erradicação absoluta das doenças transmissíveis que extinguiu toda a mortalidade infantil precoce."
    ],
    1,
    "Alternativa correta: B. a rápida transição da sociedade agrária para a urbana alterou o custo de criação dos filhos (que deixaram de ser mão de obra no campo e passaram a demandar gastos em educação e moradia na cidade), aliada à crescente autonomia e escolarização feminina, à sua inserção no mercado de trabalho assalariado e ao acesso amplo a métodos anticoncepcionais. A alternativa A confunde com a política da China (que nunca existiu no Brasil). A C e a D são falsas e absurdas. A E afirma erradamente que a mortalidade foi totalmente zerada."
  ],
  "Pirâmides etárias e envelhecimento": [
    "A pirâmide etária é o gráfico demográfico que representa a distribuição da população por faixas etárias e sexo: a base representa os jovens (0 a 14 anos); o corpo representa os adultos em idade ativa (15 a 64 anos); e o topo (ou ápice) representa a população idosa (65 anos ou mais). No Brasil tradicional, a pirâmide exibia base larga e topo muito estreito (país jovem com alta fecundidade). Nas últimas décadas, o país passou por um rápido estreitamento da base (redução drástica de nascimentos) e expressivo alargamento do topo (aumento da expectativa de vida para além dos 76 anos), resultando no envelhecimento acelerado da população. Esse processo abre a janela temporária do 'bônus demográfico' (quando a proporção de pessoas em idade de trabalhar é máxima), mas impõe desafios prementes ao Estado: reformas previdenciárias sustentáveis, ampliação de custos do SUS para tratamento de doenças crônicas e carência de cuidadores e políticas de acolhimento para idosos.",
    [
      "Base da pirâmide estreita: queda no número de nascimentos e crianças",
      "Topo alargado: aumento da longevidade e da proporção de idosos",
      "Bônus demográfico: proporção máxima de população produtiva (oportunidade para investir em educação e infraestrutura)",
      "Desafios do envelhecimento: sustentabilidade da previdência social, adaptação do sistema de saúde (SUS) e acessibilidade urbana"
    ],
    "Para o ENEM: o bônus demográfico é uma oportunidade que passa rápido; se o país não aproveitar esse período investindo pesado na educação de qualidade dos jovens e na produtividade do trabalho, corre o risco de 'envelhecer antes de ficar rico'.",
    "<svg viewBox='0 0 320 160' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='160' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Evolução da Pirâmide Etária Brasileira (IBGE)</text><rect x='110' y='40' width='100' height='15' fill='#5B6785' rx='3'/><text x='125' y='52' font-size='9' fill='#fff'>Topo Alarga (Idosos >65)</text><rect x='80' y='65' width='160' height='25' fill='#2F5BFF' rx='3'/><text x='95' y='82' font-size='10' font-weight='700' fill='#fff'>Corpo Largo: Adultos (15-64 anos)</text><rect x='100' y='100' width='120' height='20' fill='#FFB400' rx='3'/><text x='105' y='114' font-size='9' font-weight='700' fill='var(--tx)'>Base Estreita (Jovens 0-14)</text><text x='35' y='145' font-size='9' fill='var(--mu)'>Transição para perfil envelhecido</text></svg>O Censo Demográfico de 2022 constatou que a proporção de idosos com 65 anos ou mais na população brasileira atingiu 10,9%, superando pela primeira vez a casa dos 22 milhões de cidadãos, enquanto a participação de crianças de 0 a 14 anos caiu de quase 30% em 2000 para menos de 20% em 2022.",
    "A principal consequência socioeconômica de longo prazo decorrente dessa nova configuração da pirâmide etária brasileira consiste na:",
    [
      "necessidade imediata de fechar todas as unidades básicas de atendimento do Sistema Único de Saúde.",
      "extinção absoluta do trabalho assalariado substituído por servidão camponesa medieval.",
      "proibição da contratação de trabalhadores adultos de meia-idade no setor de comércio e serviços.",
      "pressão sobre os sistemas de previdência social e ampliação da demanda por políticas públicas de saúde e assistência a idosos.",
      "expansão compulsória de milhares de novas creches públicas municipais por falta de vagas para recém-nascidos."
    ],
    3,
    "Alternativa correta: D. o envelhecimento populacional acarreta a elevação da razão de dependência dos idosos sobre a população ativa, desafiando o equilíbrio fiscal do regime de repartição da previdência social e demandando maiores aportes no SUS para geriatria, tratamento de doenças crônico-degenerativas e cuidadores. A alternativa A é incoerente, pois a saúde pública precisa ser ampliada. As alternativas C e D são proposições descabidas. A E contraria o estreitamento da base de nascimentos."
  ],
  "Dinâmica migratória e migrações internas": [
    "As migrações internas brasileiras refletem as disparidades de desenvolvimento regional ao longo dos ciclos econômicos do país. Entre os anos 1950 e 1980, predominou o fluxo maciço de nordestinos em direção ao Sudeste (atraídos pela industrialização paulista e pela construção civil no Rio de Janeiro) e ao Centro-Oeste (construção de Brasília e expansão da fronteira agrícola). A partir da década de 1970, ocorreu a marcha para o Centro-Oeste e Norte (sulistas migrando para o Paraná, Mato Grosso e Rondônia em busca de terras baratas pela BR-364). Nas últimas duas décadas, o padrão migratório tornou-se mais complexo: observa-se a 'migração de retorno' (nordestinos voltando aos seus estados de origem, estimulados pelo crescimento econômico regional e políticas sociais), o avanço das migrações inter-regionais para cidades médias do interior e a diminuição das migrações interestaduais de longo curso.",
    [
      "Fluxo Nordeste ➔ Sudeste (1950-1980): motivado pela concentração industrial e seca sertaneja",
      "Fronteira Agrícola (Norte/Centro-Oeste): atração de produtores sulistas e camponeses para terras novas",
      "Migração de retorno: volta de migrantes ao Nordeste impulsionada pela desconcentração econômica",
      "Migração pendular vs êxodo rural: pendular é o bate-e-volta diário; êxodo rural é a mudança definitiva do campo para a cidade"
    ],
    "Atenção para o ENEM: as metrópoles do Sudeste (como São Paulo e Rio de Janeiro) continuam recebendo migrantes, mas a taxa líquida de atração diminuiu, enquanto cidades médias do interior (Campinas, Ribeirão Preto, Londrina, Maringá) ganharam forte protagonismo migratório.",
    "O Instituto Brasileiro de Geografia e Estatística (IBGE) identificou, nas primeiras décadas do século XXI, a desaceleração do ritmo de crescimento populacional das regiões metropolitanas de São Paulo e do Rio de Janeiro, acompanhada da dinamização demográfica de cidades médias do interior e da ampliação de fluxos de migrantes retornando às suas cidades de origem no interior nordestino.",
    "Essa inflexão na dinâmica migratória interestadual brasileira contemporânea é explicada principalmente pela:",
    [
      "descoberta de imensas minas de ouro aluvionar superficial no semiárido do Piauí.",
      "proibição formal da entrada de cidadãos de outros estados nos centros urbanos da Região Sudeste.",
      "desconcentração da atividade econômica e investimentos industriais e de infraestrutura em cidades médias e na Região Nordeste.",
      "paralisação total dos transportes rodoviários de passageiros entre os estados brasileiros.",
      "eliminação integral de todas as indústrias e fábricas da cidade de São Paulo."
    ],
    2,
    "Alternativa correta: C. a busca de menores custos de produção (terrenos mais baratos, incentivos fiscais e menor custo de mão de obra) levou indústrias e serviços a se desconcentrarem rumo a cidades médias e ao Nordeste; isso gerou empregos fora dos grandes centros e permitiu a migração de retorno e o crescimento de polos regionais do interior. A alternativa B é inconstitucional (Art. 5º da CF garante livre locomoção). As alternativas C, D e E trazem formulações falsas ou absurdas."
  ],
  "Refugiados e migrações internacionais": [
    "As migrações internacionais são condicionadas por fatores de expulsão (guerras civis, perseguições políticas e religiosas, violações graves de direitos humanos e desastres socioambientais) e fatores de atração (oportunidades de emprego, segurança jurídica e qualidade de vida). Segundo a Convenção das Nações Unidas de 1951, refugiado é a pessoa que se encontra fora do seu país de origem devido a 'fundado temor de perseguição por motivos de raça, religião, nacionalidade, grupo social ou opiniões políticas'. No Brasil, a Lei de Refúgio (Lei nº 9.474/1997) ampliou essa definição para acolher vítimas de 'grave e generalizada violação de direitos humanos'. O país recebeu contingentes expressivos de refugiados e migrantes humanitários nas últimas décadas, como haitianos (após o terremoto de 2010), sírios (fugindo da guerra civil) e venezuelanos (pela Operação Acolhida em Roraima desde 2018). Em contrapartida, países desenvolvidos ergueram barreiras físicas e leis restritivas, alimentando episódios de xenofobia (aversão ou discriminação a estrangeiros).",
    [
      "Refugiado (ONU/1951): fundado temor de perseguição (raça, religião, nacionalidade, opinião política) ou violação de direitos humanos",
      "Imigrante econômico: desloca-se voluntariamente em busca de melhores condições materiais de vida e trabalho",
      "Xenofobia: discriminação, preconceito e aversão violenta contra imigrantes estrangeiros",
      "Operação Acolhida: ação humanitária e de interiorização de venezuelanos no Brasil (Roraima)"
    ],
    "Diferencie com rigor no ENEM: Imigrante econômico muda-se voluntariamente para trabalhar; Refugiado é forçado a fugir de seu país de origem sob risco real de morte, perseguição ou colapso dos direitos humanos, não podendo retornar em segurança.",
    "Desde 2018, o governo federal brasileiro, com apoio da Agência da ONU para Refugiados (ACNUR) e de organizações não governamentais, coordena a Operação Acolhida no estado de Roraima. O programa estruturou postos de triagem, abrigamento temporário e a estratégia de 'interiorização', que transporta voluntariamente famílias de migrantes para outras cidades brasileiras com vagas de emprego formal.",
    "A estratégia de interiorização adotada na Operação Acolhida tem como objetivo territorial primordial:",
    [
      "repatriar compulsoriamente os solicitantes de refúgio devolvendo-os ao país de origem.",
      "obrigar os imigrantes a abdicarem de sua cidadania e idioma nativo em cartórios eleitorais.",
      "confinar os migrantes exclusivamente em campos de trabalho rural fechados no norte do país.",
      "impedir o acesso dos estrangeiros ao mercado formal de trabalho assalariado no Brasil.",
      "evitar a sobrecarga de serviços públicos de saúde e educação em municípios fronteiriços e facilitar a integração socioeconômica dos imigrantes."
    ],
    4,
    "Alternativa correta: E. a interiorização transfere os migrantes e refugiados venezuelanos concentrados em cidades pequenas de Roraima (como Pacaraima e Boa Vista) para municípios de outros estados que possuem maior capacidade de absorção de mão de obra e serviços públicos de assistência social e saúde, promovendo integração cidadã digna. A alternativa A erra porque o refúgio proíbe repatriação forçada (princípio de non-refoulement). As alternativas C, D e E descrevem violações de direitos humanos contrárias à Lei de Migração (Lei 13.445/2017)."
  ],
  "Indicadores sociais: IDH e Coeficiente de Gini": [
    "Os indicadores socioeconômicos sintetizam as condições de vida das populações. O Índice de Desenvolvimento Humano (IDH), criado pelo Programa das Nações Unidas para o Desenvolvimento (PNUD), varia de 0 (pior) a 1 (melhor) e avalia três dimensões fundamentais: 1) Saúde/Longevidade (expectativa de vida ao nascer); 2) Educação (anos médios de estudo e anos esperados de escolaridade); 3) Renda (Renda Nacional Bruta per capita em paridade de poder de compra). O IDH superou a visão restrita do PIB per capita como sinônimo de riqueza. O Coeficiente de Gini, por sua vez, mede o grau de desigualdade na distribuição de renda de uma sociedade: varia de 0 (igualdade absoluta, onde todos têm a mesma renda) a 1 (desigualdade absoluta, onde uma única pessoa concentra toda a renda). O Brasil apresenta IDH considerado 'alto' (> 0,76), porém figura historicamente entre os países de pior índice de Gini do mundo (> 0,52), expressando uma extrema concentração de riqueza.",
    [
      "IDH: varia de 0 a 1; baseia-se em 3 pilares (Saúde/Expectativa de vida, Educação e Renda per capita)",
      "Coeficiente de Gini: mede a desigualdade de renda; varia de 0 (igualdade total) a 1 (desigualdade máxima)",
      "Crítica ao PIB per capita: uma média que esconde a concentração abissal da riqueza",
      "IDH-D: IDH ajustado à desigualdade (penaliza países com grande fosso entre ricos e pobres)"
    ],
    "Atenção para as escalas: no IDH, quanto mais perto de 1, MELHOR o desenvolvimento. No Coeficiente de Gini, quanto mais perto de 1, PIOR e mais desigual é o país!",
    "Dois municípios brasileiros hipotéticos apresentam exatamente o mesmo valor de Produto Interno Bruto (PIB) per capita de R$ 45.000,00 anuais. No entanto, enquanto o Município X ostenta Índice de Gini de 0,32 e ampla cobertura de saneamento básico e escolas públicas integrais, o Município Y apresenta Coeficiente de Gini de 0,61, com mais de metade de sua população residente em favelas sem água tratada.",
    "A análise geográfica e socioespacial comparativa entre os dois municípios permite concluir com rigor estatístico que:",
    [
      "a distribuição dos rendimentos e a qualidade dos serviços públicos são idênticas em ambos os municípios.",
      "o Município Y apresenta maior equidade distributiva de renda do que o Município X.",
      "o Município X é mais desigual que o Município Y porque o valor numérico do seu Gini é mais baixo.",
      "o PIB per capita isolado é insuficiente para expressar a realidade socioeconômica, pois oculta os níveis de desigualdade revelados pelo Índice de Gini.",
      "o Coeficiente de Gini avalia unicamente o volume total de impostos pagos pela indústria pesada."
    ],
    3,
    "Alternativa correta: D. o PIB per capita é uma simples média matemática (divisão do PIB pela população) que não reflete como a riqueza é repartida; o Coeficiente de Gini é o índice que mensura a disparidade de renda (sendo 0,61 indicativo de concentração extrema e 0,32 de maior equidade). A alternativa A ignora a discrepância do Gini. As alternativas B e D invertem a escala de leitura do Gini. A E define incorretamente o indicador."
  ],
  "Fases da Revolução Industrial e modelos de produção": [
    "A industrialização moldou a organização do espaço mundial através de quatro fases técnicas: 1) 1ª Revolução Industrial (século XVIII, Inglaterra): máquina a vapor, carvão mineral, tear mecânico e ferrovias; 2) 2ª Revolução Industrial (meados do XIX, EUA e Europa): eletricidade, motor a combustão, petróleo, indústria química e siderurgia pesada; 3) 3ª Revolução Industrial ou Técnico-Científica (década de 1970 em diante): microeletrônica, informática, robótica, biotecnologia e telecomunicações; 4) 4ª Revolução Industrial ou Indústria 4.0: internet das coisas (IoT), inteligência artificial, computação em nuvem e automação avançada. Paralelamente, os modelos de produção evoluíram: o Taylorismo/Fordismo caracterizou-se pela produção em massa padronizada, esteiras rolantes, estoques gigantescos e rígida divisão do trabalho; enquanto o Toyotismo (Japão) consagrou a produção flexível 'just-in-time', sem estoques, trabalhadores polivalentes e controle de qualidade total.",
    [
      "1ª Rev.: vapor e carvão mineral (Inglaterra); 2ª Rev.: petróleo, aço e eletricidade (EUA/Alemanha)",
      "3ª Rev. (Técnico-Científica): robótica, informática e telecomunicações; 4ª Rev.: IA e internet das coisas",
      "Fordismo: produção em massa homogênea, esteira de montagem mecânica e grandes estoques",
      "Toyotismo: produção flexível just-in-time (sob demanda), eliminação de estoques e operário multifuncional"
    ],
    "Para o ENEM: no Fordismo o produto era padronizado ('o cliente pode escolher a cor que quiser, desde que seja preto'); no Toyotismo a linha de montagem é flexível e ajustada à demanda individual do consumidor em tempo real.",
    "Na década de 1970, em resposta às crises do petróleo e à saturação dos mercados de produtos padronizados em larga escala, as corporações manufatureiras globais reestruturaram suas linhas de montagem, substituindo a estocagem maciça pela produção personalizada e sob demanda, mediada pela microeletrônica e pelo trabalho de equipes multifuncionais.",
    "O modelo de organização da produção industrial emergente descrito no texto corresponde ao:",
    [
      "Taylorismo rígido dos primórdios da indústria têxtil inglesa.",
      "Toyotismo, estruturado sobre os princípios da produção flexível e do 'just-in-time'.",
      "Fordismo tradicional centrado na esteira rolante de ritmo mecânico constante.",
      "Mercantilismo comercial baseado em manufaturas estatais corporativas de seda.",
      "Artesanato medieval de controle estrito por corporações de ofício municipais."
    ],
    1,
    "Alternativa correta: B. o Toyotismo (produção enxuta ou flexível) foi concebido na fábrica da Toyota no Japão e difundido mundialmente a partir dos anos 1970, operando sob o conceito do 'just-in-time' (produção no momento exato da demanda para zerar estoques físicos), apoiando-se na automação e em trabalhadores qualificados e polivalentes. As alternativas A e B descrevem modelos rígidos de estoques em massa. As alternativas D e E são anacrônicas e anteriores à Revolução Industrial."
  ],
  "Industrialização brasileira e desconcentração espacial": [
    "A industrialização brasileira ocorreu de forma tardia em relação aos países centrais, acelerando-se na Era Vargas (1930-1945) com a implantação da indústria de base estatal (Companhia Siderúrgica Nacional - CSN, Vale do Rio Doce, Petrobras em 1953) sob a política de 'substituição de importações'. Nos anos 1950, o Plano de Metas de Juscelino Kubitschek abriu a economia ao capital estrangeiro (montadoras automobilísticas multinacionais) e priorizou o modelo rodoviário. Essa industrialização concentrou-se de modo esmagador na Região Sudeste, particularmente no estado de São Paulo (Cinturão do ABC Paulista). A partir da década de 1980 e sobretudo nos anos 1990, iniciou-se o processo de desconcentração industrial: as fábricas passaram a migrar para o interior de São Paulo, Sul e Nordeste em busca de menores custos com terrenos, isenções fiscais (guerra fiscal), sindicatos menos combativos e saturação do trânsito na capital paulista.",
    [
      "Industrialização tardia: iniciada de forma consistente na década de 1930 com substituição de importações",
      "Era Vargas: foco na indústria de base estatal (siderurgia, energia, petróleo, mineração)",
      "Plano de Metas (JK): tripé econômico (capital estatal na infraestrutura + capital nacional nos bens de consumo não duráveis + capital multinacional nos duráveis/automotivo)",
      "Desconcentração industrial: fuga do ABC paulista rumo a cidades médias e ao Nordeste em busca de vantagens locacionais"
    ],
    "Desconcentração NÃO significa desindustrialização: desconcentração é a dispersão geográfica das fábricas de São Paulo para outros estados ou interior; desindustrialização é a perda de participação da indústria manufatureira no PIB nacional para serviços ou commodities.",
    "Entre 1950 e 1980, a Região Metropolitana de São Paulo respondia por quase metade de todo o valor da transformação industrial do Brasil. A partir do final do século XX, montadoras e indústrias calçadistas, têxteis e de autopeças desativaram plantas na capital paulista e instalaram unidades modernas em cidades como Camaçari (BA), Gravataí (RS) e no interior paulista (como Campinas e Sorocaba).",
    "A dinâmica geográfica recente de dispersão do parque fabril brasileiro, conhecida como desconcentração industrial, decorre da:",
    [
      "proibição por lei federal da circulação de caminhões de carga no estado de São Paulo.",
      "elevação dos custos operacionais no centro tradicional (terrenos caros, trânsito e salários) associada a incentivos fiscais oferecidos por outras regiões.",
      "falta de energia elétrica nas usinas do Sudeste provocada pelo desvio do Rio Tietê para a Bolívia.",
      "estatização integral de todas as montadoras privadas internacionais pelo governo paulista.",
      "extinção absoluta do mercado consumidor nas grandes capitais do Sudeste."
    ],
    1,
    "Alternativa correta: B. a chamada 'deseconomia de aglomeração' na metrópole de São Paulo (engarrafamentos, IPTU elevado, preço exorbitante dos terrenos, forte pressão salarial sindical) motivou as corporações a buscar novas localizações geográficas que ofereciam doações de áreas, isenções de tributos (guerra fiscal) e mão de obra com menores custos sindicais. As alternativas A, C, D e E trazem hipóteses factuais absurdas ou juridicamente inverídicas."
  ],
  "Modais de transporte e matriz logística": [
    "A matriz de transportes de um país define a distribuição percentual das cargas e passageiros entre os diferentes modais: rodoviário, ferroviário, aquaviário (hidroviário e cabotagem marítima), dutoviário e aéreo. O Brasil possui uma das matrizes de transporte mais desequilibradas e ineficientes do mundo: cerca de 65% das cargas são transportadas pelo modal rodoviário (caminhões), que é o mais caro por tonelada-quilômetro para longas distâncias, o mais poluente por emissão de CO₂ e o que apresenta maior vulnerabilidade a acidentes e roubos de carga. Modais de alta capacidade e baixo custo operacional unitário para granéis agrícolas e minerais — como ferrovias (apenas ~15%) e hidrovias (~5%) — foram subutilizados desde o governo JK, que privilegiou a construção de rodovias para atender aos interesses da indústria automobilística multinacional. A modernização logística exige a intermodalidade: integração harmoniosa entre trens, barcaças e caminhões.",
    [
      "Modal Rodoviário: alta flexibilidade porta a porta; custo altíssimo para longas distâncias e alta emissão de poluentes",
      "Modal Ferroviário: ideal para cargas pesadas a médias e longas distâncias; baixo custo operacional e baixa emissão",
      "Modal Hidroviário: o mais econômico para granéis a granel em rios navegáveis; baixíssimo impacto de carbono",
      "Cabotagem: navegação comercial costeira entre portos do mesmo país (costa brasileira)"
    ],
    "Para o ENEM, lembre-se do 'Custo Brasil': transportar soja por 1.500 km em caminhão queima litros de óleo diesel caro e deteriora rodovias; a ferrovia ou hidrovia transporta o mesmo volume consumindo até um quarto do combustível por tonelada.",
    "Um estudo logístico do Ministério dos Transportes comparou a eficiência energética e o frete de três modais para o escoamento de safras de milho do Centro-Oeste até os portos exportadores do litoral a uma distância de 1.200 km, constatando que um único comboio de barcaças hidroviárias substitui mais de mil carretas bitrem nas rodovias, emitindo até 80% menos gases de efeito estufa por tonelada.",
    "A prevalência histórica e a dependência crônica do modal rodoviário de transporte de cargas no território brasileiro explicam-se pela:",
    [
      "opção política de desenvolvimento a partir dos anos 1950 focada no fomento à indústria automotiva e na atração de montadoras multinacionais.",
      "inexistência de qualquer rio caudaloso ou bacia hidrográfica em todo o continente sul-americano.",
      "proibição legal de fabricação de locomotivas e trilhos de aço no Brasil pela Constituição de 1988.",
      "impossibilidade física de trens operarem sobre terrenos com relevo de planalto e chapadões.",
      "gratuidade perpétua do combustível derivado de petróleo em todos os postos de combustíveis nacionais."
    ],
    0,
    "Alternativa correta: A. a distorção da matriz de transportes brasileira remonta ao 'rodoviarismo', intensificado no Plano de Metas de Juscelino Kubitschek (década de 1950) e consolidado pelos governos militares; o Estado direcionou investimentos públicos quase exclusivamente para a abertura e pavimentação de rodovias, atendendo às demandas das montadoras automobilísticas instaladas no país e subsidiando o consumo de diesel. As alternativas A, C, D e E contêm afirmações estapafúrdias e comprovadamente falsas."
  ],
  "Terceirização e transformações no mundo do trabalho": [
    "As transformações contemporâneas no mundo do trabalho decorrem da reestruturação produtiva do capitalismo sob o impacto da microeletrônica, da globalização e da hegemonia neoliberal. A terceirização consiste na transferência de determinadas atividades de uma empresa para firmas terceirizadas prestadoras de serviços; a Lei nº 13.467/2017 (Reforma Trabalhista) autorizou no Brasil a terceirização irrestrita, inclusive na 'atividade-fim' das companhias. Paralelamente, o avanço da economia de plataformas digitais consolidou o fenômeno da 'uberização': modelo de contratação no qual trabalhadores executam serviços (entregas por moto, transporte por aplicativo) geridos por algoritmos e aplicativos, sem vínculo empregatício formal regido pela CLT, sem jornada de trabalho fixa, sem férias remuneradas, sem descanso semanal e sem proteção previdenciária em caso de acidente, sendo classificados formalmente como 'empreendedores autônomos'.",
    [
      "Terceirização da atividade-fim: autorizada pela Reforma Trabalhista de 2017, reduzindo custos patronais e ampliando a rotatividade",
      "Uberização do trabalho: gestão algorítmica mediada por plataformas digitais sem direitos previdenciários e trabalhistas",
      "Pejotização: exigência de abertura de pessoa jurídica (CNPJ) para mascarar vínculos reais de emprego assalariado",
      "Precarização estrutural: desmonte das garantias de seguridade social e ampliação da informalidade"
    ],
    "Para a redação e questões de Geografia do Trabalho no ENEM, memorize: a 'uberização' gera a falsa ilusão de liberdade ('seja seu próprio chefe'), mas na prática impõe jornadas exaustivas de mais de 12 horas diárias e transfere todos os riscos e custos operacionais (gasolina, moto, celular) para o próprio trabalhador.",
    "Sociólogos e geógrafos do trabalho analisam o cotidiano dos entregadores ciclistas e motociclistas de grandes centros urbanos que prestam serviços para aplicativos de delivery, constatando que os algoritmos estabelecem bonificações e penalidades automáticas, enquanto os trabalhadores arcam com a manutenção dos veículos e não contam com auxílio-doença nem proteção previdenciária.",
    "O fenômeno socioespacial descrito expressa a face contemporânea da organização do trabalho denominada:",
    [
      "pleno emprego formal com estabilidade funcional pública universal.",
      "uberização e precarização estrutural das relações laborais mediadas por plataformas digitais.",
      "fordismo clássico com controle sindical hegemônico e plano de carreira vitalício.",
      "servidão por dívida corporativa feudal vinculada à nobreza agrária do século XVIII.",
      "cooperativismo estatal comunitário com distribuição paritária do lucro líquido corporativo."
    ],
    1,
    "Alternativa correta: B. a uberização representa uma modalidade contemporânea de subordinação do trabalho ao capital no meio técnico-científico-informacional, na qual plataformas digitais comandam a jornada através de inteligência de dados algorítmica, eximindo-se das obrigações da legislação trabalhista (CLT) e deixando o trabalhador em condições de precariedade e vulnerabilidade socioeconômica. A alternativa A erra porque o vínculo é informal. A C descreve o fordismo que garantia direitos rígidos. As alternativas D e E são anacrônicas ou fictícias."
  ],
  "Matriz energética brasileira e mundial": [
    "A matriz energética representa a totalidade das fontes de energia primária utilizadas por um país para suprir todas as suas atividades econômicas (incluindo transportes, indústrias, aquecimento e geração de eletricidade); ela difere da matriz elétrica, que abrange exclusivamente a energia convertida em eletricidade. No cenário global, a matriz energética mundial é dominada com folga por combustíveis fósseis não renováveis e poluentes (petróleo, carvão mineral e gás natural respondem por mais de 80% do total segundo a Agência Internacional de Energia - IEA). O Brasil possui uma posição singular e privilegiada no cenário energético planetário: cerca de 45% a 48% de sua matriz energética provém de fontes renováveis (biomassa de cana-de-açúcar/etanol, hidroeletricidade, eólica, solar e lenha sustentável). No que tange especificamente à matriz elétrica brasileira, o grau de sustentabilidade é ainda maior, com mais de 85% de geração renovável (destacando-se hidrelétricas, parques eólicos e parques solares fotovoltaicos).",
    [
      "Matriz Energética: engloba TODA a energia (combustíveis de carros + caminhões + indústrias + termelétricas)",
      "Matriz Elétrica: restringe-se exclusivamente à produção de ELETRICIDADE que abastece a tomada",
      "Brasil: ~48% renovável na matriz energética total e >85% renovável na matriz elétrica (uma das mais limpas do planeta)",
      "Mundo: ~80% de combustíveis fósseis (petróleo, carvão e gás natural) e apenas ~14% de renováveis"
    ],
    "Cuidado com a pegadinha no ENEM: Matriz ENERGÉTICA não é Matriz ELÉTRICA! O combustível queimado pelo seu carro (gasolina ou etanol) entra na matriz energética, mas não entra na matriz elétrica.",
    "<svg viewBox='0 0 320 160' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='160' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Comparação de Matrizes Energéticas (EPE/MME)</text><rect x='20' y='45' width='135' height='40' fill='#2E7D32' rx='6'/><text x='25' y='62' font-size='10' font-weight='700' fill='#fff'>Brasil: ~48% Renovável</text><text x='25' y='76' font-size='9' fill='#fff'>Biomassa, Hídrica, Solar, Eólica</text><rect x='170' y='45' width='135' height='40' fill='#5B6785' rx='6'/><text x='175' y='62' font-size='10' font-weight='700' fill='#fff'>Mundo: ~14% Renovável</text><text x='175' y='76' font-size='9' fill='#fff'>Mais de 80% Fóssil (Carvão/Petróleo)</text><text x='30' y='115' font-size='10' fill='var(--tx)'>Matriz Elétrica Brasileira: >85% Renovável</text><text x='30' y='135' font-size='9' fill='var(--mu)'>Destaque global na transição para baixo carbono</text></svg>Dados do Balanço Energético Nacional (BEN), publicado pela Empresa de Pesquisa Energética (EPE), demonstram que, enquanto a média dos países membros da OCDE mantém suas matrizes energéticas primárias amplamente dependentes do consumo de carvão mineral e petróleo, o Brasil exibe uma participação das fontes renováveis de energia três vezes superior à média observada no restante do planeta.",
    "A configuração comparativamente mais limpa e renovável da matriz energética brasileira deve-se primordialmente ao expressivo aproveitamento de:",
    [
      "reatores nucleares instalados no leito dos rios da planície pantaneira.",
      "centrais geotérmicas profundas alimentadas por vulcões ativos da bacia do Paraná.",
      "geradores eólicos instalados exclusivamente em cavernas subterrâneas do sertão baiano.",
      "jazidas submarinas de carvão betuminoso de alta pureza na foz do Rio Amazonas.",
      "recursos hídricos continentais para hidroeletricidade e biomassa da cana-de-açúcar para biocombustíveis e cogeração."
    ],
    4,
    "Alternativa correta: E. a singularidade renovável da matriz energética do Brasil alicerça-se no uso massivo de hidrelétricas em seus caudalosos rios de planalto e no complexo agroindustrial sucroalcooleiro (etanol combustível para automóveis flex-fuel e queima do bagaço da cana em termoelétricas de cogeração), além da rápida expansão recente das energias solar e eólica. As alternativas A, B, D e E trazem fontes de energia tecnicamente absurdas ou geograficamente inexistentes no Brasil."
  ],
  "Petróleo, gás natural e o Pré-sal": [
    "O petróleo e o gás natural são combustíveis fósseis originados da decomposição anaeróbia de matéria orgânica microscópica (plâncton e algas) soterrada em bacias sedimentares marinhas ao longo de milhões de anos. O marco histórico contemporâneo da indústria petrolífera brasileira foi a descoberta, em 2006 pela Petrobras, das gigantescas jazidas da camada Pré-sal, localizadas nas Bacias de Santos e Campos, no litoral Sudeste (RJ, SP, ES). O Pré-sal estende-se a profundidades superiores a 7.000 metros abaixo do nível do mar, situado sob uma lâmina de água de até 2.000 m, uma camada de rochas sedimentares pós-sal de 2.000 m e uma espessa camada de sal geológico cristalizado de mais de 2.000 m de espessura (que atua como selante impermeável, retendo hidrocarbonetos leves de excelente qualidade comercial). O país tornou-se autossuficiente e um dos dez maiores produtores e exportadores globais de óleo cru.",
    [
      "Pré-sal: bacias de Santos, Campos e Espírito Santo; profundidades >7.000 m; camada selante de sal",
      "Petróleo leve: de alto valor comercial, ideal para refino de gasolina, querosene de aviação e diesel",
      "Regime de Partilha de Produção: marco regulatório criado em 2010 para a área do Pré-sal (com pagamento de royalties)",
      "Royalties do petróleo: compensação financeira devida a estados e municípios produtores (destinados por lei à saúde e educação)"
    ],
    "Para o ENEM, lembre-se do paradoxo do Pré-sal: o Brasil exporta petróleo cru em grande escala, mas ainda importa parcelas de derivados refinados (como óleo diesel) por carência de capacidade de refino em seu parque industrial interno.",
    "A descoberta das províncias do Pré-sal demandou o desenvolvimento pioneiro de tecnologias de engenharia offshore em águas ultraprofundas pela Petrobras, permitindo a extração comercial de petróleo e gás através de plataformas flutuantes ancoradas a mais de 200 km da costa sudeste.",
    "A camada espessa de rochas salinas estratificadas (evaporitos) que dá nome ao Pré-sal desempenhou um papel geológico decisivo para a preservação das jazidas porque atuou como uma:",
    [
      "fonte contínua de oxigênio gasoso que impediu a fossilização biológica do fitoplâncton marinho.",
      "placa tectônica vulcânica que aqueceu o petróleo até transformá-lo em gás hélio mineral.",
      "rocha selante impermeável que impediu a fuga e migração dos hidrocarbonetos em direção à superfície oceânica.",
      "muralha biológica de recifes de corais vivos que atraíram baleias para o fundo do mar.",
      "camada permeável que dissolveu o petróleo transformando-o em água doce potável."
    ],
    2,
    "Alternativa correta: C. na geologia do petróleo, o sal geológico (evaporito) depositado durante a abertura do Oceano Atlântico no Cretáceo atua como uma 'rocha selante' de plasticidade e impermeabilidade únicas; essa capa estancou a rocha-reservatório por baixo, impedindo que o petróleo e o gás migrassem para as camadas superiores ou se dissipassem na água do oceano. A alternativa A erra porque o petróleo exige ambiente anóxico (sem oxigênio). As alternativas C, D e E trazem conceitos geológicos inteiramente disparatados."
  ],
  "Fontes renováveis e transição energética": [
    "A transição energética global consiste na substituição estrutural de combustíveis fósseis emissores de carbono (carvão, petróleo e gás) por fontes renováveis de baixa ou nula emissão de gases-estufa (solar, eólica, biomassa, hidrogênio verde), com a meta internacional de atingir o 'net zero' (neutralidade climática) até 2050. No Brasil, o setor elétrico tem sido impulsionado pela expansão meteórica da energia solar fotovoltaica (tanto em grandes fazendas solares no semiárido quanto em geração distribuída com placas em telhados urbanos) e da energia eólica (aerogeradores concentrados no litoral e serras do Nordeste, em estados como Rio Grande do Norte, Bahia e Ceará, onde os ventos alísios constantes e unidirecionais oferecem fatores de capacidade superiores à média mundial). Embora sejam fontes limpas, essas instalações requerem planejamento socioambiental para mitigar impactos locais: ruído sonoro, desapropriações de terras de quilombos e ribeirinhos e descarte futuro de baterias e painéis.",
    [
      "Transição energética: descarbonização global da matriz para frear o aquecimento planetário",
      "Energia Eólica: destaque no Nordeste brasileiro (ventos alísios regulares e de alta velocidade geram recordes de eficiência)",
      "Energia Solar: geração centralizada (grandes usinas) e geração distribuída (microgeração em residências e comércios)",
      "Hidrogênio verde (H2V): combustível limpo produzido por eletrólise da água alimentada exclusivamente por eletricidade renovável"
    ],
    "Para o ENEM: parques eólicos e solares são 'limpos' quanto às emissões operacionais de carbono, mas geram impactos territoriais locais que não podem ser ignorados: ruído constante das pás dos aerogeradores, sombreamento de áreas vizinhas, afugentamento de fauna alada e conflitos fundiários com comunidades camponesas locais.",
    "O litoral e o agreste da Região Nordeste do Brasil consolidaram-se como um polo de atração de bilhões de reais em investimentos globais para a implantação de parques de geração eólica e plantas de hidrogênio verde, registrando fatores de capacidade operacional que ultrapassam 50%, patamar muito superior à média global dos países desenvolvidos.",
    "O fator geoclimático natural responsável pelo excepcional desempenho da geração eólica no Nordeste brasileiro consiste na:",
    [
      "presença de furacões e ciclones tropicais diários que giram as turbinas com velocidades de tufão.",
      "atividade contínua de vulcões de cinzas que expelem ar comprimido quente sobre as pás dos geradores.",
      "ausência completa de radiação solar durante os doze meses do ano no sertão nordestino.",
      "proximidade imediata com as geleiras ativas do Círculo Polar Antártico.",
      "constância, intensidade e previsibilidade dos ventos alísios que sopram em direção ao Equador sem barreiras orográficas abruptas."
    ],
    4,
    "Alternativa correta: E. a localização tropical do Nordeste favorece a atuação dos ventos alísios oceânicos que sopram com velocidade constante, baixa turbulência e direção estável ao longo de praticamente todo o ano, proporcionando uma geração elétrica contínua e altamente rentável para os aerogeradores. A alternativa A erra porque furacões não ocorrem no Atlântico Sul brasileiro. A C mente sobre o sol sertanejo. As alternativas D e E citam vulcões e geleiras incompatíveis com a geografia do Nordeste."
  ],
  "Mineração e impactos socioambientais": [
    "A mineração é uma atividade primária de suma relevância para a balança comercial e para a base industrial moderna, mas acarreta graves passivos socioambientais. No Brasil, destacam-se duas grandes províncias minerais: 1) O Quadrilátero Ferrífero (MG): histórico polo de extração de minério de ferro e manganês desde o período colonial, cuja exploração intensa gerou centenas de barragens de contenção de rejeitos de mineração a montante (as mais baratas e instáveis); 2) O Projeto Grande Carajás (PA): maior mina de ferro a céu aberto do mundo, com minério de altíssimo teor exportado pelo Porto de Itaqui (MA) pela Estrada de Ferro Carajás. As rupturas das barragens de rejeitos da Samarco/Vale em Mariana (2015, no Rio Doce) e da Vale em Brumadinho (2016, no Rio Paraopeba) configuraram as maiores tragédias socioambientais e humanitárias da história do país, destruindo comunidades, contaminando bacias hidrográficas com lama tóxica e ceifando centenas de vidas humanas.",
    [
      "Barragens a montante: método construtivo mais barato e vulnerável, onde os alteamentos são erguidos sobre a própria lama de rejeitos",
      "Desastres de Mariana (2015) e Brumadinho (2019): destruição das bacias dos rios Doce e Paraopeba e soterramento de comunidades",
      "Projeto Carajás (PA): extração de ferro, manganês, cobre e bauxita escoada pela ferrovia até o Porto de Itaqui em São Luís (MA)",
      "Garimpo ilegal: invasão de terras indígenas (Yanomami) com contaminação dos rios e peixes por mercúrio metálico líquido"
    ],
    "Para o ENEM, lembre-se: a mineração gera o 'efeito enclave' em municípios do interior: atrai grande arrecadação de royalties (CFEM), mas gera poucos empregos locais duradouros, degrada o meio ambiente e deixa crateras e passivos quando a jazida se esgota.",
    "Após o rompimento de barragens de contenção de rejeitos minerários na bacia do Rio Doce e do Rio Paraopeba em Minas Gerais, a legislação federal de segurança de barragens (Lei nº 14.066/2020) proibiu expressamente a construção ou ampliação de barragens erguidas pelo método de alteamento 'a montante', determinando a descaracterização e eliminação dessas estruturas no território nacional.",
    "A proibição legal do método construtivo de barragens de rejeitos alteadas 'a montante' justifica-se tecnicamente porque esse modelo:",
    [
      "utiliza concreto armado maciço de custo dez vezes superior ao das usinas nucleares.",
      "exige a queima contínua de carvão fóssil para manter os rejeitos minerais em estado líquido.",
      "apoia os diques de alteamento sobre o próprio sedimento lamacento de rejeitos previamente depositado, apresentando alto risco de liquefação e colapso mecânico.",
      "impede a passagem de navios cargueiros transoceânicos pelo topo das montanhas de Minas Gerais.",
      "foi concebido para funcionar exclusivamente como reservatório de água potável urbana tratada."
    ],
    2,
    "Alternativa correta: C. no método 'a montante', a empresa alteia a barragem utilizando a própria lama de rejeitos acumulada como base para novos diques sucessivos; quando chove excessivamente ou ocorrem tremores e infiltrações, a lama de rejeitos perde rigidez e se comporta como líquido (fenômeno da liquefação), rompendo a estrutura e liberando tsunamis de lama. As alternativas A, C, D e E trazem hipóteses incoerentes e absurdas."
  ],
  "Divisões regionais: IBGE e Milton Santos": [
    "A regionalização é a divisão do espaço geográfico em porções territoriais que compartilham características físicas, sociais, econômicas ou culturais homogêneas. No Brasil, três grandes propostas de regionalização destacam-se: 1) Divisão Oficial do IBGE (1994, ajustada em 1988): divide o país em cinco macrorregiões (Norte, Nordeste, Centro-Oeste, Sudeste e Sul), respeitando estritamente os limites político-administrativos dos estados; fundamentou-se em critérios naturais associados a dados socioeconômicos para fins estatísticos e de planejamento governamental; 2) Os 3 Complexos Geoeconômicos de Pedro Pinchas Geiger (1967): divide o país em Amazônia, Nordeste e Centro-Sul, ignorando as fronteiras estaduais e priorizando a formação histórico-econômica e a integração capitalista; 3) Os 'Quatro Brasis' de Milton Santos e María Laura Silveira (2001): baseia-se na difusão desigual do meio técnico-científico-informacional, dividindo o território em: Região Concentrada (Sudeste e Sul), Região Centro-Oeste, Região Nordeste e Região da Amazônia.",
    [
      "IBGE (5 Regiões): Norte, Nordeste, Centro-Oeste, Sudeste, Sul (respeita 100% as fronteiras políticas dos estados)",
      "Complexos Geoeconômicos (Geiger - 3 Regiões): Amazônia, Nordeste e Centro-Sul (NÃO respeita fronteiras estaduais)",
      "Os 4 Brasis (Milton Santos): Região Concentrada (Sul+Sudeste), Centro-Oeste, Nordeste e Amazônia (critério: meio técnico-científico-informacional)",
      "Tocantins: criado pela CF/88 a partir da divisão de Goiás e integrado à Região Norte do IBGE"
    ],
    "Memorize a diferença essencial para as questões do ENEM: A divisão do IBGE obedece às fronteiras estaduais (nenhum estado é dividido ao meio). A regionalização geoeconômica de Pedro Pinchas Geiger NÃO obedece fronteiras estaduais (corta Minas Gerais ao meio, separa o norte do Tocantins e o leste do Maranhão).",
    "Ao propor a regionalização dos 'Quatro Brasis' no livro 'O Brasil: Território e Sociedade no Início do Século XXI', o geógrafo Milton Santos e a professora María Laura Silveira adotaram como critério analítico a distribuição espacial diferenciada das densidades técnicas, financeiras, de telecomunicações e de inovação que estruturam o território.",
    "Na tipologia dos 'Quatro Brasis', a denominada 'Região Concentrada' abrange:",
    [
