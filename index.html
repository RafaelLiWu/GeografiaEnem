    0,
    "Alternativa correta: A. O Agreste é o clássico ecótono nordestino localizado entre a Zona da Mata (litoral úmido) e o Sertão (interior semiárido); seu relevo montanhoso no Planalto da Borborema barra parte da umidade oceânica, gerando vertentes úmidas (brejos de altitude) e encostas secas, marcando a transição física e econômica regional. As alternativas A, C, D e E citam outras regiões geográficas sem relação com o ecótono nordestino."
  ],
  "Relevo cárstico e dissolução química de rochas calcárias": [
    "O relevo cárstico (ou carste) é uma paisagem geomorfológica singular modelada predominantemente pelo intemperismo químico de dissolução e corrosão ácida exercido pela água sobre rochas solúveis, com ênfase esmagadora para as rochas carbonáticas sedimentares (calcários e dolomitos). A água da chuva absorve dióxido de carbono (CO₂) da atmosfera e dos solos com matéria orgânica, transformando-se em uma solução fraca de ácido carbônico (H₂CO₃); ao infiltrar-se pelas fissuras e fraturas do maciço rochoso calcário, a água ácida reage quimicamente com o carbonato de cálcio insolúvel (CaCO₃), convertendo-o em bicarbonato de cálcio solúvel [Ca(HCO₃)₂], que é carreado pela drenagem subterrânea. Ao longo de milhões de anos, esse processo esculpe formas subterrâneas espetaculares (como cavernas, grutas, galerias e espeleotemas: estalactites descendo do teto e estalagmites subindo do chão) e formas superficiais típicas (como dolinas: depressões circulares formadas pelo abatimento do teto de cavernas; lapiás e sumidouros por onde rios inteiros desaparecem para o subsolo). No Brasil, destacam-se os carstes de Lagoa Santa (MG), Iporanga/PETAR (SP) e Bonito (MS).",
    [
      "Carste: relevo de dissolução química de rochas calcárias por água acidificada com dióxido de carbono (H₂CO₃)",
      "Dolinas: depressões circulares superficiais geradas pelo colapso de cavernas subterrâneas",
      "Espeleotemas: estalactites (teto) e estalagmites (chão) formadas pela precipitação lenta de carbonato de cálcio",
      "Sumidouros e ressurgências: rios que desaparecem no subsolo calcário e reaparecem quilômetros adiante"
    ],
    "Para o ENEM: caverna em calcário não é buraco cavado por terremoto; é buraco dissolvido gota a gota pela química da água ácida com calcário ao longo de eras geológicas.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Dinamica do Relevo Cárstico Calcário</text><path d='M20 50 Q 80 50 100 80 Q 120 110 140 80 Q 160 50 300 50 L 300 135 L 20 135 Z' fill='#5B6785'/><text x='105' y='75' font-size='9' fill='#D12D20' font-weight='700'>Dolina</text><rect x='60' y='95' width='180' height='30' fill='#14213D' rx='5'/><text x='75' y='112' font-size='9' fill='#fff' font-weight='700'>Caverna / Galeria Subterrânea</text><text x='75' y='122' font-size='8' fill='#2F5BFF'>Dissolução por Ácido Carbônico (H₂CO₃)</text></svg>Em parques geológicos de Minas Gerais e do vale do Rio Ribeira em São Paulo, geólogos mapeiam paisagens marcadas por depressões fechadas circulares onde a água pluvial some para o subsolo, além de vastos complexos subterrâneos repletos de colunas de pedra formadas pela precipitação contínua de minerais carbonáticos.",
    "O processo morfogenético primário responsável pela estruturação do relevo cárstico descrito fundamenta-se no(a):",
    [
      "impacto direto de meteoritos gigantescos que desintegram o leito rochoso de granito.",
      "intemperismo químico por dissolução ácida de rochas carbonáticas pela ação de águas enriquecidas com dióxido de carbono.",
      "congelamento do magma vulcânico sob alta pressão atmosférica em áreas glaciais.",
      "atrito provocado por tempestades contínuas de areia eólica em planícies litorâneas.",
      "elevação abrupta do fundo do mar provocada por abalos sísmicos de placas divergentes."
    ],
    1,
    "Alternativa correta: B. O relevo cárstico é esculpido pela ação química da água carregada de CO₂ que reage e dissolve as rochas sedimentares calcárias, abrindo galerias subterrâneas e colapsando o terreno superficial em dolinas e sumidouros característicos. As alternativas A, C, D e E trazem agentes mecânicos ou tectônicos alheios à química do carste."
  ],
  "Voçorocamento e ravinamento em encostas desmatadas": [
    "A erosão hídrica do solo nas vertentes brasileiras atinge seus estágios mais destrutivos sob a ação antrópica desordenada, pautada no desmatamento total da vegetação protetora, queimadas e loteamentos irregulares. O processo erosivo linear evolui em etapas bem definidas: 1) Erosão Laminar (ou em lençol): a chuva lava uniformemente a camada superficial fértil de terra sem abrir sulcos visíveis; 2) Ravinamento: a água das enxurradas concentra-se em linhas preferenciais de escoamento superficial, escavando sulcos lineares e canais de até 50 cm de profundidade no solo (ravinas); 3) Voçorocamento: quando o ravinamento aprofunda-se violentamente até atingir o lençol freático subterrâneo. Nesse ponto crítico, a água do aquífero brota no fundo da fenda, solapando a base das paredes terrosas por erosão subterrânea (piping) e provocando desmoronamentos contínuos de blocos de terra em grande escala. As voçorocas podem atingir dezenas de metros de largura e profundidade, devorando estradas, soterrando pastagens e lançando toneladas de sedimentos que provocam o assoreamento de rios e reservatórios hidrelétricos.",
    [
      "Erosão laminar: remoção invisível e uniforme dos horizontes superficiais do solo pela chuva",
      "Ravinas: sulcos lineares escavados pelo escoamento superficial concentrado da enxurrada",
      "Voçoroca: fenda erosiva profunda e desmoronante que atinge e expõe o lençol freático",
      "Piping: erosão subterrânea onde a água do lençol freático solapa a base das vertentes da voçoroca"
    ],
    "Para o ENEM: a diferença entre ravina e voçoroca é uma pergunta clássica! Na ravina a água da chuva corre só pela superfície; na voçoroca o buraco é tão fundo que alcançou o lençol freático lá embaixo, fazendo brotar água e derrubar as encostas.",
    "Na bacia do Rio Paraíba do Sul e no interior de Minas Gerais e São Paulo, o desmatamento secular das encostas íngremes de Mares de Morros para pastagens abriu fendas monumentais de mais de 20 metros de profundidade que atingiram o lençol freático, engolindo áreas produtivas e soterando córregos locais.",
    "A feição erosiva acelerada de grande porte que atinge o lençol de água subterrâneo solapando as encostas é denominada na Geomorfologia como:",
    [
      "restingas litorâneas de deposição eólica marinha.",
      "horst tectônico soerguido por falhas geológicas ativas.",
      "falésia fóssil consolidada por recifes de coral.",
      "meandro abandonado formado pela sinuosidade de rios de planície.",
      "voçoroca, originada pela evolução do ravinamento até a interceptação do lençol freático."
    ],
    4,
    "Alternativa correta: E. O voçorocamento constitui o estágio mais grave da erosão hídrica linear, ocorrendo quando a incisão erosiva intercepta a água subterrânea do lençol freático, cujo fluxo desestabiliza a base dos taludes e acelera colapsos catastróficos de solo em áreas desprotegidas pela cobertura florestal nativa. As alternativas A, C, D e E citam feições sedimentares, marinhas ou tectônicas."
  ],
  "Bacia do Tocantins-Araguaia e Usina de Tucuruí": [
    "A Bacia Hidrográfica do Tocantins-Araguaia ostenta a condição geográfica singular de ser a maior bacia hidrográfica situada inteiramente dentro do território nacional brasileiro (com mais de 960 mil km², abrangendo terras de Goiás, Tocantins, Pará, Maranhão, Mato Grosso e o Distrito Federal). Seus dois eixos fluviais principais (o Rio Tocantins e o Rio Araguaia) correm de sul para norte, serpenteando por planaltos do Cerrado até desaguarem no Golfão Amazônico e baía do Marajó. No Rio Araguaia encontra-se a monumental Ilha do Bananal (a maior ilha fluvial do mundo). O aproveitamento econômico da bacia divide-se entre a geração energética e a logística: nela opera a Usina Hidrelétrica de Tucuruí (PA), uma das maiores do mundo em potência geradora, construída durante os governos militares para fornecer energia hidrelétrica abundante e subsidiada para a eletrointensiva metalurgia de alumínio do Projeto Grande Carajás (como a Albrás em Barcarena). Paralelamente, a expansão do agronegócio de grãos no Matopiba aumentou a demanda pelo transporte hidroviário de barcaças pelo Tocantins até o Porto de Vila do Conde e Itaqui.",
    [
      "Maior bacia 100% brasileira: não divide águas internacionais com nenhum outro país vizinho",
      "Rios de planalto Tocantins e Araguaia: correm para o norte cortando o bioma Cerrado até a Amazônia",
      "Usina Hidrelétrica de Tucuruí: abastece a cadeia de beneficiamento de bauxita e alumínio de Carajás",
      "Ilha do Bananal: maior ilha genuinamente fluvial do planeta, localizada no curso do Rio Araguaia"
    ],
    "Para o ENEM: a Bacia Amazônica é a maior bacia do Brasil, mas NÃO é 100% brasileira (ela nasce no Peru e passa por outros países); a maior bacia exclusivamente brasileira em área é a do Tocantins-Araguaia.",
    "Construída no Rio Tocantins na década de 1980, a Hidrelétrica de Tucuruí representou um marco da integração territorial amazônica, conectada à linha de transmissão que alimenta complexos industriais de transformação de bauxita em alumínio voltados ao mercado de exportação no litoral paraense.",
    "A relevância geográfica e estratégica da Bacia Hidrográfica do Tocantins-Araguaia no cenário nacional apoia-se no fato de:",
    [
      "ser a maior bacia hidrográfica com extensão territorial localizada integralmente em território brasileiro, combinando grande potencial energético e hidroviário.",
      "constituir uma bacia desértica intermitente que seca completamente durante os meses de verão.",
      "localizar-se em território internacional compartilhado obrigatoriamente com a Bolívia e o Paraguai.",
      "apresentar rios congelados que impedem a navegação e a instalação de turbinas hidráulicas.",
      "abastecer com exclusividade toda a rede de água encanada da Região Sul do Brasil."
    ],
    0,
    "Alternativa correta: A. A Bacia do Tocantins-Araguaia é a maior bacia inteiramente contida nas fronteiras do Brasil, desempenhando papel estratégico tanto pelo potencial elétrico (com destaque para a Usina de Tucuruí) quanto pela função de corredor de escoamento hidroviário para a produção agropecuária do Centro-Oeste e mineral do Pará. As alternativas A, C, D e E trazem informações geográficas inverídicas."
  ],
  "Bacia do Rio Paraná e Hidrovia Tietê-Paraná": [
    "A Bacia Hidrográfica do Rio Paraná integra a macrobacia da Prata, configurando o eixo econômico, populacional e energético mais desenvolvido e denso da América do Sul. Seus tributários principais drenam áreas dos estados de São Paulo, Minas Gerais, Paraná, Goiás, Mato Grosso do Sul, Santa Catarina e o Distrito Federal. A conjugação entre o relevo de planalto e o clima tropical com chuvas copiosas confere à bacia o maior aproveitamento e capacidade instalada de energia hidrelétrica do continente, sediando complexos monumentais como a Usina Hidrelétrica Binacional de Itaipu (Brasil/Paraguai), Porto Primavera, Ilha Solteira e Marimbondo. No campo dos transportes multimodais, a bacia abriga a Hidrovia Tietê-Paraná, uma artéria fluvial estratégica dotada de eclusas que permite a navegação contínua de comboios de barcaças ao longo de mais de 2.400 km de cursos navegáveis, interligando a produção de soja, farelo, cana-de-açúcar e milho do Centro-Oeste e interior paulista às ferrovias que conduzem ao Porto de Santos, barateando fretes e reduzindo emissões de carbono do modal rodoviário.",
    [
      "Bacia do Paraná: coração energético do Brasil, concentrando a maior parte da hidroeletricidade consumida no país",
      "Usina Binacional de Itaipu: gigante hidrelétrica compartilhada em condomínio soberano entre Brasil e Paraguai",
      "Hidrovia Tietê-Paraná: sistema de transporte fluvial com eclusas para contornar os desníveis das hidrelétricas",
      "Intermodalidade: conexão entre barcaças fluviais, ferrovias e o Porto de Santos para escoar safras"
    ],
    "Para o ENEM: rios de planalto geram muita eletricidade por terem quedas d'água, mas são ruins para barcos; para fazer barcaças navegarem onde tem represa, foram construídas eclusas (espécie de elevador de navios).",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Esquema de Funcionamento de uma Eclusa</text><rect x='20' y='50' width='80' height='40' fill='#2F5BFF' rx='4'/><text x='25' y='72' font-size='9' fill='#fff' font-weight='700'>Nível Superior</text><text x='25' y='82' font-size='8' fill='#fff'>Represa da Usina</text><rect x='110' y='40' width='90' height='60' fill='#5B6785' rx='6'/><text x='118' y='65' font-size='9' fill='#fff' font-weight='700'>Câmara da Eclusa</text><text x='118' y='78' font-size='8' fill='#fff'>Elevação / Descida</text><rect x='210' y='70' width='80' height='30' fill='#14213D' rx='4'/><text x='215' y='88' font-size='9' fill='#fff' font-weight='700'>Nível Inferior</text><text x='40' y='125' font-size='9' fill='var(--tx)'>Superação de desníveis topográficos para integração logística hidroviária</text></svg>O transporte hidroviário na Bacia do Rio Paraná permite que barcaças graneleiras de grande porte desçam os cursos fluviais transportando milhões de toneladas de grãos do interior em direção aos terminais intermodais ferroviários paulistas, contornando desníveis de barragens através de sistemas de comportas hidráulicas.",
    "O duplo papel estratégico desempenhado pela Bacia do Rio Paraná para o desenvolvimento econômico do Centro-Sul brasileiro caracteriza-se pela:",
    [
      "produção artesanal de sal marinho e criação intensiva de peixes polares de águas gélidas.",
      "ausência de conexões de transporte com o complexo portuário de Santos e Paranaguá.",
      "manutenção de rios de planície sem barragens voltados exclusivamente para canoagem esportiva.",
      "liderança nacional na geração de energia hidrelétrica e estruturação de rotas de transporte multimodal hidroviário de cargas agrícolas.",
      "destinação exclusiva de todas as suas águas fluviais para a extração mecanizada de petróleo leve pré-sal."
    ],
    3,
    "Alternativa correta: D. A Bacia do Rio Paraná concentra a maior capacidade geradora de eletricidade do país devido ao relevo de planalto e à presença de Itaipu e das usinas de São Paulo, além de sediar a Hidrovia Tietê-Paraná, fundamental para o barateamento do escoamento de commodities agrícolas do Centro-Oeste e Sudeste até os portos exportadores. As alternativas A, C, D e E trazem assertivas desconexas."
  ],
  "Mapas temáticos: coropléticos, isarítmicos e anamorfoses": [
    "A representação do espaço geográfico exige métodos cartográficos específicos (semiologia gráfica) conforme a natureza e a distribuição espacial dos dados analisados: 1) Mapas Coropléticos: utilizam cores, tons graduais ou hachuras sobre áreas poligonais predefinidas (como municípios, estados ou países) para representar fenômenos quantitativos contínuos relativos (como densidade demográfica, taxa de homicídios ou IDH); a regra fundamental exige que tons mais escuros representem valores mais intensos/altos; 2) Mapas Isarítmicos (ou de isolinhas): utilizam linhas imaginárias que conectam pontos de idêntico valor numérico de um determinado elemento, tais como curvas de nível (isópsas: mesma altitude), isotermas (mesma temperatura) ou isóietas (mesma pluviosidade); 3) Anamorfoses Cartográficas: distorcem deliberadamente a forma e a área real dos territórios cartografados, redesenhando as fronteiras de modo diretamente proporcional à grandeza da variável estudada (como população total, riqueza do PIB ou número de armas nucleares), permitindo impacto visual imediato sobre disparidades globais.",
    [
      "Mapa Coroplético: gradação de cores/tons em unidades territoriais (ex: IDH por estado; mais escuro = maior valor)",
      "Mapa Isarítmico (isolinhas): linhas conectando pontos de mesmo valor (curvas de nível, isotermas, isóietas)",
      "Anamorfose: distorção visual deliberada da área geográfica proporcional ao valor estatístico representado",
      "Semiologia gráfica de Jacques Bertin: regras visuais de tamanho, cor, valor, granulação e orientação nos mapas"
    ],
    "Para o ENEM: em mapa coroplético de intensidade, tom escuro é 'muito' e tom claro é 'pouco'! Já na anamorfose, o país vira um 'balão inflado' se a estatística for grande (como a Índia num mapa de população) ou vira um 'palito' se o valor for minúsculo.",
    "Ao analisar uma publicação científica sobre geopolítica mundial, um estudante depara-se com um mapa no qual o continente africano aparece minúsculo e quase imperceptível, enquanto a Europa Ocidental e a América do Norte aparecem gigantescas e infladas, deformando o tamanho real das terras emersas.",
    "O tipo de representação cartográfica temática que deliberadamente distorce a escala geométrica dos territórios em função da variável socioeconômica representada é a:",
    [
      "planta cadastral urbana de loteamento residencial.",
      "projeção estereográfica equidistante pura de Mercator.",
      "carta náutica batimétrica de navegação portuária.",
      "anamorfose cartográfica, desenhada proporcionalmente ao peso da variável estatística quantitativa.",
      "fotografia aérea pancromática em preto e branco sem escala."
    ],
    3,
    "Alternativa correta: D. A anamorfose é uma técnica cartográfica que substitui a precisão métrica de áreas e formatos geométricos por uma distorção plástica proporcional aos dados estatísticos em análise (por exemplo, PIB ou gastos militares), evidenciando imediatamente as disparidades e assimetrias espaciais globais. As alternativas A, C, D e E citam outras técnicas cartográficas que preservam rigorosamente a métrica espacial."
  ],
  "Leitura de perfis topográficos e vertentes do relevo": [
    "A interpretação do relevo em cartas topográficas fundamenta-se na leitura das curvas de nível (ou curvas hipsométricas), que são linhas imaginárias que conectam pontos de mesma cota altimétrica na superfície terrestre, traçadas com uma equidistância vertical constante (por exemplo, a cada 20 metros ou 50 metros). A regra cartográfica fundamental de interpretação do relevo estabelece que: onde as curvas de nível encontram-se densamente agrupadas e muito próximas umas das outras, o relevo é extremamente íngreme, escarpado e de alta declividade (como encostas serranas e paredões de chapadas); ao contrário, onde as curvas de nível apresentam-se muito afastadas e espaçadas entre si, o relevo é suave, plano ou ondulado (como planícies aluviais e topos de chapadões). A partir do traçado de uma linha de corte sobre a carta topográfica, elabora-se o perfil topográfico: um gráfico bidimensional que exibe a silhueta vertical do terreno, essencial para o planejamento de traçados de rodovias, ferrovias, canais de irrigação e zonas de risco de deslizamento.",
    [
      "Curvas de nível (isópsas): linhas que unem pontos de igual altitude na carta topográfica",
      "Equidistância vertical: distância altimétrica constante entre duas curvas de nível vizinhas",
      "Declividade e proximidade: curvas juntas = relevo íngreme/escarpado; curvas afastadas = terreno plano/suave",
      "Perfil topográfico: corte transversal bidimensional que representa a forma e elevação do relevo ao longo de uma linha"
    ],
    "Para o ENEM: em qualquer prova com desenho de curvas de nível, lembre-se: 'linhas coladas = subida dura de escalar'; 'linhas bem separadas = terreno quase plano fácil de andar de bicicleta'.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Curvas de Nível e Declividade</text><circle cx='80' cy='85' r='50' fill='none' stroke='#2F5BFF' stroke-width='2'/><circle cx='80' cy='85' r='35' fill='none' stroke='#2F5BFF' stroke-width='2'/><circle cx='80' cy='85' r='20' fill='none' stroke='#2F5BFF' stroke-width='2'/><text x='70' y='88' font-size='9' fill='var(--tx)' font-weight='700'>100 m</text><text x='25' y='142' font-size='9' fill='var(--mu)'>Curvas circulares concêntricas</text><rect x='160' y='50' width='140' height='40' fill='#D12D20' rx='5'/><text x='165' y='67' font-size='9' fill='#fff' font-weight='700'>Curvas Próximas</text><text x='165' y='80' font-size='8' fill='#fff'>Alta Declividade / Íngreme</text><rect x='160' y='98' width='140' height='38' fill='#2E7D32' rx='5'/><text x='165' y='114' font-size='9' fill='#fff' font-weight='700'>Curvas Afastadas</text><text x='165' y='126' font-size='8' fill='#fff'>Baixa Declividade / Suave</text></svg>Ao analisar uma carta topográfica para o traçado de uma nova ferrovia de transporte de grãos, engenheiros constataram que no trecho ocidental as curvas de nível de 20 metros de equidistância distavam apenas 2 milímetros entre si, enquanto no trecho oriental as mesmas curvas distavam 4 centímetros.",
    "A leitura geomorfológica correta indica que a rota ferroviária encontrará no trecho ocidental um terreno:",
    [
      "perfeitamente horizontal de planície aluvial inundável.",
      "abrupto e de elevada declividade que exigirá obras pesadas de corte, viadutos e túneis.",
      "formado exclusivamente por areias móveis de dunas oceânicas.",
      "deprimido abaixo do nível médio dos mares globais.",
      "desprovido de qualquer força gravitacional atuante."
    ],
    1,
    "Alternativa correta: B. A extrema proximidade gráfica das curvas de nível em uma carta topográfica expressa que a altitude varia de forma abrupta em um curto espaço horizontal, caracterizando vertentes íngremes e escarpadas de alta declividade, o que encarece obras civis de infraestrutura viária e impõe limites ao transporte de cargas. As alternativas A, C, D e E trazem deduções fisicamente incoerentes."
  ],
  "Bônus demográfico e janela de oportunidade no Brasil": [
    "O bônus demográfico (ou dividendo demográfico / janela de oportunidade demográfica) é um fenômeno socioeconômico temporário e único que ocorre durante a transição demográfica de um país, quando a taxa de fecundidade despenca rapidamente, mas o envelhecimento populacional em massa ainda não se consolidou. Nesse intervalo histórico específico (que no Brasil vivenciou seu auge entre o início dos anos 2000 e meados da década de 2020), a razão de dependência atinge seu patamar mínimo histórico: a proporção de indivíduos em idade ativa para trabalhar e produzir (População em Idade Ativa - PIA, de 15 a 64 anos) é muito superior à soma de dependentes (crianças de 0 a 14 anos e idosos com mais de 65 anos). Esse cenário cria uma oportunidade singular para o enriquecimento e salto econômico de uma nação, pois sobra mais poupança pública e privada para ser investida em educação científica de excelência, inovação tecnológica e infraestrutura pesada. Contudo, analistas apontam que o Brasil corre o sério risco de desperdiçar seu bônus demográfico em razão de altas taxas de desemprego e subocupação jovem, envelhecendo antes de se tornar rico.",
    [
      "Bônus demográfico: período transitório onde a proporção de pessoas em idade de trabalhar (15-64 anos) supera amplamente a de dependentes",
      "Razão de dependência mínima: menos crianças para sustentar e os idosos ainda não são maioria na pirâmide",

  "Xenofobia e crise migratória no Mar Mediterrâneo": [
    "As migrações internacionais contemporâneas tornaram-se um dos temas mais tensos da geopolítica global, com destaque para as rotas marítimas perigosas através do Mar Mediterrâneo, convertidas na fronteira migratória mais mortal do planeta. Centenas de milhares de pessoas procedentes da África Subsaariana e do Oriente Médio (fugindo de guerras civis na Síria, Iêmen e Sudão, perseguições políticas, colapsos econômicos e desertificação) arriscam a travessia em embarcações precárias superlotadas operadas por redes ilegais de tráfico humano com destino à Itália, Grécia e Espanha. Diante desse fluxo humanitário, a União Europeia adotou políticas severas de contenção e securitização de fronteiras (através da agência Frontex, militarização de patrulhas e acordos financeiros bilaterais para que países terceiros, como a Turquia e a Líbia, barrem os migrantes antes de chegarem à Europa). Esse contexto alimentou o recrudescimento da xenofobia (aversão, preconceito e hostilidade aberta contra estrangeiros) e a ascensão de partidos de extrema-direita nos países europeus, que utilizam discursos nacionalistas e anti-imigração para culpar os estrangeiros pelo desemprego e pela perda de identidade cultural.",
    [
      "Crise do Mediterrâneo: travessias marítimas mortais de solicitantes de refúgio da África e Oriente Médio para a Europa",
      "Securitização de fronteiras: tratamento da migração como problema militar e policial através da Frontex e barreiras",
      "Xenofobia: discriminação, intolerância e discursos de ódio contra imigrantes e refugiados",
      "Externalização do controle: União Europeia paga países terceiros (Turquia, Líbia) para deter migrantes fora do continente"
    ],
    "Para a redação e para o ENEM: xenofobia é violação explícita da Declaração Universal dos Direitos Humanos; a busca por asilo e refúgio quando se foge da guerra não é crime, é um direito universal sagrado de todo ser humano.",
    "Relatórios da Agência da ONU para Refugiados (ACNUR) contabilizam mais de 28 mil pessoas mortas ou desaparecidas em naufrágios no Mar Mediterrâneo na última década, em meio à recusa de países europeus em permitir o desembarque imediato de navios humanitários de resgate civil.",
    "A reação política e sociocultural que se fortaleceu em várias nações receptoras da Europa Ocidental em oposição à chegada desses fluxos populacionais caracteriza-se pelo(a):",
    [
      "avanço de discursos e práticas xenófobas que associam a presença de imigrantes e refugiados à criminalidade e à desestruturação dos serviços sociais públicos.",
      "desmantelamento voluntário de todas as alfândegas e forças policiais de fronteira.",
      "concessão espontânea de moradias gratuitas e cargos de alto escalão público a todos os migrantes recém-chegados.",

  ],
  "Uberização e plataformização do trabalho urbano": [
    "A 'uberização' do trabalho (ou plataformização do trabalho) expressa a mais profunda e acelerada mutação nas relações de produção e emprego do capitalismo flexível contemporâneo, potencializada pelo meio técnico-científico-informacional, pela proliferação de smartphones e pelo gerenciamento algorítmico da força de trabalho. Nesse modelo, corporações transnacionais de tecnologia (plataformas de transporte de passageiros, entrega de alimentos e serviços diversos) conectam diretamente prestadores de serviço e consumidores, apresentando-se formalmente não como empregadoras, mas como meras intermediárias digitais neutras. Esse arranjo impõe um regime de extrema precarização do trabalho camuflado pela ideologia do 'empreendedor de si mesmo': os trabalhadores arcam pessoalmente com a posse, manutenção e abastecimento dos instrumentos de trabalho (carros, motocicletas, bicicletas e celulares), não possuem salário fixo, jornada máxima legalmente delimitada, férias remuneradas, previdência social contra acidentes ou auxílio-doença, ficando inteiramente subordinados a ordens emitidas por algoritmos e sujeitos a bloqueios punitivos arbitrários.",
    [
      "Uberização / Plataformização: gestão e subordinação do trabalho operada por algoritmos de aplicativos",
      "Trabalhador como 'empreendedor': ideologia que disfarça a total ausência de direitos trabalhistas e previdenciários",
      "Transferência de custos: o trabalhador assume todos os riscos, combustível, manutenção do veículo e acidentes",
      "Jornadas extenuantes: motoristas e entregadores trabalham 12 a 16 horas diárias sem garantia de remuneração mínima"
    ],
    "Para a redação e para o ENEM: o trabalhador do aplicativo não é um 'chefe de si mesmo'; ele é um trabalhador terceirizado sem nenhum direito da CLT, que trabalha mais do que um operário do início da Revolução Industrial e sob vigilância de inteligência artificial.",
    "Pesquisa do IBGE sobre outras formas de trabalho indicou que mais de 1,5 milhão de brasileiros trabalham regularmente para aplicativos de transporte ou entrega rápida, cumprindo jornadas semanais médias superiores a 50 horas, com rendimentos líquidos inferiores ao piso de categorias formais equivalentes e sem qualquer cobertura da legislação trabalhista.",
    "A caracterização socioespacial e produtiva do processo de plataformização do trabalho retratado fundamenta-se na:",
    [
      "garantia de estabilidade profissional vitalícia e previdência integral custeada pelos aplicativos.",
      "estatização compulsória de todas as motocicletas e bicicletas em favor dos municípios.",
      "proibição legal do uso de celulares e conexões de internet em atividades comerciais urbanas.",
      "transferência dos riscos econômicos e custos operacionais para os trabalhadores, desprovidos de direitos e subordinados ao controle algorítmico.",
      "adoção universal do modelo artesanal corporativo da Idade Média europeia."
    ],
    3,
    "Alternativa correta: D. A uberização opera a transferência dos custos dos meios de produção para o próprio trabalhador precarizado, enquanto as plataformas digitais monopolizam o controle das tarifas e das regras de remuneração através de algoritmos, desmontando a rede de proteção social conquistada nas leis trabalhistas do século XX. As alternativas A, C, D e E trazem formulações incoerentes."
  ],
  "Tecnopolos e distritos industriais de inovação tecnológica": [
    "No contexto da Terceira Revolução Industrial (Revolução Técnico-Científica-Informacional) e do pós-fordismo, a organização espacial da produção fabril alterou-se radicalmente: o modelo das gigantescas fábricas de chaminé instaladas perto de minas de carvão e portos foi superado pela emergência dos tecnopolos (ou distritos de inovação / parques tecnológicos). Os tecnopolos são espaços geográficos planejados que promovem a sinergia territorial entre universidades de pesquisa científica de excelência, centros estatais de fomento à inovação, capital de risco financeiro e empresas privadas de alta tecnologia (especializadas em microeletrônica, biotecnologia, inteligência artificial, robótica, nanotecnologia e telecomunicações). O pioneiro e mais célebre tecnopolo do mundo é o Vale do Silício (Silicon Valley), na Califórnia, articulado à Universidade de Stanford. No Brasil, destacam-se os tecnopolos de Campinas (SP, articulado à Unicamp e laboratórios de luz síncrotron), São José dos Campos (SP, polo aeroespacial da Embraer e ITA), São Carlos (SP) e o Porto Digital no Recife (PE, polo de desenvolvimento de software).",
    [
      "Tecnopolo: espaço de concentração espacial de empresas de tecnologia de ponta integradas a universidades de ponta",
      "Sinergia universidade-empresa: transformação direta do conhecimento científico básico em produtos comerciais patenteados",
      "Fatores locacionais modernos: mão de obra altamente qualificada, centros de pesquisa, aeroportos internacionais e qualidade de vida",
      "Exemplos globais e nacionais: Vale do Silício (EUA), Tsukuba (Japão), Campinas e São José dos Campos (Brasil)"
    ],
    "Para o ENEM: antigamente a fábrica procurava ficar perto de carvão ou minério de ferro; hoje as indústrias mais ricas do mundo procuram ficar perto de universidades cheias de cérebros qualificados e laboratórios de física e computação.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Tríplice Hélice nos Tecnopolos</text><circle cx='80' cy='85' r='38' fill='#2F5BFF'/><text x='55' y='83' font-size='9' fill='#fff' font-weight='700'>Universidades</text><text x='55' y='94' font-size='8' fill='#fff'>Pesquisa &amp; Ciência</text><circle cx='160' cy='85' r='38' fill='#2E7D32'/><text x='140' y='83' font-size='9' fill='#fff' font-weight='700'>Empresas</text><text x='140' y='94' font-size='8' fill='#fff'>Inovação &amp; Mercado</text><circle cx='240' cy='85' r='38' fill='#5B6785'/><text x='225' y='83' font-size='9' fill='#fff' font-weight='700'>Governo</text><text x='225' y='94' font-size='8' fill='#fff'>Fomento &amp; Infra</text><text x='35' y='140' font-size='9' fill='var(--tx)'>Ecossistema territorial de alta tecnologia e inovação tecnológica</text></svg>Em municípios como Campinas e São José dos Campos, a implantação de institutos públicos de tecnologia e universidades de ponta atraiu clusters de empresas de biotecnologia, semicondutores e aviação, consolidando complexos industriais de alto valor agregado com grande concentração de engenheiros e cientistas.",
    "O fator locacional decisivo que comanda a atração e a fixação de investimentos nos chamados tecnopolos contemporâneos é o(a):",
    [
      "proximidade imediata de universidades e centros de pesquisa e desenvolvimento dotados de capital humano altamente qualificado.",
      "abundância de mão de obra braçal analfabeta com baixíssimo custo salarial de subsistência.",
      "existência exclusiva de usinas a carvão fóssil mineral altamente poluentes.",

    0,
    "Alternativa correta: A. Os tecnopolos estruturam-se sobre a proximidade geográfica entre universidades e indústrias avançadas, demandando mão de obra pós-graduada e altamente capacitada para produzir inovações patenteáveis e produtos de alta densidade tecnológica, diferentemente da indústria fordista tradicional focada em mão de obra desqualificada. As alternativas A, C, D e E trazem hipóteses opostas aos fundamentos dos parques tecnológicos."

  "Hidrogênio verde (H2V) e a transição energética nordestina": [
    "O hidrogênio verde (H2V) desponta como o vetor energético de ponta para a descarbonização global de setores econômicos industriais e de transporte pesado de difícil eletrificação direta (como a siderurgia do aço verde, fertilizantes nitrogenados agrícolas, navegação mercante transoceânica e aviação). Ele é denominado 'verde' porque é produzido pelo processo de eletrólise da água pura utilizando exclusivamente eletricidade gerada a partir de fontes 100% renováveis (como a energia solar fotovoltaica e a energia eólica), não emitindo nenhum grama de gases de efeito estufa na sua síntese. O Nordeste brasileiro — em especial os estados do Ceará (Complexo Industrial e Portuário do Pecém), Rio Grande do Norte, Bahia e Piauí — desponta internacionalmente como um dos territórios mais competitivos do planeta para se tornar um hub mundial de produção e exportação de hidrogênio verde e amônia verde, em razão da complementaridade de seus ventos constantes de alta velocidade e radiação solar excepcional, gerando eletricidade limpa ao menor custo de produção do mundo.",
    [
      "Hidrogênio verde (H2V): H₂ produzido por eletrólise da água utilizando energia 100% renovável (eólica/solar)",
      "Diferença de cores: Cinza (gás natural fóssil), Azul (gás fóssil com captura de carbono), Verde (zero emissões fósseis)",
      "Hub do Pecém (Ceará): pioneiro no Brasil em memorandos de entendimento para exportação de H2V para a Europa",
      "Descarbonização pesada: viabiliza a siderurgia verde (substituindo o carvão mineral no alto-forno do aço)"
    ],
    "Para o ENEM: hidrogênio verde não se extrai pronto de poço de petróleo; ele é produzido quebrando a molécula da água (H₂O) com um choque de eletricidade limpa dos parques eólicos e solares do Nordeste.",
    "O governo do estado do Ceará e o Porto de Roterdã (Holanda) firmaram parcerias para a estruturação do Hub de Hidrogênio Verde no Complexo do Pecém, prevendo a instalação de usinas de eletrólise alimentadas por parques eólicos e solares para exportar combustível limpo na forma de amônia para abastecer indústrias europeias em processo de transição ecológica.",
    "A vantagem comparativa geográfica e energética que posiciona o Nordeste brasileiro na vanguarda da cadeia produtiva global do hidrogênio verde é o(a):",
    [
      "potencial excepcional de geração de energia eólica e solar a custos operacionais altamente competitivos para abastecer a eletrólise da água.",
      "predomínio de jazidas de carvão mineral de alta pureza no litoral do Maranhão.",
      "congelamento perene das águas oceânicas subtropicais que barateia o resfriamento de turbinas térmicas.",
      "ausência de radiação solar na região semiárida durante todos os meses do ano.",
      "obrigatoriedade de queima de óleo diesel em todas as etapas fabris da hidrólise química."
    ],
    0,
    "Alternativa correta: A. O Nordeste reúne ventos alísios regulares e velozes e altíssimos índices de insolação solar durante o ano inteiro, produzindo energia renovável abundante e barata, insumo indispensável para que o processo de eletrólise da água torne o hidrogênio verde economicamente viável para abastecer a transição energética do Brasil e da Europa. As alternativas A, C, D e E trazem formulações cientificamente errôneas."
  ],
  "Energia eólica offshore e onshore no litoral brasileiro": [
    "A energia eólica tornou-se um dos pilares mais dinâmicos e crescentes da matriz elétrica brasileira, respondendo por mais de 13% de toda a geração do país e consolidando o Brasil como um dos maiores produtores eólicos do globo. A expansão histórica ocorreu no modelo 'onshore' (parques eólicos instalados em terra firme, com gigantesca concentração na Região Nordeste: Bahia, Rio Grande do Norte, Ceará e Piauí), impulsionada pela presença dos ventos alísios de leste, caracterizados por alta velocidade, direção constante e ausência quase total de rajadas turbulentas, proporcionando fatores de capacidade superiores a 50% (muito acima da média mundial). Paralelamente, o país prepara-se para a fronteira da energia eólica 'offshore' (aerogeradores gigantescos instalados dentro do mar, na plataforma continental rasa), onde os ventos são ainda mais velozes e desimpedidos por obstáculos de relevo. Embora seja uma fonte renovável limpa e de baixo carbono, a implantação de parques eólicos suscita debates sobre impactos socioambientais locais: ruído constante das pás, afugentamento de avifauna migratória, supressão de dunas costeiras e restrições impostas a comunidades tradicionais de pescadores artesanais.",
    [
      "Eólica onshore: turbinas eólicas em terra firme (Bahia e Rio Grande do Norte lideram a geração nacional)",
      "Eólica offshore: aerogeradores marítimos na plataforma continental rasa com ventos mais fortes e estáveis",
      "Ventos alísios: ventos constantes e unidirecionais que garantem fator de capacidade récorde no Nordeste",
      "Impactos socioambientais: ruído em vilas costeiras, sombreamento piscante e impactos sobre dunas e pesca artesanal"
    ],
    "Para o ENEM: energia eólica é limpa no sentido de não queimar petróleo e não emitir carbono, mas ela não tem 'impacto zero'; a instalação de torres e pás em cima de dunas nordestinas pode soterrar lagoas e afastar comunidades pesqueiras caiçaras e indígenas.",
    "Imagens aéreas da costa do Rio Grande do Norte e do Ceará registram centenas de torres aerogeradoras eólicas instaladas ao longo de campos de dunas e falésias litorâneas, aproveitando o fluxo ininterrupto de massas de ar marítimas impulsionadas pela circulação atmosférica tropical.",
    "O fator natural atmosférico determinante que explica a elevada produtividade e o recorde de eficiência dos parques eólicos nordestinos é a:",
    [

      "constância e velocidade regular dos ventos alísios que sopram do oceano em direção ao continente sem grandes variações bruscas de direção.",

  ],
  "A Região Concentrada e os Quatro Brasis de Milton Santos": [
    "A proposta de regionalização formulada pelos geógrafos Milton Santos e María Laura Silveira em 2001 divide o território brasileiro não pelos limites político-administrativos dos estados (como o IBGE) ou pelo critério exclusivamente geoeconômico histórico (como Pinchas Geiger), mas sim pela difusão desigual dos meios técnicos, científicos e informacionais pelo território nacional. O modelo estabelece a divisão do país em 'Quatro Brasis': 1) Região Concentrada (formada pela união física das regiões Sudeste e Sul): o coração hegemônico do país, que reúne a esmagadora maioria das sedes corporativas, o sistema financeiro, os tecnopolos, as universidades de elite, as redes de cabos de fibra óptica e a maior densidade de fluxos informacionais e capitais; 2) Região Centro-Oeste: o espaço da agricultura globalizada e do agronegócio corporativo tecnificado, articulado diretamente aos mercados internacionais de grãos e comodities; 3) Região Nordeste: espaço de povoamento antigo marcado por modernizações pontuais (como polos de fruticultura irrigada no Vale do São Francisco) e persistência de áreas de extrema carência socioeconômica; 4) Região Amazônica: caracterizada pela menor densidade técnica e informacional, vista pelos centros decisórios da Região Concentrada como uma fronteira de recursos naturais a ser explorada.",
    [
      "Quatro Brasis de Milton Santos: Região Concentrada, Centro-Oeste, Nordeste e Amazônia",
      "Critério de divisão: difusão desigual do meio técnico-científico-informacional pelo território nacional",
      "Região Concentrada: união de Sudeste e Sul; concentra bancos, sedes de multinacionais, aeroportos e ciência",
      "Espaços luminosos vs opacos: coexistência de áreas de alta tecnologia com regiões de exclusão técnica no mesmo país"
    ],
    "Para o ENEM: memorize que para Milton Santos o 'Sul' e o 'Sudeste' não são regiões separadas; eles formam uma coisa só: a 'Região Concentrada', onde bate o coração financeiro, industrial e tecnológico de todo o Brasil.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Os Quatro Brasis (Milton Santos &amp; Silveira)</text><rect x='20' y='45' width='130' height='40' fill='#2F5BFF' rx='6'/><text x='25' y='62' font-size='9' fill='#fff' font-weight='700'>Região Concentrada</text><text x='25' y='76' font-size='8' fill='#fff'>Sul + Sudeste (Densidade Técnica)</text><rect x='170' y='45' width='130' height='40' fill='#2E7D32' rx='6'/><text x='175' y='62' font-size='9' fill='#fff' font-weight='700'>Centro-Oeste</text><text x='175' y='76' font-size='8' fill='#fff'>Agronegócio Corporativo Global</text><rect x='20' y='95' width='130' height='40' fill='#D12D20' rx='6'/><text x='25' y='112' font-size='9' fill='#fff' font-weight='700'>Nordeste</text><text x='25' y='126' font-size='8' fill='#fff'>Modernizações Pontuais &amp; Seca</text><rect x='170' y='95' width='130' height='40' fill='#5B6785' rx='6'/><text x='175' y='112' font-size='9' fill='#fff' font-weight='700'>Amazônia</text><text x='175' y='126' font-size='8' fill='#fff'>Baixa Densidade Técnica / Recursos</text></svg>Na obra 'O Brasil: Território e Sociedade no Início do Século XXI', Milton Santos e María Laura Silveira propõem uma regionalização que agrupa os estados de São Paulo, Rio de Janeiro, Minas Gerais, Espírito Santo, Paraná, Santa Catarina e Rio Grande do Sul sob uma mesma denominação geográfica unificada.",
    "O critério epistemológico fundamental utilizado pelos geógrafos para agrupar esses estados sob a denominação de 'Região Concentrada' foi a:",
    [
      "elevadíssima densidade de infraestruturas técnicas, fluxos de informação, finanças e centros de comando corporativo.",
      "distribuição rigorosamente uniforme das chuvas de monção sobre todos os municípios do país.",
      "obrigatoriedade de que todos os cidadãos residentes professem a mesma fé religiosa colonial.",
      "identidade geológica de preservação estrita de geleiras permanentes em montanhas vulcânicas.",
      "ausência completa de fábricas e estradas asfaltadas no interior de Minas e São Paulo."

// NOVO RECURSO: GLOSSÁRIO GEOGRÁFICO UNIFICADO
function vGl(){
  let items = [];
  M.forEach((m, i)=>{
    SUB[i].forEach((s, j)=>{
      const c = C[s.n];
      if(c && c[1]){
        c[1].forEach(conceito => {
          items.push({ mod: m.n, sub: s.n, txt: conceito, i, j });
        });
      }
    });
  });

  const t = nz(st.qs.trim());
  if(t){
    items = items.filter(x => nz(x.txt + " " + x.mod + " " + x.sub).includes(t));
  }

  return `<h1 class="a">📖 Glossário Geográfico Unificado</h1>
  <p class="a mu">Todos os conceitos-chave, leis ambientais, siglas e propriedades catalogados por módulo com busca rápida e cópia direta:</p>
  <div class="srch a" style="--i:1"><input id="gq" type="search" placeholder="Filtrar conceito no glossário..." value="${st.qs}" oninput="st.qs=this.value;q('#gl-list').innerHTML=renderGlList(this.value);" autocomplete="off"></div>
  <div id="gl-list" class="a" style="--i:2">${renderGlList(st.qs)}</div>`;
}

function renderGlList(query){
  let items = [];
  M.forEach((m, i)=>{
    SUB[i].forEach((s, j)=>{
      const c = C[s.n];
      if(c && c[1]){
        c[1].forEach(conceito => {
          items.push({ mod: m.n, sub: s.n, txt: conceito, i, j });
        });
      }
    });
  });

  const t = nz((query||"").trim());
  if(t){
    items = items.filter(x => nz(x.txt + " " + x.mod + " " + x.sub).includes(t));
  }

  if(!items.length) return `<p class="mu" style="padding:20px 0">Nenhum termo encontrado com "${query}".</p>`;

  return `<div style="display:grid;gap:8px;margin-top:14px">` + items.map(item => `
    <div class="rw" style="margin-bottom:6px" onclick="go('s/${item.i}/${item.j}')">
      <span class="rt">
        ${item.txt}
        <small>${item.sub} · <b>${item.mod}</b></small>
      </span>
      <button class="cp-btn" style="font-size:14px" onclick="event.stopPropagation();copyTxt('${item.txt.replace(/'/g, "\\'")}', this)" title="Copiar conceito">📋</button>
    </div>
  `).join("") + `</div>`;
}

      certo: "O efeito estufa atua na troposfera retendo radiação térmica infravermelha (ondas longas). A camada de ozônio (O₃) situa-se na estratosfera e tem a função específica de absorver a radiação ultravioleta (UV), sendo degradada por gases CFC.",
      dica: "Infravermelho = calor/efeito estufa. Ultravioleta = radiação ionizante/camada de ozônio."
    },
    {
      t: "Urbanização vs Crescimento Urbano",
      errado: "Usar urbanização como mero sinônimo de expansão das construções ou aumento demográfico da cidade.",
      certo: "Urbanização é um conceito demográfico e relativo: refere-se ao crescimento da população urbana em ritmo percentual superior ao da população rural, decorrente do êxodo rural. Crescimento urbano é a expansão física e morfológica da mancha da cidade.",
      dica: "Um país só se urbaniza quando o percentual de moradores nas cidades cresce em relação ao total."
    },
    {
      t: "Bioma vs Domínio Morfoclimático",
      errado: "Tratar os termos como sinônimos intercambiáveis.",
      certo: "Bioma é uma classificação biológica e ecológica da vegetação e fauna com fisionomia uniforme. Domínio Morfoclimático (proposto por Aziz Ab'Sáber) é uma síntese geográfica que integra o relevo, o tipo de solo, a bacia hidrográfica e o clima à cobertura vegetal.",
      dica: "No domínio de Ab'Sáber, o relevo (ex.: terras baixas, mares de morros, chapadões) é indissociável da vegetação."
    },
    {
      t: "Intemperismo vs Erosão",
      errado: "Chamar qualquer desgaste de rocha de erosão.",
      certo: "Intemperismo é a alteração e desagregação física ou decomposição química da rocha no próprio local (in situ), sem deslocamento. Erosão é o processo integrado de desgaste + transporte de sedimentos (pela água das chuvas, rios, vento ou geleiras) + deposição em áreas baixas.",
      dica: "Se não houve transporte de partículas, é apenas intemperismo."
    },
    {
      t: "Agricultura Familiar vs Agronegócio Patronal",
      errado: "Supor que o grande agronegócio exportador é quem abastece a alimentação diária da população brasileira.",
      certo: "A agricultura familiar (pequenas e médias propriedades) produz a maior parte dos alimentos da cesta básica brasileira (mandioca, feijão, hortaliças, leite). O grande agronegócio patronal foca na monocultura intensiva de commodities voltadas à exportação e ração animal (soja, milho, cana).",
      dica: "No Brasil: quem tem menos terra alimenta a mesa interna; quem tem mais terra exporta grãos."
    },
    {
      t: "Leitura de Mapas, Gráficos e Climogramas no ENEM",
      errado: "Pular direto para as alternativas sem ler a legenda, os eixos, as unidades e a fonte do gráfico.",
      certo: "Mais de 70% dos distratores do ENEM apoiam-se em erros de leitura das unidades do gráfico (ex.: confundir porcentagem com valor absoluto, inverter a linha de temperatura com as barras de chuva, ou não notar a escala do mapa).",
      dica: "Regra de ouro no ENEM: leia primeiro o TÍTULO, a FONTE/ANO, a LEGENDA e as UNIDADES DOS EIXOS."
    }
  ];

  return `<h1 class="a">⚠️ As 9 Pegadinhas Mais Clássicas do ENEM</h1>
  <p class="a mu">Revise as confusões conceituais que o Inep mais utiliza para construir os distratores da prova de Ciências Humanas:</p>
  <div class="a" style="--i:1;margin-top:16px">
    ${pegadinhas.map((p, idx)=>`
      <div class="err-card">
        <span class="err-badge" style="background:color-mix(in srgb,var(--er) 15%,transparent);color:var(--er)">Pegadinha #${idx+1}</span>
        <h3>${p.t}</h3>
        <p style="margin:4px 0 8px;font-size:13.5px"><b>❌ O erro comum:</b> <span class="mu">${p.errado}</span></p>
        <p style="margin:4px 0 8px;font-size:13.5px"><b>✔️ O correto na Geografia:</b> ${p.certo}</p>
        <div class="dc" style="margin-top:8px;font-size:13px"><b>💡 Macete ENEM:</b> ${p.dica}</div>
      </div>
    `).join("")}
  </div>`;
}

function vSt(){
  let A=0,E=0;Object.values(S.res).forEach(r=>{A+=r.a;E+=r.e});
  const T=A+E,
  cs=[
    ["✅",doneN()+"/"+FLAT.length,"assuntos concluídos"],
    ["🎯",T?Math.round(100*A/T)+"%":"—","taxa de acerto"],
    ["✔",A,"questões corretas"],
    ["✘",E,"questões erradas"],
    ["⏱",fmt(S.t),"tempo de estudo"],
    ["📝",S.sims.length,"simulados realizados"]
  ];
  return`<h1 class="a">📊 Suas Estatísticas de Estudo</h1><div class="g3">${cs.map((c,k)=>`<div class="bx stat a" style="--i:${k}"><span>${c[0]}</span><b>${c[1]}</b><small>${c[2]}</small></div>`).join("")}</div><h2 class="a">Desempenho por Módulo Temático</h2><div class="bx a">${M.map((m,i)=>{const s=ms(i);return`<div class="mr"><span>${IC[i]} ${m.n}</span><div class="sb"><i class="g1" data-w="${s.t?100*s.a/s.t:0}"></i><i class="e1" data-w="${s.t?100*s.e/s.t:0}"></i></div><small>${s.t?`${s.a} certas · ${s.e} erradas (${s.p}%)`:"—"}</small></div>`}).join("")}</div><h2 class="a">Histórico de Simulados Realizados</h2>${S.sims.length?`<div class="bx a">${S.sims.map(x=>`<div class="mr2"><span>${new Date(x.d).toLocaleDateString("pt-BR")} · ${x.t}</span><b>${x.s}/${x.n} (${Math.round(100*x.s/x.n)}%)</b><small>${fmt(x.sec)}</small></div>`).join("")}</div>`:`<p class="mu">Nenhum simulado finalizado ainda. Teste seus conhecimentos na aba Simulado!</p>`}<div class="row" style="margin-top:16px"><button class="bt gh" onclick="rst()">Zerar histórico e estatísticas</button></div>`;
}

function rst(){
  if(confirm("Deseja zerar estatísticas, acertos, erros e histórico de simulados? Seus temas concluídos e favoritos serão preservados.")){
    S.res={};S.wrong={};S.sims=[];S.t=0;sv();render();
  }
}

function vRv(){
  const l=uniq(FLAT).filter(x=>S.wrong[x.n]);
  return`<h1 class="a">🔁 Caderno de Erros</h1>`+(l.length?`<p class="a mu">Aqui estão as questões que você errou recentemente. Acertá-las retira automaticamente da lista de pendências:</p><div class="row a"><button class="bt" onclick="startRev()">▶ Refazer as ${l.length} questões com erro</button></div>`+l.map(row).join(""):`<div class="bx empty a">🎉<p>Nenhum erro pendente! Você acertou todas as questões praticadas até o momento.</p><a class="bt" href="#/sim">Iniciar novo simulado</a></div>`);
}

function vFv(){
  const l=FLAT.filter(x=>S.fav[x.i+"."+x.j]);
  return`<h1 class="a">⭐ Assuntos Favoritos</h1>`+(l.length?`<p class="a mu">Temas marcados com estrela para revisão prioritária antes da prova:</p>`+l.map(row).join(""):`<div class="bx empty a">⭐<p>Nenhum assunto favoritado. Toque na estrela de qualquer assunto para guardá-lo aqui.</p><a class="bt" href="#/">Explorar módulos</a></div>`);
}

function render(){
  const p=location.hash.replace(/^#\/?/,"").split("/"),v=p[0];
  view=v;st.q=null;let o;
  if(v=="m") o=vMod(+p[1]);
  else if(v=="s"){cur={i:+p[1],j:+p[2]};o=vSub(cur.i,cur.j)}
  else if(v=="sim") o=vSim();
  else if(v=="q") o=vQ();
  else if(v=="fc") o=vFc(p[1]);
  else if(v=="map") o=vMap();
  else if(v=="gl") o=vGl();
  else if(v=="err") o=vErr();
  else if(v=="st") o=vSt();
  else if(v=="rv") o=vRv();
  else if(v=="fv") o=vFv();
  else{view="";o=vHome()}

  if(o==null)return;
  q("#app").innerHTML=o;
  bars();
  const act=["m","s",""].includes(view)?"":view=="q"?"sim":view;
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r==act));
  scrollTo(0,0);
}

function th(){
  const d=document.documentElement,
  dark=d.dataset.theme?d.dataset.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  S.theme=dark?"light":"dark";
  d.dataset.theme=S.theme;
  sv();
}
if(S.theme)document.documentElement.dataset.theme=S.theme;

const tick=()=>{
  const e=q("#tm");
  if(e)e.textContent=(run?"⏸ ":"⏱ ")+fmt(S.t);
  const t=q("#qt");
  if(t&&Q&&Q.k<Q.list.length)t.textContent="⏱ "+fmt(Math.floor((Date.now()-Q.t0)/1000));
};

function tmT(){run=!run;tick()}
setInterval(()=>{if(run){S.t++;if(S.t%5==0)sv()}tick()},1000);

addEventListener("keydown",e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){
    if(e.key=="Escape")e.target.blur();
    return;
  }
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(k=="/"){
    const s=q("#sq")||q("#gq");
    if(s){e.preventDefault();s.focus()}
    return;
  }
  const oi=k.length==1&&"abcde".includes(k.toLowerCase())?"abcde".indexOf(k.toLowerCase()):"12345".indexOf(k);
  if((view=="s"||view=="q")&&oi>=0&&k.length==1){pick(oi);return}
  if(k=="ArrowRight"){
    if(view=="s")navS(1);
    else if(view=="q"&&Q&&Q.sel!=null)nextQ();
    else if(view=="fc")fcGo(1);
  } else if(k=="ArrowLeft"){
    if(view=="s")navS(-1);
    else if(view=="fc")fcGo(-1);
  } else if(k==" "&&view=="fc"){
    e.preventDefault();flipFc();
  } else if(k=="Enter"&&view=="q"&&Q&&Q.sel!=null){
    nextQ();
  } else if(k=="Escape"&&view!=""){
    go("");
  }
});

addEventListener("pagehide",sv);
addEventListener("hashchange",render);
render();
tick();
</script>
</body>
</html>
