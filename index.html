  "El Niño, La Niña e anomalias térmicas": [
    "O El Niño e a La Niña compõem a fase oceânica e atmosférica do fenômeno acoplado ENOS (El Niño - Oscilação Sul). Em condições normais, os ventos alísios sopram de leste para oeste na bacia do Pacífico, acumulando águas aquecidas na costa asiática/oceania e permitindo a ressurgência de águas frias profundas ricas em nutrientes na costa do Peru e Chile. No El Niño, ocorre o enfraquecimento anormal dos ventos alísios, provocando o aquecimento anômalo das águas superficiais do Pacífico Equatorial Leste. No Brasil, o El Niño gera secas severas nas regiões Norte e Nordeste e chuvas volumosas e enchentes catastróficas na Região Sul. Já a La Niña é o fenômeno inverso: fortalecimento dos ventos alísios e resfriamento anômalo das águas do Pacífico Equatorial, gerando estiagem no Sul e chuvas abundantes no semiárido nordestino e na Amazônia.",
    [
      "El Niño: enfraquecimento dos alísios ➔ águas do Pacífico Leste aquecidas ➔ seca no Norte/Nordeste e enchentes no Sul do Brasil",
      "La Niña: fortalecimento dos alísios ➔ águas do Pacífico resfriadas ➔ chuvas fortes no Norte/Nordeste e seca no Sul do Brasil",
      "Ressurgência: subida de águas frias e ricas em nutrientes (favorece cardumes pesqueiros no Peru/Chile)",
      "Eventos extremos: perda de safras agrícolas e sobrecarga em reservatórios hidrelétricos"
    ],
    "Memorize o impacto cruzado do El Niño no Brasil: ELEVA chuvas no Sul e DERRUBA chuvas no Norte/Nordeste. Na La Niña, ocorre rigorosamente o inverso.",
    "Em determinados anos, agricultores da bacia do Rio Uruguai, na Região Sul do Brasil, registram perdas severas de plantios de arroz por inundação contínua de várzeas, enquanto produtores familiares do Semiárido nordestino e ribeirinhos da Amazônia sofrem com secas severas históricas, rios navegáveis secando e risco de desabastecimento hídrico.",
    "O fenômeno climático de grande escala responsável pela ocorrência simultânea dos dois cenários opostos relatados é o:",
    [
      "início da glaciação permanente no manto de gelo da Groenlândia.",
      "bloqueio perpétuo de todas as massas de ar marítimas pela Cordilheira do Himalaia.",
      "avanço do anticiclone glacial do Ártico sobre a Bacia do Prata.",
      "El Niño, associado ao aquecimento anômalo das águas do Oceano Pacífico Equatorial.",
      "La Niña, caracterizada pelo aquecimento exclusivo das correntes marítimas do Atlântico Sul."
    ],
    3,
    "Alternativa correta: D. o El Niño consiste no aquecimento anômalo das águas superficiais do Pacífico Equatorial, alterando a circulação de Walker e a corrente de jato polar; no território brasileiro, isso bloqueia frentes frias no Sul (provocando chuvas torrenciais e inundações) e inibe a formação de nuvens convectivas no Norte e Nordeste (provocando secas agudas). A alternativa A e a C citam fenômenos árticos sem relação com as secas no Nordeste e chuvas no Sul. A D é descabida geograficamente. A E define incorretamente a La Niña (que é o resfriamento do Pacífico, e não aquecimento do Atlântico)."
  ],
  "Circulação geral da atmosfera e ventos": [
    "A circulação geral da atmosfera é o sistema de transporte global de calor gerado pelo desequilíbrio térmico entre a região equatorial (que recebe mais radiação solar incidente por unidade de área) e as regiões polares. Esse gradiente gera três grandes células convectivas em cada hemisfério: Célula de Hadley (entre o Equador e os 30° de latitude), Célula de Ferrel (latitudes médias) e Célula Polar. Na zona de baixa pressão do Equador (Doldrums ou Zona de Convergência Intertropical - ZCIT), o ar quente e úmido ascende, esfria e precipita; nos 30° de latitude norte e sul (cinturão de alta pressão subtropical), o ar seco desce (subsidência), inibindo a formação de nuvens e gerando os grandes desertos mundiais (como o Saara, Atacama e Kalahari). Os ventos alísios sopram das altas pressões subtropicais em direção à baixa pressão equatorial, desviados para oeste pela Força de Coriolis gerada pela rotação da Terra.",
    [
      "ZCIT: Zona de Convergência Intertropical (área de baixa pressão equatorial onde convergem os ventos alísios)",
      "Alísios: ventos constantes que sopram dos trópicos (alta pressão) para o Equador (baixa pressão)",
      "Força de Coriolis: desvia ventos para a direita no Hemisfério Norte e para a esquerda no Hemisfério Sul",
      "Desertos subtropicais (30° N/S): formados pela subsidência (ar seco que desce) da Célula de Hadley"
    ],
    "Regra básica de climatologia física: o ar SEMPRE sopra de centros de Alta Pressão (dispersores de ventos, anticiclones) para centros de Baixa Pressão (receptores de ventos, ciclones).",
    "A Zona de Convergência Intertropical (ZCIT) é um dos mais determinantes sistemas meteorológicos que atuam nas baixas latitudes terrestres, oscilando sazonalmente ao norte e ao sul da linha do Equador geográfico e influenciando diretamente a quadra chuvosa do semiárido setentrional brasileiro.",
    "A dinâmica atmosférica fundamental responsável pela gênese e funcionamento contínuo da ZCIT baseia-se na:",
    [
      "estagnação perpétua de ventos contra-alísios descendentes que provocam seca total ao longo da foz do Rio Amazonas.",
      "descida contínua de massas de ar polar estratosféricas que expulsam o vapor d'água da Amazônia para os polos.",
      "convergência dos ventos alísios de nordeste e sudeste em direção a uma faixa equatorial de baixas pressões térmicas, gerando forte ascendência do ar úmido.",
      "atração gravitacional exclusiva exercida pela Lua durante as marés de quadratura no oceano Índico.",
      "dispersão de ventos divergentes gerados em um centro anticiclônico permanente instalado sobre o Círculo Polar Ártico."
    ],
    2,
    "Alternativa correta: C. a ZCIT resulta da confluência dos ventos alísios originários dos hemisférios Norte e Sul que convergem para a faixa equatorial de baixa pressão (cavado barométrico); ao se encontrarem, o ar quente e repleto de umidade ascende vigorosamente em células de convecção, condensando-se e gerando cinturões contínuos de nuvens de grande desenvolvimento vertical e chuvas volumosas. As alternativas B, C, D e E contêm formulações fisicamente falsas, confusas ou geograficamente disparatadas."
  ],
  "Domínio Amazônico e floresta equatorial": [
    "O Domínio Amazônico, classificado por Aziz Ab'Sáber como o domínio das terras baixas florestadas equatoriais, é o maior do Brasil e abriga a mais densa bacia hidrográfica do mundo. A floresta amazônica é latifoliada (folhas largas), perenifólia (sempre verde), densa, heterogênea e estratificada em três patamares clássicos: mata de igapó (permanentemente inundada, rica em vitórias-régias), mata de várzea (periodicamente inundada nas cheias) e mata de terra firme (a mais extensa, nunca inundada, com castanheiras e seringueiras gigantes). Ao contrário do senso comum, os solos amazônicos são, em sua imensa maioria, profundos, lixiviados, ácidos e quimicamente pobres; a exuberância da floresta é sustentada por um ciclo fechado de ciclagem de nutrientes provido pela serrapilheira (camada de folhas, frutos e matéria orgânica decomposta por fungos e bactérias).",
    [
      "Estratificação: igapó (alagada constante), várzea (inundação periódica), terra firme (nunca inunda)",
      "Solo pobre e lixiviado: a fertilidade da floresta depende da reciclagem da serrapilheira superficial",
      "Latifoliada e perenifólia: folhas largas e perenes que garantem intensa evapotranspiração",
      "Biodiversidade genética: maior patrimônio biológico e biotecnológico do planeta"
    ],
    "Cuidado com a pegadinha do solo: o solo amazônico NÃO é rico nem fértil! Ele é quimicamente pobre e arenoso/argiloso lixiviado; retirar a floresta sem técnicas adequadas gera empobrecimento imediato do solo.",
    "<svg viewBox='0 0 320 160' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='160' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Estratificação da Vegetação Amazônica</text><path d='M20 140 L 90 140 L 140 120 L 220 90 L 300 80' fill='none' stroke='#5B6785' stroke-width='2'/><rect x='20' y='130' width='80' height='20' fill='#2F5BFF' opacity='0.4'/><text x='25' y='145' font-size='9' fill='#1D3FC4' font-weight='700'>Rio Amazonas</text><rect x='100' y='125' width='4' height='15' fill='#2E7D32'/><circle cx='102' cy='122' r='8' fill='#2E7D32'/><text x='75' y='110' font-size='8' fill='var(--tx)'>Igapó</text><rect x='150' y='105' width='5' height='25' fill='#2E7D32'/><circle cx='152' cy='100' r='12' fill='#2E7D32'/><text x='135' y='85' font-size='8' fill='var(--tx)'>Várzea</text><rect x='240' y='65' width='8' height='45' fill='#1B5E20'/><circle cx='244' cy='55' r='22' fill='#1B5E20'/><text x='215' y='28' font-size='9' font-weight='700' fill='#1B5E20'>Mata de Terra Firme (~80%)</text></svg>Ao sobrevoar a Bacia Amazônica, pesquisadores observam que a retirada completa da cobertura arbórea de grande porte para implantação de pastagens extensivas resulta, em poucos anos, na compactação do solo e na redução abrupta dos teores de matéria orgânica superficial.",
    "A rápida degradação do solo após o desmatamento da floresta equatorial amazônica decorre do fato de que:",
    [
      "a fertilidade do solo independe da cobertura florestal, sendo mantida por rochas vulcânicas de formação recente.",
      "o relevo amazônico é formado por cordilheiras pontiagudas de alta declividade que aceleram avalanches de rochas.",
      "as raízes da mata de igapó retiravam todo o nitrogênio da atmosfera, tornando a terra estéril na presença do gado.",
      "as chuvas equatoriais cessam completamente assim que as primeiras árvores são derrubadas na bacia.",
      "o equilíbrio ecológico depende da ciclagem contínua de nutrientes da serrapilheira mantida pelas árvores nativas."
    ],
    4,
    "Alternativa correta: E. os solos amazônicos são predominantemente intemperizados, ácidos e pobres em nutrientes minerais solúveis; o sustento da densa biomassa florestal provém da ciclagem quase fechada de nutrientes proporcionada pela decomposição da serrapilheira (folhas, galhos e matéria orgânica superficial). A alternativa A erra porque o solo é antigo e não vulcânico recente. A C traz uma afirmação biológica falsa. A D exagera, pois as chuvas não cessam instantaneamente. A E descreve relevo alpino, oposto ao relevo de terras baixas, platôs e depressões da Amazônia."
  ],
  "Domínio do Cerrado e savanas tropicais": [
    "O Cerrado é o segundo maior bioma da América do Sul e a savana de maior biodiversidade do planeta, conhecido como a 'caixa-d'água do Brasil' por abrigar as nascentes de oito das doze grandes bacias hidrográficas nacionais (como São Francisco, Tocantins-Araguaia e Paraná). Sua vegetação exibe árvores com troncos e galhos tortuosos, casca grossa suberosa e folhas coriáceas, associadas a um sistema radicular profundo (as 'florestas invertidas') que permite alcançar lençóis freáticos profundos durante a seca de inverno. O aspecto tortuoso decorre da acidez do solo e da elevada toxicidade de alumínio (Al³⁺). O bioma sofre com o fogo periódico (ao qual é adaptado, mas que se torna destrutivo quando antrópico descontrolado) e é atualmente a área mais pressionada pelo agronegócio de grãos e cana no Brasil, com mais da metade de sua cobertura original já desmatada.",
    [
      "Caixa-d'água do Brasil: abriga nascentes de 8 das 12 bacias hidrográficas nacionais",
      "Solos: profundos, ácidos, pobres em nutrientes e com toxicidade por alumínio (corrigidos por calagem)",
      "Adaptações pirofíticas: casca grossa de cortiça (súber), gemas protegidas e raízes pivotantes profundas",
      "Biodiversidade e pressão: hotspot mundial de conservação ameaçado pelo Matopiba"
    ],
    "Para o ENEM: as raízes profundas do Cerrado funcionam como esponjas que absorvem a água das chuvas de verão e abastecem os lençóis freáticos que alimentam os rios brasileiros na estação seca.",
    "O bioma Cerrado é reconhecido internacionalmente como um dos hotspots mundiais da biodiversidade devido à extraordinária concentração de espécies vegetais endêmicas e ao altíssimo grau de devastação promovido pelo avanço da fronteira agrícola de commodities ao longo das últimas décadas.",
    "A característica morfofisiológica da flora nativa do Cerrado que viabiliza a sobrevivência das espécies lenhosas durante a rigorosa estiagem de inverno consiste na presença de:",
    [
      "folhas aciculadas em formato de agulhas carnívoras que absorvem orvalho superficial.",
      "raízes tubulares aéreas respiratórias (pneumatóforos) adaptadas à hipóxia salobra.",
      "bulbos subterrâneos que entram em combustão espontânea no período de chuvas fortes.",
      "troncos repletos de espinhos hidrofílicos com tecidos de reserva esponjosa salina.",
      "cascas grossas de súber isolante e raízes pivotantes profundas capazes de alcançar o lençol freático."

    4,
    "Alternativa correta: E. a vegetação do Cerrado apresenta adaptações morfológicas xeromórficas e pirofíticas, destacando-se as cascas espessas de súber (que protegem os tecidos vitais do calor do fogo) e raízes muito profundas que acessam a água do lençol subterrâneo mesmo nos meses de inverno seco. A alternativa A descreve coníferas polares. A B descreve manguezais litorâneos (pneumatóforos). A D e a E trazem caraterísticas de cactáceas ou formulações fantasiosas."
  ],
  "Domínio da Caatinga e semiárido": [
    "A Caatinga ('mata branca' em tupi) é o único bioma com ocorrência 100% restrita ao território brasileiro, desenvolvendo-se sob o clima semiárido com chuvas escassas e concentradas em poucos meses e acentuado déficit hídrico anual. A vegetação é adaptada à aridez extrema (xeromorfismo): perde as folhas durante a estiagem prolongada (caducifólia) para reduzir a perda de água por transpiração, apresenta espinhos no lugar de folhas (cactáceas como mandacaru, xique-xique e facheiro) e raízes com órgãos de reserva subterrânea (tuberófilas). Os solos do sertão da Caatinga são predominantemente rasos, pedregosos e pouco desenvolvidos (litólicos), porém ricos em minerais básicos não lixiviados; quando irrigados com técnica agronômica apropriada (como no Polo Frutícola de Petrolina/PE e Juazeiro/BA), revelam altíssima produtividade agrícola, embora o manejo descuidado possa provocar salinização do solo.",
    [
      "Exclusivamente brasileiro: não ocorre em nenhum outro país do planeta",
      "Xeromorfismo: folhas caducas (caducifólias), espinhos e caules suculentos acumuladores de água",
      "Solos rasos e pedregosos: intemperismo químico fraco pelo clima seco; solos ricos em minerais, mas vulneráveis à salinização",
      "Transposição do São Francisco: obras hídricas para levar água perene a açudes e bacias secas do Setentrião"
    ],
    "Memorize: os solos da Caatinga NÃO são quimicamente estéreis; como chove pouco, os minerais não foram lavados pela água (pouca lixiviação). O fator limitante da Caatinga é a falta de água (déficit hídrico), e não a fertilidade mineral do solo.",
    "No Vale do Submédio São Francisco, a implantação de canais de transposição e redes de irrigação por gotejamento transformou áreas do sertão semiárido em polos mundiais de exportação de uvas finas de mesa e mangas, dinamizando o mercado de trabalho em cidades como Juazeiro (BA) e Petrolina (PE).",
    "A viabilidade da agricultura intensiva de alta produtividade nas áreas irrigadas da Caatinga deve-se ao fato de que os solos sertanejos:",
    [
      "possuem camadas de turfa vegetal espessa e úmida formadas por antigas glaciações equatoriais.",
      "apresentam fertilidade mineral natural preservada pela baixa lixiviação pluvial, dependendo apenas do suprimento de água.",
      "são compostos exclusivamente de areias eólicas que filtram a água salgada tornando-a potável.",
      "apresentam acidez crônica superior à do Cerrado, dispensando qualquer adubação mineral.",
      "derivam da decomposição instantânea de corais marinhos fósseis depositados no Holoceno."

    "Alternativa correta: B. sob o clima semiárido, o intemperismo químico e a lixiviação são lentos devido à escassez de água líquida; dessa forma, os nutrientes minerais (cálcio, magnésio, potássio) permanecem retidos no solo. Ao receber irrigação controlada e insumos, a terra torna-se altamente produtiva. A alternativa B é descabida (não houve glaciação recente no semiárido). A C confunde solos pedregosos com dunas dessalinizadoras. A D e a E contêm assertivas quimicamente incorretas e fictícias."
  ],
  "Domínio dos Mares de Morros e Mata Atlântica": [
    "O Domínio dos Mares de Morros abrange a faixa litorânea oriental do Brasil, estendendo-se do Rio Grande do Norte ao Rio Grande do Sul sobre os planaltos e serras do Atlântico Leste-Sudeste. Sua geomorfologia é caracterizada pelo relevo mamelonar ou de 'meia-laranja' (morros convexos esculpidos por intenso intemperismo químico sob clima tropical úmido ao longo de milhões de anos). Originalmente recoberto pela exuberante e megadiversa Mata Atlântica, foi o bioma historicamente mais devastado pela ocupação territorial brasileira (ciclos da cana, pau-brasil, ouro, café e pela intensa urbanização e industrialização do litoral). Hoje restam menos de 12% de sua cobertura florestal original, em fragmentos protegidos por unidades de conservação. Em períodos de chuvas torrenciais concentradas no verão, as encostas íngremes sofrem movimentos de massa catastróficos (deslizamentos de terra e corridas de lama).",
    [
      "Mares de Morros: relevo mamelonar (colinas arredondadas em 'meia-laranja')",
      "Intemperismo químico: água da chuva decompõe rochas cristalinas, gerando solos profundos (latossolos)",
      "Mata Atlântica: hotspot de biodiversidade reduzido a fragmentos florestais isolados",
      "Movimentos de massa: desmatamento de encostas e ocupação desordenada geram deslizamentos fatais no verão"
    ],
    "Movimento de massa (deslizamento de encosta) no litoral sudeste é agravado pela ação antrópica: a retirada da mata atlântica remove a barreira de retenção mecânica das raízes e o peso de construções sobrecarrega o talude encharcado de água.",
    "Nos verões chuvosos da Região Sudeste, telejornais noticiam tragédias recorrentes na Serra do Mar e em regiões serranas (como Petrópolis e Nova Friburgo), onde chuvas orográficas concentradas provocam deslizamentos generalizados de encostas com soterramento de residências construídas em áreas de risco.",
    "A vulnerabilidade geomorfológica a movimentos de massa catastróficos no domínio dos Mares de Morros decorre da interação entre:",
    [
      "a ausência total de chuvas e a presença de dunas móveis no litoral arenoso.",
      "a colisão tectônica ativa entre placas continentais que provoca terremotos de magnitude 9 na escala Richter.",
      "o intemperismo físico provocado pelo congelamento diário de geleiras no topo das serras litorâneas.",
      "a alta declividade das encostas, a saturação hídrica do manto de intemperismo e a supressão da vegetação protetora.",
      "a impermeabilização do solo por mantas asfálticas construídas em topos de picos desabitados."
    ],
    3,
    "Alternativa correta: D. a combinação de relevo acidentado com escarpas declivosas, solos profundos (manto de intemperismo) que se tornam pesados e instáveis quando encharcados por chuvas volumosas, somada à remoção da vegetação nativa e à ocupação humana irregular, deflagra escorregamentos de terra catastróficos. A alternativa A erra porque o domínio é marcado por chuvas torrenciais. A C fala em geleiras ativas na Serra do Mar, o que inexiste no Brasil tropical. A D cita abalos tectônicos de alta magnitude inexistentes no país. A E traz causa irreal."
  ],
  "Pantanal e Pradarias (Pampa)": [
    "O Pantanal é a maior planície de inundação contínua de água doce do planeta, situado no Centro-Oeste (Mato Grosso e Mato Grosso do Sul) e drenado pela Bacia do Alto Paraguai. É um complexo mosaico ecológico que congrega elementos da Amazônia, Cerrado e Chaco. Seu ciclo biológico e econômico é regido pelas cheias sazonais: no verão chuvoso, o relevo plano e a baixa declividade retêm as águas dos rios, inundando até 80% do território; no inverno seco, a água recua, deixando solos fertilizados por sedimentos onde floresce a pecuária bovina extensiva tradicional. O Pantanal sofre gravemente com queimadas descontroladas no inverno seco e com o assoreamento de rios provocado pelo agronegócio nos planaltos circundantes. O Pampa (Pradarias ou Campos Sulinos), no Rio Grande do Sul, caracteriza-se pelo relevo plano a ondulado (coxilhas) recoberto por gramíneas rasteiras, historicamente utilizado para pecuária e ameaçado pelo sobrepastoreio, expansão da soja e formação de areais.",
    [
      "Pantanal: maior planície de inundação contínua da Terra (Bacia do Rio Paraguai)",
      "Ciclo das águas pantaneiras: cheias no verão (inundações) e vazante no inverno",
      "Assoreamento das nascentes: lavouras de soja no planalto jogam terra nos rios que deságuam na planície pantaneira",
      "Pampa / Pradarias: relevo de coxilhas recobertas por gramíneas no RS; ameaçado pela arenização e pela monocultura"
    ],
    "Para o ENEM, entenda a relação planalto-planície no Pantanal: as nascentes dos rios estão nos planaltos que cercam o Pantanal. O desmatamento para soja no planalto provoca erosão e a lama desce, assoreando os rios e secando lagoas na planície pantaneira.",
    "O Rio Taquari, importante afluente da Bacia do Paraguai no Pantanal, sofreu drásticas alterações morfológicas e hidrológicas ao longo das últimas décadas, com o surgimento de extensos bancos de areia no leito do rio (assoreamento) e o rompimento permanente de diques marginais (arrombados), inundando de forma desordenada milhares de hectares de pastagens tradicionais.",
    "A causa geográfica primária do grave processo de degradação hidrológica verificado no Pantanal mato-grossense está relacionada à:",
    [
      "construção de quebra-mares de concreto armado na orla costeira do estuário do Rio da Prata.",
      "substituição das gramíneas nativas por florestas equatoriais fechadas nas margens do pantanal.",
      "secagem artificial de todas as nascentes por bombeamento de água para desertos da Patagônia.",
      "erosão acelerada dos solos nos planaltos circundantes provocada pelo desmatamento para monoculturas de grãos.",
      "ativação de falhas geológicas sísmicas que afundaram o assoalho sedimentar do Chaco em 500 metros."
    ],
    3,
    "Alternativa correta: D. o Pantanal é uma planície deprimida cercada por planaltos (chapadões); a ocupação agropecuária intensiva desses planaltos sem práticas de conservação do solo causou intensa erosão pluvial; a terra arrastada pelas enxurradas foi transportada para a planície, assoreando a calha dos rios pantaneiros como o Taquari. As alternativas A, C, D e E trazem hipóteses geográficas absurdas e incoerentes com a geomorfologia do Centro-Oeste."
  ],
  "Domínios morfoclimáticos de Aziz Ab'Sáber": [
    "O geógrafo Aziz Nacib Ab'Sáber formulou a clássica classificação dos 'Domínios Morfoclimáticos e Fitogeográficos do Brasil', definidos como unidades espaciais de escala regional em que há uma interação integrada e harmônica entre feições de relevo, tipos de solo, redes de drenagem, condições climáticas e biomas vegetais. Ab'Sáber delimitou seis grandes domínios no território brasileiro: 1) Domínio Amazônico (terras baixas florestadas equatoriais); 2) Domínio do Cerrado (chapadões centrais com savanas e verões chuvosos); 3) Domínio dos Mares de Morros (áreas mamelonares tropicais atlânticas); 4) Domínio da Caatinga (depressões interplanálticas semiáridas sertanejas); 5) Domínio das Araucárias (planaltos subtropicais com pinheiros no Sul); 6) Domínio das Pradarias (coxilhas onduladas com campos limpos no Pampa gaúcho). Entre esses seis domínios núcleos, estendem-se as 'Faixas de Transição' (ecótonos complexos como o Pantanal, a Mata dos Cocais e o Agreste).",
    [
      "Domínio morfoclimático: síntese dinâmica entre relevo, clima, vegetação, solo e hidrografia (conceito mais amplo que bioma)",
      "6 domínios de Ab'Sáber: Amazônico, Cerrado, Mares de Morros, Caatinga, Araucárias e Pradarias",
      "Faixas de transição: áreas de contato e ecótonos com espécies de múltiplos domínios (ex.: Pantanal e Mata dos Cocais)",
      "Domínio das Araucárias: relevo de planalto, clima subtropical de altitude e Mata dos Pinhais (ameaçada pela extração de madeira)"
    ],
    "Diferença conceitual mandatória: Bioma é um conceito eminentemente biológico e ecológico (conjunto de vida vegetal e animal com fisionomia homogênea). Domínio Morfoclimático é um conceito geográfico que integra o relevo, o solo e o clima à vegetação.",
    "Na clássica obra 'Os Domínios de Natureza no Brasil', Aziz Ab'Sáber destaca que os limites entre os domínios paisagísticos não são linhas estáticas e abruptas no espaço, mas sim faixas de transição gradativas e ecótonos biogeográficos onde se entrecruzam características bióticas e climáticas de dois ou mais sistemas adjacentes.",
    "Representa um exemplo típico de faixa de transição ecotonal no território brasileiro a região da:",
    [
      "floresta boreal de taiga instalada nos topos congelados do Parque Nacional do Itatiaia.",
      "planície abissal oceânica situada a leste da cadeia montanhosa da Dorsal Mesoatlântica.",
      "Mata dos Cocais, com predomínio de palmeiras de babaçu e carnaúba entre o Domínio Amazônico e a Caatinga.",
      "Mata de Igapó perenemente submersa na foz do Rio Solimões em Tabatinga.",
      "savana estépica congelada de tundra subpolar dominante no norte do Paraná."
    ],
    2,
    "Alternativa correta: C. a Mata dos Cocais (no Maranhão, Piauí e norte do Tocantins) é uma clássica faixa de transição que interliga as características úmidas da floresta amazônica com as feições semiáridas da Caatinga, caracterizada pela presença abundante de palmeiras extrativistas de grande porte como o babaçu e a carnaúba. As alternativas B, C e E citam formações inexistentes no Brasil tropical (tundra, taiga boreal e relevos submarinos oceânicos). A D cita um estrato intrazonal de um único domínio, e não uma faixa de transição entre domínios distintos."
  ],
  "Tectônica de placas e agentes internos": [
    "A dinâmica da litosfera é regida pela Tectônica de Placas, impulsionada pelas correntes de convecção térmica que circulam no manto terrestre (astenosfera). As bordas de placas litosféricas podem ser: 1) Convergentes (colisão ou subducção): geram dobramentos modernos (como a Cordilheira dos Andes e o Himalaia), fossas oceânicas, vulcanismo ativo e terremotos de alta intensidade; 2) Divergentes (afastamento): formam dorsais meso-oceânicas e assoalho oceânico por efusão basáltica (como a Dorsal Mesoatlântica); 3) Transformantes (deslizamento lateral conservativo): falhas geológicas ativas (como a Falha de San Andreas, na Califórnia). Os agentes internos (ou endógenos) do relevo são o tectonismo (epirogênese e orogênese), o vulcanismo e os abalos sísmicos, responsáveis pela criação das formas estruturais primárias da crosta.",
    [
      "Agentes internos (endógenos): tectonismo, vulcanismo e abalos sísmicos (criadores do relevo)",
      "Bordas convergentes: dobramentos modernos (Andes, Himalaia) e subducção de placas",
      "Bordas divergentes: dorsais oceânicas e expansão do fundo do mar",
      "Brasil no interior da Placa Sul-Americana: estabilidade tectônica relativa, ausência de vulcanismo ativo e ausência de dobramentos modernos"
    ],
    "Por que o Brasil não tem terremotos catastróficos nem vulcões ativos? Porque o território brasileiro situa-se inteiramente no centro estável da Placa Tectônica Sul-Americana, longe das zonas de contato e colisão de bordas.",
    "<svg viewBox='0 0 320 160' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='160' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Tectônica de Placas na América do Sul</text><rect x='20' y='65' width='90' height='40' fill='#2F5BFF' rx='4'/><text x='25' y='88' font-size='10' font-weight='700' fill='#fff'>Placa de Nazca ➔</text><rect x='150' y='55' width='150' height='60' fill='#2E7D32' rx='4'/><text x='170' y='75' font-size='10' font-weight='700' fill='#fff'>Placa Sul-Americana ➔ Brasil</text><path d='M110 95 L 145 130' stroke='#D12D20' stroke-width='4'/><text x='105' y='145' font-size='9' fill='#D12D20' font-weight='700'>Subducção / Fossa</text><path d='M145 55 L 160 35 L 175 55' fill='#5B6785'/><text x='138' y='30' font-size='9' font-weight='700' fill='var(--tx)'>Andes</text><text x='200' y='98' font-size='9' fill='#fff'>Centro Estável (Sem Vulcões)</text></svg>A costa oeste da América do Sul (como Chile e Peru) sofre com terremotos frequentes e violentos e abriga dezenas de vulcões ativos ao longo dos Andes, enquanto o território continental brasileiro é caracterizado por abalos sísmicos de baixa magnitude e pela total ausência de vulcanismo ativo na era geológica recente.",
    "A estabilidade geológica e a inexistência de vulcões ativos no território brasileiro contemporâneo justificam-se geograficamente porque o país:",
    [
      "apresenta rochas jovens formadas exclusivamente na Era Cenozoica recente.",
      "encontra-se assentado no centro estável da Placa Tectônica Sul-Americana, afastado das margens ativas de colisão.",
      "situa-se em uma zona de divergência tectônica profunda onde se abrem fossas oceânicas abissais.",
      "possui escudo cristalino inteiramente recoberto por geleiras permanentes que resfriam o magma.",
      "está localizado exatamente sobre a fossa tectônica que divide o planeta em hemisfério Norte e Sul."
    ],
    1,
    "Alternativa correta: B. o Brasil está localizado na porção central da Placa Sul-Americana; os tremores de alta magnitude e o vulcanismo ativo concentram-se nas bordas da placa (a oeste, na zona de subducção da Placa de Nazca sob os Andes; e a leste, na Dorsal Mesoatlântica). A alternativa A erra porque as estruturas geológicas brasileiras são antiquíssimas (Arqueano e Proterozoico). A C erra a localização das zonas de divergência oceânica. A D e a E trazem proposições absurdas."
  ],
  "Estrutura geológica e escudos cristalinos": [
    "A crosta terrestre brasileira é formada por duas grandes províncias geológicas: 1) Escudos Cristalinos (ou Crátons): terrenos muito antigos consolidados nas eras Pré-Cambriana (Arqueozoico e Proterozoico), ocupando cerca de 36% do país; são compostos por rochas ígneas e metamórficas resistentes (como granitos e gnaisses) e abrigam as ricas reservas minerais metálicas nacionais (minério de ferro, manganês, ouro, bauxita, cobre e níquel, encontrados no Quadrilátero Ferrífero/MG e na Província Mineral de Carajás/PA); 2) Bacias Sedimentares: cobrem aproximadamente 64% do território, formadas pelo acúmulo contínuo de sedimentos nas eras Paleozoica, Mesozoica e Cenozoica; nelas ocorrem os combustíveis fósseis (petróleo e gás natural na Bacia de Santos e Campos, e carvão mineral na Bacia do Paraná) e os grandes aquíferos de água subterrânea. O Brasil não possui dobramentos modernos da Era Cenozoica.",
    [
      "Escudos Cristalinos (~36%): rochas magmáticas/metamórficas antigas ➔ Minerais metálicos (ferro, manganês, ouro, bauxita)",
      "Bacias Sedimentares (~64%): rochas sedimentares estratificadas ➔ Combustíveis fósseis (petróleo, gás, carvão) e aquíferos",
      "Carajás (PA) e Quadrilátero Ferrífero (MG): maiores províncias de minério de ferro do país em terrenos proterozoicos",
      "Dobramentos modernos: INEXISTEM no Brasil (por isso não temos montanhas no sentido geomorfológico estrito)"
    ],
    "Associação direta indispensável para o ENEM: Minerais metálicos (ferro, cobre, bauxita) ➔ Escudos Cristalinos; Petróleo, gás, carvão e aquíferos ➔ Bacias Sedimentares.",
    "A empresa multinacional mineradora planeja expandir a lavra a céu aberto de hematita (minério de ferro de alto teor) e manganês para alimentar indústrias siderúrgicas e exportações portuárias em larga escala no estado do Pará e no estado de Minas Gerais.",
    "Para obter sucesso geológico na prospecção dos recursos minerais metálicos citados, os geólogos devem direcionar as sondagens exclusivamente para áreas de:",
    [
      "bacias sedimentares recentes quaternárias formadas por aluviões fluviais litorâneos.",
      "cordilheiras montanhosas vulcânicas de dobramentos modernos originadas no Terciário.",
      "fossas tectônicas ativas originadas pelo afastamento de placas no fundo do mar.",
      "depósitos de carvão mineral de origem vegetal fóssil da Era Cenozoica.",
      "escudos cristalinos pré-cambrianos ricos em rochas magmáticas e metamórficas antigas."
    ],
    4,
    "Alternativa correta: E. as jazidas de minerais metálicos (como ferro e manganês em Carajás e no Quadrilátero Ferrífero) formaram-se há bilhões de anos no Pré-Cambriano e estão geologicamente associadas aos escudos cristalinos (terrenos ígneos e metamórficos antigos). A alternativa A abriga areia e argila, sem minério de ferro primário. A C não ocorre no interior continental. A D abriga combustíveis fósseis, e não minérios metálicos. A E cita dobramentos modernos inexistentes no Brasil."
  ],
  "Agentes externos do relevo e intemperismo": [
    "Os agentes externos (ou exógenos) do relevo são os modeladores e escultores da paisagem superficial terrestre: atuam por meio da água (chuvas, rios, mares e geleiras), do vento e dos seres vivos. Esse processo envolve três etapas sucessivas: intemperismo (degradação e desagregação da rocha no local), erosão (desgaste associado ao transporte dos sedimentos) e sedimentação (deposição dos sedimentos nas partes mais baixas). O intemperismo divide-se em: 1) Intemperismo Químico (ou hidrólise): ação da água das chuvas que decompõe mineralogicamente a rocha, predominando em regiões tropicais quentes e úmidas, gerando mantos de intemperismo espessos e solos profundos (como latossolos); 2) Intemperismo Físico (ou mecânico): quebra mecânica da rocha por dilatação e contração térmica (termoclastia) ou congelamento (crioclastia), predominando em climas secos (áridos e semiáridos) e polares, onde a escassez de água líquida limita a decomposição química, gerando relevos pontiagudos e pedregosos (como inselbergs).",
    [
      "Intemperismo: desagregação in situ da rocha sem transporte de sedimentos",
      "Intemperismo Químico: prevalece em climas quentes e úmidos (chuva decompõe rochas e cria solos profundos)",
      "Intemperismo Físico: prevalece em climas secos ou frios (variação de temperatura fratura a rocha)",
      "Erosão: desgaste + transporte de sedimentos pela água, vento ou gravidade"
    ],
    "Não confunda intemperismo com erosão! Intemperismo é apenas a quebra/decomposição da rocha no local (in situ). Erosão só existe quando há transporte dos fragmentos (pela enxurrada, vento ou rio).",
    "Em uma expedição geomorfológica pelo Sertão da Paraíba (clima semiárido), cientistas fotografaram relevos residuais isolados de rochas cristalinas pontiagudas e pedregosas cercadas por solos rasos (inselbergs). Semanas depois, nas serras litorâneas do Rio de Janeiro (clima tropical úmido), a equipe constatou colinas suaves e arredondadas ('meia-laranja') recobertas por solo profundo e argiloso de mais de dez metros de espessura.",
    "A diferença morfológica e pedológica contrastante entre as duas paisagens brasileiras visitadas é explicada pelo fato de que:",
    [
      "no Rio de Janeiro inexiste ação das chuvas, razão pela qual as rochas se mantêm intactas e lisas.",
      "no Sertão semiárido predomina o intemperismo físico por amplitude térmica, enquanto no litoral úmido prevalece o intemperismo químico pela abundância de água.",
      "na Paraíba o solo profundo e fértil foi totalmente transportado para o Oceano Pacífico por erupções vulcânicas.",
      "os inselbergs sertanejos foram esculpidos exclusivamente por geleiras fluviais que derreteram no século XIX.",
      "a decomposição mineral das rochas independe das variáveis climáticas locais de temperatura e umidade."
    ],
    1,
    "Alternativa correta: B. a água é o principal agente do intemperismo químico; no litoral tropical úmido, as chuvas constantes decompõem quimicamente os minerais das rochas, arredondando as formas e originando solos espessos; já no semiárido, com chuvas escassas e forte insolação, domina a desagregação mecânica/física (termoclastia), preservando rochas pontiagudas e solos rasos e pedregosos. As alternativas B, C, D e E contêm afirmações contrárias às leis fundamentais da geomorfologia."
  ],
  "Solos, erosão e conservação do solo": [
    "O solo é o manto superficial da crosta resultante da alteração das rochas pelo intemperismo combinado à incorporação de matéria orgânica ao longo de milhares de anos (pedogênese). Um perfil de solo bem desenvolvido apresenta horizontes distintos: O (camada orgânica superficial de folhas e húmus), A (horizonte mineral rico em matéria orgânica), B (horizonte de acumulação de argila e minerais lixiviados) e C (rocha alterada sobre a rocha-mãe sã). No Brasil, predominam os latossolos (profundos, avermelhados/amarelados, bem drenados, porém naturalmente ácidos). A remoção da vegetação nativa deixa o solo exposto à erosão hídrica em fases: efeito splash (impacto da gota de chuva que desagrega partículas), erosão laminar (enxurrada que lava a camada superficial), sulcos, ravinas e voçorocas (grandes fendas que atingem o lençol freático). Técnicas de conservação incluem o terraceamento (degraus em encostas), curvas de nível, plantio direto na palha (sem arar a terra) e rotação de culturas.",
    [
      "Horizonte O e A: camadas superiores que concentram a fertilidade orgânica vital à agricultura",
      "Voçoroca: estágio avançado de erosão hídrica linear que atinge o lençol freático subterrâneo",
      "Curvas de nível e terraceamento: barram a velocidade da enxurrada e favorecem a infiltração da água em terrenos declivosos",
      "Plantio direto: manutenção da palhada da colheita anterior protegendo o solo do impacto direto da chuva (efeito splash)"
    ],
    "Para o ENEM: a técnica mecânica mais cobrada para combater a erosão em encostas inclinadas é a curva de nível (plantar em linhas de mesma altitude) ou o terraceamento (criar degraus que quebram a velocidade da enxurrada).",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Técnica Conservacionista: Curvas de Nível</text><path d='M30 130 C 100 90, 180 60, 290 40' stroke='#5B6785' stroke-width='2' fill='none'/><line x1='50' y1='120' x2='270' y2='60' stroke='#2E7D32' stroke-width='4' stroke-dasharray='8'/><line x1='70' y1='135' x2='280' y2='80' stroke='#2E7D32' stroke-width='4' stroke-dasharray='8'/><text x='70' y='80' font-size='10' font-weight='700' fill='#2E7D32'>Linhas em cotas de mesma altitude</text><text x='70' y='95' font-size='9' fill='var(--mu)'>Retêm enxurradas e aumentam a infiltração</text></svg>Em uma propriedade agrícola situada em terreno acidentado com declividade de 20%, chuvas intensas provocaram a formação de canais profundos de erosão (ravinamento) e o arraste da camada superficial de adubo e sementes em direção ao córrego vizinho, causando assoreamento e perda da fertilidade da lavoura.",
    "Para conter o escoamento superficial da água da chuva, impedir a perda de solo e recuperar a capacidade de infiltração hídrica na encosta descrita, o produtor rural deve adotar:",
    [
      "a queima periódica da palhada para endurecer mecanicamente o horizonte A do solo.",
      "o cultivo em curvas de nível e a implantação de terraceamento com retenção de cobertura morta (plantio direto).",
      "o arado contínuo no sentido do topo para o fundo do vale (morro abaixo) para canalizar a água.",
      "a remoção de todas as árvores das margens do córrego para acelerar a drenagem de sedimentos.",
      "o uso intensivo de tratores pesados durante as chuvas para compactar a superfície argilosa."
    ],
    1,
    "Alternativa correta: B. plantar em curvas de nível (linhas perpendiculares à inclinação máxima do terreno) e construir terraços (degraus nivelados) freia a velocidade das enxurradas, diminui a energia erosiva da água e aumenta o tempo para que a chuva infiltre suavemente no solo, evitando ravinas e assoreamento. A alternativa A destrói a microbiota do solo e agrava a erosão. A B canaliza a enxurrada e acelera a voçoroca. A D comete crime ambiental de destruição da mata ciliar. A E causa compactação nociva ao solo."
  ],
  "Relevo brasileiro segundo Jurandyr Ross": [
    "A classificação do relevo brasileiro proposta pelo geógrafo Jurandyr Ross (1989), fundamentada no levantamento aerofotogramétrico e de radar do Projeto Radambrasil, superou as propostas anteriores de Aroldo de Azevedo (1949) e Aziz Ab'Sáber (1958) ao utilizar três critérios integrados: morfoestrutural (estrutura geológica subjacente), morfoclimático (ação dos climas pretéritos e atuais) e morfoescultural (balanço entre erosão e sedimentação). Ross dividiu o relevo brasileiro em 28 unidades distribuídas em três grandes macroformas: 1) Planaltos (11 unidades): superfícies irregulares onde os processos de erosão superam os de sedimentação; 2) Depressões (11 unidades): superfícies rebaixadas por erosão prolongada situadas entre planaltos e bacias (as depressões brasileiras são todas relativas, rebaixadas em relação ao entorno, mas acima do nível do mar); 3) Planícies (6 unidades): superfícies planas onde os processos de deposição e sedimentação recente superam os de erosão (como a Planície Pantaneira, a Planície do Rio Amazonas e a Planície Costeira).",
    [
      "Classificação de Jurandyr Ross: baseada no Projeto Radambrasil (28 unidades)",
      "Planaltos: erosão supera sedimentação (formas residuais elevadas)",
      "Depressões: áreas erodidas e rebaixadas situadas entre planaltos (todas depressões relativas no Brasil)",
      "Planícies: sedimentação recente supera a erosão (Planície do Amazonas, Pantanal e Costeira)"
    ],
    "Cuidado para o ENEM: no Brasil NÃO existem depressões absolutas (áreas continentais abaixo do nível do mar, como o Mar Morto ou o Vale da Morte). Todas as 11 depressões identificadas por Jurandyr Ross no Brasil são depressões relativas.",
    "O mapa geomorfológico do Brasil estabelecido por Jurandyr Ross redefiniu a compartimentação topográfica do território ao identificar extensas áreas rebaixadas por processos erosivos ao longo do tempo geológico, intercaladas entre os topos residuais de planaltos e as bordas de bacias sedimentares.",

  "Bacias hidrográficas brasileiras": [
    "O Brasil possui a mais rica rede hidrográfica do planeta, detendo cerca de 12% da água doce superficial do globo. As bacias hidrográficas brasileiras caracterizam-se pelo predomínio de rios perenes (que nunca secam, exceto alguns cursos d'água no sertão semiárido), foz em estuário (exceto o Rio Parnaíba em delta e o Amazonas em foz mista), regime pluvial tropical (alimentados por chuvas, com exceção da nascente andina do Rio Amazonas que recebe degelo) e predomínio de rios de planalto com grande potencial hidrelétrico. As principais bacias são: Bacia Amazônica (a mais caudalosa e extensa do mundo); Bacia do Tocantins-Araguaia (maior bacia inteiramente em território brasileiro, com a Usina de Tucuruí); Bacia do Paraná (maior capacidade instalada e consumo elétrico, com Itaipu Binacional); e a Bacia do São Francisco (o 'rio da integração nacional', perene em pleno semiárido).",
    [
      "Potencial hidrelétrico: concentrado em rios de planalto com desníveis e cachoeiras (Bacia do Paraná e Amazônica)",
      "Navegação: favorecida em rios de planície (Bacia Amazônica e Bacia do Paraguai)",
      "Bacia do Tocantins-Araguaia: maior bacia hidrográfica 100% contida dentro das fronteiras do Brasil",
      "Rios perenes vs intermitentes: perenes correm o ano todo; intermitentes secam no período de estiagem (Sertão)"
    ],
    "Atenção para a pegadinha do São Francisco: ele nasce na Serra da Canastra (Minas Gerais), onde o clima é tropical chuvoso, o que garante vazão perene para atravessar o semiárido sem secar.",
    "A matriz elétrica brasileira historicamente ancora-se na exploração de seus recursos hídricos. Contudo, enquanto as bacias do Centro-Sul apresentam seu potencial de geração hidrelétrica quase esgotado e próximo aos centros de maior consumo, a Bacia Amazônica concentra o maior potencial hidrelétrico remanescente do país, gerando polêmicas socioambientais para a construção de usinas como Belo Monte no Rio Xingu.",
    "A principal contradição socioambiental e energética envolvida na implantação de megausinas hidrelétricas na Bacia Amazônica reside no fato de que:",
    [
      "os rios amazônicos são secos e intermitentes durante dez meses do ano, impossibilitando girar turbinas.",
      "a transmissão da eletricidade é desnecessária porque toda a energia é consumida diretamente por cidades ribeirinhas isoladas.",
      "o relevo predominantemente plano exige a inundação de vastas áreas de floresta e terras indígenas ou opera a fio d'água com forte oscilação sazonal de geração.",
      "o Rio Amazonas corre em direção aos Andes, o que impede a água de descer até os reservatórios.",
      "a legislação ambiental brasileira proíbe qualquer tipo de produção energética nas regiões Norte e Centro-Oeste."
    ],
    2,
    "Alternativa correta: C. devido ao relevo de baixas declividades da Amazônia, a construção de usinas com grandes reservatórios alagaria imensas áreas de floresta nativa e terras de povos indígenas e ribeirinhos; para minimizar o alagamento, usinas como Belo Monte foram projetadas 'a fio d'água' (sem grande reservatório de regularização), o que faz sua capacidade real de geração cair drasticamente durante a vazante de inverno. A alternativa A erra porque rios amazônicos são extremamente caudalosos. A C é incorreta, pois a energia é enviada por linhões de alta tensão ao Sudeste. A D inverte a hidrografia (o rio deságua no Atlântico). A E é falsa."
  ],
  "Aquíferos Guarani e Alter do Chão": [
    "Os aquíferos são formações geológicas permeáveis e porosas capazes de armazenar e transmitir volumes significativos de água subterrânea. O Brasil abriga dois dos maiores sistemas aquíferos do planeta: 1) Aquífero Guarani (Sistema Aquífero Guarani - SAG): estende-se por quatro países da Bacia do Prata (Brasil, Argentina, Paraguai e Uruguai), cobrindo oito estados brasileiros (SP, PR, SC, RS, MS, MT, GO, MG); é um aquífero sedimentar confinado sob derrames de basalto vulcânico da Formação Serra Geral, apresentando grande extensão superficial (1,2 milhão de km²); 2) Aquífero Alter do Chão (Sistema Aquífero Grande Amazônia - SAGA): situado na Bacia Sedimentar Amazônica (PA, AM, AP); embora tenha menor área de ocorrência que o Guarani, possui espessura sedimentar permeável colossal, sendo considerado o maior aquífero do mundo em volume útil de água potável (superando 80 mil km³ de água, suficiente para abastecer a humanidade por séculos).",
    [
      "Aquífero Guarani: transfronteiriço (Brasil, Argentina, Paraguai e Uruguai); área de recarga sensível a agrotóxicos em SP e PR",
      "Aquífero Alter do Chão / SAGA: localizado na Amazônia; maior aquífero do mundo em volume absoluto de água doce potável",
      "Área de recarga: afloramento de rochas permeáveis na superfície onde a água da chuva infiltra e alimenta o lençol profundo",
      "Ameaças: contaminação por pesticidas do agronegócio e sobre-exploração urbana em cidades do interior paulista"
    ],
    "No Aquífero Guarani, as 'áreas de recarga' são as mais vulneráveis à contaminação: são as faixas onde a rocha arenosa arenítica aflora na superfície sem a capa protetora de basalto impermeável.",
    "O Sistema Aquífero Guarani é uma das mais importantes reservas estratégicas transfronteiriças de água doce do mundo. Em cidades do interior do estado de São Paulo, como Ribeirão Preto, 100% do abastecimento público urbano e industrial provém de poços tubulares profundos perfurados no arenito desse aquífero.",
    "A vulnerabilidade ambiental do Aquífero Guarani a episódios graves de contaminação por pesticidas agrícolas e esgotos químicos manifesta-se criticamente nas:",
    [
      "camadas profundas de basalto impermeável onde inexiste qualquer contato com a biosfera.",
      "zonas de subducção magmática onde a temperatura da água atinge 800 °C.",
      "fossas oceânicas abissais da costa antártica para onde drenam todas as águas paulistas.",
      "áreas de afloramento superficial das rochas areníticas permeáveis (áreas de recarga direta).",
      "plataformas continentais marítimas situadas no litoral oriental da África do Sul."
    ],
    3,
    "Alternativa correta: D. as áreas de recarga do Aquífero Guarani correspondem aos locais onde os arenitos porosos afloram à superfície, sem a proteção da cobertura de rochas basálticas impermeáveis; nessas áreas, a aplicação descontrolada de fertilizantes químicos, agrotóxicos e efluentes industriais percola livremente no solo com a chuva, contaminando a água subterrânea. As alternativas A, C, D e E trazem equívocos geológicos ou localizações marítimas distantes."
  ],
  "Regimes fluviais e transposição do São Francisco": [
    "O regime fluvial refere-se à variação sazonal do volume e do nível das águas de um rio ao longo do ano. No Brasil, quase a totalidade dos rios apresenta regime pluvial tropical (cheias no verão chuvoso e vazante no inverno seco), com exceção do Rio Amazonas que tem regime misto pluvio-nival (alimentado pelas chuvas equatoriais e pelo degelo da neve nos Andes peruanos). O Rio São Francisco ('Velho Chico') é um rio alóctone: nasce na Serra da Canastra (MG) sob clima tropical úmido, atravessa a Bahia e penetra no Sertão semiárido nordestino sem secar, desaguando entre Alagoas e Sergipe. A obra de Transposição do Rio São Francisco (Projeto de Integração do Rio São Francisco - PISF) construiu dois eixos de canais de concreto (Eixo Norte e Eixo Leste) para desviar uma fração da vazão do rio para bacias hidrográficas receptoras intermitentes nos estados do Ceará, Rio Grande do Norte, Paraíba e Pernambuco.",
    [
      "Rio alóctone: nasce em região chuvosa e atravessa regiões secas conservando vazão permanente (ex.: São Francisco, Rio Nilo)",
      "Regime pluvial: alimentado pelas chuvas (predominante no Brasil); Regime nival: degelo da neve (nos Andes)",
      "Transposição do São Francisco: Eixo Norte e Eixo Leste (abastecimento humano e perenização de açudes no semiárido setentrional)",
      "Debate socioambiental: segurança hídrica vs custo tarifário da água, impacto na foz e uso prioritário pelo agronegócio irrigado"
    ],
    "Lembre-se para o ENEM: a Lei das Águas (Lei 9.433/1997) estabelece que, em situações de escassez hídrica, o uso prioritário da água é o consumo humano e a dessedentação de animais.",
    "O Projeto de Integração do Rio São Francisco com as Bacias Hidrográficas do Nordeste Setentrional concebeu mais de 400 km de canais, aquedutos e túneis para transferir vazão hídrica contínua do leito do rio para açudes e bacias de rios temporários que secavam periodicamente durante as estiagens do semiárido.",
    "O principal objetivo social e territorial prioritário estabelecido no projeto da transposição das águas do Rio São Francisco consiste em:",
    [
      "alimentar exclusivamente a navegação de grandes navios cargueiros transatlânticos até o sertão do Piauí.",
      "garantir a segurança hídrica para abastecimento das populações urbanas e rurais difusas em bacias receptoras intermitentes do semiárido.",
      "drenar toda a água doce do rio para transformar a Bacia do São Francisco em uma salina marítima.",
      "inundar permanentemente a Chapada do Araripe para gerar energia nuclear de baixo custo.",
      "desviar o curso do rio para que ele passe a desaguar na Bacia do Rio Paraná em Foz do Iguaçu."
    ],
    1,
    "Alternativa correta: B. o projeto de integração foi desenhado com a meta de aumentar a segurança hídrica e a resiliência de mais de 12 milhões de habitantes no semiárido nordestino (especialmente em Pernambuco, Ceará, Paraíba e Rio Grande do Norte), garantindo água potável permanente para populações sujeitas a secas cíclicas e sustentando pequenas atividades agropecuárias. As alternativas A, C, D e E trazem formulações descabidas ou geograficamente estapafúrdias."
  ],
  "Usos múltiplos da água e crise hídrica": [
    "A água doce é um recurso natural finito e dotado de valor econômico, regulado no Brasil pela Política Nacional de Recursos Hídricos (Lei Federal nº 9.433/1997, a 'Lei das Águas'). Essa legislação descentralizou a governança ao instituir a bacia hidrográfica como unidade territorial de planejamento e criou os Comitês de Bacia Hidrográfica (compostas pelo poder público, usuários da água e sociedade civil). Dados consolidados da Agência Nacional de Águas e Saneamento Básico (ANA) demonstram a distribuição dos usos consuntivos (onde a água é consumida e não retorna de imediato ao manancial): a agricultura irrigada responde por cerca de 50% da retirada de água no Brasil, seguida pelo abastecimento urbano humano (~24%), indústria (~9%), pecuária (~8%) e termelétricas. As crises hídricas metropolitanas decorrem não apenas de anomalias pluviométricas (estiagens), mas de falhas de gestão, desmatamento de mananciais, poluição crônica de rios e perdas nas redes de distribuição.",
    [
      "Lei das Águas (9.433/1997): comitês de bacia, cobrança pelo uso da água e prioridade absoluta para consumo humano e animal",
      "Maior consumidor de água doce no Brasil: agricultura irrigada (responde por cerca de metade do consumo consuntivo total)",
      "Crise hídrica urbana: decorre de poluição de mananciais, perdas por vazamentos na rede física (>30%) e degradação de florestas ciliares",
      "Pegada hídrica: volume de água doce consumido direta e indiretamente para produzir bens e alimentos"
    ],
    "Pegadinha clássica do ENEM: quem mais consome água no Brasil NÃO é a população nas torneiras das casas! A agricultura irrigada é disparada a maior usuária consuntiva de água doce do país (cerca de 50% do total segundo a ANA).",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Uso da Água no Brasil (Dados ANA)</text><rect x='30' y='45' width='140' height='26' fill='#2F5BFF' rx='4'/><text x='35' y='62' font-size='10' font-weight='700' fill='#fff'>Irrigação Agrícola: ~50%</text><rect x='30' y='76' width='70' height='22' fill='#5B6785' rx='4'/><text x='35' y='91' font-size='9' font-weight='700' fill='#fff'>Urbano: ~24%</text><rect x='30' y='103' width='35' height='20' fill='#FFB400' rx='4'/><text x='70' y='117' font-size='9' fill='var(--tx)'>Indústria: ~9%</text><text x='180' y='62' font-size='9' fill='var(--mu)'>Maior parcela do consumo</text><text x='180' y='91' font-size='9' fill='var(--mu)'>Uso residencial/comércio</text><text x='180' y='117' font-size='9' fill='var(--mu)'>Processos fabris</text></svg>Em períodos de escassez prolongada e rebaixamento crítico dos reservatórios de represas hidrelétricas no Sudeste brasileiro, surgem disputas acirradas entre a vazão destinada à geração de eletricidade, o volume captado para irrigação de lavouras e a água reservada para as estações de tratamento que abastecem cidades de milhões de habitantes.",
    "Em conformidade com os princípios legais estabelecidos pela Lei nº 9.433/1997 (Lei das Águas), em caso de comprovada escassez hídrica crítica, a prioridade legal obrigatória no uso da água deve recair sobre:",
    [
      "a lavagem industrial intensiva de minérios para exportação rápida.",
      "o abastecimento exclusivo de fontes ornamentais de praças públicas centrais.",
      "a irrigação ilimitada de campos de golfe e resorts turísticos litorâneos.",
      "o consumo humano e a dessedentação de animais.",
      "a geração termelétrica de emergência movida a carvão mineral importado."
    ],
    3,
    "Alternativa correta: D. o Artigo 1º, inciso III, da Lei Federal nº 9.433/1997 estipula textualmente que 'em situações de escassez, o uso prioritário dos recursos hídricos é o consumo humano e a dessedentação de animais'. As alternativas A, C, D e E subordinam a vida humana a atividades econômicas ou supérfluas, contrariando frontalmente a legislação vigente."
  ],
  "Coordenadas geográficas: latitude e longitude": [
    "As coordenadas geográficas constituem a rede matemática de linhas imaginárias que permite a localização exata de qualquer ponto na superfície da Terra. A latitude é a distância angular medida em graus (°), minutos (′) e segundos (″) de qualquer ponto em relação à linha do Equador (0°), variando de 0° a 90° Norte ou Sul; a latitude determina as zonas térmicas da Terra e variações na insolação. A longitude é a distância angular medida em relação ao Meridiano de Greenwich (0°), variando de 0° a 180° Leste (E) ou Oeste (W); a longitude é a base astronômica para o cálculo dos fusos horários. Os paralelos são círculos paralelos ao Equador (como os Trópicos de Câncer e Capricórnio e os Círculos Polares), enquanto os meridianos são semicírculos que ligam o polo norte ao polo sul.",
    [
      "Latitude: distância angular ao Equador (0° a 90° N ou S) ➔ define clima e zonas térmicas",
      "Longitude: distância angular a Greenwich (0° a 180° Leste ou Oeste) ➔ define fusos horários",
      "Brasil no sistema de coordenadas: quase todo no Hemisfério Sul (~93%), pequena fração no Norte (~7%), e 100% no Hemisfério Ocidental (Oeste/W)",
      "Trópico de Capricórnio (23°27' S): corta os estados de SP, PR e MS"
    ],
    "Memorize as siglas em inglês ou português que aparecem nos mapas do ENEM: N = Norte, S = Sul, L/E = Leste (East), O/W = Oeste (West). Todo o território brasileiro está a OESTE (W) de Greenwich.",
    "<svg viewBox='0 0 320 150' style='width:100%;max-width:320px;height:auto;margin:8px auto;display:block'><rect width='320' height='150' fill='var(--hi)' rx='12'/><text x='15' y='22' font-size='11' font-weight='700' fill='var(--tx)'>Coordenadas Geográficas (Mapa Esquemático sem escala)</text><line x1='30' y1='80' x2='290' y2='80' stroke='#D12D20' stroke-width='2'/><text x='35' y='75' font-size='9' fill='#D12D20' font-weight='700'>Equador (0°)</text><line x1='160' y1='25' x2='160' y2='135' stroke='#2F5BFF' stroke-width='2'/><text x='165' y='35' font-size='9' fill='#2F5BFF' font-weight='700'>Greenwich (0°)</text><circle cx='100' cy='110' r='6' fill='#FFB400'/><text x='70' y='128' font-size='10' font-weight='700' fill='var(--tx)'>Ponto P (20° S, 45° W)</text><text x='200' y='110' font-size='9' fill='var(--mu)'>Hemisfério Sul e Ocidental</text></svg>Em uma missão de resgate marítimo no Atlântico Sul, o sistema de rastreamento por satélite captou um sinal de emergência de uma embarcação posicionada nas coordenadas geográficas 23° Sul de latitude e 42° Oeste de longitude.",
    "A leitura geográfica rigorosa das coordenadas fornecidas indica que a embarcação em perigo encontra-se:",
    [
      "ao norte da linha do Equador e a leste do Meridiano de Greenwich.",
      "no Círculo Polar Ártico, em uma região de clima polar extremo e noites eternas.",
      "ao sul da linha do Equador e a oeste do Meridiano de Greenwich, próxima ao litoral do Sudeste brasileiro.",
      "exatamente sobre o Meridiano Central de Tóquio, na Ásia Oriental.",
      "ao sul da Antártida, no centro da placa tectônica do Oceano Índico."
    ],
    2,
    "Alternativa correta: C. a latitude 23° S situa o ponto no Hemisfério Sul, praticamente sobre o Trópico de Capricórnio (23°27' S); a longitude 42° W (Oeste) situa o ponto no Hemisfério Ocidental, nas proximidades do litoral do estado do Rio de Janeiro / São Paulo. A alternativa A inverte ambos os hemisférios. A C cita o Ártico (que fica a 66° N). A D cita Tóquio (que fica no Hemisfério Norte e Oriental, ~140° E). A E cita o Índico, quando a coordenada W indica o Atlântico/Américas."
  ],
  "Fusos horários e cálculos de hora": [
    "A rotação da Terra (360° em aproximadamente 24 horas) determina a existência de 24 fusos horários globais de 15° de longitude cada (360° ÷ 24 = 15° por hora). O meridiano de Greenwich (0°) é a referência internacional (GMT/UTC). Como a Terra gira de oeste para leste, as horas adiantam (somam-se) para o Leste e atrasam (subtraem-se) para o Oeste. O Brasil possui oficialmente quatro fusos horários, todos a oeste de Greenwich: 1) Fuso 1 (UTC -2): ilhas oceânicas (Fernando de Noronha, Trindade); 2) Fuso 2 (UTC -3, Hora Oficial de Brasília): todo o Nordeste, Sudeste, Sul, mais Goiás, Tocantins, Pará e Amapá; 3) Fuso 3 (UTC -4): Mato Grosso, Mato Grosso do Sul, Rondônia, Roraima e a porção oriental do Amazonas; 4) Fuso 4 (UTC -5): estado do Acre e os 13 municípios do extremo oeste do Amazonas.",
    [
      "1 fuso horário = 15° de longitude = 1 hora",
      "Sentido da conta: Para Leste ➔ SOMA horas (+); Para Oeste ➔ SUBTRAI horas (−)",
      "Brasil possui 4 fusos horários (todos atrasados em relação a Greenwich: UTC -2, UTC -3, UTC -4, UTC -5)",
      "Tempo de voo: Hora de saída ± diferença de fuso + tempo de viagem = hora de chegada no destino"
    ],
    "Passo a passo infalível no ENEM: 1) Calcule a diferença de fusos entre a cidade de origem e a de destino; 2) Ajuste o relógio da partida para o horário local do destino (somando se for para Leste, subtraindo se for para Oeste); 3) Some o tempo de voo.",
    "Um avião comercial de passageiros decola da cidade de Brasília (fuso horário oficial do Brasil: UTC -3) às 08h00 do dia 10 de maio com destino a Londres, no Reino Unido (fuso horário de Greenwich: UTC 0). O tempo de voo sem escalas é de exatamente 11 horas.",
    "Considerando apenas os fusos horários e a duração da viagem, qual será o horário local em Londres no momento exato da aterrissagem do avião?",
    [
      "16h00 do dia 10 de maio.",
      "19h00 do dia 10 de maio.",
      "05h00 do dia 11 de maio.",
      "22h00 do dia 10 de maio.",
      "14h00 do dia 10 de maio."
    ],
    3,
    "Alternativa correta: D. Cálculo por etapas verificado por script: 1) Diferença de fuso: Brasília está a UTC -3 e Londres a UTC 0; Londres está 3 fusos a leste de Brasília, portanto Londres está 3 horas adiantada em relação a Brasília (+3 h). 2) Quando o voo decola às 08h00 em Brasília, em Londres já são: 08h00 + 3h = 11h00. 3) Somando o tempo de voo de 11 horas: 11h00 + 11h = 22h00 do mesmo dia 10 de maio. A alternativa A erra subtraindo as 3 horas do fuso (08 - 3 + 11 = 16h00). A B esquece de considerar a diferença de fuso horário (08h00 + 11h = 19h00). A D e a E resultam de erros na contagem de horas."
  ],
  "Escalas cartográficas e proporção": [
    "A escala cartográfica é a relação matemática entre as dimensões lineares medidas no mapa (d) e as distâncias reais correspondentes no terreno (D). Pode ser apresentada na forma numérica (ex.: 1:250 000, significando que 1 cm no mapa equivale a 250 000 cm na realidade) ou gráfica (uma barra graduada). Fórmula fundamental: D = d × E (onde E é o denominador da escala). A escala é dita GRANDE quando o denominador é pequeno (ex.: 1:500 ou 1:5 000, como plantas urbanas), exibindo grande nível de detalhamento e cobrindo pequena área territorial. A escala é dita PEQUENA quando o denominador é muito grande (ex.: 1:50 000 000, como planisférios mundiais e mapas do Brasil), exibindo alto grau de generalização e cobrindo grandes extensões geográficas.",
    [
      "Fórmula da escala: D = d × E (onde D = real, d = gráfico/mapa, E = denominador da escala)",
      "Conversões de unidade métrica: 1 km = 1 000 m = 100 000 cm (para passar de cm para km, divida por 100 000 / corte 5 zeros)",
      "Escala grande: denominador pequeno (1:1 000) ➔ muito detalhe, pouca área (plantas, mapas cadastrais)",
      "Escala pequena: denominador grande (1:25 000 000) ➔ pouco detalhe, muita área (mapas-múndi, mapas continentais)"
    ],
    "A pegadinha clássica número um da cartografia: 'Escala Grande' NÃO significa mapa de país grande! Escala Grande tem denominador pequeno (é uma fração maior: 1/1 000 > 1/1 000 000), mostra uma área pequena com riqueza de detalhes (como uma rua ou bairro).",
    "Em um mapa rodoviário regional confeccionado na escala numérica de 1:250 000, a distância em linha reta entre duas cidades turísticas do interior paulista mede exatamente 8 cm na folha de papel.",
